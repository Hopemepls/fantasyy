<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090807">
<title>Fantasy Registry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#080807;
  --bg2:#0d0c0a;
  --panel:#13110e;
  --panel2:#191611;
  --panel3:#211b13;

  --text:#f0e7d4;
  --muted:#8e8473;
  --muted2:#625b4e;

  --gold:#d6b04a;
  --gold2:#9b7827;
  --gold3:#6d531b;

  --line:#30291f;
  --line2:#403526;

  --green:#67bd83;
  --red:#d26470;
  --blue:#7198d0;

  --shadow:0 22px 60px rgba(0,0,0,.48);
}

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:var(--bg);
}

body{
  margin:0;
  min-height:100%;
  padding:
    calc(14px + env(safe-area-inset-top))
    12px
    calc(35px + env(safe-area-inset-bottom));

  background:
    radial-gradient(circle at 50% -10%,rgba(191,151,52,.09),transparent 35%),
    linear-gradient(180deg,#0b0a08 0%,#080807 55%,#070706 100%);

  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
  -webkit-tap-highlight-color:transparent;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.45;
}

.app{
  width:100%;
  max-width:1120px;
  margin:0 auto;
}

/* HEADER */

.header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  padding:8px 2px 17px;
  border-bottom:1px solid var(--line);
}

.brand{
  min-width:0;
}

.brand-title{
  margin:0;
  color:#f2e7d1;
  font-size:24px;
  line-height:1;
  letter-spacing:2px;
}

.brand-sub{
  margin:7px 0 0;
  color:var(--muted);
  font:9px/1.4 monospace;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.header-actions{
  display:flex;
  gap:7px;
}

/* BUTTONS */

.btn{
  min-height:38px;
  padding:0 13px;

  border:1px solid var(--line2);
  border-radius:5px;

  background:linear-gradient(180deg,#1c1813,#15120f);
  color:#d9ceb8;

  font:9px monospace;
  letter-spacing:1px;
  text-transform:uppercase;

  transition:
    border-color .18s ease,
    background .18s ease,
    transform .12s ease;
}

.btn:hover{
  border-color:var(--gold2);
  background:linear-gradient(180deg,#241d13,#19150f);
}

.btn:active{
  transform:translateY(1px);
}

.btn.primary{
  color:#181207;
  border-color:var(--gold);
  background:linear-gradient(180deg,#d4ae4a,#977426);
  font-weight:700;
}

.btn.gold-outline{
  border-color:var(--gold3);
  color:var(--gold);
}

/* TABS */

.tabs{
  display:flex;
  gap:24px;
  margin-top:2px;
  border-bottom:1px solid var(--line);
}

.tab{
  position:relative;
  padding:13px 1px 12px;

  border:0;
  background:none;

  color:var(--muted);

  font:9px monospace;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold);
}

.tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:var(--gold);
}

/* STATUS */

.status{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:13px 0;
}

.status-item{
  padding:6px 8px;

  border:1px solid var(--line);
  border-radius:4px;

  background:rgba(255,255,255,.012);

  color:var(--muted);
  font:8px monospace;
  letter-spacing:.3px;
}

.status-item b{
  color:var(--gold);
}

/* NOTICE */

.notice{
  margin:12px 0;
  padding:11px 12px;

  border:1px solid #4d3e20;
  border-radius:5px;

  background:rgba(145,111,28,.075);
  color:#cbbd9e;

  font:9px/1.55 monospace;
}

.notice.ok{
  border-color:#315a3e;
  background:rgba(51,122,70,.075);
  color:#a6d6b2;
}

.notice.error{
  border-color:#693039;
  background:rgba(150,30,45,.08);
  color:#e5a3aa;
}

/* EMPTY / CREATE */

.empty{
  position:relative;
  overflow:hidden;

  padding:60px 22px;

  border:1px solid var(--line);
  border-radius:7px;

  background:
    radial-gradient(circle at 50% 0%,rgba(205,165,60,.08),transparent 45%),
    linear-gradient(180deg,#14110e,#0f0d0b);

  text-align:center;
  box-shadow:var(--shadow);
}

.empty:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,transparent,rgba(255,255,255,.018),transparent);
}

.emblem{
  width:66px;
  height:66px;
  margin:0 auto 18px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--gold3);
  border-radius:50%;

  color:var(--gold);
  font-size:27px;

  background:
    radial-gradient(circle,rgba(210,169,65,.11),transparent 65%);
  box-shadow:
    0 0 45px rgba(200,160,50,.07),
    inset 0 0 20px rgba(200,160,50,.04);
}

.empty h2{
  margin:0 0 9px;
  font-size:23px;
  letter-spacing:.4px;
}

.empty p{
  max-width:540px;
  margin:0 auto 22px;

  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

/* PLAYER CARD */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  gap:16px;
}

.player-card{
  overflow:hidden;

  border:1px solid #4b3d22;
  border-radius:7px;

  background:
    linear-gradient(180deg,#17130f,#110f0c);

  box-shadow:
    0 22px 60px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.012) inset;
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;

  height:42px;
  padding:0 13px;

  border-bottom:1px solid var(--line);

  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);
}

.card-role{
  color:var(--gold);
  font:8px monospace;
  letter-spacing:1.6px;
}

.card-badge{
  padding:4px 7px;

  border-radius:3px;

  background:var(--gold);
  color:#1b1408;

  font:7px monospace;
  font-weight:700;
  letter-spacing:.8px;
}

/* AVATAR */

.hero{
  position:relative;
  height:250px;
  overflow:hidden;

  background:#0b0908;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;

  transform:scale(1.01);
}

.hero-placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#756442;
  font-size:72px;

  background:
    radial-gradient(circle at 50% 35%,rgba(210,169,65,.13),transparent 40%),
    #0b0907;
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.08) 35%,rgba(0,0,0,.92) 100%);
}

.hero-info{
  position:absolute;
  z-index:2;
  left:15px;
  right:15px;
  bottom:14px;
}

.hero-name{
  margin:0;

  color:#f3ead9;
  font-size:25px;
  line-height:1.1;

  text-shadow:0 3px 14px #000;
}

.hero-account{
  margin-top:5px;
  color:#aaa08e;
  font:8px monospace;
  letter-spacing:.5px;
}

/* SCORE */

.score-row{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;

  padding:14px;

  border-bottom:1px solid var(--line);
}

.score-label{
  color:var(--muted2);
  font:8px monospace;
  letter-spacing:1px;
}

.rarity{
  margin-bottom:4px;
  color:var(--gold);
  font:8px monospace;
  letter-spacing:1.3px;
}

.score{
  color:var(--gold);
  font-size:28px;
  font-weight:700;
  line-height:1;
}

/* MATCHES */

.matches{
  padding:10px;
}

.match{
  margin-bottom:7px;
  padding:10px;

  border:1px solid var(--line);
  border-radius:4px;

  background:#100e0b;
}

.match:last-child{
  margin-bottom:0;
}

.match-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.match-id{
  color:#655d50;
  font:8px monospace;
}

.match-fantasy{
  color:var(--gold);
  font:bold 13px monospace;
}

.match-info{
  display:flex;
  flex-wrap:wrap;
  gap:8px;

  margin-top:7px;

  color:#756b5a;
  font:8px monospace;
}

.win{
  color:var(--green)!important;
}

.loss{
  color:var(--red)!important;
}

/* PROGRESS */

.loading-box{
  padding:12px;

  border-bottom:1px solid var(--line);

  background:rgba(0,0,0,.13);
}

.loading-head{
  display:flex;
  justify-content:space-between;
  gap:10px;

  margin-bottom:8px;

  color:#a49a87;
  font:8px monospace;
}

.progress{
  height:5px;
  overflow:hidden;

  border-radius:99px;

  background:#292219;
}

.progress i{
  display:block;
  width:0;
  height:100%;

  background:linear-gradient(90deg,#8e6c20,#d8b34e);

  transition:width .25s ease;
}

/* FOOTER */

.card-footer{
  display:grid;
  grid-template-columns:1fr 1fr 48px;
  gap:6px;

  padding:10px;

  border-top:1px solid var(--line);
}

/* TABLE */

.table-wrap{
  overflow:auto;

  border:1px solid var(--line);
  border-radius:5px;
}

table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}

th,
td{
  padding:11px;
  text-align:left;
  border-bottom:1px solid var(--line);
}

th{
  background:var(--panel2);
  color:var(--muted);
  font:8px monospace;
  text-transform:uppercase;
}

td{
  background:var(--panel);
  font-size:12px;
}

tr:last-child td{
  border-bottom:0;
}

/* MODAL */

.overlay{
  position:fixed;
  z-index:100;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12px;

  background:rgba(0,0,0,.84);
  backdrop-filter:blur(7px);
}

.modal{
  position:relative;

  width:100%;
  max-width:570px;
  max-height:94vh;
  overflow:auto;

  padding:21px;

  border:1px solid var(--gold3);
  border-radius:7px;

  background:
    radial-gradient(circle at 50% 0%,rgba(210,168,61,.06),transparent 40%),
    var(--panel);

  box-shadow:var(--shadow);
}

.close{
  position:absolute;
  top:7px;
  right:10px;

  width:35px;
  height:35px;

  border:0;
  background:none;

  color:#756c5c;
  font-size:25px;
}

.modal h2{
  margin:0 35px 7px 0;
  font-size:22px;
}

.modal-desc{
  margin-bottom:19px;

  color:#9d927e;
  font:9px/1.65 monospace;
}

.profile-preview{
  display:flex;
  align-items:center;
  gap:12px;

  margin-bottom:18px;
  padding:11px;

  border:1px solid var(--line);
  border-radius:5px;

  background:#0e0c0a;
}

.profile-preview img,
.profile-preview-avatar{
  width:48px;
  height:48px;

  flex:0 0 48px;

  border-radius:50%;

  object-fit:cover;
}

.profile-preview-avatar{
  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--gold3);

  background:#18130c;
  color:var(--gold);

  font-size:18px;
}

.profile-name{
  min-width:0;
}

.profile-name strong{
  display:block;

  color:#e9dfcc;
  font-size:13px;
}

.profile-name span{
  display:block;
  margin-top:3px;

  color:#756b5b;
  font:8px monospace;
}

/* FORM */

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  margin-bottom:6px;

  color:#938873;
  font:8px monospace;
  letter-spacing:1px;
}

.input{
  width:100%;
  height:42px;

  padding:0 11px;

  border:1px solid var(--line2);
  border-radius:4px;

  outline:none;

  background:#0c0b09;
  color:var(--text);

  font:11px monospace;

  transition:border-color .15s ease;
}

.input:focus{
  border-color:var(--gold2);
}

.input::placeholder{
  color:#504a40;
}

.input:disabled,
.input[readonly]{
  opacity:.6;
}

/* ROLE */

.roles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.role-option{
  padding:11px 5px;

  border:1px solid var(--line);
  border-radius:4px;

  background:#0f0e0c;

  text-align:center;
  cursor:pointer;
}

.role-option strong{
  display:block;
  color:#c5b9a2;
  font:9px monospace;
}

.role-option span{
  display:block;
  margin-top:4px;
  color:#625b4f;
  font:8px monospace;
}

.role-option.selected{
  border-color:var(--gold);
  background:rgba(170,130,35,.08);
}

.role-option.selected strong{
  color:var(--gold);
}

/* RARITY */

.rarities{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.rarity-option{
  padding:11px 5px;

  border:1px solid var(--line);
  border-radius:4px;

  background:#0f0e0c;

  color:#9e927d;

  font:8px monospace;
  text-align:center;

  cursor:pointer;
}

.rarity-option.selected{
  border-color:var(--gold);
  color:var(--gold);
  background:rgba(170,130,35,.08);
}

/* BONUS */

.bonus-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.bonus{
  padding:8px;

  border:1px solid var(--line);
  border-radius:4px;

  background:#100e0b;
}

.bonus label{
  margin-bottom:4px;
  font-size:7px;
}

.bonus input{
  width:100%;
  height:33px;

  padding:0 8px;

  border:1px solid var(--line);
  border-radius:3px;

  background:#0b0a08;
  color:#d9ceb9;

  outline:none;

  font:10px monospace;
}

/* MODAL FOOTER */

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;

  margin-top:18px;
}

/* CALC */

.calc-card{
  margin-top:12px;

  border:1px solid var(--line);
  border-radius:4px;

  overflow:hidden;
}

.calc-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:10px;

  border-bottom:1px solid var(--line);

  background:#100e0b;

  font:8px monospace;
}

.calc-head strong{
  color:var(--gold);
}

.calc-table{
  width:100%;
  min-width:0;
  border-collapse:collapse;
}

.calc-table th,
.calc-table td{
  min-width:0;
  padding:8px 6px;

  font-size:8px;
}

.calc-table th{
  font-size:7px;
}

.calc-table td{
  background:#100e0b;
}

.calc-total{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-top:12px;
  padding:13px;

  border:1px solid var(--gold3);
  border-radius:4px;

  background:rgba(160,125,30,.07);
}

.calc-total span{
  color:#988c75;
  font:8px monospace;
}

.calc-total strong{
  color:var(--gold);
  font-size:25px;
}

/* DIAGNOSTICS */

.diag{
  display:none;

  margin-top:15px;

  overflow:hidden;

  border:1px solid var(--line);
  border-radius:5px;

  background:#0d0b09;
}

.diag.open{
  display:block;
}

.diag-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:10px;

  border-bottom:1px solid var(--line);

  background:var(--panel2);
}

.diag-head strong{
  color:#a4967d;
  font:8px monospace;
}

pre{
  max-height:500px;
  overflow:auto;

  margin:0;
  padding:12px;

  color:#aaa08d;

  font:8px/1.5 monospace;

  white-space:pre-wrap;
  word-break:break-word;
}

/* SPINNER */

.spinner{
  width:14px;
  height:14px;

  display:inline-block;

  border:2px solid rgba(255,255,255,.16);
  border-top-color:var(--gold);

  border-radius:50%;

  animation:spin .7s linear infinite;

  vertical-align:-3px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* MOBILE */

@media(max-width:650px){

  body{
    padding-left:10px;
    padding-right:10px;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
    gap:13px;
  }

  .header-actions{
    width:100%;
  }

  .header-actions .btn{
    flex:1;
  }

  .brand-title{
    font-size:21px;
  }

  .tabs{
    gap:18px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .hero{
    height:235px;
  }

  .card-footer{
    grid-template-columns:1fr 1fr 44px;
  }

  .modal{
    padding:17px;
  }

  .bonus-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:380px){

  .tabs{
    gap:13px;
  }

  .tab{
    font-size:8px;
  }

  .hero-name{
    font-size:22px;
  }

  .roles,
  .rarities{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<div class="app">

</div>

<div id="modalRoot"></div>

/* ============================================================
   HELPERS
============================================================ */

function esc(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}

function num(value){

  const n=Number(value);

  return Number.isFinite(n)?n:0;

}

function fmt(value){

  return num(value).toLocaleString("ru-RU",{
    maximumFractionDigits:2
  });

}

function initials(value){

  const str=String(value||"?").trim();

  return str
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase() || "?";

}

function defaultBonuses(){

  const result={};

  BONUS_FIELDS.forEach(([key])=>{
    result[key]=0;
  });

  return result;

}

function defaultCard(){

  return{
    rarity:"bronze",
    bonuses:defaultBonuses()
  };

}

function normalize(p){

  if(!p)return null;

  p.card=p.card||defaultCard();

  p.card.bonuses=p.card.bonuses||defaultBonuses();

  BONUS_FIELDS.forEach(([key])=>{
    p.card.bonuses[key]=num(p.card.bonuses[key]);
  });

  if(!RARITIES[p.card.rarity]){
    p.card.rarity="bronze";
  }

  if(!Array.isArray(p.matches)){
    p.matches=[];
  }

  return p;

}

function ownerRef(){

  if(!db || !telegramId){
    return null;
  }

  return db
    .collection("owners")
    .doc(String(telegramId));

}


async function loadOwner(){

  if(!db || !telegramId){
    return null;
  }

  try{

    const snap=await ownerRef().get();

    if(!snap.exists){

      player=null;

      clearLocal();

      render();

      return null;

    }

    const data=normalize(snap.data());

    /*
      Дополнительная проверка.
      В production её также обязательно нужно
      сделать через Firestore Rules/backend.
    */

    if(
      data.telegramUserId &&
      String(data.telegramUserId)!==String(telegramId)
    ){

      throw new Error(
        "Карта принадлежит другому Telegram аккаунту"
      );

    }

    player=data;

    saveLocal();

    render();

    return player;

  }catch(error){

    log("OWNER LOAD ERROR",{
      error:error.message
    });

    /*
      Если Firestore временно недоступен,
      разрешаем показать локальный cache,
      но только если Telegram ID совпадает.
    */

    const local=loadLocal();

    if(
      local &&
      String(local.telegramUserId)===String(telegramId)
    ){

      player=local;
      render();

    }

    return player;

  }

}

/* ============================================================
   DOTA ID PARSER
============================================================ */

function parseDotaAccountId(value){

  const raw=String(value||"").trim();

  if(!raw){
    return null;
  }

  /*
    Прямой account ID.
  */

  if(/^\d+$/.test(raw)){
    return raw;
  }

  const patterns=[
    /steamcommunity\.com\/profiles\/(\d+)/i,
    /steamcommunity\.com\/id\/([^/?#]+)/i,
    /opendota\.com\/players\/(\d+)/i,
    /\/profiles\/(\d+)/i
  ];

  for(const pattern of patterns){

    const match=raw.match(pattern);

    if(match){

      /*
        Для /profiles/123 и OpenDota
        уже получаем numeric ID.
      */

      if(/^\d+$/.test(match[1])){
        return match[1];
      }

    }

  }

  return null;

}

/* ============================================================
   FANTASY CALCULATION
============================================================ */

function calculateBaseFantasy(p){

  const kills=num(p.kills);
  const deaths=num(p.deaths);
  const assists=num(p.assists);

  const lastHits=num(p.last_hits);
  const denies=num(p.denies);

  const gpm=num(p.gold_per_min);

  const tower=num(p.tower_kills);
  const roshan=num(p.roshan_kills);

  const team=num(p.teamfight_participation);

  const obs=num(p.obs_placed);
  const stacks=num(p.camps_stacked);
  const runes=num(p.rune_pickups);

  const firstBlood=p.firstblood_claimed?1:0;

  const stuns=num(p.stuns);

  return{

    kills:
      kills*FANTASY_RULES.kills,

    deaths:
      FANTASY_RULES.deaths_base+
      deaths*FANTASY_RULES.deaths,

    assists:
      assists*FANTASY_RULES.assists,

    last_hits:
      (lastHits+denies)*
      FANTASY_RULES.last_hits,

    gpm:
      gpm*FANTASY_RULES.gpm,

    tower_kills:
      tower*FANTASY_RULES.tower_kills,

    roshan_kills:
      roshan*FANTASY_RULES.roshan_kills,

    teamfight:
      team*FANTASY_RULES.teamfight,

    observer_placed:
      obs*FANTASY_RULES.observer_placed,

    camps_stacked:
      stacks*FANTASY_RULES.camps_stacked,

    runes_grabbed:
      runes*FANTASY_RULES.runes_grabbed,

    first_blood:
      firstBlood*FANTASY_RULES.first_blood,

    stuns:
      stuns*FANTASY_RULES.stuns

  };

}


function applyBonuses(base,bonuses){

  const result={};

  BONUS_FIELDS.forEach(([key])=>{

    result[key]=
      num(base[key])*
      (
        1+
        num(bonuses?.[key])/100
      );

  });

  return result;

}


function calculate(p,card){

  const base=
    calculateBaseFantasy(p);

  const final=
    applyBonuses(
      base,
      card.bonuses
    );

  const total=
    Object.values(final)
      .reduce(
        (sum,value)=>sum+num(value),
        0
      );

  return{
    base,
    final,
    total
  };

}


/* ============================================================
   MATCHES
============================================================ */

async function getHistory(accountId){

  const data=await api(
    `/players/${accountId}/recentMatches`
  );

  if(!Array.isArray(data)){
    return [];
  }

  return data
    .filter(match=>match.match_id)
    .sort(
      (a,b)=>
        num(b.start_time)-
        num(a.start_time)
    )
    .slice(0,4);

}


async function loadMatch(
  matchId,
  accountId,
  card
){

  const match=
    await api(`/matches/${matchId}`);

  if(
    !match ||
    !Array.isArray(match.players)
  ){

    throw new Error(
      `Матч ${matchId}: игроки отсутствуют`
    );

  }

  const p=
    match.players.find(
      x=>
        String(x.account_id)===
        String(accountId)
    );

  if(!p){

    throw new Error(
      `Игрок не найден в матче ${matchId}`
    );

  }

  const calculation=
    calculate(p,card);

  const radiant=
    num(p.player_slot)<128;

  const win=
    Boolean(match.radiant_win)===radiant;

  return{

    matchId:String(match.match_id),

    startTime:num(match.start_time),
    duration:num(match.duration),

    win,

    kills:num(p.kills),
    deaths:num(p.deaths),
    assists:num(p.assists),

    lastHits:num(p.last_hits),
    denies:num(p.denies),

    gpm:num(p.gold_per_min),

    teamfight:num(
      p.teamfight_participation
    ),

    observer:num(p.obs_placed),
    stacks:num(p.camps_stacked),
    runes:num(p.rune_pickups),

    firstBlood:Boolean(
      p.firstblood_claimed
    ),

    towerKills:num(p.tower_kills),
    roshanKills:num(p.roshan_kills),
    stuns:num(p.stuns),

    baseFantasy:
      calculation.base,

    finalFantasy:
      calculation.final,

    fantasy:Number(
      calculation.total.toFixed(2)
    )

  };

}


async function loadLimited(
  ids,
  accountId,
  card,
  onProgress
){

  const results=[];

  let next=0;
  let done=0;

  async function worker(){

    while(true){

      const index=next++;

      if(index>=ids.length){
        return;
      }

      const id=ids[index];

      try{

        results[index]=
          await loadMatch(
            id,
            accountId,
            card
          );

      }catch(error){

        results[index]=null;

        log(
          "MATCH FAILED",
          {
            matchId:id,
            error:error.message
          }
        );

      }

      done++;

      if(onProgress){

        onProgress(
          done,
          ids.length,
          id
        );

      }

    }

  }

  await Promise.all([
    worker(),
    worker()
  ]);

  return results.filter(Boolean);

}


/* ============================================================
   BEST 2
============================================================ */

function bestTwo(){

  if(!player){

    return{
      matches:[],
      total:0
    };

  }

  const sorted=
    (player.matches||[])
      .slice()
      .sort(
        (a,b)=>
          num(b.fantasy)-
          num(a.fantasy)
      );

  const matches=
    sorted.slice(0,2);

  return{
    matches,
    total:
      matches.reduce(
        (sum,m)=>sum+num(m.fantasy),
        0
      )
  };

}


/* ============================================================
   REFRESH MATCHES
============================================================ */

async function refreshPlayer(){

  if(!player){
    return;
  }

  player.loading=true;
  player.loadingCurrent=0;
  player.loadingTotal=2;
  player.loadingText="Получаем последние матчи…";

  render();

  try{

    const history=
      await getHistory(
        player.accountId
      );

    if(!history.length){

      throw new Error(
        "У игрока пока нет доступной истории матчей"
      );

    }

    const target=
      history
        .slice(0,2)
        .map(x=>String(x.match_id));

    const existing=
      new Map(
        (player.matches||[])
          .map(
            m=>[
              String(m.matchId),
              m
            ]
          )
      );

    const need=
      target.filter(
        id=>!existing.has(id)
      );

    if(need.length){

      const fresh=
        await loadLimited(
          need,
          player.accountId,
          player.card,
          (
            current,
            total,
            id
          )=>{

            player.loadingCurrent=current;
            player.loadingTotal=total;
            player.loadingText=
              `Матч ${current}/${total} · ${id}`;

            render();

          }
        );

      fresh.forEach(match=>{

        existing.set(
          String(match.matchId),
          match
        );

      });

    }

    player.matches=
      target
        .map(
          id=>existing.get(id)
        )
        .filter(Boolean);

    /*
      Пересчёт сохранённых матчей
      при изменении бонусов карты.
    */

    player.matches.forEach(match=>{

      const final=
        applyBonuses(
          match.baseFantasy,
          player.card.bonuses
        );

      match.finalFantasy=final;

      match.fantasy=
        Number(
          Object.values(final)
            .reduce(
              (sum,value)=>
                sum+num(value),
              0
            )
            .toFixed(2)
        );

    });

    player.lastRefresh=Date.now();

    delete player.loading;
    delete player.loadingCurrent;
    delete player.loadingTotal;
    delete player.loadingText;

    await saveOwner();

    render();

    showNotice(
      "✓ Статистика обновлена",
      "ok"
    );

  }catch(error){

    delete player.loading;
    delete player.loadingCurrent;
    delete player.loadingTotal;
    delete player.loadingText;

    render();

    showNotice(
      "Не удалось обновить матчи: "+
      error.message,
      "error"
    );

  }

}

          Сначала создай свою карточку.
        </p>

      </div>

    `;

    return;

  }

  const best=bestTwo();

  content.innerHTML=`

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Игрок</th>
            <th>Матч 1</th>
            <th>Матч 2</th>
            <th>Best 2</th>
            <th>Карта</th>
          </tr>

        </thead>

        <tbody>

          <tr>

            <td>

              <strong>
                ${esc(player.name)}
              </strong>

              <div
                style="
                  margin-top:3px;
                  color:#675c4a;
                  font:8px monospace
                "
              >
                ${esc(player.accountId)}
              </div>

            </td>

            <td
              style="
                color:var(--gold);
                font-family:monospace
              "
            >
              ${
                best.matches[0]
                ?fmt(
                  best.matches[0].fantasy
                )
                :"—"
              }
            </td>

            <td
              style="
                color:var(--gold);
                font-family:monospace
              "
            >
              ${
                best.matches[1]
                ?fmt(
                  best.matches[1].fantasy
                )
                :"—"
              }
            </td>

            <td
              style="
                color:var(--gold);
                font:bold 14px monospace
              "
            >
              ${fmt(best.total)}
            </td>

            <td>
              ${esc(
                RARITIES[
                  player.card.rarity
                ]
              )}
            </td>

          </tr>

        </tbody>

      </table>

    </div>

    <div class="notice">

      Глобальный рейтинг можно подключить
      отдельно. Сейчас карточка принадлежит
      только текущему Telegram аккаунту.

    </div>

  `;

}


/* ============================================================
   MAIN RENDER
============================================================ */

function render(){

  renderStatus();

  diag.classList.toggle(
    "open",
    activeTab==="diagnostics"
  );

  if(activeTab==="players"){

    renderPlayer();

  }else if(activeTab==="rating"){

    renderRating();

  }else{

    content.innerHTML=`

      <div class="notice">

        Telegram ID:
        <b>
          ${
            telegramId
            ?esc(telegramId)
            :"не найден"
          }
        </b>

        <br><br>

        Firestore owner:
        <b>
          ${
            telegramId
            ?"owners/"+esc(telegramId)
            :"—"
          }
        </b>

        <br><br>

        Один Telegram ID =
        одна карточка.

      </div>

    `;

    renderDiagnostics();

  }

}


/* ============================================================
   MODAL
============================================================ */

function closeModal(){

  modalRoot.innerHTML="";

}


function openCreateModal(){

  if(player){

    showNotice(
      "У тебя уже есть карточка. Второго игрока создать нельзя.",
      "error"
    );

    return;

  }

  if(!telegramId){

    initTelegram();

  }

  if(!telegramId){

    showNotice(
      "Открой приложение через Telegram WebApp.",
      "error"
    );

    return;

  }

  renderForm(false);

}


function openEditModal(){

  if(!player){
    return;
  }

  renderForm(true);

}


/* ============================================================
   CREATE / EDIT FORM
============================================================ */

function renderForm(edit){

  const card=
    player
    ?player.card
    :defaultCard();

  let role=
    player
    ?player.role
    :"carry";

  let rarity=
    card.rarity;

  const tgAvatar=
    tgPhoto();

  modalRoot.innerHTML=`

    <div class="overlay">

      <div class="modal">

        <button
          class="close"
          id="closeModal"
        >
          ×
        </button>

        <h2>
          ${
            edit
            ?"Моя карта"
            :"Создание карты"
          }
        </h2>

        <div class="modal-desc">

          ${
            edit
            ?
            "Основные данные карты зафиксированы. Dota Account ID и владелец изменить нельзя."
            :
            "Telegram используется для идентификации владельца. Выбери имя карточки и привяжи один Dota аккаунт."
          }

        </div>

        ${
          telegramUser
          ?

          `
          <div class="profile-preview">

            ${
              tgAvatar

              ?

              `
              <img
                src="${esc(tgAvatar)}"
                alt=""
              >
              `

              :

              `
              <div class="profile-preview-avatar">
                ${esc(
                  initials(
                    tgName()
                  )
                )}
              </div>
              `
            }

            <div class="profile-name">

              <strong>
                ${esc(
                  tgName()||
                  "Telegram пользователь"
                )}
              </strong>

              <span>
                ${
                  esc(
                    tgUsername()||
                    "Telegram"
                  )
                }
                · ID ${esc(telegramId)}
              </span>

            </div>

          </div>
          `

          :""
        }

        <div class="field">

          <label>
            ИМЯ КАРТОЧКИ
          </label>

          <input
            class="input"
            id="playerName"
            value="${esc(
              player
              ?player.name
              :""
            )}"
            placeholder="Например: Yatoro"
            maxlength="32"
          >

        </div>

        <div class="field">

          <label>
            DOTA 2 ACCOUNT ID
          </label>

          <input
            class="input"
            id="playerAccount"
            value="${esc(
              player
              ?player.accountId
              :""
            )}"
            placeholder="123456789 или Steam profile URL"
            ${
              edit
              ?"readonly"
              :""
            }
          >

        </div>

        ${
          !edit
          ?

          `
          <div
            style="
              margin-top:-6px;
              margin-bottom:15px;
              color:#625b4e;
              font:8px/1.5 monospace
            "
          >
            Можно вставить обычный числовой
            Account ID или ссылку на Steam/OpenDota профиль.
          </div>
          `

          :""
        }

        <div class="field">

          <label>
            РОЛЬ
          </label>

          <div
            class="roles"
            id="roleGrid"
          >

            ${
              Object.entries(ROLES)
                .map(([key,value])=>`

                  <div
                    class="
                      role-option
                      ${
                        role===key
                        ?"selected"
                        :""
                      }
                    "
                    data-role="${key}"
                  >

                    <strong>
                      ${value}
                    </strong>

                    <span>
                      Fantasy
                    </span>

                  </div>

                `)
                .join("")
            }

          </div>

        </div>

        <div class="field">

          <label>
            РЕДКОСТЬ
          </label>

          <div class="rarities">

            ${
              Object.entries(RARITIES)
                .map(([key,value])=>`

                  <div
                    class="
                      rarity-option
                      ${
                        rarity===key
                        ?"selected"
                        :""
                      }
                    "
                    data-rarity="${key}"
                  >
                    ${value}
                  </div>

                `)
                .join("")
            }

          </div>

        </div>

        <div class="field">

          <label>
            БОНУСЫ PLAYER CARD
          </label>

          <div class="bonus-grid">

            ${
              BONUS_FIELDS
                .map(([key,label])=>`

                  <div class="bonus">

                    <label>
                      ${label}
                    </label>

                    <input
                      type="number"
                      min="-100"
                      max="100"
                      step="1"
                      data-bonus="${key}"
                      value="${num(
                        card.bonuses[key]
                      )}"
                    >

                  </div>

                `)
                .join("")
            }

          </div>

        </div>

        <div id="modalError"></div>

        <div class="modal-actions">

          <button
            class="btn"
            id="cancelModal"
          >
            Отмена
          </button>

          <button
            class="btn primary"
            id="savePlayer"
          >
            ${
              edit
              ?"Сохранить"
              :"Создать карту"
            }
          </button>

        </div>

      </div>

    </div>

  `;


  document
    .getElementById("closeModal")
    .onclick=closeModal;

  document
    .getElementById("cancelModal")
    .onclick=closeModal;


  document
    .querySelectorAll("[data-role]")
    .forEach(element=>{

      element.onclick=()=>{

        role=
          element.dataset.role;

        document
          .querySelectorAll("[data-role]")
          .forEach(x=>
            x.classList.remove(
              "selected"
            )
          );

        element.classList.add(
          "selected"
        );

      };

    });


  document
    .querySelectorAll("[data-rarity]")
    .forEach(element=>{

      element.onclick=()=>{

        rarity=
          element.dataset.rarity;

        document
          .querySelectorAll(
            "[data-rarity]"
          )
          .forEach(x=>
            x.classList.remove(
              "selected"
            )
          );

        element.classList.add(
          "selected"
        );

      };

    });


  document
    .getElementById("savePlayer")
    .onclick=async()=>{

      const errorBox=
        document.getElementById(
          "modalError"
        );

      errorBox.innerHTML="";

      const saveButton=
        document.getElementById(
          "savePlayer"
        );

      if(!telegramId){

        errorBox.innerHTML=`
          <div class="notice error">
            Telegram ID не найден.
            Открой приложение через Telegram.
          </div>
        `;

        return;

      }


      const name=
        document
          .getElementById(
            "playerName"
          )
          .value
          .trim();

      const rawAccount=
        document
          .getElementById(
            "playerAccount"
          )
          .value
          .trim();


      if(!name){

        errorBox.innerHTML=`
          <div class="notice error">
            Укажи имя карточки.
          </div>
        `;

        return;

      }


      if(name.length<2){

        errorBox.innerHTML=`
          <div class="notice error">
            Имя слишком короткое.
          </div>
        `;

        return;

      }


      const account=
        parseDotaAccountId(
          rawAccount
        );


      if(!account){

        errorBox.innerHTML=`
          <div class="notice error">
            Не удалось определить Dota Account ID.
            Введи числовой ID или ссылку на профиль.
          </div>
        `;

        return;

      }


      /*
        При редактировании
        аккаунт вообще не берём из формы.
      */

      if(edit){

        if(
          String(account)!==
          String(player.accountId)
        ){

          errorBox.innerHTML=`
            <div class="notice error">
              Dota Account ID нельзя изменить.
            </div>
          `;

          return;

        }

      }


      /*
        Жёсткий запрет второй карты.
      */

      if(!edit && player){

        errorBox.innerHTML=`
          <div class="notice error">
            У этого Telegram аккаунта
            уже существует карта.
          </div>
        `;

        return;

      }


      saveButton.disabled=true;

      saveButton.innerHTML=
        `<span class="spinner"></span> Проверка…`;


      try{

        /*
          При создании обязательно проверяем
          реального игрока через OpenDota.
        */

        let dota=null;

        if(!edit){

          dota=
            await validateDotaPlayer(
              account
            );

        }


        const bonuses=
          defaultBonuses();


        document
          .querySelectorAll(
            "[data-bonus]"
          )
          .forEach(input=>{

            bonuses[
              input.dataset.bonus
            ]=num(input.value);

          });


        if(!edit){

          const dotaName=
            dota?.profile?.personaname||
            name;

          const dotaAvatar=
            getPlayerPhoto(dota);


          const newPlayer={

            /*
              Нельзя менять.
            */

            telegramUserId:
              String(telegramId),

            telegramUsername:
              telegramUser?.username||
              null,

            /*
              Dota account фиксируется
              при создании.
            */

            accountId:
              String(account),

            /*
              Имя выбирает пользователь.
            */

            name,

            /*
              Telegram avatar имеет приоритет.
            */

            photo:
              tgPhoto()||
              dotaAvatar||
              null,

            telegramName:
              tgName()||
              null,

            role,

            card:{
              rarity,
              bonuses
            },

            matches:[],

            createdAt:
              Date.now(),

            lastRefresh:null

          };


          /*
            Важный момент:
            сначала создаём owner документ.
            Если он уже существует —
            операция отменяется.
          */

          saveButton.innerHTML=
            `<span class="spinner"></span> Создание…`;


          await createOwner(
            newPlayer
          );


          player=
            normalize(
              newPlayer
            );


          saveLocal();

        }else{

          /*
            При редактировании:
            Telegram ID и Dota ID
            никогда не меняются.
          */

          player.name=name;
          player.role=role;

          player.card={
            rarity,
            bonuses
          };

          normalize(player);

          await saveOwner();

        }


        closeModal();

        render();

        showNotice(
          edit
          ?"✓ Карта обновлена"
          :"✓ Карта создана",
          "ok"
        );


        /*
          Матчи грузим после появления
          карточки, чтобы UI не зависел
          от OpenDota.
        */

        if(!edit){

          setTimeout(()=>{
            refreshPlayer();
          },250);

        }else{

          /*
            Бонусы могли измениться.
            Пересчитаем сохранённые матчи.
          */

          if(player.matches?.length){

            player.matches.forEach(match=>{

              const final=
                applyBonuses(
                  match.baseFantasy,
                  player.card.bonuses
                );

              match.finalFantasy=final;

              match.fantasy=
                Number(
                  Object.values(final)
                    .reduce(
                      (sum,value)=>
                        sum+num(value),
                      0
                    )
                    .toFixed(2)
                );

            });

          }

          await saveOwner();

          render();

        }


      }catch(error){

        console.error(error);

        errorBox.innerHTML=`
          <div class="notice error">
            ${esc(error.message)}
          </div>
        `;

        saveButton.disabled=false;

        saveButton.textContent=
          edit
          ?"Сохранить"
          :"Создать карту";

      }

    };

}


/* ============================================================
   CALCULATION MODAL
============================================================ */

function openCalculation(){

  if(!player){
    return;
  }

  const best=
    bestTwo();

  modalRoot.innerHTML=`

    <div class="overlay">

      <div class="modal">

        <button
          class="close"
          id="closeModal"
        >
          ×
        </button>

        <h2>
          Расчёт · ${esc(player.name)}
        </h2>

        <div class="modal-desc">
          ${esc(
            RARITIES[
              player.card.rarity
            ]
          )}
          PLAYER CARD
        </div>

        ${
          best.matches.length

          ?

          best.matches.map(match=>`

            <div class="calc-card">

              <div class="calc-head">

                <span>
                  MATCH #${esc(match.matchId)}
                </span>

                <strong>
                  ${fmt(match.fantasy)}
                </strong>

              </div>

              <table class="calc-table">

                <thead>

                  <tr>
                    <th>Показатель</th>
                    <th>Base</th>
                    <th>Card</th>
                    <th>Final</th>
                  </tr>

                </thead>

                <tbody>

                  ${
                    BONUS_FIELDS
                      .map(([key,label])=>`

                        <tr>

                          <td>
                            ${esc(label)}
                          </td>

                          <td>
                            ${num(
                              match.baseFantasy[key]
                            ).toFixed(3)}
                          </td>

                          <td>
                            ${
                              num(
                                player
                                  .card
                                  .bonuses[key]
                              )>=0
                              ?"+"
                              :""
                            }${
                              num(
                                player
                                  .card
                                  .bonuses[key]
                              )
                            }%
                          </td>

                          <td>
                            ${num(
                              match.finalFantasy[key]
                            ).toFixed(3)}
                          </td>

                        </tr>

                      `)
                      .join("")
                  }

                </tbody>

              </table>

            </div>

          `).join("")

          :

          `
          <div class="notice">
            Нет загруженных матчей.
          </div>
          `
        }

        <div class="calc-total">

          <span>
            BEST 2 TOTAL
          </span>

          <strong>
            ${fmt(best.total)}
          </strong>

        </div>

      </div>

    </div>

  `;

  document
    .getElementById("closeModal")
    .onclick=closeModal;

}


/* ============================================================
   TABS
============================================================ */

document
  .querySelectorAll(".tab")
  .forEach(tab=>{

    tab.onclick=()=>{

      document
        .querySelectorAll(".tab")
        .forEach(x=>
          x.classList.remove(
            "active"
          )
        );

      tab.classList.add(
        "active"
      );

      activeTab=
        tab.dataset.tab;

      render();

    };

  });


/* ============================================================
   HEADER BUTTONS
============================================================ */

document
  .getElementById("myBtn")
  .onclick=()=>{

    activeTab="players";

    document
      .querySelectorAll(".tab")
      .forEach(tab=>{

        tab.classList.toggle(
          "active",
          tab.dataset.tab==="players"
        );

      });

    render();

  };


document
  .getElementById("refreshBtn")
  .onclick=async()=>{

    const button=
      document.getElementById(
        "refreshBtn"
      );

    button.disabled=true;

    button.innerHTML=
      `<span class="spinner"></span>`;

    try{

      await refreshPlayer();

    }finally{

      button.disabled=false;

      button.textContent=
        "↻ Обновить";

    }

  };


/* ============================================================
   BOOT
============================================================ */

async function boot(){

  /*
    Мгновенно показываем локальный cache,
    но только если Telegram ID совпадает.
  */

  const local=loadLocal();

  if(
    local &&
    telegramId &&
    String(local.telegramUserId)===
    String(telegramId)
  ){

    player=local;

  }else{

    player=null;

  }

  render();


  /*
    Основной источник истины —
    Firestore.
  */

  if(telegramId){

    await loadOwner();

  }


  if(player){

    showNotice(
      `✓ Добро пожаловать, ${player.name}`,
      "ok"
    );

  }else if(!telegramId){

    showNotice(
      "Открой Fantasy Registry через Telegram WebApp.",
      "error"
    );

  }

}


boot();

</script>
