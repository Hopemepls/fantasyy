<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Dota Fantasy Registry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#070707;
  --bg2:#0d0c0a;
  --panel:#12110f;
  --panel2:#181512;
  --panel3:#211c15;

  --text:#eee5d3;
  --muted:#8f8677;
  --muted2:#665e51;

  --gold:#d6ad42;
  --gold2:#9b7929;
  --gold3:#f0ce68;

  --line:#2d281f;
  --line2:#413728;

  --green:#69bd83;
  --red:#d5656d;

  --shadow:0 20px 70px rgba(0,0,0,.5);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,rgba(182,139,43,.10),transparent 35%),
    var(--bg);
}

body{
  color:var(--text);
  padding:
    max(18px,env(safe-area-inset-top))
    12px
    max(70px,env(safe-area-inset-bottom));
  font-family:Georgia,"Times New Roman",serif;
  -webkit-tap-highlight-color:transparent;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.45;
}

.wrap{
  width:100%;
  max-width:1120px;
  margin:auto;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  padding:4px 2px 18px;
  border-bottom:1px solid var(--line);
}

.brand{
  min-width:0;
}

.brand-kicker{
  color:var(--gold);
  font:9px monospace;
  letter-spacing:2.5px;
  text-transform:uppercase;
  margin-bottom:7px;
}

.brand h1{
  margin:0;
  font-size:27px;
  line-height:1;
  letter-spacing:1.8px;
  font-weight:600;
}

.brand p{
  margin:8px 0 0;
  color:var(--muted);
  font:10px/1.5 monospace;
  letter-spacing:.3px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
  border:1px solid var(--line2);
  background:linear-gradient(180deg,#191611,#12100d);
  color:var(--text);
  min-height:36px;
  padding:8px 12px;
  border-radius:5px;

  font:9px monospace;
  letter-spacing:.8px;
  text-transform:uppercase;

  transition:
    border-color .18s,
    background .18s,
    transform .18s;
}

.btn:hover{
  border-color:var(--gold2);
  background:var(--panel3);
}

.btn:active{
  transform:translateY(1px);
}

.btn.primary{
  color:#171208;
  border-color:var(--gold);
  background:
    linear-gradient(180deg,var(--gold3),var(--gold));
  font-weight:bold;
  box-shadow:0 5px 20px rgba(214,173,66,.12);
}

.btn.primary:hover{
  background:linear-gradient(180deg,#f4d574,#c59a32);
}

/* =========================================================
   TABS
========================================================= */

.tabs{
  display:flex;
  gap:26px;
  border-bottom:1px solid var(--line);
  margin:0 0 18px;
}

.tab{
  position:relative;
  border:0;
  background:none;
  color:var(--muted);
  padding:13px 1px 12px;

  font:9px monospace;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold3);
}

.tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:var(--gold);
}

/* =========================================================
   STATUS
========================================================= */

.status{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:0 0 14px;
}

.status-item{
  border:1px solid var(--line);
  background:rgba(255,255,255,.015);
  border-radius:4px;
  padding:6px 9px;

  color:var(--muted);
  font:8px monospace;
}

.status-item b{
  color:var(--gold);
}

/* =========================================================
   NOTICE
========================================================= */

.notice{
  border:1px solid #4c3c1a;
  background:rgba(145,111,27,.07);
  color:#cbbb96;
  border-radius:5px;
  padding:10px 12px;
  margin:10px 0;

  font:10px/1.55 monospace;
}

.notice.ok{
  border-color:#315a3e;
  background:rgba(50,120,70,.07);
  color:#9ed3ab;
}

.notice.error{
  border-color:#633038;
  background:rgba(140,30,45,.08);
  color:#e1a0a8;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  min-height:400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;

  border:1px dashed var(--line2);
  border-radius:7px;
  background:
    radial-gradient(circle at 50% 20%,rgba(210,170,60,.06),transparent 35%),
    var(--panel);

  padding:45px 20px;
}

.empty-icon{
  width:65px;
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:18px;

  border:1px solid var(--gold2);
  border-radius:50%;

  color:var(--gold);
  font-size:28px;

  box-shadow:
    0 0 40px rgba(210,170,60,.07);
}

.empty h2{
  margin:0 0 9px;
  font-size:22px;
  font-weight:500;
}

.empty p{
  max-width:490px;
  margin:0 auto 20px;

  color:var(--muted);
  font-size:12px;
  line-height:1.65;
}

/* =========================================================
   CARD
========================================================= */

.cards{
  display:grid;
  grid-template-columns:minmax(0,500px);
  justify-content:center;
}

.card{
  overflow:hidden;
  position:relative;

  border:1px solid var(--line2);
  border-radius:8px;

  background:
    linear-gradient(180deg,#15120f,#100e0c);

  box-shadow:var(--shadow);

  animation:cardIn .35s ease both;
}

.card:before{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  top:0;
  height:1px;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(230,192,89,.8),
    transparent
  );
}

.card.mine{
  border-color:#655329;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card-head{
  height:46px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  border-bottom:1px solid var(--line);
}

.role{
  color:var(--gold);
  font:8px monospace;
  letter-spacing:1.6px;
}

.mine-badge{
  padding:4px 7px;

  border-radius:3px;

  color:#171208;
  background:var(--gold);

  font:7px monospace;
  font-weight:bold;
  letter-spacing:.7px;
}

/* =========================================================
   PHOTO
========================================================= */

.photo{
  height:260px;

  position:relative;
  overflow:hidden;

  background:
    radial-gradient(circle at 50% 35%,#292117,#0d0b09 65%);
}

.photo img{
  width:100%;
  height:100%;
  display:block;

  object-fit:cover;

  animation:photoIn .5s ease both;
}

@keyframes photoIn{
  from{
    opacity:0;
    transform:scale(1.04);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.photo:after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.05),
      rgba(0,0,0,.05) 35%,
      rgba(0,0,0,.9) 100%
    );

  pointer-events:none;
}

.placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#504637;
  font-size:76px;

  background:
    radial-gradient(circle,#30281c 0%,#0d0b09 70%);
}

.player-name{
  position:absolute;
  z-index:2;

  left:15px;
  right:15px;
  bottom:15px;
}

.player-name strong{
  display:block;

  color:#f4ead5;
  font-size:24px;
  line-height:1.1;

  text-shadow:0 3px 12px #000;
}

.player-name span{
  display:block;
  margin-top:6px;

  color:#aaa08d;
  font:8px monospace;
  letter-spacing:.6px;
}

/* =========================================================
   SUMMARY
========================================================= */

.card-summary{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;

  padding:15px;

  border-bottom:1px solid var(--line);
}

.rarity{
  color:var(--gold);
  font:8px monospace;
  letter-spacing:1.3px;
}

.score-label{
  margin-top:5px;
  color:var(--muted2);
  font:8px monospace;
}

.score{
  color:var(--gold3);
  font-size:29px;
  font-weight:bold;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
  padding:13px 15px;
  border-bottom:1px solid var(--line);
}

.loading-line{
  display:flex;
  justify-content:space-between;
  gap:10px;

  margin-bottom:8px;

  color:#9c927e;
  font:8px monospace;
}

.progress{
  height:4px;
  overflow:hidden;

  background:#292219;
  border-radius:10px;
}

.progress i{
  display:block;

  width:0;
  height:100%;

  background:var(--gold);

  transition:width .25s ease;
}

/* =========================================================
   MATCHES
========================================================= */

.matches{
  padding:11px;
}

.match{
  padding:10px;
  margin-bottom:7px;

  border:1px solid var(--line);
  border-radius:4px;

  background:#0e0d0b;

  transition:border-color .18s;
}

.match:hover{
  border-color:#4b402e;
}

.match:last-child{
  margin-bottom:0;
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.match-id{
  color:#6e6759;
  font:8px monospace;
}

.match-score{
  color:var(--gold);
  font:13px monospace;
  font-weight:bold;
}

.match-info{
  display:flex;
  flex-wrap:wrap;
  gap:8px;

  margin-top:6px;

  color:#756c5c;
  font:8px monospace;
}

.win{
  color:var(--green)!important;
}

.loss{
  color:var(--red)!important;
}

/* =========================================================
   FOOTER
========================================================= */

.card-footer{
  display:flex;
  gap:7px;

  padding:11px;

  border-top:1px solid var(--line);
}

.card-footer .btn{
  flex:1;
}

/* =========================================================
   RATING
========================================================= */

.table-wrap{
  overflow:auto;

  border:1px solid var(--line);
  border-radius:5px;
}

table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}

th,
td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

th{
  background:var(--panel2);

  color:var(--muted);
  font:8px monospace;

  text-transform:uppercase;
}

td{
  background:var(--panel);
  font-size:12px;
}

tr:last-child td{
  border-bottom:0;
}

/* =========================================================
   MODAL
========================================================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12px;

  background:rgba(0,0,0,.86);

  backdrop-filter:blur(5px);
}

.modal{
  width:100%;
  max-width:560px;
  max-height:93vh;

  overflow:auto;

  position:relative;

  padding:21px;

  border:1px solid #75602d;
  border-radius:7px;

  background:
    radial-gradient(circle at 50% 0%,rgba(205,164,52,.07),transparent 35%),
    var(--panel);

  box-shadow:0 25px 100px rgba(0,0,0,.7);

  animation:modalIn .2s ease both;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:scale(.98) translateY(6px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.close{
  position:absolute;
  top:8px;
  right:11px;

  border:0;
  background:none;

  color:var(--muted);
  font-size:24px;
}

.close:hover{
  color:var(--text);
}

.modal h2{
  margin:0 35px 7px 0;

  font-size:22px;
  font-weight:500;
}

.modal-desc{
  color:#9b907c;
  font-size:11px;
  line-height:1.6;

  margin-bottom:18px;
}

.modal-desc b{
  color:#d5c7ad;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;

  margin-bottom:6px;

  color:#958a77;

  font:8px monospace;
  letter-spacing:1px;
}

input{
  width:100%;

  padding:10px 11px;

  border:1px solid var(--line);
  border-radius:4px;

  outline:none;

  background:#0c0b09;
  color:var(--text);

  font:11px monospace;

  transition:border-color .18s,box-shadow .18s;
}

input:focus{
  border-color:var(--gold2);

  box-shadow:
    0 0 0 2px rgba(190,145,42,.06);
}

input[readonly]{
  opacity:.6;
}

/* =========================================================
   ROLE / RARITY
========================================================= */

.roles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.role-option,
.rarity-option{
  padding:11px 8px;

  text-align:center;

  border:1px solid var(--line);
  border-radius:4px;

  background:#100f0c;

  cursor:pointer;

  transition:
    border-color .18s,
    background .18s;
}

.role-option:hover,
.rarity-option:hover{
  border-color:#5a4b2d;
}

.role-option.selected,
.rarity-option.selected{
  border-color:var(--gold);
  background:rgba(191,147,41,.07);
  color:var(--gold);
}

.role-option strong{
  display:block;
  font:9px monospace;
}

.role-option span{
  display:block;

  margin-top:3px;

  color:#6f6655;
  font-size:9px;
}

/* =========================================================
   BONUS
========================================================= */

.bonus-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.bonus{
  padding:8px;

  border:1px solid var(--line);
  border-radius:4px;

  background:#0f0e0c;
}

.bonus label{
  margin-bottom:4px;
  font-size:7px;
}

.bonus input{
  padding:7px;
}

/* =========================================================
   MODAL ACTIONS
========================================================= */

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;

  margin-top:18px;
}

/* =========================================================
   CALCULATION
========================================================= */

.calc-table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}

.calc-table th,
.calc-table td{
  min-width:0;
  padding:8px 6px;
  font-size:8px;
}

.calc-table th{
  font-size:7px;
}

.calc-table td{
  background:#100e0b;
}

.calc-total{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-top:10px;
  padding:13px;

  border:1px solid var(--gold2);

  background:rgba(160,125,30,.07);
}

.calc-total span{
  color:#988a6d;
  font:9px monospace;
}

.calc-total strong{
  color:var(--gold);
  font-size:24px;
}

/* =========================================================
   DIAGNOSTICS
========================================================= */

.diag{
  display:none;

  border:1px solid var(--line);
  border-radius:5px;

  overflow:hidden;
}

.diag.open{
  display:block;
}

.diag-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:10px;

  border-bottom:1px solid var(--line);

  background:var(--panel2);
}

.diag-head strong{
  font:9px monospace;
}

pre{
  margin:0;

  max-height:500px;
  overflow:auto;

  padding:12px;

  color:#afa38b;

  font:8px/1.5 monospace;

  white-space:pre-wrap;
  word-break:break-word;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

  body{
    padding-left:9px;
    padding-right:9px;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
    gap:14px;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .brand h1{
    font-size:23px;
  }

  .tabs{
    gap:19px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .photo{
    height:245px;
  }

  .roles{
    grid-template-columns:1fr;
  }

  .bonus-grid{
    grid-template-columns:1fr 1fr;
  }

  .modal{
    padding:17px;
  }
}

@media(max-width:390px){

  .bonus-grid{
    grid-template-columns:1fr;
  }

  .photo{
    height:220px;
  }

  .player-name strong{
    font-size:21px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <header class="header">

    <div class="brand">

      </button>

    <pre id="diagOutput">Пока запросов нет.</pre>

  </div>

</div>


<div id="modalRoot"></div>


<script>

/* ============================================================
   CONFIG
============================================================ */

const API="https://api.opendota.com/api";

const FIREBASE_CONFIG={

  authDomain:"fantasy-218c8.firebaseapp.com",
  projectId:"fantasy-218c8",
  storageBucket:"fantasy-218c8.firebasestorage.app",
  messagingSenderId:"122819799870",

};


/*
  Локальный ключ.
  Важно: Telegram ID больше НЕ нужен для работы приложения.
*/
const CACHE_KEY="fantasy_registry_card_v20";


/*
  Если Telegram доступен, его фото будет использовано.
  Но отсутствие Telegram НЕ мешает создать карту.
*/
const TELEGRAM_PHOTO_KEY="fantasy_registry_tg_photo";


const FANTASY_RULES={
  kills:.30,
  deaths:-.30,
  assists:.15,

  gpm:.002,

  runes_grabbed:.25,

};


const BONUS_FIELDS=[
  ["kills","Kills"],
  ["deaths","Deaths"],
  ["assists","Assists"],
  ["last_hits","Last Hits"],

  ["tower_kills","Tower Kills"],

const ROLES={

  bronze:"BRONZE",

/* ============================================================
   STATE
============================================================ */

let db=null;

let player=null;

let telegramUser=null;

let activeTab="players";

let logs=[];


/* ============================================================
   TELEGRAM
===============================================================
   ВАЖНО:

   Telegram теперь используется ТОЛЬКО для фото.

   Никаких:
   - telegramId checks
   - Telegram authorization requirements
   - блокировок создания
   - требований открыть страницу через Telegram
============================================================ */

function initTelegramPhoto(){

  try{

    const tg=
      window.Telegram &&
      window.Telegram.WebApp;

    if(!tg){
      return null;
    }

    try{
      tg.ready();
    }catch(_){}

    try{
      tg.expand();
    }catch(_){}

    const u=
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user;

/* ============================================================
   HELPERS
============================================================ */

function esc(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}


function num(v){

  const n=Number(v);

  return Number.isFinite(n)
    ? n
    : 0;

}


function fmt(v){

  return num(v).toLocaleString(
    "ru-RU",
    {
      maximumFractionDigits:2
    }
  );

}


function accountIdFrom(v){

  const m=
    String(v || "")
      .match(/\d+/g);

  return m && m.length
    ? m[m.length-1]
    : null;

}


function initials(v){

  return String(v || "?")
    .trim()
    .slice(0,1)
    .toUpperCase();

}


function defaultBonuses(){

  const x={};

  BONUS_FIELDS.forEach(
    ([k])=>{
      x[k]=0;
    }
  );

  return x;

}


function defaultCard(){

  return{
    rarity:"bronze",
    bonuses:defaultBonuses()
  };

}


function normalize(p){

  p=p || {};

  p.card=
    p.card ||
    defaultCard();

  p.card.bonuses=
    p.card.bonuses ||
    defaultBonuses();

  BONUS_FIELDS.forEach(
    ([k])=>{
      p.card.bonuses[k]=
        num(p.card.bonuses[k]);
    }
  );

  if(!RARITIES[p.card.rarity]){
    p.card.rarity="bronze";
  }

  if(!Array.isArray(p.matches)){
    p.matches=[];
  }

  return p;

}

/* ============================================================
   FIREBASE STORAGE
===============================================================
   Без Telegram ID используем один документ:

   registry/main

   Это значит:
   приложение не требует Telegram,
   а Firebase используется просто как постоянное
   хранилище одной карточки.
============================================================ */

function ownerRef(){

  if(!db){
    return null;
  }

  return db
    .collection("registry")
    .doc("main");

}


async function loadOwner(){

  const local=loadLocal();

  if(local){

    player=local;

    render();

  }


  if(!db){

    return player;

  }


  try{

    const ref=ownerRef();

    if(!ref){
      return player;
    }

    const snap=
      await ref.get();

    if(snap.exists){

      const remote=
        normalize(snap.data());

      /*
        Если Firebase уже содержит карту,
        она является главной.
      */

      player=remote;

      saveLocal();

      render();

    }else if(local){

      /*
        Если Firebase пустой,
        переносим локальную карту.
      */

      await ref.set(
        local,
        {merge:false}
      );

    }

  }catch(e){

    log(
      "FIREBASE LOAD ERROR",
      {
        error:e.message
      }
    );

  }

  return player;

}


async function saveOwner(){

  if(!player){
    return;
  }

  normalize(player);

  saveLocal();


  if(!db){
    return;
  }


  try{

    const ref=ownerRef();

    if(ref){

      await ref.set(
        player,
        {merge:false}
      );

    }

  }catch(e){

    log(
      "FIREBASE SAVE ERROR",
      {
        error:e.message
      }
    );

  }

}

/* ============================================================
   OPEN DOTA API
============================================================ */

async function api(path){

  const url=
    API+path;

  log(
    "REQUEST",
    {url}
  );

  const r=
    await fetch(
      url,
      {
        method:"GET",
        cache:"no-store",
        headers:{
          Accept:"application/json"
        }
      }
    );


  const text=
    await r.text();


  if(!r.ok){

    throw new Error(
      `OpenDota HTTP ${r.status}`
    );

  }


  try{

    return JSON.parse(text);

  }catch(_){

    throw new Error(
      "OpenDota вернула не JSON"
    );

  }

}

/* ============================================================
   FANTASY
============================================================ */

function calculateBaseFantasy(p){

  const kills=
    num(p.kills);

  const deaths=
    num(p.deaths);

  const assists=
    num(p.assists);

  const lastHits=
    num(p.last_hits);

  const denies=
    num(p.denies);

  const gpm=
    num(p.gold_per_min);

  const tower=
    num(p.tower_kills);

  const roshan=
    num(p.roshan_kills);

  const team=
    num(p.teamfight_participation);

  const obs=
    num(p.obs_placed);

  const stacks=
    num(p.camps_stacked);

  const runes=
    num(p.rune_pickups);

  const fb=
    p.firstblood_claimed
      ? 1
      : 0;

  const stuns=
    num(p.stuns);


  return{

    kills:
      kills*
      FANTASY_RULES.kills,

    deaths:
      FANTASY_RULES.deaths_base+
      deaths*
      FANTASY_RULES.deaths,

    assists:
      assists*
      FANTASY_RULES.assists,

    last_hits:
      (lastHits+denies)*
      FANTASY_RULES.last_hits,

    gpm:
      gpm*
      FANTASY_RULES.gpm,

    tower_kills:
      tower*
      FANTASY_RULES.tower_kills,

    roshan_kills:
      roshan*
      FANTASY_RULES.roshan_kills,

    teamfight:
      team*
      FANTASY_RULES.teamfight,

    observer_placed:
      obs*
      FANTASY_RULES.observer_placed,

    camps_stacked:
      stacks*
      FANTASY_RULES.camps_stacked,

    runes_grabbed:
      runes*
      FANTASY_RULES.runes_grabbed,

    first_blood:
      fb*
      FANTASY_RULES.first_blood,

    stuns:
      stuns*
      FANTASY_RULES.stuns

  };

}


function applyBonuses(
  base,
  bonuses
){

  const out={};

  BONUS_FIELDS.forEach(
    ([k])=>{

      out[k]=
        num(base[k])*
        (
          1+
          num(
            bonuses &&
            bonuses[k]
          )/100
        );

    }
  );

  return out;

}


function calculate(
  p,
  card
){

  const base=
    calculateBaseFantasy(p);

  const final=
    applyBonuses(
      base,
      card.bonuses
    );

  const total=
    Object.values(final)
      .reduce(
        (s,v)=>
          s+num(v),
        0
      );

  return{
    base,
    final,
    total
  };

}


/* ============================================================
   MATCH
============================================================ */

async function loadMatch(
  matchId,
  accountId,
  card
){

  const match=
    await api(
      `/matches/${matchId}`
    );


  if(
    !match ||
    !Array.isArray(match.players)
  ){

    throw new Error(
      `Матч ${matchId}: players отсутствует`
    );

  }


  const p=
    match.players.find(
      x=>
        String(x.account_id)===
        String(accountId)
    );


  if(!p){

    throw new Error(
      `Игрок не найден в матче ${matchId}`
    );

  }


  const c=
    calculate(
      p,
      card
    );


  const radiant=
    num(p.player_slot)<128;

  const win=
    Boolean(match.radiant_win)===
    radiant;


  return{

    matchId:
      String(match.match_id),

    startTime:
      num(match.start_time),

    duration:
      num(match.duration),

    win,

    kills:
      num(p.kills),

    deaths:
      num(p.deaths),

    assists:
      num(p.assists),

    lastHits:
      num(p.last_hits),

    denies:
      num(p.denies),

    gpm:
      num(p.gold_per_min),

    teamfight:
      num(p.teamfight_participation),

    observer:
      num(p.obs_placed),

    stacks:
      num(p.camps_stacked),

    runes:
      num(p.rune_pickups),

    firstBlood:
      Boolean(p.firstblood_claimed),

    towerKills:
      num(p.tower_kills),

    roshanKills:
      num(p.roshan_kills),

    stuns:
      num(p.stuns),

    baseFantasy:
      c.base,

    finalFantasy:
      c.final,

    fantasy:
      Number(
        c.total.toFixed(2)
      )

  };

}


/* ============================================================
   LIMITED LOADER
============================================================ */

async function loadLimited(
  ids,
  accountId,
  card,
  onProgress
){

  const results=[];

  let next=0;

  let done=0;


  async function worker(){

    while(true){

      const i=
        next++;


      if(i>=ids.length){
        return;
      }


      try{

        results[i]=
          await loadMatch(
            ids[i],
            accountId,
            card
          );

      }catch(e){

        results[i]=null;

        log(
          "MATCH FAILED",
          {
            matchId:ids[i],
            error:e.message
          }
        );

      }


      done++;


      if(onProgress){

        onProgress(
          done,
          ids.length,
          ids[i]
        );

      }

    }

  }


  await Promise.all([
    worker(),
    worker()
  ]);


  return results.filter(Boolean);

}


/* ============================================================
   BEST TWO
============================================================ */

function bestTwo(){

  if(!player){

    return{
      matches:[],
      total:0
    };

  }


  const sorted=
    (player.matches||[])
      .slice()
      .sort(
        (a,b)=>
          num(b.fantasy)-
          num(a.fantasy)
      );


  const matches=
    sorted.slice(0,2);


  return{

    matches,

    total:
      matches.reduce(
        (s,m)=>
          s+num(m.fantasy),
        0
      )

  };

}


/* ============================================================
   REFRESH PLAYER
============================================================ */

async function refreshPlayer(){

  if(!player){
    return;
  }


  player.loading=true;

  player.loadingCurrent=0;

  player.loadingTotal=2;

  player.loadingText=
    "Получаем последние матчи...";

  render();


  try{

    const history=
      await getHistory(
        player.accountId
      );


    if(!history.length){

      throw new Error(
        "У игрока нет доступной истории матчей"
      );

    }


    const target=
      history
        .slice(0,2)
        .map(
          x=>String(x.match_id)
        );


    const existing=
      new Map(
        (player.matches||[])
          .map(
            m=>[
              String(m.matchId),
              m
            ]
          )
      );


    const need=
      target.filter(
        id=>!existing.has(id)
      );


    if(need.length){

      const fresh=
        await loadLimited(
          need,
          player.accountId,
          player.card,
          (
            current,
            total,
            id
          )=>{

            player.loadingCurrent=
              current;

            player.loadingTotal=
              total;

            player.loadingText=
              `Матч ${current}/${total} · ${id}`;

            render();

          }
        );


      fresh.forEach(
        m=>
          existing.set(
            String(m.matchId),
            m
          )
      );

    }


    player.matches=
      target
        .map(
          id=>existing.get(id)
        )
        .filter(Boolean);


    player.lastRefresh=
      Date.now();


    /*
      Пересчёт без повторного запроса.
    */

    player.matches.forEach(
      m=>{

        const final=
          applyBonuses(
            m.baseFantasy,
            player.card.bonuses
          );

        m.finalFantasy=
          final;

        m.fantasy=
          Number(
            Object.values(final)
              .reduce(
                (s,v)=>
                  s+num(v),
                0
              )
              .toFixed(2)
          );

      }
    );


    delete player.loading;

    delete player.loadingCurrent;

    delete player.loadingTotal;

    delete player.loadingText;


    await saveOwner();

    render();

    showNotice(
      "✓ Данные матчей обновлены",
      "ok"
    );


  }catch(e){

    delete player.loading;

    delete player.loadingCurrent;

    delete player.loadingTotal;

    delete player.loadingText;

    render();

    showNotice(
      "Ошибка: "+e.message,
      "error"
    );

  }

}

    </div>


    <div class="notice">

      Сейчас отображается только твоя карта.
      Система специально не позволяет добавлять
      чужих игроков вручную.

    </div>

  `;

}


/* ============================================================
   MAIN RENDER
============================================================ */

function render(){

  renderStatus();

  diag.classList.toggle(
    "open",
    activeTab==="diagnostics"
  );


  if(activeTab==="players"){

    renderPlayer();

  }else if(activeTab==="rating"){

    renderRating();

  }else{

    content.innerHTML=`

      <div class="notice">

        <b>FANTASY REGISTRY</b>

        <br><br>

        Telegram используется
        только для получения фотографии
        профиля.

        <br><br>

        Создание карты не зависит
        от Telegram WebApp API.

        <br><br>

        Карта:
        <b>
          ${player
            ?esc(player.name)
            :"не создана"}
        </b>

      </div>

    `;

    renderDiagnostics();

  }

}


/* ============================================================
   MODALS
============================================================ */

function closeModal(){

  modalRoot.innerHTML="";

}


/* ============================================================
   CREATE
============================================================ */

function openCreateModal(){

  /*
    Если карта уже существует,
    никакого редактирования.
  */

  if(player){

    showNotice(
      "Карта уже создана. Изменение или создание второй карты недоступно.",
      "error"
    );

    return;

  }


  /*
    Telegram фото пытаемся получить,
    но если его нет — продолжаем.
  */

  const photo=
    getTelegramPhoto();


  renderCreateForm(photo);

}


/* ============================================================
   CREATE FORM
============================================================ */

function renderCreateForm(
  photo
){

  let role="carry";

  let rarity="bronze";


  modalRoot.innerHTML=`

    <div class="overlay">

      <div class="modal">

        <button
          class="close"
          id="closeModal"
        >
          ×
        </button>


        <h2>
          Создание PLAYER CARD
        </h2>


        <div class="modal-desc">

          Укажи данные игрока.
          После создания карта будет
          <b>зафиксирована навсегда</b>.

          <br><br>

          Имя, Dota Account ID,
          роль и параметры карты
          после сохранения изменить нельзя.

        </div>


        <div class="field">

          <label>
            ИМЯ ИГРОКА
          </label>

          <input
            id="playerName"
            placeholder="Например: Yatoro"
            autocomplete="off"
          >

        </div>


        <div class="field">

          <label>
            DOTA 2 ACCOUNT ID
          </label>

          <input
            id="playerAccount"
            inputmode="numeric"
            placeholder="Например: 117905733"
            autocomplete="off"
          >

        </div>


        <div class="field">

          <label>
            РОЛЬ
          </label>

          <div
            class="roles"
            id="roleGrid"
          >

            ${
              Object.entries(ROLES)
                .map(
                  ([k,v])=>`

                    <div
                      class="
                        role-option
                        ${
                          role===k
                            ?"selected"
                            :""
                        }
                      "
                      data-role="${k}"
                    >

                      <strong>
                        ${v}
                      </strong>

                      <span>
                        Fantasy
                      </span>

                    </div>

                  `
                )
                .join("")
            }

          </div>

        </div>


        <div class="field">

          <label>
            РЕДКОСТЬ
          </label>


          <div
            class="roles"
            style="
              grid-template-columns:
              repeat(3,1fr)
            "
          >

            ${
              Object.entries(RARITIES)
                .map(
                  ([k,v])=>`

                    <div
                      class="
                        rarity-option
                        ${
                          rarity===k
                            ?"selected"
                            :""
                        }
                      "
                      data-rarity="${k}"
                    >
                      ${v}
                    </div>

                  `
                )
                .join("")
            }

          </div>

        </div>


        ${
          photo

          ?`

            <div
              style="
                display:flex;
                align-items:center;
                gap:10px;
                margin-top:4px;
                padding:10px;
                border:1px solid var(--line);
                border-radius:4px;
                background:#0e0d0b;
              "
            >

              <img
                src="${esc(photo)}"
                style="
                  width:42px;
                  height:42px;
                  border-radius:50%;
                  object-fit:cover;
                  border:1px solid var(--gold2);
                "
              >

              <div
                style="
                  color:#948975;
                  font:8px/1.5 monospace;
                "
              >
                Фотография профиля
                <br>
                будет использована
                на карточке.
              </div>

            </div>

          `

          :`

            <div
              class="notice"
              style="margin-top:4px"
            >
              Фото профиля Telegram
              недоступно — будет создан
              красивый текстовый аватар.
            </div>

          `
        }


        <div id="modalError"></div>


        <div class="modal-actions">

          <button
            class="btn"
            id="cancelModal"
          >
            Отмена
          </button>

          <button
            class="btn primary"
            id="savePlayer"
          >
            Создать карту
          </button>

        </div>

      </div>

    </div>

  `;


  document
    .getElementById("closeModal")
    .onclick=
      closeModal;


  document
    .getElementById("cancelModal")
    .onclick=
      closeModal;


  document
    .querySelectorAll("[data-role]")
    .forEach(
      el=>{

        el.onclick=()=>{

          role=
            el.dataset.role;

          document
            .querySelectorAll(
              "[data-role]"
            )
            .forEach(
              x=>
                x.classList
                  .remove(
                    "selected"
                  )
            );

          el.classList.add(
            "selected"
          );

        };

      }
    );


  document
    .querySelectorAll("[data-rarity]")
    .forEach(
      el=>{

        el.onclick=()=>{

          rarity=
            el.dataset.rarity;

          document
            .querySelectorAll(
              "[data-rarity]"
            )
            .forEach(
              x=>
                x.classList
                  .remove(
                    "selected"
                  )
            );

          el.classList.add(
            "selected"
          );

        };

      }
    );


  document
    .getElementById("savePlayer")
    .onclick=
      async()=>{

        const error=
          document.getElementById(
            "modalError"
          );

        error.innerHTML="";


        /*
          Повторная защита.
        */

        if(player){

          error.innerHTML=`

            <div class="notice error">
              Карта уже существует.
              Создать вторую невозможно.
            </div>

          `;

          return;

        }


        const name=
          document
            .getElementById(
              "playerName"
            )
            .value
            .trim();


        const account=
          accountIdFrom(
            document
              .getElementById(
                "playerAccount"
              )
              .value
          );


        if(!name){

          error.innerHTML=`

            <div class="notice error">
              Укажи имя игрока.
            </div>

          `;

          return;

        }


        if(!account){

          error.innerHTML=`

            <div class="notice error">
              Укажи корректный
              Dota 2 Account ID.
            </div>

          `;

          return;

        }


        /*
          Создаём карту ОДИН РАЗ.
        */

        player={

          accountId:
            String(account),

          name,

          role,

          photo:
            photo || null,

          card:{

            rarity,

            bonuses:
              defaultBonuses()

          },

          matches:[],

          lastRefresh:null,

          createdAt:
            Date.now(),

          /*
            Флаг неизменяемой карты.
          */

          locked:true

        };


        normalize(player);


        /*
          Сохраняем локально сразу.
        */

        saveLocal();


        /*
          Сохраняем в Firebase.
        */

        await saveOwner();


        closeModal();

        render();


        showNotice(
          "✓ Карта создана. Данные игрока зафиксированы.",
          "ok"
        );


        /*
          Матчи загружаются уже после
          создания карточки.
        */

        refreshPlayer();

      };

}


/* ============================================================
   CALCULATION
============================================================ */

function openCalculation(){

  if(!player){
    return;
  }


  const best=
    bestTwo();


  modalRoot.innerHTML=`

    <div class="overlay">

      <div class="modal">

        <button
          class="close"
          id="closeModal"
        >
          ×
        </button>


        <h2>
          Fantasy Calculation
        </h2>


        <div class="modal-desc">

          ${esc(player.name)}

          ·

          ${esc(
            RARITIES[
              player.card.rarity
            ]
          )}

          PLAYER CARD

        </div>


        ${
          best.matches.length

          ? best.matches.map(
              m=>`

                <div
                  style="
                    border:1px solid var(--line);
                    margin-top:12px;
                    border-radius:4px;
                    overflow:hidden;
                  "
                >

                  <div
                    style="
                      display:flex;
                      justify-content:space-between;
                      padding:9px;
                      border-bottom:1px solid var(--line);
                      font:9px monospace;
                    "
                  >

                    <span>
                      MATCH #${esc(m.matchId)}
                    </span>

                    <strong
                      style="
                        color:var(--gold)
                      "
                    >
                      ${fmt(m.fantasy)}
                    </strong>

                  </div>


                  <table
                    class="calc-table"
                  >

                    <thead>

                      <tr>
                        <th>Показатель</th>
                        <th>Base</th>
                        <th>Card</th>
                        <th>Final</th>
                      </tr>

                    </thead>


                    <tbody>

                      ${
                        BONUS_FIELDS.map(
                          ([k,l])=>`

        <div class="calc-total">

          <span>
            BEST 2 TOTAL
          </span>

          <strong>
            ${fmt(best.total)}
          </strong>

        </div>

      </div>

    </div>

  `;


  document
    .getElementById("closeModal")
    .onclick=

}


/* ============================================================
   TABS
============================================================ */

document
  .querySelectorAll(".tab")
  .forEach(
    tab=>{

      tab.onclick=()=>{

        document
          .querySelectorAll(".tab")
          .forEach(
            x=>
              x.classList.remove(
                "active"
              )
          );


        tab.classList.add(
          "active"
        );


        activeTab=
          tab.dataset.tab;


        render();

      };

    }
  );


/* ============================================================
   TOP BUTTONS
============================================================ */

document
  .getElementById("myBtn")
  .onclick=()=>{

    activeTab="players";

    document
      .querySelectorAll(".tab")
      .forEach(
        x=>
          x.classList.toggle(
            "active",
            x.dataset.tab==="players"
          )
      );

    render();

  };


document
  .getElementById("refreshBtn")
  .onclick=
    async()=>{

      const b=
        document.getElementById(
          "refreshBtn"
        );


      b.disabled=true;

      b.textContent=
        "Загрузка...";


      try{

        await refreshPlayer();

      }finally{

        b.disabled=false;

        b.textContent=
          "↻ Обновить";

      }

    };


/* ============================================================
   BOOT
============================================================ */

async function boot(){

  /*
    Пытаемся получить Telegram photo,
    но абсолютно не зависим от Telegram.
  */

  initTelegramPhoto();


  /*
    Сначала локальная карта.
  */

  player=
    loadLocal();


  render();


  /*
    Потом Firebase.
  */

  await loadOwner();


  /*
    Если карта существует —
    просто показываем её.
  */

  if(player){

    render();

    return;

  }


  /*
    Если карты нет —
    автоматически открываем создание.

    Здесь НЕТ:
      if(!telegramId)
      "открой через Telegram"
      "Telegram ID не найден"
      и т.п.
  */

  setTimeout(
    ()=>{
      if(!player){
        openCreateModal();
      }
    },
    350
  );

}


boot();

</script>
