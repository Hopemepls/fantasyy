<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Dota 2 Fantasy Registry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#080706;
  --bg2:#0d0b09;
  --panel:#13100d;
  --panel2:#19140f;
  --panel3:#211a12;

  --text:#eee5d3;
  --muted:#8f836f;
  --muted2:#655b4c;

  --gold:#d8b34b;
  --gold2:#9b7929;
  --gold3:#604a1b;

  --line:#30271c;
  --line2:#403323;

  --green:#63c584;
  --red:#d36570;
  --blue:#78a9dc;

  --shadow:0 20px 60px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -20%,rgba(173,130,39,.08),transparent 35%),
    var(--bg);
}

body{
  color:var(--text);
  padding:
    calc(14px + env(safe-area-inset-top))
    11px
    calc(60px + env(safe-area-inset-bottom));

  font-family:Georgia,"Times New Roman",serif;
  -webkit-tap-highlight-color:transparent;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.45;
}

.wrap{
  width:100%;
  max-width:1180px;
  margin:0 auto;
}

/* ============================================================
   HEADER
============================================================ */

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;

  padding:8px 0 17px;
  border-bottom:1px solid var(--line);
}

.brand{
  min-width:0;
}

.brand-kicker{
  color:var(--gold);
  font:8px monospace;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:6px;
}

.brand h1{
  margin:0;
  font-size:26px;
  line-height:1;
  letter-spacing:1.8px;
}

.brand p{
  margin:7px 0 0;
  color:var(--muted);
  font:9px monospace;
  letter-spacing:.4px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  border:1px solid var(--gold3);
  background:linear-gradient(180deg,var(--panel3),var(--panel2));
  color:var(--text);

  padding:9px 12px;
  border-radius:4px;

  font:9px monospace;
  letter-spacing:.8px;
  text-transform:uppercase;

  transition:
    border-color .15s,
    background .15s,
    transform .15s;
}

.btn:hover{
  border-color:var(--gold2);
  background:#2a2115;
}

.btn:active{
  transform:translateY(1px);
}

.btn.primary{
  background:linear-gradient(180deg,#ad892b,#735717);
  border-color:var(--gold);
  color:#181206;
  font-weight:700;
}

.btn.small{
  padding:7px 9px;
  font-size:8px;
}

/* ============================================================
   TABS
============================================================ */

.tabs{
  display:flex;
  gap:25px;
  border-bottom:1px solid var(--line);
  margin-bottom:17px;
  overflow:auto;
}

.tab{
  position:relative;

  border:0;
  background:none;

  color:var(--muted);

  padding:12px 1px;

  white-space:nowrap;

  font:9px monospace;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold);
}

.tab.active:after{
  content:"";

  position:absolute;
  left:0;
  right:0;
  bottom:-1px;

  height:2px;

  background:var(--gold);
  box-shadow:0 0 10px rgba(216,179,75,.3);
}

/* ============================================================
   STATUS
============================================================ */

.status{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:13px 0;
}

.status-item{
  border:1px solid var(--line);
  background:rgba(255,255,255,.012);

  padding:6px 9px;
  border-radius:3px;

  color:var(--muted);

  font:8px monospace;
}

.status-item b{
  color:var(--gold);
}

/* ============================================================
   NOTICE
============================================================ */

.notice{
  border:1px solid #51421e;
  background:rgba(140,110,25,.07);

  color:#c9bb99;

  padding:10px 12px;
  margin:12px 0;

  border-radius:4px;

  font:9px/1.6 monospace;
}

.notice.ok{
  border-color:#315d40;
  background:rgba(50,120,70,.08);
  color:#9fd1aa;
}

.notice.error{
  border-color:#693039;
  background:rgba(140,30,45,.08);
  color:#e4a5ac;
}

/* ============================================================
   EMPTY
============================================================ */

.empty{
  padding:58px 20px;

  text-align:center;

  border:1px dashed var(--line2);
  border-radius:5px;

  background:rgba(255,255,255,.01);
}

.empty-icon{
  width:70px;
  height:70px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:0 auto 18px;

  border:1px solid var(--gold3);
  border-radius:50%;

  color:var(--gold);
  font-size:28px;

  background:rgba(160,125,30,.04);
}

.empty h2{
  margin:0 0 9px;
  font-size:20px;
}

.empty p{
  max-width:540px;
  margin:0 auto 20px;

  color:var(--muted);

  line-height:1.7;
  font-size:11px;
}

/* ============================================================
   CARDS GRID
============================================================ */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(305px,1fr));
  gap:15px;
}

/* ============================================================
   PLAYER CARD
============================================================ */

.player-card{
  overflow:hidden;

  border:1px solid var(--line);
  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.015),
      transparent 28%
    ),
    linear-gradient(180deg,var(--panel),var(--panel2));

  box-shadow:var(--shadow);

  transition:
    transform .18s,
    border-color .18s;
}

.player-card:hover{
  transform:translateY(-2px);
  border-color:#4a3a24;
}

.player-card.mine{
  border-color:#725a25;
}

/* ============================================================
   CARD HEADER
============================================================ */

.card-head{
  height:43px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px;

  border-bottom:1px solid var(--line);
}

.rank{
  color:var(--muted);
  font:9px monospace;
}

.rank strong{
  color:var(--gold);
}

.role{
  color:var(--gold);
  font:8px monospace;
  letter-spacing:1.5px;
}

.mine-badge{
  padding:4px 7px;

  border-radius:2px;

  background:var(--gold);
  color:#171206;

  font:7px monospace;
  font-weight:700;
  letter-spacing:.5px;
}

/* ============================================================
   PHOTO
============================================================ */

.photo{
  height:190px;

  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(200,160,60,.12),
      transparent 40%
    ),
    #0c0a08;
}

.photo img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  transition:transform .4s;
}

.player-card:hover .photo img{
  transform:scale(1.025);
}

.photo:after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.04),
      rgba(0,0,0,.06) 40%,
      rgba(0,0,0,.9) 100%
    );
}

.photo-placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#40372a;
  font-size:60px;

  background:
    radial-gradient(
      circle,
      rgba(205,165,65,.1),
      transparent 55%
    );
}

.player-name{
  position:absolute;

  left:13px;
  right:13px;
  bottom:12px;

  z-index:2;
}

.player-name strong{
  display:block;

  font-size:20px;
  line-height:1.15;

  text-shadow:0 2px 10px #000;
}

.player-name span{
  display:block;

  margin-top:4px;

  color:#a99d87;

  font:8px monospace;
}

/* ============================================================
   CARD SUMMARY
============================================================ */

.card-summary{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;

  padding:13px;

  border-bottom:1px solid var(--line);
}

.rarity{
  color:var(--gold);

  font:8px monospace;
  letter-spacing:1.3px;
}

.score-label{
  margin-top:5px;

  color:var(--muted2);

  font:7px monospace;
  letter-spacing:.7px;
}

.score{
  color:var(--gold);

  font-size:27px;
  line-height:1;

  font-weight:700;

  text-shadow:0 0 18px rgba(216,179,75,.13);
}

/* ============================================================
   STATS
============================================================ */

.quick-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);

  border-bottom:1px solid var(--line);
}

.quick-stat{
  padding:9px 5px;

  text-align:center;

  border-right:1px solid var(--line);
}

.quick-stat:last-child{
  border-right:0;
}

.quick-stat strong{
  display:block;

  font:11px monospace;
  color:#d8cdb8;
}

.quick-stat span{
  display:block;

  margin-top:3px;

  color:var(--muted2);

  font:6px monospace;
  letter-spacing:.4px;
}

/* ============================================================
   MATCH
============================================================ */

.matches{
  padding:10px;
}

.match{
  padding:9px;

  margin-bottom:6px;

  border:1px solid var(--line);
  border-radius:3px;

  background:#100e0b;
}

.match:last-child{
  margin-bottom:0;
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}

.match-id{
  color:#6d6454;
  font:8px monospace;
}

.match-score{
  color:var(--gold);
  font:12px monospace;
  font-weight:600;
}

.match-info{
  display:flex;
  gap:8px;
  flex-wrap:wrap;

  margin-top:5px;

  color:#746a58;

  font:8px monospace;
}

.win{
  color:var(--green)!important;
}

.loss{
  color:var(--red)!important;
}

/* ============================================================
   LOADING
============================================================ */

.loading{
  padding:11px 12px;

  border-bottom:1px solid var(--line);
}

.loading-line{
  display:flex;
  justify-content:space-between;

  gap:10px;

  margin-bottom:7px;

  color:#9c9078;

  font:8px monospace;
}

.progress{
  height:4px;

  overflow:hidden;

  border-radius:8px;

  background:#292219;
}

.progress i{
  display:block;

  width:0;
  height:100%;

  background:var(--gold);

  transition:width .2s;
}

/* ============================================================
   FOOTER
============================================================ */

.card-footer{
  display:flex;
  gap:6px;

  padding:10px;

  border-top:1px solid var(--line);
}

.card-footer .btn{
  flex:1;
}

/* ============================================================
   RATING
============================================================ */

.rating-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  gap:15px;

  margin-bottom:12px;
}

.rating-title h2{
  margin:0;

  font-size:21px;
}

.rating-title p{
  margin:5px 0 0;

  color:var(--muted);

  font:8px monospace;
}

.rating-count{
  color:var(--gold);

  font:9px monospace;
}

.rating-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.rating-row{
  display:grid;

  grid-template-columns:46px 50px minmax(150px,1fr) 105px 100px;

  align-items:center;

  gap:10px;

  min-height:70px;

  padding:8px 10px;

  border:1px solid var(--line);
  border-radius:4px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.015),
      transparent
    ),
    var(--panel);

  transition:border-color .15s;
}

.rating-row:hover{
  border-color:#4a3a24;
}

.rating-row.mine{
  border-color:#735b27;
  background:
    linear-gradient(
      90deg,
      rgba(180,140,40,.07),
      transparent
    ),
    var(--panel);
}

.rating-position{
  color:var(--muted);

  text-align:center;

  font:bold 14px monospace;
}

.rating-position.top{
  color:var(--gold);
}

.rating-avatar{
  width:43px;
  height:43px;

  overflow:hidden;

  border:1px solid var(--line2);
  border-radius:3px;

  background:#0b0907;
}

.rating-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.rating-avatar .avatar-letter{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#70644e;

  font-size:18px;
}

.rating-player{
  min-width:0;
}

.rating-player strong{
  display:block;

  overflow:hidden;

  color:#e8dfcf;

  text-overflow:ellipsis;
  white-space:nowrap;

  font-size:13px;
}

.rating-player span{
  display:block;

  margin-top:4px;

  overflow:hidden;

  color:var(--muted2);

  text-overflow:ellipsis;
  white-space:nowrap;

  font:7px monospace;
}

.rating-matches{
  color:#958a76;

  text-align:right;

  font:8px monospace;
}

.rating-matches strong{
  color:#d5c7ad;

  font-size:10px;
}

.rating-score{
  color:var(--gold);

  text-align:right;

  font:bold 18px monospace;
}

.rating-role{
  margin-top:3px;

  color:var(--muted2);

  font:7px monospace;
  letter-spacing:.7px;
}

/* ============================================================
   FORM
============================================================ */

.overlay{
  position:fixed;
  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12px;

  background:rgba(0,0,0,.86);

  backdrop-filter:blur(5px);
}

.modal{
  width:100%;
  max-width:570px;
  max-height:93vh;

  position:relative;

  overflow:auto;

  padding:21px;

  border:1px solid var(--gold2);
  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.018),
      transparent 30%
    ),
    var(--panel);

  box-shadow:var(--shadow);
}

.close{
  position:absolute;

  top:8px;
  right:11px;

  border:0;
  background:none;

  color:var(--muted);

  font-size:23px;
}

.modal h2{
  margin:0 0 6px;

  font-size:21px;
}

.modal-desc{
  margin-bottom:18px;

  color:#9b8e75;

  font-size:10px;
  line-height:1.6;
}

.modal-desc b{
  color:#d9ccb3;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;

  margin-bottom:6px;

  color:#968a73;

  font:8px monospace;
  letter-spacing:1px;
}

input{
  width:100%;

  padding:10px;

  border:1px solid var(--line);
  border-radius:3px;
  outline:none;

  background:#0d0b09;
  color:var(--text);

  font:11px monospace;
}

input:focus{
  border-color:var(--gold2);
}

.roles,
.rarity-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.role-option,
.rarity-option{
  padding:11px 7px;

  text-align:center;

  border:1px solid var(--line);
  border-radius:3px;

  background:#11100d;

  cursor:pointer;

  transition:border-color .15s,background .15s;
}

.role-option:hover,
.rarity-option:hover{
  border-color:#584521;
}

.role-option.selected,
.rarity-option.selected{
  border-color:var(--gold);

  background:rgba(160,125,30,.08);

  color:var(--gold);
}

.role-option strong{
  display:block;

  font:9px monospace;
}

.role-option span{
  display:block;

  margin-top:3px;

  color:#6f6554;

  font-size:8px;
}

.bonus-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.bonus{
  padding:8px;

  border:1px solid var(--line);
  border-radius:3px;

  background:#100e0b;
}

.bonus label{
  margin-bottom:4px;

  font-size:7px;
}

.bonus input{
  padding:7px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;

  margin-top:17px;
}

/* ============================================================
   CALCULATION
============================================================ */

.calc-box{
  margin-top:12px;

  border:1px solid var(--line);
}

.calc-head{
  display:flex;
  justify-content:space-between;

  padding:9px;

  border-bottom:1px solid var(--line);

  font:8px monospace;
}

.calc-head strong{
  color:var(--gold);
}

.calc-table{
  width:100%;

  border-collapse:collapse;
}

.calc-table th,
.calc-table td{
  padding:8px 6px;

  border-bottom:1px solid var(--line);

  font-size:8px;
}

.calc-table th{
  color:var(--muted);

  background:var(--panel2);

  font:7px monospace;
  text-transform:uppercase;
}

.calc-table td{
  background:#100e0b;
}

.calc-total{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:10px;
  padding:13px;

  border:1px solid var(--gold2);

  background:rgba(160,125,30,.07);
}

.calc-total span{
  color:#988a6d;

  font:9px monospace;
}

.calc-total strong{
  color:var(--gold);

  font-size:24px;
}

/* ============================================================
   API DEBUG
============================================================ */

.diag{
  display:none;

  border:1px solid var(--line);
  border-radius:4px;

  overflow:hidden;

  margin-top:12px;
}

.diag.open{
  display:block;
}

.diag-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px;

  background:var(--panel2);

  border-bottom:1px solid var(--line);
}

.diag-head strong{
  font:9px monospace;
}

pre{
  margin:0;

  max-height:500px;

  overflow:auto;

  padding:12px;

  color:#afa38b;

  font:8px/1.5 monospace;

  white-space:pre-wrap;
  word-break:break-word;
}

/* ============================================================
   MOBILE
============================================================ */

@media(max-width:700px){

  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .rating-row{
    grid-template-columns:38px 42px minmax(0,1fr) 80px;
  }

  .rating-matches{
    display:none;
  }

  .rating-score{
    font-size:15px;
  }
}

@media(max-width:500px){

  body{
    padding-left:9px;
    padding-right:9px;
  }

  .brand h1{
    font-size:22px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .photo{
    height:205px;
  }

  .roles,
  .rarity-grid{
    grid-template-columns:1fr;
  }

  .rating-row{
    grid-template-columns:34px 40px minmax(0,1fr) 72px;
    gap:7px;
    padding:8px;
  }

  .rating-avatar{
    width:38px;
    height:38px;
  }

  .rating-player strong{
    font-size:11px;
  }

  .rating-score{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">

  <div class="brand">

    <div class="brand-kicker">
      DOTA 2 · FANTASY SYSTEM
    </div>

    <h1>FANTASY REGISTRY</h1>

    <p>
      PLAYER CARDS · MATCH PERFORMANCE · GLOBAL RATING
    </p>

  </div>

  <div class="actions">

    <button class="btn" id="myBtn">
      Моя карта
    </button>

    <button class="btn" id="refreshBtn">
      ↻ Обновить
    </button>

  </div>

</header>

<nav class="tabs">

  <button class="tab active" data-tab="players">
    Моя карта
  </button>

  <button class="tab" data-tab="rating">
    Рейтинг
  </button>

  <button class="tab" data-tab="diagnostics">
    API
  </button>

</nav>

<div id="status"></div>

<div id="notice"></div>

<div id="content"></div>

<div class="diag" id="diag">

  <div class="diag-head">

    <strong>
      OPEN DOTA / DEBUG
    </strong>

    <button class="btn small" id="clearDiag">
      Очистить
    </button>

  </div>

  <pre id="diagOutput">Пока запросов нет.</pre>

</div>

</div>

<div id="modalRoot"></div>

<script>

/* ============================================================
   CONFIG
============================================================ */

const API = "https://api.opendota.com/api";

const FIREBASE_CONFIG = {

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}


function num(value){

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function fmt(value){

  return num(value).toLocaleString(
    "ru-RU",
    {
      maximumFractionDigits:2
    }
  );

}


function accountIdFrom(value){

  const match =
    String(value || "")
      .match(/\d+/g);

  if(!match || !match.length){
    return null;
  }

  return match[match.length - 1];

}


function initials(value){

  const text =
    String(value || "?")
      .trim();

  return text
    ? text.slice(0,1).toUpperCase()
    : "?";

}


function defaultBonuses(){

  const bonuses = {};

  BONUS_FIELDS.forEach(
    ([key])=>{
      bonuses[key] = 0;
    }
  );

  return bonuses;

}


function defaultCard(){

  return {

    rarity:"bronze",

    bonuses:
      defaultBonuses()

  };

}


function normalizePlayer(p){

  p = p || {};

  p.card =
    p.card ||
    defaultCard();

  p.card.bonuses =
    p.card.bonuses ||
    defaultBonuses();

  BONUS_FIELDS.forEach(
    ([key])=>{

      p.card.bonuses[key] =
        num(
          p.card.bonuses[key]
        );

    }
  );

  if(!RARITIES[p.card.rarity]){
    p.card.rarity = "bronze";
  }

  if(!ROLES[p.role]){
    p.role = "carry";
  }

  if(!Array.isArray(p.matches)){
    p.matches = [];
  }

  return p;

}

async function api(path){

  const url =
    API + path;

  log(
    "REQUEST",
    {
      url
    }
  );

  const response =
    await fetch(
      url,
      {
        method:"GET",
        cache:"no-store",
        headers:{
          Accept:"application/json"
        }
      }
    );

  const text =
    await response.text();

  if(!response.ok){

    throw new Error(
      `OpenDota HTTP ${response.status}`
    );

  }

  try{

    return JSON.parse(text);

  }catch(_){

    throw new Error(
      "OpenDota вернула не JSON"
    );

  }

}

/* ============================================================
   FANTASY CALCULATION
============================================================ */

function calculateBaseFantasy(p){

  const kills =
    num(p.kills);

  const deaths =
    num(p.deaths);

  const assists =
    num(p.assists);

  const lastHits =
    num(p.last_hits);

  const denies =
    num(p.denies);

  const gpm =
    num(p.gold_per_min);

  const tower =
    num(p.tower_kills);

  const roshan =
    num(p.roshan_kills);

  const team =
    num(p.teamfight_participation);

  const observers =
    num(p.obs_placed);

  const stacks =
    num(p.camps_stacked);

  const runes =
    num(p.rune_pickups);

  const firstBlood =
    p.firstblood_claimed
      ? 1
      : 0;

  const stuns =
    num(p.stuns);

  return {

    kills:
      kills *
      FANTASY_RULES.kills,

    deaths:
      FANTASY_RULES.deaths_base +
      deaths *
      FANTASY_RULES.deaths,

    assists:
      assists *
      FANTASY_RULES.assists,

    last_hits:
      (lastHits + denies) *
      FANTASY_RULES.last_hits,

    gpm:
      gpm *
      FANTASY_RULES.gpm,

    tower_kills:
      tower *
      FANTASY_RULES.tower_kills,

    roshan_kills:
      roshan *
      FANTASY_RULES.roshan_kills,

    teamfight:
      team *
      FANTASY_RULES.teamfight,

    observer_placed:
      observers *
      FANTASY_RULES.observer_placed,

    camps_stacked:
      stacks *
      FANTASY_RULES.camps_stacked,

    runes_grabbed:
      runes *
      FANTASY_RULES.runes_grabbed,

    first_blood:
      firstBlood *
      FANTASY_RULES.first_blood,

    stuns:
      stuns *
      FANTASY_RULES.stuns

  };

}


function applyBonuses(
  base,
  bonuses
){

  const result = {};

  BONUS_FIELDS.forEach(
    ([key])=>{

      result[key] =
        num(base[key]) *
        (
          1 +
          num(
            bonuses &&
            bonuses[key]
          ) / 100
        );

    }
  );

  return result;

}


function calculate(
  stats,
  card
){

  const base =
    calculateBaseFantasy(stats);

  const final =
    applyBonuses(
      base,
      card.bonuses
    );

  const total =
    Object.values(final)
      .reduce(
        (sum,value)=>
          sum + num(value),
        0
      );

  return {

    base,

    final,

    total

  };

}


/* ============================================================
   MATCH
============================================================ */

async function loadMatch(
  matchId,
  accountId,
  card
){

  const match =
    await api(
      `/matches/${matchId}`
    );

  if(
    !match ||
    !Array.isArray(match.players)
  ){

    throw new Error(
      `Матч ${matchId}: данные игроков отсутствуют`
    );

  }

  const p =
    match.players.find(
      x =>
        String(x.account_id) ===
        String(accountId)
    );

  if(!p){

    throw new Error(
      `Игрок не найден в матче ${matchId}`
    );

  }

  const fantasy =
    calculate(
      p,
      card
    );

  const radiant =
    num(p.player_slot) < 128;

  const win =
    Boolean(match.radiant_win) ===
    radiant;

  return {

    matchId:
      String(match.match_id),

    startTime:
      num(match.start_time),

    duration:
      num(match.duration),

    win,

    kills:
      num(p.kills),

    deaths:
      num(p.deaths),

    assists:
      num(p.assists),

    lastHits:
      num(p.last_hits),

    denies:
      num(p.denies),

    gpm:
      num(p.gold_per_min),

    teamfight:
      num(p.teamfight_participation),

    observer:
      num(p.obs_placed),

    stacks:
      num(p.camps_stacked),

    runes:
      num(p.rune_pickups),

    firstBlood:
      Boolean(
        p.firstblood_claimed
      ),

    towerKills:
      num(p.tower_kills),

    roshanKills:
      num(p.roshan_kills),

    stuns:
      num(p.stuns),

    baseFantasy:
      fantasy.base,

    finalFantasy:
      fantasy.final,

    fantasy:
      Number(
        fantasy.total.toFixed(2)
      )

  };

}


/* ============================================================
   LOAD PLAYER MATCHES
============================================================ */

async function refreshOnePlayer(
  target,
  limit = 2
){

  if(!target || !target.accountId){
    return target;
  }

  try{

    const history =
      await getHistory(
        target.accountId
      );

    if(!history.length){
      return target;
    }

    const ids =
      history
        .slice(0,limit)
        .map(
          x =>
            String(x.match_id)
        );

    const existing =
      new Map(
        (target.matches || [])
          .map(
            m =>
              [
                String(m.matchId),
                m
              ]
          )
      );

    const missing =
      ids.filter(
        id =>
          !existing.has(id)
      );

    /*
      Загружаем только недостающие матчи.
      Это существенно уменьшает количество API запросов.
    */

    for(
      const id of missing
    ){

      try{

        const match =
          await loadMatch(
            id,
            target.accountId,
            target.card
          );

        existing.set(
          id,
          match
        );

      }catch(error){

        log(
          "MATCH FAILED",
          {
            player:
              target.name,

            matchId:id,

            error:
              error.message
          }
        );

      }

    }

    target.matches =
      ids
        .map(
          id =>
            existing.get(id)
        )
        .filter(Boolean);

    /*
      Если бонусы карты изменились —
      пересчитываем без новых запросов.
    */

    target.matches.forEach(
      match=>{

        if(!match.baseFantasy){
          return;
        }

        const final =
          applyBonuses(
            match.baseFantasy,
            target.card.bonuses
          );

        match.finalFantasy =
          final;

        match.fantasy =
          Number(
            Object.values(final)
              .reduce(
                (sum,value)=>
                  sum + num(value),
                0
              )
              .toFixed(2)
          );

      }
    );

    target.lastRefresh =
      Date.now();

    return target;

  }catch(error){

    log(
      "PLAYER REFRESH ERROR",
      {
        player:
          target.name,

        accountId:
          target.accountId,

        error:
          error.message
      }
    );

    return target;

  }

}

/* ============================================================
   BEST 2
============================================================ */

function bestTwo(target = player){

  if(!target){

    return {
      matches:[],
      total:0
    };

  }

  const matches =
    (target.matches || [])
      .slice()
      .sort(
        (a,b)=>
          num(b.fantasy) -
          num(a.fantasy)
      )
      .slice(0,2);

  const total =
    matches.reduce(
      (sum,m)=>
        sum + num(m.fantasy),
      0
    );

  return {

    matches,

    total

  };

}

              ЛУЧШИЕ 2 МАТЧА
            </div>

          </div>

          <div class="score">
            ${fmt(best.total)}
          </div>

        </div>

        <div class="quick-stats">

          <div class="quick-stat">
            <strong>
              ${matches.length}
            </strong>
            <span>МАТЧЕЙ</span>
          </div>

          <div class="quick-stat">
            <strong>
              ${wins}
            </strong>
            <span>ПОБЕД</span>
          </div>

          <div class="quick-stat">
            <strong>
              ${losses}
            </strong>
            <span>ПОРАЖЕНИЙ</span>
          </div>

          <div class="quick-stat">
            <strong>
              ${esc(
                ROLES[player.role]
              )}
            </strong>
            <span>РОЛЬ</span>
          </div>

        </div>

        ${
          player.loading

          ? `

            <div class="loading">

              <div class="loading-line">

                <span>
                  ${esc(
                    player.loadingText ||
                    "Загрузка..."
                  )}
                </span>

                <span>
                  ...
                </span>

              </div>

              <div class="progress">
                <i style="width:65%"></i>
              </div>

            </div>

          `

          : ""

        }

        <div class="matches">

          ${
            matches.length

            ? matches
              .map(
                m => `

                  <div class="match">

                    <div class="match-top">

                      <span class="match-id">
                        #${esc(m.matchId)}
                      </span>

                      <span class="match-score">
                        ${fmt(m.fantasy)}
                      </span>

                    </div>

                    <div class="match-info">

                      <span
                        class="${
                          m.win
                            ? "win"
                            : "loss"
                        }"
                      >
                        ${
                          m.win
                            ? "ПОБЕДА"
                            : "ПОРАЖЕНИЕ"
                        }
                      </span>

                      <span>
                        ${m.kills}/${m.deaths}/${m.assists}
                      </span>

                      <span>
                        GPM ${fmt(m.gpm)}
                      </span>

                    </div>

                  </div>

                `
              )
              .join("")

            : `

              <div class="match">

                <div class="match-info">

                  Матчи ещё не загружены

                </div>

              </div>

            `

          }

        </div>

        <div class="card-footer">

          <button
            class="btn"
            id="calcBtn"
          >
            Расчёт
          </button>

          <button
            class="btn primary"
            id="refreshMine"
          >
            ↻ Обновить
          </button>

        </div>

      </article>

    </div>

  `;

  document
    .getElementById("calcBtn")
    .onclick =
    openCalculation;

  document
    .getElementById("refreshMine")
    .onclick =
    refreshPlayer;

}


/* ============================================================
   RATING
============================================================ */

function renderRating(){

  if(ratingLoading){

    content.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ◌
        </div>

        <h2>
          Загружаем рейтинг
        </h2>

        <p>
          Получаем карточки игроков из реестра.
        </p>

      </div>

    `;

    return;

  }

  const players =
    allPlayers
      .slice()
      .sort(
        (a,b)=>
          bestTwo(b).total -
          bestTwo(a).total
      );

  if(!players.length){

    content.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ★
        </div>

        <h2>
          Рейтинг пока пуст
        </h2>

        <p>
          Создай первую карточку.
          Когда другие игроки создадут свои карты,
          они автоматически появятся здесь.
        </p>

      </div>

    `;

    return;

  }

  content.innerHTML = `

    <div class="rating-head">

      <div class="rating-title">

        <h2>
          Глобальный рейтинг
        </h2>

        <p>
          Игроки реестра · BEST 2 MATCHES
        </p>

      </div>

      <div class="rating-count">
        ${players.length} PLAYERS
      </div>

    </div>

    <div class="rating-list">

      ${players
        .map(
          (p,index)=>{

            const best =
              bestTwo(p);

            const matches =
              p.matches || [];

            const isMine =
              player &&
              String(
                p._docId || ""
              ) ===
              ownerId();

            return `

              <div
                class="
                  rating-row
                  ${isMine ? "mine" : ""}
                "
              >

                <div
                  class="
                    rating-position
                    ${
                      index < 3
                        ? "top"
                        : ""
                    }
                  "
                >
                  ${index + 1}
                </div>

                <div class="rating-avatar">

                  ${avatarHtml(
                    p,
                    true
                  )}

                </div>

                <div class="rating-player">

                  <strong>
                    ${esc(p.name)}
                  </strong>

                  <span>
                    ${esc(
                      p.accountId
                    )}
                  </span>

                  <div class="rating-role">

                    ${
                      esc(
                        ROLES[p.role] ||
                        "ИГРОК"
                      )
                    }

                    ·

                    ${
                      esc(
                        RARITIES[
                          p.card &&
                          p.card.rarity
                        ] ||
                        "BRONZE"
                      )
                    }

                  </div>

                </div>

                <div class="rating-matches">

                  <strong>
                    ${matches.length}
                  </strong>

                  <br>

                  МАТЧЕЙ

                </div>

                <div class="rating-score">

                  ${fmt(best.total)}

                </div>

              </div>

            `;

          }
        )
        .join("")}

    </div>

  `;

}

/* ============================================================
   MAIN RENDER
============================================================ */

function render(){

  renderStatus();

  diag.classList.toggle(
    "open",
    activeTab === "diagnostics"
  );

  if(activeTab === "players"){

    renderPlayer();

  }else if(
    activeTab === "rating"
  ){

    renderRating();

  }else{

    renderDiagnosticsTab();

  }

}


/* ============================================================
   NOTICE
============================================================ */

function showNotice(
  text,
  type = ""
){

  notice.innerHTML = `

    <div class="notice ${type}">
      ${esc(text)}
    </div>

  `;

  setTimeout(
    ()=>{
      notice.innerHTML = "";
    },
    5000
  );

}


/* ============================================================
   CREATE MODAL
============================================================ */

function openCreateModal(){

  /*
    Вторую карту создать нельзя.
  */

  if(player){

    showNotice(
      "Карта уже создана. Вторую карту создать нельзя.",
      "error"
    );

    return;

  }

  let role = "carry";

  let rarity = "bronze";

  const defaultName =
    tgName();

  const defaultPhoto =
    tgPhoto();

  modalRoot.innerHTML = `

    <div class="overlay">

      <div class="modal">

        <button
          class="close"
          id="closeModal"
        >
          ×
        </button>

        <h2>
          Создание PLAYER CARD
        </h2>

        <div class="modal-desc">

          ${
            defaultPhoto

            ? `

              Фото Telegram найдено.
              Оно будет сохранено
              на твоей карточке.

            `

            : `

              Фото Telegram не найдено.
              Это не мешает созданию карты.

            `

          }

          <br><br>

          После создания:

          <b>
            имя, Dota Account ID,
            роль и карта изменить нельзя.
          </b>

        </div>

        <div class="field">

          <label>
            ИМЯ ИГРОКА
          </label>

          <input
            id="playerName"
            value="${esc(defaultName)}"
            placeholder="Например: Miracle-"
            autocomplete="off"
          >

        </div>

        <div class="field">

          <label>
            DOTA 2 ACCOUNT ID
          </label>

          <input
            id="playerAccount"
            placeholder="Например: 105248644"
            inputmode="numeric"
            autocomplete="off"
          >

        </div>

        <div class="field">

          <label>
            РОЛЬ
          </label>

          <div
            class="roles"
            id="roleGrid"
          >

            ${Object.entries(ROLES)
              .map(
                ([key,value])=>`

                  <div
                    class="
                      role-option
                      ${
                        role === key
                          ? "selected"
                          : ""
                      }
                    "
                    data-role="${key}"
                  >

                    <strong>
                      ${value}
                    </strong>

                    <span>
                      Fantasy
                    </span>

                  </div>

                `
              )
              .join("")}

          </div>

        </div>

        <div class="field">

          <label>
            РЕДКОСТЬ КАРТЫ
          </label>

          <div class="rarity-grid">

            ${Object.entries(RARITIES)
              .map(
                ([key,value])=>`

                  <div
                    class="
                      rarity-option
                      ${
                        rarity === key
                          ? "selected"
                          : ""
                      }
                    "
                    data-rarity="${key}"
                  >
                    ${value}
                  </div>

                `
              )
              .join("")}

          </div>

        </div>

        <div
          id="modalError"
        ></div>

        <div class="modal-actions">

          <button
            class="btn"
            id="cancelModal"
          >
            Отмена
          </button>

          <button
            class="btn primary"
            id="savePlayer"
          >
            Создать карту
          </button>

        </div>

      </div>

    </div>

  `;

  document
    .getElementById("closeModal")
    .onclick =
    closeModal;

  document
    .getElementById("cancelModal")
    .onclick =
    closeModal;


  document
    .querySelectorAll("[data-role]")
    .forEach(
      element=>{

        element.onclick = ()=>{

          role =
            element.dataset.role;

          document
            .querySelectorAll(
              "[data-role]"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "selected"
                )
            );

          element.classList.add(
            "selected"
          );

        };

      }
    );


  document
    .querySelectorAll("[data-rarity]")
    .forEach(
      element=>{

        element.onclick = ()=>{

          rarity =
            element.dataset.rarity;

          document
            .querySelectorAll(
              "[data-rarity]"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "selected"
                )
            );

          element.classList.add(
            "selected"
          );

        };

      }
    );


  document
    .getElementById("savePlayer")
    .onclick =
    async ()=>{

      const errorBox =
        document.getElementById(
          "modalError"
        );

      errorBox.innerHTML = "";

      const name =
        document
          .getElementById(
            "playerName"
          )
          .value
          .trim();

      const account =
        accountIdFrom(
          document
            .getElementById(
              "playerAccount"
            )
            .value
        );

      if(!name){

        errorBox.innerHTML = `

          <div class="notice error">
            Укажи имя игрока.
          </div>

        `;

        return;

      }

      if(!account){

        errorBox.innerHTML = `

          <div class="notice error">
            Укажи корректный Dota Account ID.
          </div>

        `;

        return;

      }

      /*
        Повторно проверяем Firestore.
        Это важно, если карта уже была создана,
        но локальный cache был очищен.
      */

      if(db){

        try{

          const existing =
            await ownerRef().get();

          if(existing.exists){

            player =
              normalizePlayer(
                existing.data()
              );

            saveLocal();

            closeModal();

            render();

            showNotice(
              "Эта карта уже существует.",
              "error"
            );

            return;

          }

        }catch(error){

          console.warn(
            "Owner check failed",
            error
          );

        }

      }


      /*
        Создание карты.
      */

      player = {

        accountId:
          String(account),

        name,

        role,

        photo:
          defaultPhoto || null,

        telegramUserId:
          telegramId || null,

        telegramUsername:
          telegramUser &&
          telegramUser.username
            ? telegramUser.username
            : null,

        ownerId:
          ownerId(),

        card:{

          rarity,

          /*
            Бонусы оставляем нулевыми.
            Карта после создания фиксируется.
          */

          bonuses:
            defaultBonuses()

        },

        matches:[],

        createdAt:
          Date.now(),

        lastRefresh:null

      };

      normalizePlayer(player);

      try{

        await saveOwner();

      }catch(error){

        errorBox.innerHTML = `

          <div class="notice error">

            Не удалось сохранить карту:
            ${esc(error.message)}

          </div>

        `;

        return;

      }

      closeModal();

      render();

      showNotice(
        "✓ Карта создана и зафиксирована",
        "ok"
      );

      /*
        Матчи загружаем после создания.
      */

      await refreshPlayer();

      /*
        После обновления рейтинга
        тоже подгружаем остальных.
      */

      await loadAllPlayers();

    };

}


/* ============================================================
   CLOSE MODAL
============================================================ */

function closeModal(){

  modalRoot.innerHTML = "";

}


/* ============================================================
   CALCULATION
============================================================ */

function openCalculation(){

  if(!player){
    return;
  }

  const best =
    bestTwo(player);

  modalRoot.innerHTML = `

    <div class="overlay">

      <div class="modal">

        <button
          class="close"
          id="closeModal"
        >
          ×
        </button>

        <h2>
          Fantasy Calculation
        </h2>

        <div class="modal-desc">

          ${esc(player.name)}
          ·
          ${esc(
            RARITIES[
              player.card.rarity
            ]
          )}

        </div>

        ${
          best.matches.length

          ? best.matches
            .map(
              match=>`

                <div class="calc-box">

                  <div class="calc-head">

                    <span>
                      MATCH #${esc(
                        match.matchId
                      )}
                    </span>

                    <strong>
                      ${fmt(
                        match.fantasy
                      )}
                    </strong>

                  </div>

                  <table class="calc-table">

                    <thead>

                      <tr>

                        <th>
                          Показатель
                        </th>

                        <th>
                          Base
                        </th>

                        <th>
                          Card
                        </th>

                        <th>
                          Final
                        </th>

                      </tr>

                    </thead>

                    <tbody>

                      ${BONUS_FIELDS
                        .map(
                          ([key,label])=>`

                            <tr>

                              <td>
                                ${esc(label)}
                              </td>

                              <td>
                                ${num(
                                  match
                                    .baseFantasy[key]
                                ).toFixed(3)}
                              </td>

                              <td>
                                +${num(
                                  player
                                    .card
                                    .bonuses[key]
                                )}%
                              </td>

                              <td>
                                ${num(
                                  match
                                    .finalFantasy[key]
                                ).toFixed(3)}
                              </td>

                            </tr>

                          `
                        )
                        .join("")}

                    </tbody>

                  </table>

                </div>

              `
            )
            .join("")

          : `

            <div class="notice">

              Нет загруженных матчей.

            </div>

          `

        }

        <div class="calc-total">

          <span>
            BEST 2 TOTAL
          </span>

          <strong>
            ${fmt(best.total)}
          </strong>

        </div>

      </div>

    </div>

  `;

  document
    .getElementById("closeModal")
    .onclick =
    closeModal;

}


/* ============================================================
   TABS
============================================================ */

document
  .querySelectorAll(".tab")
  .forEach(
    tab=>{

      tab.onclick = async ()=>{

        document
          .querySelectorAll(".tab")
          .forEach(
            x =>
              x.classList.remove(
                "active"
              )
          );

        tab.classList.add(
          "active"
        );

        activeTab =
          tab.dataset.tab;

        render();

        /*
          При открытии рейтинга
          загружаем всех владельцев.
        */

        if(activeTab === "rating"){

          await loadAllPlayers();

        }

      };

    }
  );


/* ============================================================
   MY BUTTON
============================================================ */

document
  .getElementById("myBtn")
  .onclick = ()=>{

    activeTab =
      "players";

    document
      .querySelectorAll(".tab")
      .forEach(
        x =>
          x.classList.toggle(
            "active",
            x.dataset.tab ===
            "players"
          )
      );

    render();

  };


/* ============================================================
   REFRESH
============================================================ */

document
  .getElementById("refreshBtn")
  .onclick =
  async ()=>{

    const button =
      document.getElementById(
        "refreshBtn"
      );

    button.disabled = true;

    button.textContent =
      "Загрузка...";

    try{

      /*
        Обновляем свою карту.
      */

      if(player){

        await refreshPlayer();

      }

      /*
        И затем обновляем список
        владельцев.
      */

      await loadAllPlayers();

      /*
        Если открыт рейтинг —
        обновляем оценки игроков,
        у которых уже есть матчи.
      */

      if(
        activeTab === "rating" &&
        allPlayers.length
      ){

        /*
          Не делаем API-запрос для каждого игрока
          автоматически при каждом клике.
          Сначала используем сохранённые матчи.
        */

        render();

      }

    }finally{

      button.disabled = false;

      button.textContent =
        "↻ Обновить";

    }

  };


/* ============================================================
   BOOT
============================================================ */

async function boot(){

  /*
    1. Сначала пытаемся определить Telegram.
    Это НЕ блокирует приложение.
  */

  initTelegram();

  /*
    2. Показываем локальную карту.
  */

  player =
    loadLocal();

  render();

  /*
    3. Подтягиваем свою карту из Firestore.
  */

  await loadOwner();

  /*
    4. Загружаем список всех карточек.
  */

  await loadAllPlayers();

  /*
    5. Если карта уже существует —
    показываем её.
  */

  if(player){

    showNotice(
      `✓ Карта ${player.name} загружена`,
      "ok"
    );

  }else{

    showNotice(
      "Создай свою первую Dota 2 карту",
      ""
    );

  }

}


boot();

</script>
