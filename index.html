<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Fantasy Registry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600;700&family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#090806;
  --panel:#15110d;
  --panel2:#1d1710;
  --panel3:#231b12;
  --text:#eadfc7;
  --muted:#8f8269;
  --muted2:#625844;
  --gold:#d1aa38;
  --gold2:#8f7426;
  --line:#33291d;
  --red:#b94b5a;
  --green:#55a872;
  --blue:#5f7fe0;
  --danger:#d35c69;
  --shadow:0 16px 40px rgba(0,0,0,.5);
  font-family:"Spectral",serif;
}

*{box-sizing:border-box}

html{background:var(--bg)}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% -10%,rgba(177,130,42,.13),transparent 38%),
    radial-gradient(circle at 90% 0%,rgba(70,90,150,.12),transparent 35%),
    var(--bg);
  color:var(--text);
  padding:20px 14px 80px;
  -webkit-tap-highlight-color:transparent;
}

button,input{font:inherit}

button{cursor:pointer}

.wrap{
  max-width:1240px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  padding-bottom:17px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}

.logo h1{
  margin:0;
  font-family:"Spectral SC",serif;
  font-size:27px;
  letter-spacing:1.8px;
}

.logo p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--gold2);
  background:var(--panel2);
  color:var(--text);
  padding:9px 13px;
  border-radius:4px;
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
  transition:.15s;
}

.btn:hover{
  border-color:var(--gold);
  background:var(--panel3);
}

.btn.primary{
  background:linear-gradient(180deg,#97761e,#6f5517);
  color:#151106;
  border-color:var(--gold);
  font-weight:600;
}

.btn.danger{
  border-color:#6c3038;
  color:#e39aa2;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.tabs{
  display:flex;
  gap:24px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.tab{
  position:relative;
  border:0;
  background:none;
  color:var(--muted);
  padding:11px 2px 13px;
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold);
}

.tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:var(--gold);
}

.status{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:18px;
}

.status-item{
  padding:7px 10px;
  background:rgba(255,255,255,.02);
  border:1px solid var(--line);
  border-radius:3px;
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
}

.status-item b{color:var(--gold)}

.notice{
  border:1px solid #55441d;
  background:rgba(130,100,25,.08);
  padding:12px 14px;
  margin-bottom:18px;
  border-radius:4px;
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  line-height:1.6;
  color:#c9ba94;
}

.notice.error{
  border-color:#683039;
  background:rgba(130,30,40,.1);
  color:#e4a0a8;
}

.notice.ok{
  border-color:#31563e;
  background:rgba(40,100,60,.08);
  color:#9bd0aa;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:18px;
}

.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);
  border-radius:5px;
  box-shadow:var(--shadow);
}

.card.mine{
  border-color:#75602a;
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 13px;
  border-bottom:1px solid var(--line);
}

.role{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:1.5px;
}

.mine{
  color:#181307;
  background:var(--gold);
  padding:3px 6px;
  border-radius:2px;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  font-weight:600;
}

.photo{
  height:190px;
  position:relative;
  background:#0c0a08;
  overflow:hidden;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-placeholder{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Spectral SC",serif;
  font-size:60px;
  color:#40372a;
}

.photo:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.88),transparent 55%);
  pointer-events:none;
}

.player-name{
  position:absolute;
  left:13px;
  bottom:11px;
  z-index:2;
}

.player-name strong{
  display:block;
  font-family:"Spectral SC",serif;
  font-size:20px;
  text-shadow:0 2px 8px #000;
}

.player-name span{
  font-family:"IBM Plex Mono",monospace;
  color:#b7aa8e;
  font-size:9px;
}

.score-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 14px;
  border-bottom:1px solid var(--line);
}

.score-title{
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:1px;
}

.score{
  color:var(--gold);
  font-family:"Spectral SC",serif;
  font-size:26px;
  font-weight:700;
}

.matches{
  padding:12px;
}

.match{
  border:1px solid var(--line);
  background:#12100d;
  margin-bottom:7px;
  padding:9px 10px;
  border-radius:3px;
}

.match:last-child{margin-bottom:0}

.match-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.match-id{
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  color:#756b59;
}

.match-score{
  font-family:"IBM Plex Mono",monospace;
  font-size:13px;
  color:var(--gold);
  font-weight:600;
}

.match-info{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:5px;
  color:#817662;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
}

.win{color:#7fc595!important}
.loss{color:#cf7c85!important}

.card-footer{
  display:flex;
  gap:7px;
  padding:12px;
  border-top:1px solid var(--line);
}

.card-footer .btn{
  flex:1;
}

.empty{
  border:1px dashed var(--line);
  padding:55px 20px;
  text-align:center;
  color:var(--muted);
}

.empty h2{
  margin:0 0 8px;
  font-family:"Spectral SC",serif;
  color:var(--text);
}

.empty p{
  max-width:480px;
  margin:0 auto 18px;
  line-height:1.6;
  font-size:13px;
}

/* TABLE */

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:5px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th,td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

th{
  background:var(--panel2);
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:1px;
  text-transform:uppercase;
}

td{
  background:var(--panel);
  font-size:13px;
}

tr:last-child td{border-bottom:0}

.player-cell{
  display:flex;
  align-items:center;
  gap:10px;
}

.small-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  overflow:hidden;
  background:#231d14;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#5d5140;
  font-family:"Spectral SC",serif;
}

.small-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.table-score{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-weight:600;
}

.rank-number{
  color:#a39578;
  font-family:"IBM Plex Mono",monospace;
}

/* DIAGNOSTIC */

.diagnostic{
  display:none;
  margin-top:18px;
  border:1px solid var(--line);
  background:#0d0b09;
  border-radius:4px;
  overflow:hidden;
}

.diagnostic.open{display:block}

.diag-head{
  padding:11px 13px;
  background:var(--panel2);
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.diag-head strong{
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  letter-spacing:1px;
}

pre{
  margin:0;
  padding:14px;
  max-height:500px;
  overflow:auto;
  color:#b8ad94;
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.modal{
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--gold2);
  border-radius:5px;
  box-shadow:var(--shadow);
  padding:21px;
  position:relative;
}

.close{
  position:absolute;
  right:13px;
  top:10px;
  background:none;
  border:0;
  color:var(--muted);
  font-size:22px;
}

.modal h2{
  margin:0 0 7px;
  font-family:"Spectral SC",serif;
}

.modal-desc{
  color:#a39780;
  font-size:12px;
  line-height:1.6;
  margin-bottom:18px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:#9e9178;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:1px;
  margin-bottom:6px;
}

input[type=text]{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  background:#0d0b09;
  color:var(--text);
  border-radius:3px;
  outline:none;
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
}

input:focus{
  border-color:var(--gold2);
}

.roles{
  display:grid;
  gap:7px;
}

.role-option{
  padding:11px;
  border:1px solid var(--line);
  background:#11100d;
  cursor:pointer;
  border-radius:3px;
}

.role-option.selected{
  border-color:var(--gold);
}

.role-option strong{
  display:block;
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
}

.role-option span{
  color:#817660;
  font-size:11px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* DETAIL */

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.detail-stat{
  background:#100e0b;
  border:1px solid var(--line);
  padding:9px;
}

.detail-stat small{
  display:block;
  color:#716652;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  text-transform:uppercase;
}

.detail-stat b{
  display:block;
  color:var(--text);
  margin-top:3px;
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
}

@media(max-width:720px){
  body{padding:14px 10px 70px}

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .logo h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="wrap">

</div>

  kills:.3,

};

/* ============================================================
   STATE
============================================================ */

let PLAYERS = [];
let MY_ID = null;
let ACTIVE_TAB = "players";

let diagnosticLogs = [];

const content = document.getElementById("content");
const status = document.getElementById("status");
const modalRoot = document.getElementById("modalRoot");
const diagnosticPanel = document.getElementById("diagnosticPanel");
const diagOutput = document.getElementById("diagOutput");

/* ============================================================
   LOCAL CACHE
============================================================ */

const CACHE_KEY = "fantasy_registry_players_v5";
const MY_ID_KEY = "fantasy_registry_my_id_v5";

function saveLocal(){

  try{
    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(PLAYERS)
    );
  }catch(e){}
}

function loadLocal(){

  try{
    const x = localStorage.getItem(CACHE_KEY);

    if(!x) return [];

    const data = JSON.parse(x);

    return Array.isArray(data) ? data : [];

  }catch(e){
    return [];
  }
}

/* ============================================================
   HELPERS
============================================================ */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function fmt(n){

  return Number(n||0).toLocaleString("ru-RU",{
    maximumFractionDigits:2
  });
}

function initials(name){

  return (name || "?")
    .trim()
    .slice(0,1)
    .toUpperCase();
}

function accountIdFrom(value){

  const matches = String(value||"").match(/\d+/g);

  if(!matches || !matches.length)
    return null;

  return matches[matches.length-1];
}

function sleep(ms){

  return new Promise(resolve=>setTimeout(resolve,ms));
}

function tgPhoto(){

  if(!tgUser)
    return null;

  return tgUser.photo_url || null;
}

function tgName(){

  if(!tgUser)
    return "";

  let name = tgUser.first_name || "";

  if(tgUser.last_name)
    name += " " + tgUser.last_name;

  if(tgUser.username)
    name += " @" + tgUser.username;

  return name.trim();
}

/* ============================================================
   DIAGNOSTICS
============================================================ */

function diag(title,data){

  const item = {
    time:new Date().toLocaleTimeString("ru-RU"),
    title,
    data
  };

  diagnosticLogs.unshift(item);

  diagnosticLogs = diagnosticLogs.slice(0,20);

  renderDiagnostics();

  console.log("[Fantasy Registry]",title,data);
}

function renderDiagnostics(){

  if(!diagnosticLogs.length){
    diagOutput.textContent = "Пока запросов нет.";
    return;
  }

  diagOutput.textContent = diagnosticLogs
    .map(x=>{
      return (
        "["+x.time+"] "+x.title+"\n"+
        JSON.stringify(x.data,null,2)
      );
    })

/* ============================================================
   API
============================================================ */

async function apiFetch(path,options={}){

  const url = API + path;

  diag("API → "+path,{
    url
  });

  let response;

  try{

    response = await fetch(url,{
      method:"GET",
      cache:"no-store",
      ...options
    });

  }catch(error){

    diag("API CONNECTION ERROR",{
      url,
      name:error.name,
      message:error.message
    });

    throw new Error(
      "OpenDota недоступна из браузера: "+error.message
    );
  }

  const text = await response.text();

  diag("API ← "+path,{
    status:response.status,
    ok:response.ok,
    bodyPreview:text.slice(0,5000)
  });

  if(!response.ok){

    throw new Error(
      "OpenDota HTTP "+response.status
    );
  }

  let json;

  try{
    json = JSON.parse(text);
  }catch(e){

    throw new Error(
      "OpenDota вернула не JSON"
    );
  }

  return json;
}

/* ============================================================
   PLAYER MATCH HISTORY
============================================================ */

async function getRecentMatches(accountId){

  /*
    Сначала recentMatches.
    Если он не отвечает — fallback на /matches.
  */

  try{

    const recent = await apiFetch(
      `/players/${accountId}/recentMatches`
    );

    if(Array.isArray(recent) && recent.length){

      diag("Получена история recentMatches",{
        accountId,
        count:recent.length
      });

      return recent;
    }

  }catch(error){

    diag(
      "recentMatches недоступен — используем fallback",
      {
        accountId,
        error:error.message
      }
    );
  }

  /*
    Fallback.
    OpenDota поддерживает /players/{id}/matches.
  */

  const fallback = await apiFetch(
    `/players/${accountId}/matches?limit=10`
  );

  if(!Array.isArray(fallback))
    throw new Error("Некорректная история матчей");

  diag("Получена история fallback /matches",{
    accountId,
    count:fallback.length
  });

  return fallback;
}

/* ============================================================
   FANTASY
============================================================ */

function fantasyBreakdown(p){

  const values = {

    kills:{
      value:p.kills||0,
      score:FANTASY.kills*(p.kills||0)
    },

    deaths:{
      value:p.deaths||0,
      score:FANTASY.deaths_base+
            FANTASY.deaths*(p.deaths||0)
    },

    assists:{
      value:p.assists||0,
      score:FANTASY.assists*(p.assists||0)
    },

    last_hits:{
      value:(p.last_hits||0)+(p.denies||0),
      score:FANTASY.last_hits*
            ((p.last_hits||0)+(p.denies||0))
    },

    gold_per_min:{
      value:p.gold_per_min||0,
      score:FANTASY.gold_per_min*
            (p.gold_per_min||0)
    },

    xp_per_min:{
      value:p.xp_per_min||0,
      score:FANTASY.xp_per_min*
            (p.xp_per_min||0)
    },

    tower_kills:{
      value:p.tower_kills||0,
      score:FANTASY.tower_kills*
            (p.tower_kills||0)
    },

    tower_damage:{
      value:p.tower_damage||0,
      score:FANTASY.tower_damage*
            (p.tower_damage||0)
    },

    hero_damage:{
      value:p.hero_damage||0,
      score:FANTASY.hero_damage*
            (p.hero_damage||0)
    },

    courier_kills:{
      value:p.courier_kills||0,
      score:FANTASY.courier_kills*
            (p.courier_kills||0)
    },

    observer_kills:{
      value:p.observer_kills||0,
      score:FANTASY.observer_kills*
            (p.observer_kills||0)
    },

    sentry_kills:{
      value:p.sentry_kills||0,
      score:FANTASY.sentry_kills*
            (p.sentry_kills||0)
    },

    roshan_kills:{
      value:p.roshan_kills||0,
      score:FANTASY.roshan_kills*
            (p.roshan_kills||0)
    },

    teamfight:{
      value:p.teamfight_participation||0,
      score:FANTASY.teamfight*
            (p.teamfight_participation||0)
    },

    observer_placed:{
      value:p.obs_placed||0,
      score:FANTASY.observer_placed*
            (p.obs_placed||0)
    },

    sentry_placed:{
      value:p.sen_placed||0,
      score:FANTASY.sentry_placed*
            (p.sen_placed||0)
    },

    camps_stacked:{
      value:p.camps_stacked||0,
      score:FANTASY.camps_stacked*
            (p.camps_stacked||0)
    },

    runes_grabbed:{
      value:p.rune_pickups||0,
      score:FANTASY.runes_grabbed*
            (p.rune_pickups||0)
    },

    first_blood:{
      value:p.firstblood_claimed?1:0,
      score:FANTASY.first_blood*
            (p.firstblood_claimed?1:0)
    },

    stuns:{
      value:p.stuns||0,
      score:FANTASY.stuns*
            (p.stuns||0)
    },

    hero_healing:{
      value:p.hero_healing||0,
      score:FANTASY.hero_healing*
            (p.hero_healing||0)
    }
  };

  let total=0;

  Object.values(values).forEach(x=>{
    total += Number(x.score||0);
  });

  return {
    values,
    total
  };
}

/* ============================================================
   MATCH DETAILS
============================================================ */

async function getMatchFantasy(matchId,accountId){

  const match = await apiFetch(
    `/matches/${matchId}`
  );

  if(!match || !Array.isArray(match.players)){

    throw new Error(
      "Матч "+matchId+" не распарсен OpenDota"
    );
  }

  const player = match.players.find(
    p=>String(p.account_id)===String(accountId)
  );

  if(!player){

    throw new Error(
      "Игрок не найден в матче "+matchId
    );
  }

  const fantasy = fantasyBreakdown(player);

  const radiant =
    Number(player.player_slot) < 128;

  const won =
    Boolean(match.radiant_win) === radiant;

  const result = {

    matchId:String(match.match_id),

    startTime:match.start_time || null,

    duration:match.duration || 0,

    heroId:player.hero_id,

    kills:player.kills||0,

    deaths:player.deaths||0,

    assists:player.assists||0,

    lastHits:player.last_hits||0,

    denies:player.denies||0,

    gpm:player.gold_per_min||0,

    xpm:player.xp_per_min||0,

    teamfight:player.teamfight_participation||0,

    stuns:player.stuns||0,

    runes:player.rune_pickups||0,

    camps:player.camps_stacked||0,

    obsPlaced:player.obs_placed||0,

    sentryPlaced:player.sen_placed||0,

    firstBlood:Boolean(player.firstblood_claimed),

    towerKills:player.tower_kills||0,

    roshanKills:player.roshan_kills||0,

    heroDamage:player.hero_damage||0,

    heroHealing:player.hero_healing||0,

    radiantWin:Boolean(match.radiant_win),

    isRadiant:radiant,

    win:won,

    fantasy:fantasy.total,

    fantasyBreakdown:fantasy.values,

    rawPlayer:player
  };

  diag(
    "Fantasy рассчитан для "+matchId,
    {
      accountId,
      fantasy:result.fantasy,
      breakdown:result.fantasyBreakdown
    }
  );

  return result;
}

/* ============================================================
   REFRESH PLAYER
============================================================ */

async function refreshPlayer(player){

  const accountId = player.accountId;

  if(!accountId)
    throw new Error("Нет Account ID");

  const history =
    await getRecentMatches(accountId);

  /*
    Берём только реально сыгранные/завершённые матчи.
  */

  const candidates = history
    .filter(m=>m.match_id)
    .sort(
      (a,b)=>
        Number(b.start_time||0)-
        Number(a.start_time||0)
    )
    .slice(0,8);

  if(!candidates.length){

    throw new Error(
      "OpenDota не вернула матчи"
    );
  }

  const oldMatches =
    Array.isArray(player.matches)
      ? player.matches
      : [];

  const oldMap =
    new Map(
      oldMatches.map(m=>[
        String(m.matchId),
        m
      ])
    );

  let parsed=0;

  /*
    Не долбим API одновременно.
    Один матч → запрос → пауза.
  */

  for(const item of candidates){

    const id=String(item.match_id);

    if(oldMap.has(id))
      continue;

    try{

      const match =
        await getMatchFantasy(
          id,
          accountId
        );

      oldMap.set(id,match);

      parsed++;

      await sleep(350);

    }catch(error){

      diag(
        "Ошибка обработки матча "+id,
        {
          accountId,
          error:error.message
        }
      );
    }

    /*
      Достаточно получить несколько новых матчей.
    */

    if(parsed>=4)
      break;
  }

  const matches =
    Array.from(oldMap.values())
      .sort(
        (a,b)=>
          Number(b.startTime||0)-
          Number(a.startTime||0)
      )
      .slice(0,10);

  player.matches=matches;

  player.lastRefresh=Date.now();

  /*
    Сохраняем даже если новых матчей нет.
  */

  await savePlayer(player);

  return {
    newMatches:parsed,
    totalMatches:matches.length
  };
}

/* ============================================================
   BEST 2
============================================================ */

function bestTwo(player){

  const matches =
    Array.isArray(player.matches)
      ? player.matches
      : [];

  const sorted =
    matches
      .filter(m=>
        typeof m.fantasy==="number"
      )
      .slice()
      .sort(
        (a,b)=>b.fantasy-a.fantasy
      );

  const best=sorted.slice(0,2);

  return {
    matches:best,
    total:best.reduce(
      (sum,m)=>sum+(Number(m.fantasy)||0),
      0
    )
  };
}

        </div>

        <div class="field">

          <label>ИМЯ</label>

          <input
            id="playerName"
            type="text"
            value="${esc(defaultName)}"
            placeholder="Например Denis"
          >

        </div>

        <div class="field">

          <label>DOTABUFF / ACCOUNT ID</label>

          <input
            id="playerId"
            type="text"
            value="${existing
              ?esc(existing.accountId)
              :""
            }"
            placeholder="117905733"
          >

        </div>

        <div class="field">

          <label>РОЛЬ</label>

          <div class="roles">

            ${Object.entries(ROLES)
              .map(([key,value])=>`

                <div
                  class="role-option ${selectedRole===key?"selected":""}"
                  data-role="${key}"
                >

                  <strong>
                    ${value.label}
                  </strong>

                  <span>
                    ${value.slots.join(" · ")}
                  </span>

                </div>

              `).join("")
            }

          </div>

        </div>

        <div class="field">

          <label>TELEGRAM AVATAR</label>

          <div style="
            border:1px solid var(--line);
            padding:10px;
            background:#0e0c09;
            border-radius:3px;
            color:#817660;
            font-size:11px;
          ">

            ${
              selectedPhoto
              ?"✓ Аватар Telegram найден"
              :"Telegram photo_url недоступен"
            }

          </div>

        </div>

        <div id="joinError"></div>

        <div class="modal-actions">

          <button class="btn"
                  id="cancelJoin">
            Отмена
          </button>

          <button class="btn primary"
                  id="saveJoin">
            Сохранить
          </button>

        </div>

      </div>

    </div>
  `;

  document.getElementById("modalClose")
    .onclick=closeModal;

  document.getElementById("cancelJoin")
    .onclick=closeModal;

  document
    .querySelectorAll(".role-option")
    .forEach(el=>{

      el.onclick=()=>{

        selectedRole=el.dataset.role;

        document
          .querySelectorAll(".role-option")
          .forEach(x=>
            x.classList.remove("selected")
          );

        el.classList.add("selected");
      };

    });

  document.getElementById("saveJoin")
    .onclick=async()=>{

      const name =
        document
          .getElementById("playerName")
          .value
          .trim();

      const rawId =
        document
          .getElementById("playerId")
          .value
          .trim();

      const accountId=
        accountIdFrom(rawId);

      const error=
        document.getElementById("joinError");

      error.innerHTML="";

      if(!name){

        error.innerHTML=`
          <div class="notice error">
            Укажи имя.
          </div>
        `;

        return;
      }

      if(!accountId){

        error.innerHTML=`
          <div class="notice error">
            Не удалось определить Account ID.
          </div>
        `;

        return;
      }

      if(!selectedRole){

        error.innerHTML=`
          <div class="notice error">
            Выбери роль.
          </div>
        `;

        return;
      }

      const duplicate =
        PLAYERS.find(
          p=>
            String(p.accountId)===
            String(accountId) &&
            (!existing ||
             String(p.accountId)!==
             String(existing.accountId))
        );

      if(duplicate){

        error.innerHTML=`
          <div class="notice error">
            Этот игрок уже есть в реестре.
          </div>
        `;

        return;
      }

      const player =
        existing
          ?existing
          :{
            accountId:String(accountId),
            name,
            photo:selectedPhoto,
            role:selectedRole,
            tokens:START_TOKENS,
            matches:[],
            lastRefresh:null,
            joinedAt:Date.now()
          };

      player.name=name;
      player.photo=selectedPhoto;
      player.role=selectedRole;

      if(!existing){

        PLAYERS.push(player);

        await setMyId(accountId);
      }

      await savePlayer(player);

      closeModal();

      renderAll();

      /*
        Сразу пробуем загрузить матчи.
      */

      await refreshSinglePlayer(player);
    };
}

/* ============================================================
   REFRESH SINGLE
============================================================ */

async function refreshSinglePlayer(player){

  showNotice(
    `Загрузка матчей ${player.name}...`,
    "normal"
  );

  try{

    const result=
      await refreshPlayer(player);

    renderAll();

    showNotice(
      `✓ ${player.name}: новых матчей ${result.newMatches}, сохранено ${result.totalMatches}`,
      "ok"
    );

  }catch(error){

    console.error(error);

    showNotice(
      `Ошибка ${player.name}: ${error.message}`,
      "error"
    );
  }
}

/* ============================================================
   REFRESH ALL
============================================================ */

async function refreshAll(){

  if(!PLAYERS.length){

    showNotice(
      "В реестре нет игроков.",
      "normal"
    );

    return;
  }

  const button=
    document.getElementById("refreshBtn");

  button.disabled=true;

  button.textContent="⏳ ОБНОВЛЕНИЕ...";

  let success=0;
  let errors=0;

  try{

    /*
      Последовательно, а не Promise.all.
      Это сильно уменьшает вероятность rate-limit/
      connection errors.
    */

    for(const player of PLAYERS){

      try{

        await refreshPlayer(player);

        success++;

      }catch(error){

        errors++;

        diag(
          "Ошибка обновления "+player.name,
          {
            accountId:player.accountId,
            error:error.message
          }
        );
      }

      renderAll();

      await sleep(500);
    }

    showNotice(
      `Обновление завершено: ${success} успешно, ${errors} ошибок.`,
      errors ? "normal" : "ok"
    );

  }finally{

    button.disabled=false;

    button.textContent="↻ Обновить";
  }
}

/* ============================================================
   NOTICE
============================================================ */

function showNotice(text,type="normal"){

  status.insertAdjacentHTML(
    "afterend",
    `
      <div class="notice ${type==="error"?"error":type==="ok"?"ok":""}"
           id="temporaryNotice">
        ${esc(text)}
      </div>
    `
  );

  setTimeout(()=>{

    const el=
      document.getElementById(
        "temporaryNotice"
      );

    if(el)
      el.remove();

  },7000);
}

/* ============================================================
   RENDER
============================================================ */

function renderAll(){

  renderStatus();

  if(ACTIVE_TAB==="players")
    renderPlayers();

  if(ACTIVE_TAB==="rating")
    renderRating();

  if(ACTIVE_TAB==="diagnostics"){
    diagnosticPanel.classList.add("open");
    renderDiagnostics();

    content.innerHTML=`
      <div class="notice">
        Здесь отображаются последние запросы к OpenDota,
        HTTP-коды, ответы API и рассчитанные Fantasy Points.
      </div>
    `;
  }
}

/* ============================================================
   TABS
============================================================ */

document
  .querySelectorAll(".tab")
  .forEach(tab=>{

    tab.onclick=()=>{

      document
        .querySelectorAll(".tab")
        .forEach(x=>
          x.classList.remove("active")
        );

      tab.classList.add("active");

      ACTIVE_TAB=tab.dataset.tab;

      diagnosticPanel.classList.toggle(
        "open",
        ACTIVE_TAB==="diagnostics"
      );

      renderAll();
    };
  });

/* ============================================================
   BUTTONS
============================================================ */

document.getElementById("joinBtn")
  .onclick=()=>openJoinModal();

document.getElementById("refreshBtn")
  .onclick=refreshAll;

document.getElementById("diagBtn")
  .onclick=()=>{

    ACTIVE_TAB="diagnostics";

    document
      .querySelectorAll(".tab")
      .forEach(x=>
        x.classList.remove("active")
      );

    document
      .querySelector('[data-tab="diagnostics"]')
      .classList.add("active");

    diagnosticPanel.classList.add("open");

    renderAll();

    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });
  };

/* ============================================================
   BOOTSTRAP
============================================================ */

async function bootstrap(){

  /*
    1. Сначала local cache.
  */

  PLAYERS=loadLocal();

  MY_ID=await getMyId();

  renderAll();

  /*
    2. Затем Firebase.
  */

  const remote=
    await getPlayersFirestore();

  if(remote && remote.length){

    PLAYERS=remote;

    saveLocal();

    renderAll();

  }

  console.log(
    "Fantasy Registry запущен",
    {
      players:PLAYERS.length,
      telegramUser:tgUser
    }
  );

  /*
    Не запускаем автоматический API polling.
    Иначе браузер может постоянно бомбить OpenDota.
  */
}

/* ============================================================
   START
============================================================ */

bootstrap();

</script>
