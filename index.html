<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090806">
<title>Fantasy Registry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#080706;
  --panel:#12100d;
  --panel2:#19150f;
  --panel3:#211a11;
  --gold:#d7b449;
  --gold2:#987927;
  --text:#eee4d0;
  --muted:#8d806a;
  --muted2:#665c4c;
  --line:#30271c;
  --green:#69bb83;
  --red:#c95b68;
  --shadow:0 18px 55px rgba(0,0,0,.45);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,rgba(177,135,37,.10),transparent 34%),
    var(--bg);
}

body{
  color:var(--text);
  padding:15px 11px 70px;
  font-family:Georgia,"Times New Roman",serif;
  -webkit-tap-highlight-color:transparent;
}

button,input{font:inherit}
button{cursor:pointer}

.wrap{
  width:100%;
  max-width:1180px;
  margin:auto;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;
  padding:10px 0 17px;
  border-bottom:1px solid var(--line);
}

.logo h1{
  margin:0;
  font-size:25px;
  letter-spacing:1.5px;
}

.logo p{
  margin:5px 0 0;
  color:var(--muted);
  font:9px monospace;
  letter-spacing:1px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--gold2);
  background:linear-gradient(180deg,#1e1810,#15110c);
  color:var(--text);
  padding:9px 12px;
  border-radius:4px;
  font:9px monospace;
  letter-spacing:.8px;
  text-transform:uppercase;
  transition:.15s;
}

.btn:hover{
  border-color:var(--gold);
  background:var(--panel3);
}

.btn.primary{
  background:linear-gradient(180deg,#ad8927,#765a18);
  border-color:var(--gold);
  color:#171206;
  font-weight:bold;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* TABS */

.tabs{
  display:flex;
  gap:25px;
  border-bottom:1px solid var(--line);
  margin-bottom:15px;
}

.tab{
  position:relative;
  border:0;
  background:none;
  color:var(--muted);
  padding:12px 1px;
  font:9px monospace;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold);
}

.tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:var(--gold);
}

/* STATUS */

.status{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:13px 0;
}

.status-item{
  border:1px solid var(--line);
  background:rgba(255,255,255,.018);
  padding:6px 8px;
  border-radius:3px;
  color:var(--muted);
  font:8px monospace;
}

.status-item b{
  color:var(--gold);
}

/* NOTICE */

.notice{
  border:1px solid #55451f;
  background:rgba(160,125,30,.07);
  color:#c9ba96;
  padding:10px 12px;
  margin:12px 0;
  border-radius:4px;
  font:9px/1.6 monospace;
}

.notice.ok{
  border-color:#315c40;
  background:rgba(55,125,75,.08);
  color:#9bd1aa;
}

.notice.error{
  border-color:#68313a;
  background:rgba(145,30,45,.09);
  color:#e2a2aa;
}

/* HERO */

.hero{
  padding:22px;
  margin-bottom:16px;
  border:1px solid var(--line);
  border-radius:6px;
  background:
    radial-gradient(circle at 80% 20%,rgba(194,150,46,.09),transparent 30%),
    linear-gradient(145deg,#17130e,#0f0d0a);
  box-shadow:var(--shadow);
}

.hero-kicker{
  color:var(--gold);
  font:8px monospace;
  letter-spacing:2px;
}

.hero h2{
  margin:8px 0 7px;
  font-size:25px;
}

.hero p{
  margin:0;
  max-width:680px;
  color:#988c75;
  font-size:12px;
  line-height:1.6;
}

.hero-actions{
  margin-top:17px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:15px;
}

.card{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:6px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  box-shadow:var(--shadow);
}

.card.mine{
  border-color:#80682b;
}

.card-head{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid var(--line);
}

.rank-badge{
  color:var(--gold);
  font:bold 10px monospace;
}

.role{
  color:var(--gold);
  font:8px monospace;
  letter-spacing:1.4px;
}

.mine-badge{
  padding:3px 6px;
  border-radius:2px;
  background:var(--gold);
  color:#171206;
  font:7px monospace;
  font-weight:bold;
}

/* PHOTO */

.photo{
  height:185px;
  position:relative;
  overflow:hidden;
  background:#0b0907;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#463c2c;
  font-size:58px;
}

.photo:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(to top,rgba(0,0,0,.94),rgba(0,0,0,0) 68%);
}

.player-name{
  position:absolute;
  z-index:2;
  left:12px;
  right:12px;
  bottom:10px;
}

.player-name strong{
  display:block;
  font-size:20px;
  text-shadow:0 2px 9px #000;
}

.player-name span{
  color:#aaa087;
  font:8px monospace;
}

/* SCORE */

.card-summary{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  padding:13px;
  border-bottom:1px solid var(--line);
}

.rarity{
  color:var(--gold);
  font:8px monospace;
  letter-spacing:1.2px;
}

.score-label{
  margin-top:4px;
  color:#746955;
  font:8px monospace;
}

.score{
  color:var(--gold);
  font-size:27px;
  font-weight:bold;
}

/* MATCH */

.matches{
  padding:10px;
}

.match{
  background:#100f0c;
  border:1px solid var(--line);
  padding:9px;
  margin-bottom:6px;
  border-radius:3px;
}

.match:last-child{
  margin-bottom:0;
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.match-id{
  color:#6e6555;
  font:8px monospace;
}

.match-score{
  color:var(--gold);
  font:bold 12px monospace;
}

.match-info{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:5px;
  color:#766c5b;
  font:8px monospace;
}

.win{color:var(--green)!important}
.loss{color:var(--red)!important}

.card-footer{
  display:flex;
  gap:6px;
  padding:10px;
  border-top:1px solid var(--line);
}

.card-footer .btn{
  flex:1;
}

/* RANKING */

.ranking{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.rank-row{
  display:grid;
  grid-template-columns:52px 1fr auto;
  align-items:center;
  gap:12px;
  min-height:75px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:5px;
  background:linear-gradient(100deg,#14110d,#0f0d0a);
  transition:.15s;
}

.rank-row:hover{
  border-color:#58471f;
  transform:translateY(-1px);
}

.rank-row.me{
  border-color:#8a702b;
  background:
    linear-gradient(90deg,rgba(190,148,39,.10),transparent),
    #15110c;
}

.rank-number{
  color:#776a54;
  font:bold 16px monospace;
  text-align:center;
}

.rank-row:nth-child(1) .rank-number{
  color:#e4c75c;
}

.rank-row:nth-child(2) .rank-number{
  color:#b8b7ae;
}

.rank-row:nth-child(3) .rank-number{
  color:#bd895c;
}

.rank-person{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.rank-avatar{
  width:48px;
  height:48px;
  flex:none;
  border-radius:4px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#0b0907;
}

.rank-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.rank-avatar-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#5c503e;
  font-size:19px;
}

.rank-name{
  min-width:0;
}

.rank-name strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
}

.rank-name span{
  display:block;
  margin-top:3px;
  color:#706652;
  font:7px monospace;
}

.rank-score{
  text-align:right;
}

.rank-score strong{
  display:block;
  color:var(--gold);
  font:bold 17px monospace;
}

.rank-score span{
  color:#655b4a;
  font:7px monospace;
}

.search{
  width:100%;
  margin-bottom:10px;
}

.search input{
  width:100%;
}

/* EMPTY */

.empty{
  padding:50px 18px;
  text-align:center;
  border:1px dashed var(--line);
  color:var(--muted);
  border-radius:5px;
}

.empty h2{
  margin:0 0 8px;
  color:var(--text);
}

.empty p{
  max-width:560px;
  margin:0 auto 17px;
  line-height:1.6;
  font-size:12px;
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.86);
  backdrop-filter:blur(5px);
}

.modal{
  width:100%;
  max-width:560px;
  max-height:93vh;
  overflow:auto;
  position:relative;
  padding:20px;
  border:1px solid var(--gold2);
  border-radius:6px;
  background:
    radial-gradient(circle at 100% 0,rgba(188,145,35,.08),transparent 35%),
    var(--panel);
  box-shadow:var(--shadow);
}

.close{
  position:absolute;
  top:7px;
  right:10px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:24px;
}

.modal h2{
  margin:0 0 6px;
}

.modal-desc{
  color:#9b8e75;
  font-size:11px;
  line-height:1.55;
  margin-bottom:16px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin-bottom:5px;
  color:#968a73;
  font:8px monospace;
  letter-spacing:1px;
}

input{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:3px;
  outline:none;
  background:#0d0b09;
  color:var(--text);
  font:11px monospace;
}

input:focus{
  border-color:var(--gold2);
}

input[readonly]{
  opacity:.65;
}

.roles,
.rarity-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.role-option,
.rarity-option{
  padding:10px;
  text-align:center;
  border:1px solid var(--line);
  background:#11100d;
  border-radius:3px;
  cursor:pointer;
}

.role-option.selected,
.rarity-option.selected{
  border-color:var(--gold);
  color:var(--gold);
}

.role-option strong{
  display:block;
  font:9px monospace;
}

.role-option span{
  display:block;
  margin-top:3px;
  color:#6f6554;
  font-size:9px;
}

.bonus-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.bonus{
  padding:8px;
  border:1px solid var(--line);
  background:#100e0b;
  border-radius:3px;
}

.bonus label{
  margin-bottom:4px;
  font-size:7px;
}

.bonus input{
  padding:7px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:16px;
}

/* CALC */

.calc-table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}

.calc-table th,
.calc-table td{
  padding:8px 6px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:8px;
}

.calc-table th{
  color:var(--muted);
  background:var(--panel2);
  font:7px monospace;
}

.calc-table td{
  background:#100e0b;
}

.calc-total{
  margin-top:10px;
  padding:12px;
  border:1px solid var(--gold2);
  background:rgba(160,125,30,.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.calc-total span{
  color:#988a6d;
  font:9px monospace;
}

.calc-total strong{
  color:var(--gold);
  font-size:23px;
}

/* LOADER */

.loader{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:38px;
  color:var(--gold);
  font:9px monospace;
  letter-spacing:1px;
}

.loader:after{
  content:"";
  width:12px;
  height:12px;
  margin-left:10px;
  border:2px solid #493c20;
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* MOBILE */

@media(max-width:650px){
  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .rank-row{
    grid-template-columns:40px 1fr auto;
    gap:8px;
  }

  .rank-avatar{
    width:42px;
    height:42px;
  }

  .rank-score strong{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">
  <div class="logo">
    <h1>FANTASY REGISTRY</h1>
    <p>DOTA 2 · PLAYER CARDS · WORLD RANKING</p>
  </div>

  <div class="actions">
    <button class="btn" id="myBtn">Моя карта</button>
    <button class="btn" id="refreshBtn">↻ Обновить</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="players">Моя карта</button>
  <button class="tab" data-tab="rating">Мировой рейтинг</button>
</nav>

<div id="status"></div>
<div id="notice"></div>
<div id="content"></div>

</div>

<div id="modalRoot"></div>

<script>
/* ============================================================
   CONFIG
============================================================ */

const API = "https://api.opendota.com/api";

const FIREBASE_CONFIG = {
  apiKey:"AIzaSyDijiSyD6w6x-lqu6-LlI68wBVIjqB_-3BI",
  authDomain:"fantasy-218c8.firebaseapp.com",
  projectId:"fantasy-218c8",
  storageBucket:"fantasy-218c8.firebasestorage.app",
  messagingSenderId:"122819799870",
  appId:"1:122819799870:web:e47df878140ed305671a6f",
  measurementId:"G-9LZC0EZ0Y5"
};

const CACHE_KEY = "fantasy_registry_v20";

const FANTASY_RULES = {
  kills:.30,
  deaths:-.30,
  assists:.15,
  last_hits:.003,
  gpm:.002,
  tower_kills:1,
  roshan_kills:1,
  teamfight:.03,
  observer_placed:.50,
  camps_stacked:.50,
  runes_grabbed:.25,
  first_blood:4,
  stuns:.05,
  deaths_base:3
};

const BONUS_FIELDS = [
  ["kills","Kills"],
  ["deaths","Deaths"],
  ["assists","Assists"],
  ["last_hits","Last Hits"],
  ["gpm","GPM"],
  ["tower_kills","Tower Kills"],
  ["roshan_kills","Roshan"],
  ["teamfight","Teamfight"],
  ["observer_placed","Observers"],
  ["camps_stacked","Stacks"],
  ["runes_grabbed","Runes"],
  ["first_blood","First Blood"],
  ["stuns","Stuns"]
];

const ROLES = {
  carry:"ОСНОВА",
  mid:"ЦЕНТР",
  support:"ПОДДЕРЖКА"
};

const RARITIES = {
  bronze:"BRONZE",
  silver:"SILVER",
  gold:"GOLD"
};

let db = null;
let player = null;
let telegramUser = null;
let activeTab = "players";
let ranking = [];
let rankingLoaded = false;

/* ============================================================
   TELEGRAM
   Только получение фото.
============================================================ */

function initTelegram(){

  try{

    const tg = window.Telegram && window.Telegram.WebApp;

    if(!tg) return;

    try{
      tg.ready();
      tg.expand();
    }catch(_){}

    const u =
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user;

    if(u){
      telegramUser = u;
    }

  }catch(e){
    console.warn("Telegram:",e);
  }
}

initTelegram();

/* ============================================================
   FIREBASE
============================================================ */

try{

  firebase.initializeApp(FIREBASE_CONFIG);

  db = firebase.firestore();

  db.enablePersistence({
    synchronizeTabs:true
  }).catch(()=>{});

}catch(e){

  console.error("Firebase:",e);

}

/* ============================================================
   DOM
============================================================ */

const content = document.getElementById("content");
const status = document.getElementById("status");
const notice = document.getElementById("notice");
const modalRoot = document.getElementById("modalRoot");

/* ============================================================
   HELPERS
============================================================ */

function esc(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}

function num(v){

  const n = Number(v);

  return Number.isFinite(n) ? n : 0;

}

function fmt(v){

  return num(v).toLocaleString("ru-RU",{
    maximumFractionDigits:2
  });

}

function accountIdFrom(v){

  const m = String(v || "").match(/\d+/g);

  return m && m.length
    ? m[m.length-1]
    : null;

}

function initials(v){

  return String(v || "?")
    .trim()
    .slice(0,1)
    .toUpperCase();

}

function defaultBonuses(){

  const x = {};

  BONUS_FIELDS.forEach(([k])=>{
    x[k] = 0;
  });

  return x;

}

function defaultCard(){

  return {
    rarity:"bronze",
    bonuses:defaultBonuses()
  };

}

function normalizePlayer(p){

  p = p || {};

  p.card = p.card || defaultCard();

  p.card.bonuses =
    p.card.bonuses || defaultBonuses();

  BONUS_FIELDS.forEach(([k])=>{
    p.card.bonuses[k] = num(p.card.bonuses[k]);
  });

  if(!RARITIES[p.card.rarity]){
    p.card.rarity = "bronze";
  }

  if(!Array.isArray(p.matches)){
    p.matches = [];
  }

  return p;

}

function telegramPhoto(){

  return telegramUser &&
    telegramUser.photo_url
      ? telegramUser.photo_url
      : null;

}

function telegramName(){

  if(!telegramUser) return "";

  return [
    telegramUser.first_name,
    telegramUser.last_name
  ]
  .filter(Boolean)
  .join(" ")
  .trim();

}

/* ============================================================
   LOCAL CACHE
============================================================ */

function loadLocal(){

  try{

    const raw =
      localStorage.getItem(CACHE_KEY);

    return raw
      ? normalizePlayer(JSON.parse(raw))
      : null;

  }catch(_){

    return null;

  }

}

function saveLocal(){

  try{

    if(player){

      localStorage.setItem(
        CACHE_KEY,
        JSON.stringify(player)
      );

    }

  }catch(_){}

}

/* ============================================================
   OWNER STORAGE
============================================================ */

/*
  В этой версии Telegram ID НЕ требуется.

  Для локального владельца используем
  Dota Account ID.

  Поэтому пользователь может открыть
  приложение и в обычном браузере.
*/

function ownerRef(){

  if(!db || !player) return null;

  return db
    .collection("owners")
    .doc(String(player.accountId));

}

async function loadOwnerByAccount(accountId){

  if(!db || !accountId) return null;

  try{

    const snap =
      await db
        .collection("owners")
        .doc(String(accountId))
        .get();

    if(!snap.exists) return null;

    return normalizePlayer(snap.data());

  }catch(e){

    console.warn("Owner load:",e);

    return null;

  }

}

async function saveOwner(){

  if(!player) return;

/* ============================================================
   FANTASY
============================================================ */

function calculateBaseFantasy(p){

  const kills = num(p.kills);
  const deaths = num(p.deaths);
  const assists = num(p.assists);
  const lastHits = num(p.last_hits);
  const denies = num(p.denies);
  const gpm = num(p.gold_per_min);
  const tower = num(p.tower_kills);
  const roshan = num(p.roshan_kills);
  const team = num(p.teamfight_participation);
  const obs = num(p.obs_placed);
  const stacks = num(p.camps_stacked);
  const runes = num(p.rune_pickups);
  const fb = p.firstblood_claimed ? 1 : 0;
  const stuns = num(p.stuns);

  return {

    kills:
      kills * FANTASY_RULES.kills,

    deaths:
      FANTASY_RULES.deaths_base +
      deaths * FANTASY_RULES.deaths,

    assists:
      assists * FANTASY_RULES.assists,

    last_hits:
      (lastHits + denies) *
      FANTASY_RULES.last_hits,

    gpm:
      gpm * FANTASY_RULES.gpm,

    tower_kills:
      tower * FANTASY_RULES.tower_kills,

    roshan_kills:
      roshan * FANTASY_RULES.roshan_kills,

    teamfight:
      team * FANTASY_RULES.teamfight,

    observer_placed:
      obs * FANTASY_RULES.observer_placed,

    camps_stacked:
      stacks * FANTASY_RULES.camps_stacked,

    runes_grabbed:
      runes * FANTASY_RULES.runes_grabbed,

    first_blood:
      fb * FANTASY_RULES.first_blood,

    stuns:
      stuns * FANTASY_RULES.stuns

  };

}

function applyBonuses(base,bonuses){

  const out = {};

  BONUS_FIELDS.forEach(([k])=>{

    out[k] =
      num(base[k]) *
      (
        1 +
        num(bonuses && bonuses[k]) / 100
      );

  });

  return out;

}

function calculate(p,card){

  const base =
    calculateBaseFantasy(p);

  const final =
    applyBonuses(
      base,
      card.bonuses
    );

  const total =
    Object.values(final)
      .reduce((s,v)=>s+num(v),0);

  return {
    base,
    final,
    total
  };

}

/* ============================================================
   OPENDOTA
============================================================ */

async function api(path){

  const url = API + path;

  const r = await fetch(
    url,
    {
      method:"GET",
      headers:{
        Accept:"application/json"
      },
      cache:"no-store"
    }
  );

  const text =
    await r.text();

  if(!r.ok){

    throw new Error(
      `OpenDota HTTP ${r.status}`
    );

  }

  try{

    return JSON.parse(text);

  }catch(_){

    throw new Error(
      "OpenDota вернула не JSON"
    );

  }

}

async function getHistory(accountId){

  const data =
    await api(
      `/players/${accountId}/recentMatches`
    );

  if(!Array.isArray(data)){
    return [];
  }

  return data
    .filter(x=>x.match_id)
    .sort(
      (a,b)=>
        num(b.start_time) -
        num(a.start_time)
    )
    .slice(0,4);

}

/* ============================================================
   MATCH
============================================================ */

async function loadMatch(
  matchId,
  accountId,
  card
){

  const match =
    await api(
      `/matches/${matchId}`
    );

  if(
    !match ||
    !Array.isArray(match.players)
  ){

    throw new Error(
      `Матч ${matchId}: players отсутствует`
    );

  }

  const p =
    match.players.find(
      x =>
        String(x.account_id) ===
        String(accountId)
    );

  if(!p){

    throw new Error(
      `Игрок не найден в матче ${matchId}`
    );

  }

  const c =
    calculate(p,card);

  const radiant =
    num(p.player_slot) < 128;

  const win =
    Boolean(match.radiant_win) === radiant;

  return {

    matchId:String(match.match_id),

    startTime:num(match.start_time),

    duration:num(match.duration),

    win,

    kills:num(p.kills),
    deaths:num(p.deaths),
    assists:num(p.assists),

    lastHits:num(p.last_hits),
    denies:num(p.denies),
    gpm:num(p.gold_per_min),

    teamfight:
      num(p.teamfight_participation),

    observer:
      num(p.obs_placed),

    stacks:
      num(p.camps_stacked),

    runes:
      num(p.rune_pickups),

    firstBlood:
      Boolean(p.firstblood_claimed),

    towerKills:
      num(p.tower_kills),

    roshanKills:
      num(p.roshan_kills),

    stuns:num(p.stuns),

    baseFantasy:c.base,

    finalFantasy:c.final,

    fantasy:
      Number(c.total.toFixed(2))

  };

}

/* ============================================================
   BEST 2
============================================================ */

function bestTwo(){

  if(!player){

    return {
      matches:[],
      total:0
    };

  }

  const sorted =
    (player.matches || [])
      .slice()
      .sort(
        (a,b)=>
          num(b.fantasy) -
          num(a.fantasy)
      );

  const matches =
    sorted.slice(0,2);

  return {

    matches,

    total:
      matches.reduce(
        (s,m)=>s+num(m.fantasy),
        0
      )

  };

}

/*
  Это ключевая часть.

  players = только игроки,
  которые зарегистрировались
  через это приложение.
*/

async function publishPlayer(){

  if(!db || !player) return;

  const best =
    bestTwo();

  const publicPlayer = {

    accountId:
      String(player.accountId),

    name:
      player.name,

    photo:
      player.photo || null,

    role:
      player.role,

    rarity:
      player.card.rarity,

    bonuses:
      player.card.bonuses,

    bestMatches:
      best.matches.map(m=>({

        matchId:m.matchId,
        fantasy:m.fantasy,
        win:m.win,

        kills:m.kills,
        deaths:m.deaths,
        assists:m.assists,

        gpm:m.gpm,

        startTime:m.startTime

      })),

    fantasy:
      Number(best.total.toFixed(2)),

    registeredAt:
      player.createdAt || Date.now(),

    updatedAt:
      firebase.firestore.FieldValue
        .serverTimestamp()

  };

  /*
    НЕ перезаписываем владельца.

    Публичный документ находится
    по Dota Account ID.
  */

  await db
    .collection("players")
    .doc(String(player.accountId))
    .set(
      publicPlayer,
      {merge:true}
    );

}

/* ============================================================
   REFRESH PLAYER
============================================================ */

async function refreshPlayer(){

  if(!player) return;

  render();

  try{

    const history =
      await getHistory(
        player.accountId
      );

    if(!history.length){

      throw new Error(
        "У игрока нет доступных матчей."
      );

    }

    const target =
      history
        .slice(0,4)
        .map(x=>String(x.match_id));

    const existing =
      new Map(
        (player.matches || [])
          .map(m=>[
            String(m.matchId),
            m
          ])
      );

    /*
      Загружаем максимум 4 последних матча.
      Одновременно максимум 2 запроса.
    */

    let index = 0;

    async function worker(){

      while(true){

        const i = index++;

        if(i >= target.length){
          return;
        }

        const id = target[i];

        try{

          /*
            Каждый refresh пересчитывает матч,
            если изменилась карта/бонусы.
          */

          const fresh =
            await loadMatch(
              id,
              player.accountId,
              player.card
            );

          existing.set(
            id,
            fresh
          );

        }catch(e){

          console.warn(
            "Match:",
            id,
            e
          );

        }

        render();

      }

    }

    await Promise.all([
      worker(),
      worker()
    ]);

    player.matches =
      target
        .map(id=>existing.get(id))
        .filter(Boolean);

    /*
      Пересчитываем fantasy после изменения
      бонусов карточки.
    */

    for(const m of player.matches){

      const final =
        applyBonuses(
          m.baseFantasy,
          player.card.bonuses
        );

      m.finalFantasy = final;

      m.fantasy =
        Number(
          Object.values(final)
            .reduce(
              (s,v)=>s+num(v),
              0
            )
            .toFixed(2)
        );

    }

    player.lastRefresh =
      Date.now();

    saveLocal();

    await saveOwner();

    /*
      Публикуем новую позицию
      в мировой рейтинг.
    */

    await publishPlayer();

    render();

    showNotice(
      "✓ Матчи и мировой рейтинг обновлены.",
      "ok"
    );

  }catch(e){

    console.error(e);

    render();

    showNotice(
      "Ошибка обновления: " +
      e.message,
      "error"
    );

  }

}

async function loadWorldRanking(){

  if(!db){

    throw new Error(
      "Firebase недоступен."
    );

  }

  const snap =
    await db
      .collection("players")
      .orderBy("fantasy","desc")
      .limit(100)
      .get();

  ranking =
    snap.docs.map((doc,index)=>{

      const data =
        doc.data() || {};

      return {

        rank:index+1,

        id:doc.id,

        accountId:
          String(
            data.accountId ||
            doc.id
          ),

        name:
          data.name ||
          "Unknown Player",

        photo:
          data.photo ||
          null,

        role:
          data.role ||
          "carry",

        rarity:
          data.rarity ||
          "bronze",

        fantasy:
          num(data.fantasy),

        bestMatches:
          Array.isArray(data.bestMatches)
            ? data.bestMatches
            : [],

        updatedAt:
          data.updatedAt || null

      };

    });

  rankingLoaded = true;

}

                  >
                    ${v}
                  </div>

                `)
                .join("")
            }

          </div>

        </div>

        <div class="field">

          <label>
            БОНУСЫ PLAYER CARD
          </label>

          <div class="bonus-grid">

            ${
              BONUS_FIELDS.map(([k,v])=>`

                <div class="bonus">

                  <label>
                    ${v}
                  </label>

                  <input
                    type="number"
                    min="-100"
                    max="100"
                    step="1"
                    data-bonus="${k}"
                    value="${num(
                      card.bonuses[k]
                    )}"
                  >

                </div>

              `).join("")
            }

          </div>

        </div>

        <div id="modalError"></div>

        <div class="modal-actions">

          <button
            class="btn"
            id="cancelModal"
          >
            Отмена
          </button>

          <button
            class="btn primary"
            id="savePlayer"
          >
            ${edit
              ? "Сохранить"
              : "Создать карту"}
          </button>

        </div>

      </div>

    </div>

  `;

  document
    .getElementById("closeModal")
    .onclick = closeModal;

  document
    .getElementById("cancelModal")
    .onclick = closeModal;

  document
    .querySelectorAll("[data-role]")
    .forEach(el=>{

      el.onclick = ()=>{

        role =
          el.dataset.role;

        document
          .querySelectorAll("[data-role]")
          .forEach(x =>
            x.classList.remove(
              "selected"
            )
          );

        el.classList.add(
          "selected"
        );

      };

    });

  document
    .querySelectorAll("[data-rarity]")
    .forEach(el=>{

      el.onclick = ()=>{

        rarity =
          el.dataset.rarity;

        document
          .querySelectorAll("[data-rarity]")
          .forEach(x =>
            x.classList.remove(
              "selected"
            )
          );

        el.classList.add(
          "selected"
        );

      };

    });

  document
    .getElementById("savePlayer")
    .onclick = async()=>{

      const err =
        document.getElementById(
          "modalError"
        );

      err.innerHTML = "";

      const name =
        document
          .getElementById(
            "playerName"
          )
          .value
          .trim();

      const account =
        accountIdFrom(
          document
            .getElementById(
              "playerAccount"
            )
            .value
        );

      if(!name){

        err.innerHTML = `
          <div class="notice error">
            Укажи имя игрока.
          </div>
        `;

        return;

      }

      if(!account){

        err.innerHTML = `
          <div class="notice error">
            Введи правильный Dota Account ID.
          </div>
        `;

        return;

      }

      /*
        Жёсткое правило:
        второй игрок создать нельзя.
      */

      if(!edit && player){

        err.innerHTML = `
          <div class="notice error">
            Карта уже создана.
          </div>
        `;

        return;

      }

      /*
        Проверяем Dota ID в Firebase,
        чтобы один игрок не появился
        дважды.
      */

      if(!edit && db){

        try{

          const existing =
            await db
              .collection("players")
              .doc(String(account))
              .get();

          if(existing.exists){

            err.innerHTML = `
              <div class="notice error">
                Этот Dota Account ID уже
                зарегистрирован в Fantasy Registry.
              </div>
            `;

            return;

          }

        }catch(e){

          console.warn(
            "Duplicate check:",
            e
          );

        }

      }

      const bonuses =
        defaultBonuses();

      document
        .querySelectorAll("[data-bonus]")
        .forEach(input=>{

          bonuses[
            input.dataset.bonus
          ] = num(input.value);

        });

      if(!edit){

        player = {

          accountId:
            String(account),

          name,

          role,

          /*
            Telegram используется только
            для фото.
          */

          photo:
            telegramPhoto(),

          card:{
            rarity,
            bonuses
          },

          matches:[],

          lastRefresh:null,

          createdAt:
            Date.now()

        };

      }else{

        /*
          Account ID не изменяется.
          Фото обновляем только если
          Telegram дал новое.
        */

        player.name = name;

        player.role = role;

        player.card = {
          rarity,
          bonuses
        };

        if(telegramPhoto()){
          player.photo =
            telegramPhoto();
        }

      }

      normalizePlayer(player);

      saveLocal();

      try{

        await saveOwner();

        /*
          Сразу публикуем игрока.
          Даже до загрузки матчей.
        */

        await publishPlayer();

      }catch(e){

        console.error(e);

        err.innerHTML = `
          <div class="notice error">
            Не удалось сохранить карту:
            ${esc(e.message)}
          </div>
        `;

        return;

      }

      closeModal();

      render();

      showNotice(
        "✓ Карта создана. Загружаем матчи и рейтинг...",
        "ok"
      );

      /*
        Матчи грузятся после создания.
      */

      await refreshPlayer();

      /*
        Обновляем рейтинг.
      */

      rankingLoaded = false;

    };

}

/* ============================================================
   CALCULATION MODAL
============================================================ */

function openCalculation(){

  if(!player) return;

  const best =
    bestTwo();

  modalRoot.innerHTML = `

    <div class="overlay">

      <div class="modal">

        <button
          class="close"
          id="closeModal"
        >
          ×
        </button>

        <h2>
          Расчёт ·
          ${esc(player.name)}
        </h2>

        <div class="modal-desc">
          ${esc(
            RARITIES[
              player.card.rarity
            ]
          )}
          PLAYER CARD
        </div>

        ${
          best.matches.length

          ?

          best.matches.map(m=>`

            <div
              style="
                border:1px solid var(--line);
                margin-top:12px
              "
            >

              <div
                style="
                  display:flex;
                  justify-content:space-between;
                  padding:9px;
                  border-bottom:1px solid var(--line);
                  font:9px monospace
                "
              >

                <span>
                  MATCH #${esc(m.matchId)}
                </span>

                <strong
                  style="color:var(--gold)"
                >
                  ${fmt(m.fantasy)}
                </strong>

              </div>

              <table class="calc-table">

                <thead>

                  <tr>
                    <th>Показатель</th>
                    <th>Base</th>
                    <th>Card</th>
                    <th>Final</th>
                  </tr>

                </thead>

                <tbody>

                  ${
                    BONUS_FIELDS
                      .map(([k,l])=>`

                        <tr>

                          <td>
                            ${esc(l)}
                          </td>

                          <td>
                            ${num(
                              m.baseFantasy[k]
                            ).toFixed(3)}
                          </td>

                          <td>
                            ${num(
                              player.card.bonuses[k]
                            )}%
                          </td>

                          <td>
                            ${num(
                              m.finalFantasy[k]
                            ).toFixed(3)}
                          </td>

                        </tr>

                      `)
                      .join("")
                  }

                </tbody>

              </table>

            </div>

          `).join("")

          :

          `
            <div class="notice">
              Матчи ещё не загружены.
            </div>
          `
        }

        <div class="calc-total">

          <span>
            BEST 2 TOTAL
          </span>

          <strong>
            ${fmt(best.total)}
          </strong>

        </div>

      </div>

    </div>

  `;

  document
    .getElementById("closeModal")
    .onclick = closeModal;

}

/* ============================================================
   TABS
============================================================ */

document
  .querySelectorAll(".tab")
  .forEach(tab=>{

    tab.onclick = async()=>{

      document
        .querySelectorAll(".tab")
        .forEach(x =>
          x.classList.remove(
            "active"
          )
        );

      tab.classList.add("active");

      activeTab =
        tab.dataset.tab;

      if(activeTab === "rating"){

        rankingLoaded = false;

      }

      render();

    };

  });

/* ============================================================
   HEADER BUTTONS
============================================================ */

document
  .getElementById("myBtn")
  .onclick = ()=>{

    activeTab = "players";

    document
      .querySelectorAll(".tab")
      .forEach(x =>
        x.classList.toggle(
          "active",
          x.dataset.tab === "players"
        )
      );

    render();

  };

document
  .getElementById("refreshBtn")
  .onclick = async()=>{

    const b =
      document.getElementById(
        "refreshBtn"
      );

    b.disabled = true;

    b.textContent =
      "Загрузка...";

    try{

      if(player){

        await refreshPlayer();

      }else{

        showNotice(
          "Сначала создай карту.",
          "error"
        );

      }

    }finally{

      b.disabled = false;

      b.textContent =
        "↻ Обновить";

    }

  };

/* ============================================================
   BOOT
============================================================ */

async function boot(){

  /*
    1. Мгновенно берём локальный cache.
  */

  player = loadLocal();

  render();

  /*
    2. Если Firebase есть,
       проверяем сохранённую карту.
  */

  if(
    db &&
    player &&
    player.accountId
  ){

    const remote =
      await loadOwnerByAccount(
        player.accountId
      );

    if(remote){

      player = remote;

      saveLocal();

      render();

    }

  }

}

boot();

</script>
