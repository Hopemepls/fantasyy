<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0c09">
<title>Реестр Фэнтези</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600;700&family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0b0907;
  --panel:#15110e;
  --panel2:#1d1711;
  --panel3:#241c13;
  --parchment:#eadfc7;
  --muted:#94876d;
  --muted2:#6e654f;
  --gold:#d1aa35;
  --gold2:#9b7b22;
  --red:#b34352;
  --blue:#5475dd;
  --green:#438d60;
  --line:#352b20;
  --line2:#493b29;
  --danger:#c85c69;
  --success:#69b982;
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --radius:6px;
  font-family:'Spectral',serif;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--ink);
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--parchment);
  background:
    radial-gradient(ellipse at 15% -10%,rgba(113,80,24,.18),transparent 50%),
    radial-gradient(ellipse at 90% 0%,rgba(38,52,83,.18),transparent 45%),
    linear-gradient(180deg,#100d0a 0%,#0b0907 100%);
  padding:
    max(18px,env(safe-area-inset-top))
    14px
    max(90px,env(safe-area-inset-bottom))
    14px;
  -webkit-tap-highlight-color:transparent;
}

button,
input{
  font:inherit;
}

button{
  -webkit-appearance:none;
}

.wrap{
  width:100%;
  max-width:1280px;
  margin:0 auto;
}

/* ================= HEADER ================= */

.masthead{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;
  padding-bottom:17px;
  margin-bottom:16px;
  border-bottom:1px solid var(--line);
}

.brand h1{
  margin:0 0 5px;
  font-family:'Spectral SC',serif;
  font-size:clamp(21px,4vw,30px);
  line-height:1.05;
  letter-spacing:1.5px;
  font-weight:700;
}

.brand p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

/* ================= BUTTONS ================= */

.btn{
  border:1px solid var(--gold2);
  background:var(--panel2);
  color:var(--parchment);
  padding:9px 13px;
  border-radius:var(--radius);
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.8px;
  text-transform:uppercase;
  transition:.15s ease;
}

.btn:hover{
  border-color:var(--gold);
  background:var(--panel3);
}

.btn:active{
  transform:translateY(1px);
}

.btn.primary{
  background:linear-gradient(180deg,#9b7920,#705617);
  border-color:var(--gold);
  color:#130f08;
  font-weight:600;
}

.btn.ghost{
  background:transparent;
  border-color:var(--line);
  color:var(--muted);
}

.btn.small{
  padding:6px 9px;
  font-size:9px;
}

.btn:disabled{
  opacity:.45;
  cursor:default;
}

/* ================= STATUS ================= */

.status-strip{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin:0 0 18px;
}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(20,16,12,.6);
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
}

.status-pill b{
  color:var(--gold);
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--muted2);
}

.status-dot.online{
  background:var(--success);
  box-shadow:0 0 8px rgba(105,185,130,.5);
}

.status-dot.offline{
  background:var(--danger);
}

/* ================= BANNER ================= */

.config-banner{
  margin-bottom:15px;
  padding:12px 14px;
  border:1px solid #75404a;
  background:rgba(72,27,34,.45);
  border-radius:var(--radius);
  color:#e4b8be;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  line-height:1.6;
}

/* ================= TABS ================= */

.tabs{
  display:flex;
  gap:4px;
  overflow-x:auto;
  scrollbar-width:none;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex-shrink:0;
  position:relative;
  border:0;
  background:none;
  color:var(--muted2);
  padding:10px 8px 12px;
  margin-right:15px;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold);
}

.tab.active::after{
  content:'';
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:var(--gold);
}

/* ================= CARDS ================= */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:16px;
}

.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,var(--panel) 0%,#120f0c 100%);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  animation:fadeIn .25s ease;
}

.card.mine{
  border-color:#725c22;
  box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(209,170,53,.05);
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 13px;
  border-bottom:1px solid var(--line);
}

.card-role{
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:1.6px;
}

.card-meta{
  display:flex;
  align-items:center;
  gap:7px;
}

.mine-badge{
  padding:2px 6px;
  border-radius:2px;
  background:var(--gold);
  color:#130f08;
  font-family:'IBM Plex Mono',monospace;
  font-size:8px;
  font-weight:600;
}

.tokens{
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
}

.tokens b{
  color:var(--parchment);
}

.photo-wrap{
  position:relative;
  height:205px;
  background:#090806;
  overflow:hidden;
}

.photo-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photo-wrap::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.05) 55%),
    linear-gradient(135deg,rgba(255,210,90,.05),transparent 50%);
  pointer-events:none;
}

.avatar-fallback{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,#302619,#0b0907 70%);
  color:#66553a;
  font-family:'Spectral SC',serif;
  font-size:58px;
}

.name-plate{
  position:absolute;
  z-index:2;
  left:13px;
  right:13px;
  bottom:11px;
}

.name{
  color:#f5eddb;
  font-family:'Spectral SC',serif;
  font-size:20px;
  font-weight:600;
  text-shadow:0 2px 8px #000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sub{
  margin-top:2px;
  color:#c2b596;
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
  letter-spacing:1px;
  text-shadow:0 1px 4px #000;
}

.card-menu{
  position:absolute;
  z-index:5;
  top:45px;
  right:9px;
}

.emblems{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:11px;
}

.emblem{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  align-items:center;
  gap:9px;
  min-height:52px;
  padding:7px 8px;
  background:#15110f;
  border:1px solid var(--line);
  border-radius:4px;
}

.emblem.clickable{
  cursor:pointer;
}

.emblem.clickable:hover{
  border-color:var(--gold2);
  background:#1a1510;
}

.rank-dot{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid;
  border-radius:50%;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:600;
}

.color-red .rank-dot{
  color:#e49aa4;
  border-color:var(--red);
  background:#211014;
}

.color-blue .rank-dot{
  color:#abbaf0;
  border-color:var(--blue);
  background:#101525;
}

.color-green .rank-dot{
  color:#a3d6b5;
  border-color:var(--green);
  background:#102016;
}

.stat-name{
  color:#d8ccb0;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.prop-name{
  margin-top:2px;
  color:var(--muted2);
  font-size:9px;
}

.value{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:600;
}

.color-red .value{
  color:#df8995;
}

.color-blue .value{
  color:#9eb1ed;
}

.color-green .value{
  color:#94cea8;
}

.value.untracked{
  color:#625945;
  font-size:8px;
  font-weight:400;
}

.match-toggle{
  width:100%;
  border:0;
  border-top:1px solid var(--line);
  background:none;
  color:var(--muted2);
  padding:8px;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.match-toggle:hover{
  color:var(--gold);
}

.match-log{
  display:none;
  padding:0 11px 8px;
}

.match-log.open{
  display:block;
}

.match-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:7px 2px;
  border-bottom:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  color:var(--muted);
}

.match-row:last-child{
  border-bottom:0;
}

.match-row .win{
  color:var(--success);
}

.match-row .loss{
  color:var(--danger);
}

.match-points{
  color:var(--gold);
  font-weight:600;
}

.card-footer{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
  padding:12px 13px 14px;
  border-top:1px solid var(--line);
}

.score-label{
  color:var(--muted2);
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
  letter-spacing:1px;
}

.score-sub{
  margin-top:3px;
  color:#625945;
  font-family:'IBM Plex Mono',monospace;
  font-size:8px;
}

.score-val{
  color:var(--gold);
  font-family:'Spectral SC',serif;
  font-size:23px;
  font-weight:700;
}

/* ================= EMPTY ================= */

.empty-state{
  padding:50px 22px;
  text-align:center;
  border:1px dashed var(--line2);
  border-radius:var(--radius);
}

.empty-state h3{
  margin:0 0 8px;
  color:var(--parchment);
  font-family:'Spectral SC',serif;
  font-size:19px;
}

.empty-state p{
  max-width:500px;
  margin:0 auto 18px;
  color:var(--muted);
  font-size:12.5px;
  line-height:1.6;
}

/* ================= FILTERS ================= */

.chips{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.chip{
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:20px;
  padding:6px 11px;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.chip.active{
  border-color:var(--gold);
  color:var(--gold);
}

/* ================= LEADERBOARD ================= */

.board{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--radius);
}

.board-head,
.board-row{
  display:grid;
  grid-template-columns:
    42px
    44px
    minmax(150px,1fr)
    100px
    120px;
  gap:10px;
  align-items:center;
  min-width:620px;
}

.board-head{
  padding:10px 12px;
  background:var(--panel2);
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.board-row{
  padding:10px 12px;
  background:var(--panel);
  border-top:1px solid var(--line);
}

.board-scroll{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.board-rank{
  color:var(--muted);
  font-family:'Spectral SC',serif;
  font-size:16px;
  font-weight:700;
}

.board-rank.gold{
  color:#e5c65b;
}

.board-rank.silver{
  color:#c7cbd1;
}

.board-rank.bronze{
  color:#c98a55;
}

.board-avatar{
  width:36px;
  height:36px;
  overflow:hidden;
  border-radius:50%;
  border:1px solid var(--line2);
  background:#211a12;
}

.board-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.board-avatar .avatar-fallback{
  font-size:14px;
}

.board-name{
  min-width:0;
}

.board-name-main{
  color:var(--parchment);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.board-name-sub{
  margin-top:2px;
  color:var(--muted2);
  font-family:'IBM Plex Mono',monospace;
  font-size:8px;
}

.board-role{
  color:var(--gold2);
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:.8px;
}

.board-score{
  color:var(--gold);
  text-align:right;
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  font-weight:600;
}

/* ================= DATA TABLE ================= */

.data-container{
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}

.data-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  background:var(--panel2);
  border-bottom:1px solid var(--line);
}

.data-title h2{
  margin:0;
  font-family:'Spectral SC',serif;
  font-size:16px;
}

.data-title span{
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
}

.data-scroll{
  width:100%;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

.data-table{
  width:100%;
  min-width:1100px;
  border-collapse:collapse;
}

.data-table th,
.data-table td{
  padding:9px 8px;
  border-bottom:1px solid var(--line);
  text-align:right;
  white-space:nowrap;
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
}

.data-table th{
  position:sticky;
  top:0;
  z-index:3;
  background:#211910;
  color:var(--muted);
  font-weight:500;
  letter-spacing:.4px;
}

.data-table td{
  color:#b8ab8d;
}

.data-table tr:hover td{
  background:rgba(255,255,255,.018);
}

.data-table .player-cell{
  position:sticky;
  left:0;
  z-index:2;
  min-width:185px;
  text-align:left;
  background:var(--panel);
}

.data-table th.player-cell{
  z-index:5;
  background:#211910;
}

.player-flex{
  display:flex;
  align-items:center;
  gap:8px;
}

.table-avatar{
  width:29px;
  height:29px;
  flex-shrink:0;
  overflow:hidden;
  border-radius:50%;
  background:#211a12;
}

.table-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.table-avatar .avatar-fallback{
  font-size:11px;
}

.player-table-name{
  min-width:0;
}

.player-table-name strong{
  display:block;
  color:var(--parchment);
  font-family:'Spectral',serif;
  font-size:12px;
  font-weight:600;
  max-width:130px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player-table-name small{
  display:block;
  margin-top:1px;
  color:var(--muted2);
  font-size:7.5px;
}

.total-cell{
  color:var(--gold)!important;
  font-weight:600;
}

/* ================= LEGEND ================= */

.legend{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:30px;
  padding-top:17px;
  border-top:1px solid var(--line);
}

.legend-box h4{
  margin:0 0 7px;
  color:#c9bfa2;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:1px;
}

.legend-box div{
  margin-bottom:3px;
  color:var(--muted2);
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
  line-height:1.45;
}

/* ================= MODAL ================= */

.overlay{
  position:fixed;
  z-index:100;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:rgba(4,3,2,.84);
  backdrop-filter:blur(5px);
}

.modal{
  position:relative;
  width:min(500px,100%);
  max-height:92vh;
  overflow-y:auto;
  padding:21px;
  border:1px solid var(--gold2);
  border-radius:var(--radius);
  background:var(--panel);
  box-shadow:var(--shadow);
}

.modal h2{
  margin:0 30px 6px 0;
  font-family:'Spectral SC',serif;
  font-size:19px;
}

.modal .desc{
  margin:0 0 16px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.close-x{
  position:absolute;
  top:10px;
  right:12px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:23px;
  line-height:1;
  cursor:pointer;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin-bottom:6px;
  color:#a99c80;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:1px;
}

.field input[type=text]{
  width:100%;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  outline:0;
  background:#0d0b09;
  color:var(--parchment);
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
}

.field input[type=text]:focus{
  border-color:var(--gold2);
}

.hint{
  margin-top:5px;
  color:var(--muted2);
  font-size:9.5px;
  line-height:1.45;
}

.role-options{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.role-opt{
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:#13100e;
  cursor:pointer;
}

.role-opt:hover,
.role-opt.sel{
  border-color:var(--gold2);
  background:#1a1510;
}

.rt{
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:1px;
}

.rd{
  margin-top:3px;
  color:var(--muted);
  font-size:10.5px;
}

.dot-row{
  display:flex;
  gap:4px;
  margin-top:7px;
}

.dot-row span{
  width:8px;
  height:8px;
  border-radius:50%;
}

.dot-row .r{background:var(--red);}
.dot-row .b{background:var(--blue);}
.dot-row .g{background:var(--green);}

.photo-picker{
  display:flex;

/* =========================================================
   LOCAL CACHE
========================================================= */

function saveCache(key,data){

  try {

    localStorage.setItem(
      `${CACHE_NS}_${key}`,
      JSON.stringify({
        data,
        timestamp:Date.now()
      })
    );

  } catch(e){}

}


function loadCache(key){

  try {

    const raw =
      localStorage.getItem(`${CACHE_NS}_${key}`);

    if(!raw) return null;

    const parsed = JSON.parse(raw);

    /*
      Кэш живёт 10 минут.
    */
    if(Date.now() - parsed.timestamp > 600000){
      return null;
    }

    return parsed.data;

  } catch(e){

    return null;

  }

}

function extractAccountId(input){

}


function themeFor(id){

  let h = 0;

  for(const c of String(id)){
    h = (h * 31 + c.charCodeAt(0)) >>> 0;
  }

  return THEMES[h % THEMES.length];

}


function initialsFor(name){

  const text =
    String(name || '?').trim();

  return (
    text.slice(0,1) || '?'
  ).toUpperCase();

}


function fmt(n){

function weightedRank(){

  const total =
    RANKS.reduce(
      (sum,r) => sum + r.weight,
      0
    );

  let value =
    Math.random() * total;

  for(const r of RANKS){

    if(value < r.weight){
      return r;
    }

    value -= r.weight;
  }

  return RANKS[0];

}


function randChoice(arr){

  return arr[
    Math.floor(Math.random() * arr.length)
  ];

}


function rankByTier(tier){

  return RANKS.find(
    r => r.tier === tier
  ) || RANKS[0];

}


function statByKey(color,key){

  return (
    STAT_POOL[color] || []
  ).find(
    s => s.key === key
  ) || STAT_POOL[color][0];

}


function propByKey(key){

  return (
    PROPERTIES.find(
      p => p.key === key
    ) || PROPERTIES[0]
  );

}

function resizeImage(file,maxDim){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = () => {

      const img = new Image();

      img.onload = () => {

        let w = img.width;
        let h = img.height;

        if(w > h){

          if(w > maxDim){

            h =
              Math.round(
                h * maxDim / w
              );

            w = maxDim;

          }

        } else {

          if(h > maxDim){

            w =
              Math.round(
                w * maxDim / h
              );

            h = maxDim;

          }

        }

        const canvas =
          document.createElement('canvas');

        canvas.width = w;
        canvas.height = h;

        canvas
          .getContext('2d')
          .drawImage(
            img,
            0,
            0,
            w,
            h
          );

        resolve(
          canvas.toDataURL(
            'image/jpeg',
            .78
          )
        );

      };

      img.onerror = reject;

      img.src = reader.result;

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}

/* =========================================================
   SCORING
========================================================= */

function computeEmblemValue(
  player,
  index,
  match
){

  const emblem =
    player.emblems[index];

  if(!emblem) return 0;

  const stat =
    statByKey(
      emblem.color,
      emblem.stat
    );

  const rank =
    rankByTier(
      emblem.rankTier
    );

  if(!stat || !stat.tracked){
    return 0;
  }

  let multiplier =
    1 + rank.bonus;

  const all =
    player.emblems;

  /*
    Vampiric.
  */
  if(emblem.prop === 'vampiric'){

    multiplier += .50;

  }


  /*
    Fractal.
  */
  if(emblem.prop === 'fractal'){

    const tiers =
      all.map(e => e.rankTier);

    if(
      new Set(tiers).size ===
      tiers.length
    ){

      multiplier += .60;

    }

  }


  /*
    Unique.
  */
  if(emblem.prop === 'unique'){

    const count =
      all.filter(
        e => e.prop === 'unique'
      ).length;

    if(count <= 1){

      multiplier += .30;

    }

  }


  /*
    Friendly.
  */
  if(emblem.prop === 'friendly'){

    const count =
      all.filter(
        e => e.prop === 'friendly'
      ).length;

    if(count >= 3){

      multiplier += .50;

    }

  }


  /*
    Соседи.
  */
  const left =
    all[index - 1];

  const right =
    all[index + 1];

  [left,right].forEach(neighbor => {

    if(!neighbor) return;

    if(
      neighbor.prop === 'benevolent'
    ){

      multiplier += .20;

    }

    if(
      neighbor.prop === 'vampiric'
    ){

      multiplier -= .10;

    }

  });


  return Math.max(
    0,
    stat.calc(match) * multiplier
  );

}


/*
  Очки одного матча.
*/
function gameScore(player,match){

  if(!match) return 0;

  return player.emblems.reduce(
    (sum,_,index) =>
      sum +
      computeEmblemValue(
        player,
        index,
        match
      ),
    0
  );

}


/*
  Теперь система ВСЕГДА учитывает
  максимум 2 лучших матча.

  Сейчас загружаем только 2 последних,
  поэтому фактически это два последних
  и выбираются как лучшие.
*/
function bestMatches(player){

  const matches =
    Array.isArray(player.matches)
      ? player.matches
      : [];

  return matches
    .map(match => ({
      match,
      score:gameScore(
        player,
        match
      )
    }))
    .sort(
      (a,b) => b.score - a.score
    )
    .slice(0,2);

}


function totalScore(player){

  return bestMatches(player)
    .reduce(
      (sum,item) =>
        sum + item.score,
      0
    );

}


/*
  Очки по конкретному показателю.
*/
function getPlayerStatPoints(
  player,
  color,
  statKey
){

  const matches =
    bestMatches(player);

  if(!matches.length){

    return 0;

  }

  let total = 0;

  for(const item of matches){

    const match =
      item.match;

    player.emblems.forEach(
      (em,index) => {

        if(
          em.color === color &&
          em.stat === statKey
        ){

          total +=
            computeEmblemValue(
              player,
              index,
              match
            );

        }

      }
    );

  }

  return total;

}

async function openDotaFetch(url){

  const response =
    await fetch(
      url,
      {
        method:'GET',
        cache:'no-store'
      }
    );

  if(response.status === 429){

    throw new Error(
      'OpenDota: слишком много запросов'
    );

  }

  if(!response.ok){

    throw new Error(
      `OpenDota HTTP ${response.status}`
    );

  }

  return response.json();

}

    const recent =
      await openDotaFetch(
        `https://api.opendota.com/api/players/${player.accountId}/recentMatches`
      );

    if(!Array.isArray(recent)){

      return {
        ok:false,
        msg:'OpenDota вернул некорректный ответ'
      };

    }


    /*
      Только 2 последних.
    */
    const candidates =
      recent
        .slice(0,MATCHES_TO_PARSE);


    if(!Array.isArray(player.matches)){

      player.matches = [];

    }

    if(!Array.isArray(player.parsedIds)){

      player.parsedIds = [];

    }


    let newCount = 0;


    for(const recentMatch of candidates){

      const matchId =
        String(
          recentMatch.match_id
        );


      /*
        Уже есть — не скачиваем повторно.
      */
      if(
        player.parsedIds.includes(matchId)
      ){

        continue;

      }


      const detail =
        await openDotaFetch(
          `https://api.opendota.com/api/matches/${matchId}`
        );


      const me =
        (detail.players || [])
          .find(
            p =>
              Number(p.account_id) ===
              Number(player.accountId)
          );


      if(!me){

        continue;

      }


      const match = {

        matchId,

        kills:Number(me.kills || 0),

        deaths:Number(me.deaths || 0),

        assists:Number(me.assists || 0),

        lastHits:Number(me.last_hits || 0),

        gpm:Number(me.gold_per_min || 0),

        runes:Number(me.rune_pickups || 0),

        camps:Number(me.camps_stacked || 0),

        obsPlaced:Number(me.obs_placed || 0),

        teamfight:Number(
          me.teamfight_participation || 0
        ),

        stuns:Number(
          me.stuns || 0
        ),

        firstblood:Boolean(
          me.firstblood_claimed
        ),

        radiantWin:Boolean(
          detail.radiant_win
        ),

        isRadiant:
          Number(me.player_slot || 0) < 128,

        duration:Number(
          detail.duration || 0
        ),

        startTime:Number(
          detail.start_time || 0
        )

      };


      player.matches =
        player.matches.filter(
          m =>
            String(m.matchId) !==
            matchId
        );


      player.matches.push(match);


      player.parsedIds.push(
        matchId
      );


      newCount++;

    }


    /*
      Храним максимум 2 матча.
    */
    player.matches =
      player.matches
        .sort(
          (a,b) =>
            Number(a.startTime || 0) -
            Number(b.startTime || 0)
        )
        .slice(-MATCHES_TO_PARSE);


    /*
      parsedIds тоже не раздуваем.
    */
    player.parsedIds =
      player.parsedIds
        .slice(-20);


    player.lastRefresh =
      Date.now();


    await savePlayer(player);


    return {
      ok:true,
      newCount
    };


  } catch(error){

    console.error(
      'refreshPlayer:',
      error
    );

    return {
      ok:false,
      msg:error.message
    };

  }

}

function avatarHtml(

        alt=""
        loading="lazy"
        onerror="this.style.display='none'"

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}

========================================================= */

function renderCards(){

  if(!PLAYERS.length){

    viewCards.innerHTML = `
      <div class="empty-state">

        <h3>Реестр пуст</h3>

        <p>
          Добавь первый профиль.

          получать последние 2 матча через OpenDota
          и считать Fantasy Score.
        </p>

        <button
          class="btn primary"
          id="emptyJoin"
        >
          ＋ Присоединиться
        </button>

      </div>
    `;

    document.getElementById(
      'emptyJoin'
    ).onclick =
      openJoinModal;

    return;

  }


  viewCards.innerHTML =
    `<div class="cards" id="cardsGrid"></div>`;


  const grid =
    document.getElementById('cardsGrid');


  PLAYERS.forEach(player => {

    const isMine =
      player.accountId === MY_ID;


    const role =
      ROLES[player.role] ||
      ROLES.carry;


    const matches =
      Array.isArray(player.matches)
        ? player.matches
        : [];


    const latestMatch =
      matches.length
        ? matches[matches.length - 1]
        : null;


    const best =
      bestMatches(player);


    const card =
      document.createElement('article');


    card.className =
      `card${isMine ? ' mine' : ''}`;


    const emblemsHtml =
      (player.emblems || [])
        .map((em,index) => {

          const stat =
            statByKey(
              em.color,
              em.stat
            );

          const rank =
            rankByTier(
              em.rankTier
            );

          const prop =
            propByKey(em.prop);


          let valueHtml =
            `<span class="value untracked">
              нет данных
            </span>`;


          if(
            latestMatch &&
            stat.tracked
          ){

            valueHtml =
              `<span class="value">
                ${fmt(
                  computeEmblemValue(
                    player,
                    index,
                    latestMatch
                  )
                )}
              </span>`;

          } else if(
            latestMatch &&
            !stat.tracked
          ){

            valueHtml =
              `<span class="value untracked">
                API
              </span>`;

          }


          return `
            <div
              class="
                emblem
                color-${em.color}
                ${isMine ? 'clickable' : ''}
              "
              data-slot="${index}"
            >

              <div class="rank-dot">
                ${rank.roman}
              </div>

              <div>
                <div class="stat-name">
                  ${escapeHtml(stat.label)}
                </div>

                <div class="prop-name">
                  ${escapeHtml(
                    prop.label.toLowerCase()
                  )}
                </div>
              </div>

              ${valueHtml}

            </div>
          `;

        })
        .join('');


    const logsOpen =
      openLogs.has(
        player.accountId
      );


    const matchLog =
      matches
        .slice()
        .reverse()
        .map(match => {

          const win =
            match.isRadiant ===
            match.radiantWin;


          const date =
            match.startTime
              ? new Date(
                  match.startTime * 1000
                ).toLocaleDateString(
                  'ru-RU'
                )
              : '';


          const score =
            gameScore(
              player,
              match
            );


          return `
            <div class="match-row">

              <span
                class="${win ? 'win' : 'loss'}"
              >
                ${win ? 'Победа' : 'Поражение'}
                · ${date}
              </span>

              <span>
                ${match.kills}/${match.deaths}/${match.assists}
              </span>

              <span class="match-points">
                ${fmt(score)}
              </span>

            </div>
          `;

        })
        .join('');


    const finalLog =
      matchLog ||
      `<div class="match-row">
        <span>Матчи ещё не загружены</span>
      </div>`;


    card.innerHTML = `

      <div class="card-menu">
        ${
          isMine
            ? `
              <button
                class="btn ghost small"
                data-edit="${escapeHtml(player.accountId)}"
              >
                Изменить
              </button>
            `
            : ''
        }
      </div>


      <div class="card-top">

        <span class="card-role">
          ${escapeHtml(role.label)}
        </span>

        <div class="card-meta">

          ${
            isMine
              ? `<span class="mine-badge">МОЁ</span>`
              : ''
          }

          <span class="tokens">
            жетоны:
            <b>${Number(player.tokens || 0)}</b>/${START_TOKENS}

        </div>

      </div>

          <div class="name">
            ${escapeHtml(player.name)}
          </div>

          <div class="sub">
            ACCOUNT ID ${escapeHtml(player.accountId)}
          </div>

        </div>

      </div>


      <div class="emblems">
        ${emblemsHtml}
      </div>


      <button
        class="match-toggle"
        data-log="${escapeHtml(player.accountId)}"
      >
        ${
          logsOpen
            ? 'скрыть матчи'
            : `последние ${MATCHES_TO_PARSE} матча`
        }
      </button>


      <div
        class="match-log ${logsOpen ? 'open' : ''}"
      >
        ${finalLog}
      </div>


      <div class="card-footer">

        <div>

          <div class="score-label">
            FANTASY SCORE
          </div>

          <div class="score-sub">
            лучшие ${best.length} из ${MATCHES_TO_PARSE}
          </div>

        </div>

        <div class="score-val">
          ${fmt(totalScore(player))}
        </div>

      </div>

    `;


    grid.appendChild(card);


    if(isMine){

      card
        .querySelectorAll(
          '.emblem.clickable'
        )
        .forEach(el => {

          el.onclick = () => {

            openRerollModal(
              player.accountId,
              Number(el.dataset.slot)

        });


      const edit =
        card.querySelector(
          '[data-edit]'
        );

      if(edit){

          () =>
            openJoinModal(
              player.accountId

      card.querySelector(
        '[data-log]'

    if(logButton){

            player.accountId

            player.accountId

        } else {

          openLogs.add(
            player.accountId
          );

        }

        renderCards();

      };

    }

  });

}

/* =========================================================
   BOOTSTRAP
========================================================= */

async function bootstrap(){

  /*
    Сначала моментально показываем локальный кэш.
  */
  const cached =
    loadCache('players');


  if(
    Array.isArray(cached) &&
    cached.length
  ){

    PLAYERS = cached;

    MY_ID =
      await getMyId();

    renderAll();

  }


  /*
    Затем Firebase.
  */
  try {

    const fresh =
      await loadAllPlayers();

    if(Array.isArray(fresh)){

      PLAYERS = fresh;

      saveCache(
        'players',
        fresh
      );

      MY_ID =
        await getMyId();

      renderAll();

    }

  } catch(e){

    console.warn(
      'Using local cache'
    );

  }

}

                <span class="g"></span>
                <span class="b"></span>
                <span class="r"></span>
                <span class="r"></span>
              </div>

            </div>


            <div
              class="role-opt ${
                chosenRole === 'support'
                  ? 'sel'
                  : ''
              }"
              data-role="support"
            >

              <div class="rt">
                ПОДДЕРЖКА · САП
              </div>

              <div class="rd">
                3 синих + 2 зелёных
              </div>

              <div class="dot-row">
                <span class="b"></span>
                <span class="b"></span>
                <span class="b"></span>
                <span class="g"></span>
                <span class="g"></span>
              </div>

            </div>

          </div>

        </div>


        <div id="joinError"></div>


        <div class="modal-actions">

          <button
            class="btn"
            id="modalCancel"
          >
            Отмена
          </button>

          <button
            class="btn primary"
            id="modalSave"
          >
            ${
              existing
                ? 'Сохранить'
                : 'Создать знамя'
            }
          </button>

        </div>

      </div>

    </div>

  `;


  document.getElementById(
    'modalClose'
  ).onclick =
    closeModal;


  document.getElementById(
    'modalCancel'
  ).onclick =
    closeModal;


  document
    .querySelectorAll(
      '.role-opt'
    )
    .forEach(option => {

      option.onclick = () => {

        document
          .querySelectorAll(
            '.role-opt'
          )
          .forEach(
            el =>
              el.classList.remove('sel')
          );

        option.classList.add('sel');

        chosenRole =
          option.dataset.role;

      };

    });


  document.getElementById(
    'fPhoto'
  ).onchange =
    async event => {

      const file =
        event.target.files[0];

      if(!file) return;

      try {

        chosenPhoto =
          await resizeImage(
            file,
            600
          );

        document.getElementById(
          'photoPreview'
        ).innerHTML =
          `<img src="${chosenPhoto}" alt="">`;

      } catch(e){

        console.error(e);

      }

    };


  document.getElementById(
    'fName'
  ).oninput =
    event => {

      if(chosenPhoto) return;

      document.getElementById(
        'photoPreview'
      ).textContent =
        initialsFor(
          event.target.value
        );

    };


  document.getElementById(
    'modalSave'
  ).onclick =
    async () => {

      const name =
        document
          .getElementById('fName')
          .value
          .trim();


      const link =
        document
          .getElementById('fLink')
          .value
          .trim();


      const accountId =
        extractAccountId(link);


      const error =
        document.getElementById(
          'joinError'
        );


      error.innerHTML = '';


      if(!name){

        error.innerHTML =
          `<div class="err-note">
            Укажи имя.
          </div>`;

        return;

      }


      if(!accountId){

        error.innerHTML =
          `<div class="err-note">
            Не удалось определить Account ID.
          </div>`;

        return;

      }


      if(!chosenRole){

        error.innerHTML =
          `<div class="err-note">
            Выбери роль.
          </div>`;

        return;

      }


      /*
        Проверяем дубликат.
      */
      const clash =
        PLAYERS.find(
          p =>
            p.accountId ===
            accountId
        );


      if(
        !existing &&
        clash
      ){

        error.innerHTML =
          `<div class="err-note">
            Этот профиль уже есть в реестре.
          </div>`;

        return;

      }


      let player;


      if(existing){

        player = existing;

        player.name = name;

        player.photo =
          chosenPhoto;


        /*
          Если поменяли роль,
          генерируем новые эмблемы.
        */
        if(
          player.role !== chosenRole
        ){

          player.role =
            chosenRole;

          player.emblems =
            ROLES[
              chosenRole
            ].slots.map(
              color =>
                freshEmblem(color)
            );

        }

      } else {

        player = {

          accountId,

          name,

          photo:
            chosenPhoto ||
            null,

          telegramId:
            TG_USER
              ? String(TG_USER.id)
              : null,

          telegramUsername:
            TG_USER
              ? TG_USER.username || null
              : null,

          theme:
            themeFor(accountId),

          role:
            chosenRole,

          tokens:
            START_TOKENS,

          emblems:
            ROLES[
              chosenRole
            ].slots.map(
              color =>
                freshEmblem(color)
            ),

          /*
            Только 2 последних.
          */
          matches:[],

          parsedIds:[],

          lastRefresh:null,

          joinedAt:Date.now()

        };


        const ids =
          await getIndex();


        if(!ids.includes(accountId)){

          ids.push(accountId);

          await setIndex(ids);

        }


        await setMyId(accountId);

        MY_ID =
          accountId;

      }


      await savePlayer(
        player
      );


      PLAYERS =
        await loadAllPlayers();


      closeModal();

      renderAll();


      /*
        Сразу запускаем получение двух матчей
        после создания профиля.
      */
      await refreshSinglePlayer(
        player.accountId
      );

    };

}


/* =========================================================
   SINGLE REFRESH
========================================================= */

async function refreshSinglePlayer(
  accountId
){

  const player =
    PLAYERS.find(
      p =>
        p.accountId ===
        accountId
    );


  if(!player) return;


  try {

    const result =
      await refreshPlayer(
        player
      );


    PLAYERS =
      PLAYERS.map(
        p =>
          p.accountId === accountId
            ? player
            : p
      );


    saveCache(
      'players',
      PLAYERS
    );


    renderAll();


    if(result.ok){

      console.log(
        `✅ ${player.name}: ${result.newCount} новых матчей`
      );

    }

  } catch(e){

    console.warn(e);

  }

}


/* =========================================================
   REROLL
========================================================= */

function openRerollModal(
  playerId,
  slotIndex
){

  const player =
    PLAYERS.find(
      p =>
        p.accountId ===
        playerId
    );


  if(!player) return;


  const tokens =
    Number(player.tokens || 0);


  if(tokens <= 0){

    modalRoot.innerHTML = `

      <div class="overlay">

        <div class="modal">

          <button
            class="close-x"
            id="closeNoTokens"
          >
            ×
          </button>

          <h2>
            Жетоны закончились
          </h2>

          <p class="desc">
            У знамени больше нет жетонов
            замены.
          </p>

        </div>

      </div>

    `;


    document.getElementById(
      'closeNoTokens'
    ).onclick =
      closeModal;


    return;

  }


  const color =
    player.emblems[
      slotIndex
    ].color;


  const candidates = [

    freshEmblem(color),
    freshEmblem(color),
    freshEmblem(color)

  ];


  modalRoot.innerHTML = `

    <div class="overlay">

      <div class="modal">

        <button
          class="close-x"
          id="closeReroll"
        >
          ×
        </button>

        <h2>
          Замена эмблемы
        </h2>

        <p class="desc">

          Выбери один из трёх вариантов.

          <br>

          Останется жетонов:
          <b style="color:var(--gold)">
            ${tokens - 1}
          </b>

        </p>

        <div id="candidateList"></div>

      </div>

    </div>

  `;


  const list =
    document.getElementById(
      'candidateList'
    );


  candidates.forEach(
    candidate => {

      const stat =
        statByKey(
          candidate.color,
          candidate.stat
        );


      const rank =
        rankByTier(
          candidate.rankTier
        );


      const prop =
        propByKey(
          candidate.prop
        );


      const item =
        document.createElement(
          'div'
        );


      item.className =
        'role-opt';


      item.innerHTML = `

        <div
          style="
            display:flex;
            justify-content:space-between;
            gap:10px;
          "
        >

          <div>

            <div class="rt">
              ${rank.roman} ·
              ${escapeHtml(stat.label)}
            </div>

            <div class="rd">
              ${escapeHtml(prop.label)}
              · ${escapeHtml(prop.desc)}
            </div>

          </div>

          <div
            style="
              color:var(--gold);
              font-family:'IBM Plex Mono';
              font-weight:600;
            "
          >
            +${Math.round(rank.bonus * 100)}%
          </div>

        </div>

      `;


      item.onclick =
        async () => {

          player.emblems[
            slotIndex
          ] = candidate;

          player.tokens =
            Math.max(
              0,
              tokens - 1
            );


          await savePlayer(
            player
          );


          closeModal();

          renderAll();

        };


      list.appendChild(
        item
      );

    }
  );


  document.getElementById(
    'closeReroll'
  ).onclick =
    closeModal;

}


/* =========================================================
   REFRESH ALL
========================================================= */

async function refreshAllPlayers(){

  if(isUpdating) return;

  isUpdating = true;


  const button =
    document.getElementById(
      'btnRefresh'
    );


  const oldText =
    button.textContent;


  button.disabled = true;

  button.textContent =
    '⏳ Парсинг...';


  let totalNew = 0;

  const errors = [];


  try {

    /*
      Каждый игрок получает
      только 2 последних матча.
    */
    for(const player of PLAYERS){

      const result =
        await refreshPlayer(
          player
        );


      if(result.ok){

        totalNew +=
          result.newCount || 0;

      } else {

        errors.push(
          `${player.name}: ${result.msg}`
        );

      }

    }


    /*
      Обновляем из локального кэша/Firebase.
    */
    PLAYERS =
      await loadAllPlayers();


    saveCache(
      'players',
      PLAYERS
    );


    renderAll();


    if(TG){

      try {

        TG.HapticFeedback
          ?.notificationOccurred(
            'success'
          );

      } catch(e){}

    }


    let message =
      totalNew > 0
        ? `Добавлено новых матчей: ${totalNew}`
        : 'Новых матчей не найдено';


    if(errors.length){

      message +=
        ` · Ошибок: ${errors.length}`;

      console.warn(
        errors.join('\n')
      );

    }


    console.log(
      'Обновление:',
      message
    );


  } catch(error){

    console.error(
      'Refresh all:',
      error
    );

  } finally {

    button.disabled = false;

    button.textContent =
      oldText;

    isUpdating = false;

  }

}

/* =========================================================
   AUTO UPDATE
========================================================= */

setInterval(
  async () => {

    if(isUpdating) return;

    /*
      Автоматически обновляем раз в 5 минут.
    */
    if(!PLAYERS.length) return;

    isUpdating = true;

    try {

      for(const player of PLAYERS){

        await refreshPlayer(
          player
        );

      }

      PLAYERS =
        await loadAllPlayers();

      saveCache(
        'players',
        PLAYERS
      );

      renderAll();

    } catch(e){

      console.warn(
        'Auto refresh:',
        e
      );

    } finally {

      isUpdating = false;

    }

  },
  300000
);

/* =========================================================
   INITIALIZATION
========================================================= */

(async function init(){

  renderLegend();

  /*
    Telegram ID сразу считаем своим ID,
    если Mini App запущен в Telegram.
  */
  MY_ID =
    await getMyId();


  await bootstrap();


  /*
    Если пользователь Telegram уже зарегистрирован,
    обновляем его Telegram данные.
  */
  if(
    TG_USER &&
    TG_USER.id
  ){

    const telegramId =
      String(TG_USER.id);


    const player =
      PLAYERS.find(
        p =>
          p.telegramId ===
          telegramId
      );


    if(player){

      let changed = false;


      const telegramPhoto =
        getTelegramAvatar();


      const telegramName =
        getTelegramName();


      if(
        telegramPhoto &&
        player.photo !== telegramPhoto
      ){

        player.photo =
          telegramPhoto;

        changed = true;

      }


      if(
        telegramName &&
        player.telegramUsername !==
          (TG_USER.username || null)
      ){

        player.telegramUsername =
          TG_USER.username || null;

        changed = true;

      }


      if(changed){

        await savePlayer(
          player
        );

        PLAYERS =
          PLAYERS.map(
            p =>
              p.accountId ===
              player.accountId
                ? player
                : p
          );

        renderAll();

      }

    }

  }


  console.log(
    '✅ Реестр Фэнтези запущен'
  );

})();
</script>
