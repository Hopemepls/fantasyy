<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0705">
<title>Fantasy Registry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<style>
/* ============================================================
   TOKENS
   Palette: warm near-black base, aged gold frame, three stat
   "guild" colors lifted from the roster reference (blood maroon
   for combat, moss green for economy, indigo for objectives),
   plus a teal spark used only for the idle card ornament.
============================================================ */
:root{
  --bg:#0a0704;
  --bg-2:#050403;
  --panel:#151009;
  --panel-2:#1c150c;
  --panel-3:#241a0f;
  --gold:#e2bd5c;
  --gold-dim:#a3813a;
  --gold-line:#4a3a1e;
  --text:#f1e6cf;
  --muted:#9c8d72;
  --muted-2:#6e6250;
  --line:#2c2213;
  --teal:#5fd9c9;
  --green:#6fc48e;
  --red:#d9707c;

  --combat-bg:#341018;
  --combat-ac:#e0707c;
  --farm-bg:#132c1f;
  --farm-ac:#6fcf94;
  --obj-bg:#1b1638;
  --obj-ac:#a89af2;
  --vision-bg:#0f2836;
  --vision-ac:#66c3e0;

  --shadow:0 20px 60px rgba(0,0,0,.55);
  --radius:10px;
}

*{box-sizing:border-box}

html,body{margin:0;min-height:100%}

body{
  background:
    radial-gradient(circle at 15% -10%,rgba(226,189,92,.08),transparent 32%),
    radial-gradient(circle at 85% 110%,rgba(95,217,201,.05),transparent 38%),
    var(--bg);
  color:var(--text);
  padding:16px 12px 80px;
  font-family:Georgia,"Times New Roman",serif;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}

button,input{font:inherit}
button{cursor:pointer;font-family:inherit}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important;transition-duration:.001ms!important} }

.wrap{width:100%;max-width:1180px;margin:auto}
.mono{font-family:"Courier New",monospace}

/* ---------- HEADER ---------- */
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding:6px 0 16px;border-bottom:1px solid var(--line)}
.logo h1{margin:0;font-size:24px;letter-spacing:1.4px;color:var(--text)}
.logo p{margin:5px 0 0;color:var(--muted-2);font:9px/1.4 "Courier New",monospace;letter-spacing:1.6px;text-transform:uppercase}
.actions{display:flex;gap:7px;flex-wrap:wrap}

.btn{
  border:1px solid var(--gold-line);
  background:linear-gradient(180deg,#211808,#160f06);
  color:var(--text);
  padding:9px 13px;border-radius:5px;
  font:9px "Courier New",monospace;letter-spacing:1px;text-transform:uppercase;
  transition:border-color .15s,transform .1s,background .15s;
}
.btn:hover{border-color:var(--gold);background:var(--panel-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#caa03f,#8a6a21);border-color:var(--gold);color:#1a1206;font-weight:bold}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{position:relative;border:0;background:none;color:var(--muted);padding:12px 1px;font:9px "Courier New",monospace;letter-spacing:1.6px;text-transform:uppercase}
.tab.active{color:var(--gold)}
.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--gold),var(--teal))}

/* ---------- STATUS ---------- */
.status{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 6px}
.status-item{border:1px solid var(--line);background:rgba(255,255,255,.02);padding:6px 9px;border-radius:3px;color:var(--muted-2);font:8px "Courier New",monospace;letter-spacing:.4px}
.status-item b{color:var(--gold)}

/* ---------- NOTICE ---------- */
.notice{border:1px solid #55451f;background:rgba(160,125,30,.08);color:#c9ba96;padding:10px 12px;margin:12px 0;border-radius:5px;font:10px/1.6 "Courier New",monospace;animation:slideIn .25s ease}
.notice.ok{border-color:#2f6146;background:rgba(60,150,95,.09);color:#a9dab9}
.notice.error{border-color:#6c333e;background:rgba(150,35,50,.10);color:#e6adb5}
.notice.warn{border-color:#5c4a1f;background:rgba(160,125,30,.10);color:#e0c98f}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* ---------- HERO ---------- */
.hero{
  padding:26px 24px;margin-bottom:16px;border:1px solid var(--line);border-radius:12px;
  background:
    radial-gradient(circle at 82% 15%,rgba(226,189,92,.10),transparent 32%),
    radial-gradient(circle at 10% 90%,rgba(95,217,201,.06),transparent 30%),
    linear-gradient(150deg,#18130b,#0d0a06);
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.hero-kicker{color:var(--gold);font:8px "Courier New",monospace;letter-spacing:2.4px}
.hero h2{margin:9px 0 8px;font-size:27px;line-height:1.2}
.hero p{margin:0;max-width:640px;color:#a9987b;font-size:12.5px;line-height:1.65}
.hero-actions{margin-top:19px;display:flex;gap:8px;flex-wrap:wrap}

/* ============================================================
   FANTASY CARD — the signature element.
   Perspective wrapper + tilt-responsive inner layer + a pointer
   -following glare, plus a slow idle holo sweep so it always
   reads as "foil".
============================================================ */

.fcard-stage{max-width:520px;margin:0 auto;perspective:1400px;position:relative;padding:22px 6px 0}

.fcard-stage:before{
  content:"";position:absolute;z-index:0;left:10%;right:10%;top:38px;bottom:20px;
  background:radial-gradient(ellipse at 50% 40%,rgba(226,189,92,.16),transparent 68%);
  filter:blur(26px);pointer-events:none;
}

.fcard{
  position:relative;z-index:1;
  border:1px solid var(--gold-line);
  border-radius:14px;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% -10%,rgba(226,189,92,.12),transparent 42%),
    linear-gradient(160deg,#201809,#0c0906 68%);
  box-shadow:var(--shadow), inset 0 0 0 1px rgba(226,189,92,.08), inset 0 0 0 5px rgba(6,4,2,.55);
  transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));
  transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s;
  will-change:transform;
}
.fcard:hover{box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 30px rgba(226,189,92,.10), inset 0 0 0 1px rgba(226,189,92,.14), inset 0 0 0 5px rgba(6,4,2,.55)}

.fcard-glare{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(circle at var(--mx,50%) var(--my,15%), rgba(255,247,225,.30), transparent 46%);
  opacity:var(--glare,0);mix-blend-mode:soft-light;transition:opacity .2s;
}
/* Quiet gold/teal duotone sheen instead of a full rainbow foil */
.fcard-holo{
  position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:soft-light;opacity:.10;
  background:repeating-linear-gradient(120deg,rgba(226,189,92,0) 0%,rgba(226,189,92,.9) 12%,rgba(95,217,201,.7) 22%,rgba(226,189,92,0) 34%);
  background-size:280% 280%;
  animation:holoSweep 11s ease-in-out infinite;
}
@keyframes holoSweep{
  0%,100%{background-position:0% 20%}
  50%{background-position:100% 80%}
}

.fcard-banner{
  padding:14px 16px;position:relative;z-index:2;
  background:linear-gradient(180deg,#2a2011,#181008);
  border-bottom:1px solid var(--gold-line);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.fcard-title{font-size:21px;color:var(--gold);letter-spacing:.3px;line-height:1.15}
.fcard-subtitle{font:9px "Courier New",monospace;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;white-space:nowrap}

.fcard-photo{position:relative;height:220px;overflow:hidden;background:#0b0907;z-index:1}
.fcard-photo img.main{width:100%;height:100%;object-fit:cover;display:block;transform:translateZ(0)}
.fcard-photo .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#4a3f2c;font-size:64px;background:radial-gradient(circle,#241c10,#0d0a06)}
.fcard-photo:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.96),rgba(0,0,0,0) 64%)}

.fcard-photo-tag{position:absolute;z-index:2;left:14px;bottom:12px;font:9px "Courier New",monospace;letter-spacing:1px;color:#cdbf99}
.fcard-photo-badge{position:absolute;z-index:2;top:12px;right:12px;padding:5px 10px;border-radius:4px;font:8px "Courier New",monospace;font-weight:bold;letter-spacing:.8px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.fcard-photo-badge.rarity-bronze{background:linear-gradient(180deg,#c98a52,#8a5a2e);color:#241505}
.fcard-photo-badge.rarity-silver{background:linear-gradient(180deg,#d7d7d7,#8f8f8f);color:#1c1c1c}
.fcard-photo-badge.rarity-gold{background:linear-gradient(180deg,#f3d372,#b3862c);color:#241a05}

.fcard-hero-badge{
  position:absolute;z-index:3;right:12px;bottom:12px;
  width:56px;height:56px;border-radius:50%;overflow:hidden;
  border:3px solid var(--gold);
  background:#0b0907;
  box-shadow:0 6px 16px rgba(0,0,0,.55), 0 0 0 3px rgba(6,4,2,.6);
}
.fcard-hero-badge img{width:100%;height:100%;object-fit:cover;display:block}
.fcard-hero-badge.loading{display:flex;align-items:center;justify-content:center}
.fcard-hero-badge .mini-spin{margin:0}

.fcard-total{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 16px;border-bottom:1px solid var(--line);
  background:rgba(226,189,92,.06);position:relative;z-index:2;
}
.fcard-total span{color:#b9a774;font:9px "Courier New",monospace;letter-spacing:1.8px;text-transform:uppercase}
.fcard-total strong{color:var(--gold);font-size:31px;text-shadow:0 0 18px rgba(226,189,92,.25)}

.stat-rows{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);position:relative;z-index:2}
.stat-row{--rc:#e2bd5c;--rbg:#181209;background:var(--rbg);padding:9px 10px;display:flex;align-items:center;gap:9px;border-left:3px solid var(--rc)}
.stat-icon{width:26px;height:26px;flex:none;border-radius:6px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--rc) 24%, #100e0b);color:var(--rc);font-size:13px}
.stat-info{min-width:0;flex:1}
.stat-label{font:8px "Courier New",monospace;letter-spacing:.6px;text-transform:uppercase;color:#c9bd9f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-sub{margin-top:2px;font:7px "Courier New",monospace;color:#7a6f5b}
.stat-value{color:var(--rc);font:bold 12px "Courier New",monospace;flex:none;min-width:34px;text-align:right}

/* skeleton loading */
.skel{display:inline-block;height:10px;border-radius:3px;background:linear-gradient(90deg,#2a2214,#3c331d,#2a2214);background-size:200% 100%;animation:shimmer 1.3s ease-in-out infinite}
@keyframes shimmer{0%{background-position:180% 0}100%{background-position:-20% 0}}
.stat-value .skel{width:26px}
.fcard-total strong .skel{width:70px;height:22px}

.fmatches{padding:12px 16px;border-top:1px solid var(--line);position:relative;z-index:2}
.fmatches-title{color:var(--muted);font:8px "Courier New",monospace;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:8px}
.match{background:#12100b;border:1px solid var(--line);padding:9px 10px;margin-bottom:6px;border-radius:5px;transition:border-color .15s}
.match:hover{border-color:var(--gold-line)}
.match:last-child{margin-bottom:0}
.match-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.match-id{color:#71664f;font:8px "Courier New",monospace}
.match-score{color:var(--gold);font:bold 12px "Courier New",monospace}
.match-info{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px;color:#847a63;font:8px "Courier New",monospace}
.win{color:var(--green)!important;font-weight:bold}
.loss{color:var(--red)!important;font-weight:bold}

.fcard-footer{display:flex;gap:6px;padding:12px 16px;border-top:1px solid var(--line);position:relative;z-index:2}
.fcard-footer .btn{flex:1}

.fcard-hint{text-align:center;font:8px "Courier New",monospace;letter-spacing:.6px;color:var(--muted-2);margin-top:10px;opacity:.8}

@media(max-width:520px){ .stat-rows{grid-template-columns:1fr} }

/* ---------- RANKING ---------- */
.ranking{display:flex;flex-direction:column;gap:7px}
.rank-row{
  display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;min-height:75px;
  padding:10px 12px;border:1px solid var(--line);border-radius:7px;
  background:linear-gradient(100deg,#16110b,#0f0d0a);
  transition:.15s;cursor:pointer;
}
.rank-row:hover{border-color:var(--gold-line);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rank-row:active{transform:translateY(0)}
.rank-row.me{border-color:var(--gold-dim);background:linear-gradient(90deg,rgba(226,189,92,.10),transparent),#171109}
.rank-number{color:#7a6d54;font:bold 16px "Courier New",monospace;text-align:center}
.rank-row:nth-child(1) .rank-number{color:#f0d060}
.rank-row:nth-child(2) .rank-number{color:#c7c6bd}
.rank-row:nth-child(3) .rank-number{color:#cf9868}
.rank-person{display:flex;align-items:center;gap:10px;min-width:0}
.rank-avatar{width:48px;height:48px;flex:none;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#0b0907;position:relative}
.rank-avatar img{width:100%;height:100%;object-fit:cover}
.rank-avatar-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#5c503e;font-size:19px}
.rank-name{min-width:0}
.rank-name strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.rank-name span{display:block;margin-top:3px;color:#78694f;font:7px "Courier New",monospace}
.rank-score{text-align:right}
.rank-score strong{display:block;color:var(--gold);font:bold 17px "Courier New",monospace}
.rank-score span{color:#6c604a;font:7px "Courier New",monospace}
.rank-caret{color:var(--muted-2);font-size:11px;margin-left:4px}

.search{width:100%;margin-bottom:10px}
.search input{width:100%}

.empty{padding:50px 18px;text-align:center;border:1px dashed var(--line);color:var(--muted);border-radius:8px}
.empty h2{margin:0 0 8px;color:var(--text)}
.empty p{max-width:560px;margin:0 auto 17px;line-height:1.6;font-size:12px}

/* ---------- MODAL ---------- */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:flex-start;justify-content:center;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:28px 12px 56px;
  background:rgba(0,0,0,.86);backdrop-filter:blur(6px);animation:fadeIn .18s ease
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:560px;position:relative;padding:20px;border:1px solid var(--gold-line);border-radius:10px;background:radial-gradient(circle at 100% 0,rgba(226,189,92,.08),transparent 35%),var(--panel);box-shadow:var(--shadow);animation:popIn .2s cubic-bezier(.2,.9,.3,1.2);margin:auto}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal.card-modal{max-width:520px;padding:0;background:transparent;border:none;box-shadow:none;overflow:visible}
.close{position:absolute;top:7px;right:10px;border:0;background:none;color:var(--muted);font-size:24px;z-index:10}
.close.on-card{top:18px;right:16px;color:#fff;background:rgba(10,8,5,.6);width:30px;height:30px;border-radius:50%;line-height:28px;text-align:center;border:1px solid var(--gold-line)}
.modal h2{margin:0 0 6px}
.modal-desc{color:#9b8e75;font-size:11px;line-height:1.6;margin-bottom:16px}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:5px;color:#a3946f;font:8px "Courier New",monospace;letter-spacing:1.2px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;outline:none;background:#0d0b09;color:var(--text);font:11px "Courier New",monospace;transition:border-color .15s}
input:focus{border-color:var(--gold-dim)}
input[readonly]{opacity:.6}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.role-option{padding:11px 6px;text-align:center;border:1px solid var(--line);background:#13110c;border-radius:5px;cursor:pointer;transition:.12s}
.role-option:hover{border-color:var(--gold-line)}
.role-option.selected{border-color:var(--gold);color:var(--gold);background:rgba(226,189,92,.08)}
.role-option strong{display:block;font:9px "Courier New",monospace;letter-spacing:.6px}
.role-option span{display:block;margin-top:3px;color:#6f6554;font-size:9px}
.locked-note{display:flex;gap:8px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:6px;font:9px/1.6 "Courier New",monospace;color:#9c8f74;margin-top:4px}
.locked-note b{color:var(--gold)}
.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}

/* ---------- CALC ---------- */
.calc-table{width:100%;border-collapse:collapse;margin-top:10px}
.calc-table th,.calc-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:8px}
.calc-table th{color:var(--muted);background:var(--panel-2);font:7px "Courier New",monospace}
.calc-table td{background:#100e0b}
.calc-total{margin-top:10px;padding:12px;border:1px solid var(--gold-line);background:rgba(226,189,92,.08);display:flex;justify-content:space-between;align-items:center;border-radius:6px}
.calc-total span{color:#988a6d;font:9px "Courier New",monospace}
.calc-total strong{color:var(--gold);font-size:23px}

/* ---------- LOADER ---------- */
.loader{display:flex;justify-content:center;align-items:center;gap:10px;padding:40px;color:var(--gold);font:9px "Courier New",monospace;letter-spacing:1.4px}
.spin{width:13px;height:13px;border:2px solid #493c20;border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mini-spin{display:inline-block;width:9px;height:9px;border:2px solid rgba(226,189,92,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:5px}

/* ---------- MOBILE ---------- */
@media(max-width:650px){
  .header{flex-direction:column;align-items:flex-start}
  .actions{width:100%}
  .actions .btn{flex:1}
  .rank-row{grid-template-columns:40px 1fr auto;gap:8px}
  .rank-avatar{width:42px;height:42px}
  .rank-score strong{font-size:14px}
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">
  <div class="logo">
    <h1>FANTASY REGISTRY</h1>
    <p>DOTA 2 · PLAYER CARDS · WORLD RANKING</p>
  </div>
  <div class="actions">
    <button class="btn" id="myBtn">Моя карта</button>
    <button class="btn" id="refreshBtn">↻ Обновить</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="players">Моя карта</button>
  <button class="tab" data-tab="rating">Мировой рейтинг</button>
</nav>

<div id="status"></div>
<div id="notice"></div>
<div id="content"></div>

</div>

<div id="modalRoot"></div>

<script>
/* ============================================================
   CONFIG
============================================================ */

const API = "https://api.opendota.com/api";

const FIREBASE_CONFIG = {

  authDomain:"fantasy-218c8.firebaseapp.com",
  projectId:"fantasy-218c8",
  storageBucket:"fantasy-218c8.firebasestorage.app",
  messagingSenderId:"122819799870",

const CACHE_PREFIX = "fantasy_registry_v22_";
const HERO_CACHE_KEY = "fantasy_registry_heroes_v1";

/* Fantasy scoring weights. Re-tuned so every stat contributes a
   comparable, meaningful share of the total instead of some
   fields rounding to near-zero. */
const FANTASY_RULES = {
  kills:.30,
  deaths:-.50,
  assists:.15,
  last_hits:.003,
  gpm:.002,
  tower_kills:1,
  roshan_kills:1,
  teamfight:15,      // teamfight_participation is a 0..1 fraction
  observer_placed:.50,
  camps_stacked:.50,
  runes_grabbed:.25,
  first_blood:4,
  stuns:.05,
  deaths_base:3
};

/* Bonus percentages are IDENTICAL for every card. They are a
   fixed ruleset, not something a player configures or rolls —
   this keeps every Fantasy Card comparable and fair. */
const FIXED_BONUSES = {
  kills:100,
  deaths:-10,

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function num(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function fmt(v){
  return num(v).toLocaleString("ru-RU",{maximumFractionDigits:2});
}

function accountIdFrom(v){
  const m = String(v || "").match(/\d+/g);
  return m && m.length ? m[m.length-1] : null;
}

function initials(v){
  return String(v || "?").trim().slice(0,1).toUpperCase();
}

function defaultBonuses(){ return {...FIXED_BONUSES}; }

function defaultCard(){ return { rarity:"bronze", bonuses:defaultBonuses() }; }

function normalizePlayer(p){
  p = p || {};
  p.card = p.card || defaultCard();
  p.card.bonuses = {...FIXED_BONUSES}; // always fixed, never trust stored/user values
  if(!RARITY_TIERS.some(r=>r.key===p.card.rarity)){ p.card.rarity = "bronze"; }
  if(!Array.isArray(p.bestMatches)){ p.bestMatches = []; }
  if(!p.matchCache || typeof p.matchCache !== "object"){ p.matchCache = {}; }
  return p;
}

/* ============================================================
   FANTASY MATH
============================================================ */

function calculateBaseFantasy(p){
  const kills = num(p.kills);
  const deaths = num(p.deaths);
  const assists = num(p.assists);
  const lastHits = num(p.last_hits);
  const denies = num(p.denies);
  const gpm = num(p.gold_per_min);
  const tower = num(p.tower_kills);
  const roshan = num(p.roshan_kills);
  const team = num(p.teamfight_participation);
  const obs = num(p.obs_placed);
  const stacks = num(p.camps_stacked);
  const runes = num(p.rune_pickups);
  const fb = p.firstblood_claimed ? 1 : 0;
  const stuns = num(p.stuns);

  return {
    kills: kills * FANTASY_RULES.kills,
    deaths: Math.max(0, FANTASY_RULES.deaths_base + deaths * FANTASY_RULES.deaths),
    assists: assists * FANTASY_RULES.assists,
    last_hits: (lastHits + denies) * FANTASY_RULES.last_hits,
    gpm: gpm * FANTASY_RULES.gpm,
    tower_kills: tower * FANTASY_RULES.tower_kills,
    roshan_kills: roshan * FANTASY_RULES.roshan_kills,
    teamfight: team * FANTASY_RULES.teamfight,
    observer_placed: obs * FANTASY_RULES.observer_placed,
    camps_stacked: stacks * FANTASY_RULES.camps_stacked,
    runes_grabbed: runes * FANTASY_RULES.runes_grabbed,
    first_blood: fb * FANTASY_RULES.first_blood,
    stuns: stuns * FANTASY_RULES.stuns
  };
}

function applyBonuses(base,bonuses){
  const b = bonuses || FIXED_BONUSES;
  const out = {};
  BONUS_FIELDS.forEach(([k])=>{
    out[k] = num(base[k]) * (1 + num(b[k]) / 100);
  });
  return out;
}

function totalOf(finalObj){
  return Object.values(finalObj || {}).reduce((s,v)=>s+num(v),0);
}

/* ============================================================
   OPENDOTA
============================================================ */

async function api(path){
  const url = API + path;
  const r = await fetch(url,{
    method:"GET",
    headers:{Accept:"application/json"},
    cache:"no-store"
  });
  const text = await r.text();
  if(!r.ok){ throw new Error(`OpenDota HTTP ${r.status}`); }
  try{ return JSON.parse(text); }
  catch(_){ throw new Error("OpenDota вернула не JSON"); }
}

async function getHistory(accountId){
  const data = await api(`/players/${accountId}/recentMatches`);
  if(!Array.isArray(data)) return [];
  return data
    .filter(x=>x.match_id)
    .sort((a,b)=>num(b.start_time)-num(a.start_time))
    .slice(0,15);
}

async function fetchMatchComputed(matchId, accountId){
  const match = await api(`/matches/${matchId}`);
  if(!match || !Array.isArray(match.players)){
    throw new Error(`Матч ${matchId}: players отсутствует`);
  }
  const p = match.players.find(x=>String(x.account_id)===String(accountId));
  if(!p){ throw new Error(`Игрок не найден в матче ${matchId}`); }

  const base = calculateBaseFantasy(p);
  const final = applyBonuses(base, FIXED_BONUSES);
  const total = totalOf(final);
  const radiant = num(p.player_slot) < 128;
  const win = Boolean(match.radiant_win) === radiant;

  return {
    matchId:String(match.match_id),
    startTime:num(match.start_time),
    duration:num(match.duration),
    win,
    heroId:num(p.hero_id),
    kills:num(p.kills),
    deaths:num(p.deaths),
    assists:num(p.assists),
    lastHits:num(p.last_hits),
    denies:num(p.denies),
    gpm:num(p.gold_per_min),
    teamfight:num(p.teamfight_participation),
    observer:num(p.obs_placed),
    stacks:num(p.camps_stacked),
    runes:num(p.rune_pickups),
    firstBlood:Boolean(p.firstblood_claimed),
    towerKills:num(p.tower_kills),
    roshanKills:num(p.roshan_kills),
    stuns:num(p.stuns),
    baseFantasy:base,
    finalFantasy:final,
    fantasy:Number(total.toFixed(2))
  };
}

/* ============================================================
   BEST-2
   Recomputed from scratch every refresh, over the player's most
   recent OpenDota matches (not just "whatever was last played").
   Already-fetched matches are cached by id so re-refreshing is
   cheap and doesn't re-hit OpenDota for matches we already scored.
============================================================ */

const RECENT_POOL_SIZE = 15;

function bestTwo(p){
  const src = p || player;
  if(!src) return {matches:[],total:0};
  const matches = (src.bestMatches || []).slice().sort((a,b)=>num(b.fantasy)-num(a.fantasy));
  return { matches, total: matches.reduce((s,m)=>s+num(m.fantasy),0) };
}

function aggregatedFinal(p){
  const src = p || player;
  const out = {};
  BONUS_FIELDS.forEach(([k])=>{ out[k]=0; });
  (src.bestMatches || []).forEach(m=>{
    BONUS_FIELDS.forEach(([k])=>{
      out[k] += num(m.finalFantasy && m.finalFantasy[k]);
    });
  });
  return out;
}

   PUBLISH PUBLIC PLAYER (лидерборд + friend-card view)
============================================================ */

async function publishPlayer(){
  if(!db || !player) return;
  const best = bestTwo();
  const rarity = rarityFor(best.total);
  player.card.rarity = rarity;

  const publicPlayer = {
    ownerId:OWNER_ID,
    accountId:String(player.accountId),
    name:player.name,
    photo:player.photo || null,
    role:player.role,
    rarity,
    bonuses:FIXED_BONUSES,
    lastHeroId:player.lastHeroId || null,
    /* Keep the public doc lean — matchId + accountId are enough to
       recompute the full per-stat breakdown live from OpenDota
       whenever someone opens this player's friend card. That way
       the breakdown is never stale or missing, regardless of what
       shape older documents were saved in. */
    bestMatches:best.matches.map(m=>({
      matchId:m.matchId,
      fantasy:m.fantasy,
      win:m.win,
      heroId:m.heroId || null,
      kills:m.kills,
      deaths:m.deaths,
      assists:m.assists,
      gpm:m.gpm,
      startTime:m.startTime
    })),
    fantasy:Number(best.total.toFixed(2)),
    registeredAt:player.createdAt || Date.now(),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  };

  await db.collection("players").doc(OWNER_ID).set(publicPlayer,{merge:true});
}

/* ============================================================
   REFRESH PLAYER
============================================================ */

async function refreshPlayer(){
  if(!player) return;
  isRefreshing = true;
  render();

  try{
    loadHeroes(); // fire and forget, cached for badge rendering

    const recent = await getHistory(player.accountId); // up to 15 most recent, newest first
    if(!recent.length){
      throw new Error("У игрока нет доступных матчей.");
    }

    // most recent match's hero = "last hero played"
    player.lastHeroId = num(recent[0].hero_id) || player.lastHeroId || null;

    player.matchCache = player.matchCache || {};
    const pool = recent.slice(0, RECENT_POOL_SIZE);

    const prevBestIds = new Set((player.bestMatches || []).map(m=>String(m.matchId)));

    let fetchedNew = 0;
    const computedList = [];

    for(const stub of pool){
      const id = String(stub.match_id);
      let entry = player.matchCache[id];
      if(!entry){
        try{
          entry = await fetchMatchComputed(id, player.accountId);
          player.matchCache[id] = entry;
          fetchedNew++;
        }catch(e){
          console.warn("Match:",id,e);
          continue;
        }
      }
      computedList.push(entry);
    }

    if(!computedList.length){
      throw new Error("Не удалось загрузить статистику по последним матчам.");
    }

    // drop cached matches that fell out of the recent window, so an old
    // (and possibly re-scored-under-old-rules) match can never linger
    const keepIds = new Set(pool.map(s=>String(s.match_id)));
    Object.keys(player.matchCache).forEach(id=>{
      if(!keepIds.has(id)) delete player.matchCache[id];
    });

    // The Best 2 out of the recent pool — recalculated fresh every time,
    // never "whichever games happened to be processed first".
    const top2 = computedList.slice().sort((a,b)=>num(b.fantasy)-num(a.fantasy)).slice(0,2);
    player.bestMatches = top2;

    const newBestIds = new Set(top2.map(m=>String(m.matchId)));
    const changed = newBestIds.size !== prevBestIds.size ||
      [...newBestIds].some(id=>!prevBestIds.has(id));

    player.card.rarity = rarityFor(bestTwo().total);
    player.lastRefresh = Date.now();

    saveLocal();
    await saveOwner();
    await publishPlayer();

    isRefreshing = false;
    render();

    showNotice(
      `✓ Проверено матчей: ${computedList.length}${fetchedNew ? ` (новых: ${fetchedNew})` : ""}. ${changed ? "Лучшие 2 матча обновлены." : "Лучшие 2 матча без изменений."}`,
      "ok"
    );

  }catch(e){
    console.error(e);
    isRefreshing = false;
    render();
    showNotice("Ошибка обновления: " + e.message,"error");
  }
}

function attachTilt(cardEl){
  if(!cardEl || tiltAttached.has(cardEl)) return;
  tiltAttached.add(cardEl);

  let raf = null;

  function apply(px,py){
    const rx = (py - 0.5) * -12;
    const ry = (px - 0.5) * 12;
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(()=>{
      cardEl.style.setProperty("--rx", rx.toFixed(2)+"deg");
      cardEl.style.setProperty("--ry", ry.toFixed(2)+"deg");
      cardEl.style.setProperty("--mx", (px*100).toFixed(1)+"%");
      cardEl.style.setProperty("--my", (py*100).toFixed(1)+"%");
      cardEl.style.setProperty("--sc", "1.02");
      cardEl.style.setProperty("--glare", "1");
    });
  }

  function fromEvent(e){
    const rect = cardEl.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    apply((clientX-rect.left)/rect.width, (clientY-rect.top)/rect.height);
  }

  function reset(){
    cardEl.style.setProperty("--rx","0deg");
    cardEl.style.setProperty("--ry","0deg");
    cardEl.style.setProperty("--sc","1");
    cardEl.style.setProperty("--glare","0");
  }

  cardEl.addEventListener("mousemove", fromEvent);
  cardEl.addEventListener("mouseleave", reset);
  cardEl.addEventListener("touchmove", fromEvent, {passive:true});
  cardEl.addEventListener("touchend", reset);
  cardEl.addEventListener("touchcancel", reset);
}

function renderRankingList(){
  const list = document.getElementById("rankingList");
  if(!list) return;

  const search = (document.getElementById("rankingSearch")?.value || "").trim().toLowerCase();

  const data = ranking.filter(p=>{
    if(!search) return true;
    return String(p.name).toLowerCase().includes(search) || String(p.accountId).includes(search);
  });

  if(!data.length){
    list.innerHTML = `
      <div class="empty">
        <h2>Игроков не найдено</h2>
        <p>В мировом рейтинге находятся только зарегистрированные игроки.</p>
      </div>
    `;
    return;
  }

  list.innerHTML = data.map(p=>{
    const isMe = player && p.id === OWNER_ID;
    return `
      <div class="rank-row ${isMe ? "me" : ""}" data-friend-id="${esc(p.id)}">
        <div class="rank-number">#${p.rank}</div>
        <div class="rank-person">
          <div class="rank-avatar">
            ${
              p.photo
              ? `<img src="${esc(p.photo)}" loading="lazy" onerror="this.style.display='none'">`
              : `<div class="rank-avatar-placeholder">${esc(initials(p.name))}</div>`
            }
          </div>
          <div class="rank-name">
            <strong>${esc(p.name)}${isMe ? " · вы" : ""}</strong>
            <span>${esc(ROLES[p.role] || "PLAYER")} · ${esc((p.rarity||"bronze").toUpperCase())} · ${esc(p.accountId)}</span>
          </div>
        </div>
        <div class="rank-score">
          <strong>${fmt(p.fantasy)}</strong>
          <span>BEST 2 <span class="rank-caret">›</span></span>
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll("[data-friend-id]").forEach(row=>{
    row.onclick = ()=>{
      const id = row.dataset.friendId;
      const entry = ranking.find(x=>x.id===id);
      if(entry) openFriendCard(entry);
    };
  });
}

/* ============================================================
   FRIEND CARD MODAL (read-only)
============================================================ */

let friendCardToken = 0;

function paintFriendModal(friendPlayer, loading){
  modalRoot.innerHTML = `
    <div class="overlay" data-friend-modal>
      <div class="modal card-modal">
        <button class="close on-card" id="closeModal">×</button>
        ${fantasyCardHTML(friendPlayer, {readOnly:true, loadingStats:loading, cardId:"fcardFriend"})}
      </div>
    </div>
  `;

  document.getElementById("closeModal").onclick = closeModal;
  document.querySelector('[data-friend-modal]').addEventListener("click",(e)=>{
    if(e.target.hasAttribute("data-friend-modal")) closeModal();
  });

  const calcBtn = document.querySelector('[data-calc-friend]');
  if(calcBtn) calcBtn.onclick = ()=>openCalculation(friendPlayer, {readOnly:true});

  attachTilt(document.getElementById("fcardFriend"));
}

async function openFriendCard(entry){

  const myToken = ++friendCardToken;

  const friendPlayer = {
    name: entry.name,
    role: entry.role,
    accountId: entry.accountId,
    photo: entry.photo,
    lastHeroId: entry.lastHeroId,
    card:{ rarity: entry.rarity, bonuses: FIXED_BONUSES },
    bestMatches: [] // filled in below with a LIVE recompute
  };

  // Show the card immediately with skeletons instead of a blank/zeroed card.
  paintFriendModal(friendPlayer, true);
  loadHeroes().then(()=>{
    // hero badge/name may now be resolvable — repaint quietly if still open
    if(friendCardToken === myToken && document.querySelector('[data-friend-modal]') && friendPlayer.bestMatches.length){
      paintFriendModal(friendPlayer, false);
    }
  });

  const stubs = entry.bestMatches || [];
  const results = [];

  for(const stub of stubs){
    try{
      // Recompute the FULL per-stat breakdown straight from OpenDota using
      // the stored matchId + accountId. This is what actually fixes friend
      // cards showing all zeros: we never trust a possibly-stale/lean
      // Firestore snapshot for the breakdown, only for which matches count.
      const computed = await fetchMatchComputed(stub.matchId, entry.accountId);
      results.push(computed);
    }catch(e){
      console.warn("Friend match recompute failed:", stub.matchId, e);
      results.push({
        matchId: stub.matchId,
        fantasy: num(stub.fantasy),
        win: !!stub.win,
        heroId: stub.heroId || null,
        kills: num(stub.kills),
        deaths: num(stub.deaths),
        assists: num(stub.assists),
        gpm: num(stub.gpm),
        baseFantasy: {},
        finalFantasy: {},
        unavailable: true
      });
    }
  }

  results.sort((a,b)=>num(b.fantasy)-num(a.fantasy));
  friendPlayer.bestMatches = results;

  // Only repaint if the user hasn't already closed this modal / opened another.
  if(friendCardToken === myToken && document.querySelector('[data-friend-modal]')){
    paintFriendModal(friendPlayer, false);
  }
}

function closeModal(){

  renderForm(false);

function openEditModal(){

  renderForm(true);

function renderForm(edit){

  let role = player ? player.role : "carry";

  modalRoot.innerHTML = `
    <div class="overlay">
      <div class="modal">

        <button class="close" id="closeModal">×</button>

        <h2>${edit ? "Моя карта" : "Создать карту"}</h2>

        <div class="modal-desc">
          ${
            telegramName()
            ? `Telegram: <b>${esc(telegramName())}</b><br>`
            : ""
          }
          ${
            telegramPhoto()
            ? `Фото Telegram будет использовано на карточке.`
            : `Telegram-фото недоступно. Будет использован аватар с первой буквой имени.`
          }
          <br><br>
          ${
            edit
            ? `Dota Account ID изменить нельзя.`
            : `После создания Dota Account ID изменить нельзя. Один Dota-аккаунт можно привязать только к одной Telegram-карте.`
          }
        </div>

        <div class="field">
          <label>ИМЯ ИГРОКА</label>
          <input id="playerName" value="${esc(player ? player.name : telegramName())}" placeholder="Например: Yatoro">
        </div>

        <div class="field">
          <label>DOTA 2 ACCOUNT ID</label>
          <input id="playerAccount" value="${esc(player ? player.accountId : "")}" placeholder="Например: 123456789" ${edit ? "readonly" : ""}>
        </div>

        <div class="field">
          <label>РОЛЬ</label>
          <div class="roles" id="roleGrid">
            ${Object.entries(ROLES).map(([k,v])=>`
              <div class="role-option ${role===k?"selected":""}" data-role="${k}">
                <strong>${v}</strong>
                <span>Fantasy</span>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="field">
          <div class="locked-note">
            <span>ⓘ</span>
            <div>
              <b>Бонусы очков и редкость карты фиксированы</b> и одинаковы
              для всех игроков — их нельзя выбрать вручную. Редкость
              (BRONZE / SILVER / GOLD) присваивается автоматически, по
              мере роста твоего Best-2 фэнтези-счёта.
            </div>
          </div>
        </div>

        <div id="modalError"></div>

        <div class="modal-actions">
          <button class="btn" id="cancelModal">Отмена</button>
          <button class="btn primary" id="savePlayer">${edit ? "Сохранить" : "Создать карту"}</button>
        </div>

      </div>
    </div>
  `;

  document.getElementById("closeModal").onclick = closeModal;
  document.getElementById("cancelModal").onclick = closeModal;

  document.querySelectorAll("[data-role]").forEach(el=>{
    el.onclick = ()=>{
      role = el.dataset.role;
      document.querySelectorAll("[data-role]").forEach(x=>x.classList.remove("selected"));
      el.classList.add("selected");
    };
  });

  document.getElementById("savePlayer").onclick = async()=>{

    const err = document.getElementById("modalError");
    err.innerHTML = "";
    const saveBtn = document.getElementById("savePlayer");

    const name = document.getElementById("playerName").value.trim();
    const account = accountIdFrom(document.getElementById("playerAccount").value);

    if(!name){
      err.innerHTML = `<div class="notice error">Укажи имя игрока.</div>`;
      return;
    }

    if(!account){
      err.innerHTML = `<div class="notice error">Введи правильный Dota Account ID.</div>`;
      return;
    }

    if(!edit && player){
      err.innerHTML = `<div class="notice error">Карта уже создана.</div>`;
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Сохраняем…";

    if(!edit && db){
      try{
        const claim = await checkAccountClaim(account);
        if(claim && claim.ownerId && claim.ownerId !== OWNER_ID){
          err.innerHTML = `<div class="notice error">Этот Dota Account ID уже зарегистрирован другим игроком.</div>`;
          saveBtn.disabled = false;
          saveBtn.textContent = edit ? "Сохранить" : "Создать карту";
          return;
        }
      }catch(e){
        console.warn("Account claim check:",e);
      }
    }

    if(!edit){
      player = {
        accountId:String(account),
        name,
        role,
        photo:telegramPhoto(),
        lastHeroId:null,
        card:{rarity:"bronze", bonuses:defaultBonuses()},
        bestMatches:[],
        matchCache:{},
        lastRefresh:null,
        createdAt:Date.now()
      };
    }else{
      player.name = name;
      player.role = role;
      if(telegramPhoto()){ player.photo = telegramPhoto(); }
    }

    normalizePlayer(player);
    saveLocal();

    try{
      await saveOwner();
      if(!edit && db){ await claimAccount(account); }
      await publishPlayer();
    }catch(e){
      console.error(e);
      err.innerHTML = `<div class="notice error">Не удалось сохранить карту: ${esc(e.message)}</div>`;
      saveBtn.disabled = false;
      saveBtn.textContent = edit ? "Сохранить" : "Создать карту";
      return;
    }

    closeModal();
    render();

    showNotice("✓ Карта сохранена. Загружаем матчи и рейтинг...","ok");

    await refreshPlayer();

    rankingLoaded = false;
  };
}

/* ============================================================
   CALCULATION MODAL (works for self and friend)
============================================================ */

function openCalculation(p, opts){
  opts = opts || {};
  if(!p) return;

  const best = bestTwo(p);

  modalRoot.innerHTML = `
    <div class="overlay">
      <div class="modal">

        <button class="close" id="closeModal">×</button>

        <h2>Расчёт · ${esc(p.name)}</h2>

        <div class="modal-desc">${esc((p.card ? p.card.rarity : "bronze").toUpperCase())} PLAYER CARD · бонусы одинаковы у всех</div>

        ${
          best.matches.length
          ? best.matches.map(m=>`
            <div style="border:1px solid var(--line);margin-top:12px;border-radius:6px;overflow:hidden">
              <div style="display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid var(--line);font:9px 'Courier New',monospace">
                <span>MATCH #${esc(m.matchId)} ${m.win ? '<span class="win">WIN</span>' : '<span class="loss">LOSS</span>'}</span>
                <strong style="color:var(--gold)">${fmt(m.fantasy)}</strong>
              </div>
              <table class="calc-table">
                <thead>
                  <tr><th>Показатель</th><th>Base</th><th>Бонус</th><th>Final</th></tr>
                </thead>
                <tbody>
                  ${BONUS_FIELDS.map(([k,l])=>`
                    <tr>
                      <td>${esc(l)}</td>
                      <td>${num(m.baseFantasy[k]).toFixed(3)}</td>
                      <td>${num(FIXED_BONUSES[k])}%</td>
                      <td>${num(m.finalFantasy[k]).toFixed(3)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `).join("")
          : `<div class="notice">Матчи ещё не загружены.</div>`
        }

        <div class="calc-total">
          <span>BEST 2 TOTAL</span>
          <strong>${fmt(best.total)}</strong>
        </div>

      </div>
    </div>
  `;

  document.getElementById("closeModal").onclick = closeModal;
}

  const b = document.getElementById("refreshBtn");

    if(player){ await refreshPlayer(); }

  }

/* ============================================================
   BOOT
============================================================ */

async function boot(){

  player = loadLocal();
  if(player) normalizePlayer(player);
  render();

  loadHeroes().then(()=>{ if(activeTab==="players" && player) renderPlayer(); });

  if(db){
    const remote = await loadOwner();
    if(remote){
      player = remote;
      saveLocal();
      render();
    }
  }
}

boot();
