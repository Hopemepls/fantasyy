<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Dota Fantasy League</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#070706;
  --bg2:#0d0b09;
  --panel:#12100d;
  --panel2:#18140f;
  --panel3:#211a12;
  --text:#eee4d0;
  --muted:#897b65;
  --muted2:#625846;
  --gold:#d6b044;
  --gold2:#987723;
  --gold3:#f0d27a;
  --line:#30271b;
  --green:#62bd7d;
  --red:#cf5d69;
  --blue:#7599d8;
  --shadow:0 20px 55px rgba(0,0,0,.42);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,rgba(183,143,44,.09),transparent 35%),
    var(--bg);
}

body{
  color:var(--text);
  padding:18px 12px 80px;
  font-family:Georgia,serif;
  -webkit-tap-highlight-color:transparent;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  max-width:1180px;
  margin:auto;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  padding:8px 0 18px;
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-mark{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--gold2);
  background:linear-gradient(145deg,#241c0e,#0e0c09);
  color:var(--gold3);
  font-size:21px;
  border-radius:5px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.logo h1{
  margin:0;
  font-size:24px;
  letter-spacing:2px;
}

.logo p{
  margin:5px 0 0;
  color:var(--muted);
  font:9px monospace;
  letter-spacing:1px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

/* BUTTONS */

.btn{
  border:1px solid var(--line);
  background:linear-gradient(180deg,#19150f,#100e0b);
  color:var(--text);
  padding:9px 12px;
  border-radius:4px;
  font:9px monospace;
  letter-spacing:.8px;
  text-transform:uppercase;
  transition:.18s;
}

.btn:hover{
  border-color:var(--gold2);
  transform:translateY(-1px);
}

.btn.primary{
  background:linear-gradient(180deg,#b08a2a,#745918);
  border-color:var(--gold);
  color:#160f04;
  font-weight:bold;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none;
}

/* NAV */

.tabs{
  display:flex;
  gap:26px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}

.tab{
  position:relative;
  border:0;
  background:none;
  color:var(--muted);
  padding:12px 1px 13px;
  font:9px monospace;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold3);
}

.tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:var(--gold);
}

/* STATUS */

.status{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin:14px 0;
}

.status-item{
  border:1px solid var(--line);
  background:rgba(255,255,255,.012);
  padding:8px 10px;
  border-radius:4px;
  color:var(--muted);
  font:8px monospace;
}

.status-item b{
  display:block;
  margin-top:3px;
  color:var(--gold);
  font-size:10px;
}

/* NOTICE */

.notice{
  border:1px solid #51421d;
  background:rgba(140,110,25,.07);
  color:#cabb98;
  padding:10px 12px;
  margin:12px 0;
  border-radius:4px;
  font:9px/1.6 monospace;
}

.notice.ok{
  border-color:#315b3e;
  background:rgba(50,120,70,.07);
  color:#9bd2aa;
}

.notice.error{
  border-color:#6a3039;
  background:rgba(140,30,45,.08);
  color:#e0a0a8;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:15px 0;
}

.toolbar-left{
  display:flex;
  gap:7px;
  align-items:center;
}

.toolbar-title{
  color:var(--muted);
  font:9px monospace;
  letter-spacing:1px;
}

.search{
  width:230px;
  max-width:45vw;
}

/* INPUT */

input{
  width:100%;
  padding:10px 11px;
  border:1px solid var(--line);
  border-radius:4px;
  outline:none;
  background:#0c0a08;
  color:var(--text);
  font:10px monospace;
  transition:.18s;
}

input:focus{
  border-color:var(--gold2);
  box-shadow:0 0 0 2px rgba(180,140,35,.05);
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:15px;
}

.card{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:6px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.015),transparent 30%),
    linear-gradient(180deg,var(--panel),var(--panel2));
  box-shadow:var(--shadow);
}

.card.mine{
  border-color:#81692b;
  box-shadow:
    0 0 0 1px rgba(194,153,49,.05),
    var(--shadow);
}

.card-head{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid var(--line);
}

.rank{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--gold3);
  font:bold 10px monospace;
}

.role{
  color:var(--gold);
  font:8px monospace;
  letter-spacing:1.5px;
}

.badge{
  padding:3px 6px;
  border-radius:2px;
  background:var(--gold);
  color:#171106;
  font:7px monospace;
  font-weight:bold;
}

.badge.you{
  background:#5e8f6a;
  color:#071008;
}

.photo{
  height:190px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 30%,#292117,#0b0907 65%);
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#4d4232;
  font-size:65px;
}

.photo:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top,rgba(0,0,0,.94),rgba(0,0,0,.05) 65%),
    linear-gradient(90deg,rgba(0,0,0,.25),transparent 45%,rgba(0,0,0,.25));
  pointer-events:none;
}

.player-name{
  position:absolute;
  left:13px;
  right:13px;
  bottom:11px;
  z-index:2;
}

.player-name strong{
  display:block;
  font-size:19px;
  text-shadow:0 2px 10px #000;
}

.player-name span{
  color:#9c9078;
  font:8px monospace;
}

/* SCORE */

.card-summary{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  padding:13px;
  border-bottom:1px solid var(--line);
}

.rarity{
  color:var(--gold);
  font:8px monospace;
  letter-spacing:1.2px;
}

.score-label{
  color:#706653;
  margin-top:4px;
  font:8px monospace;
}

.score{
  color:var(--gold3);
  font-size:27px;
  font-weight:bold;
  text-shadow:0 0 22px rgba(211,169,55,.13);
}

/* MATCHES */

.matches{
  padding:10px;
}

.match{
  background:#0e0d0b;
  border:1px solid var(--line);
  padding:9px;
  margin-bottom:6px;
  border-radius:3px;
}

.match:last-child{
  margin-bottom:0;
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.match-id{
  color:#6d6454;
  font:8px monospace;
}

.match-score{
  color:var(--gold);
  font:bold 12px monospace;
}

.match-info{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:5px;
  color:#766c5a;
  font:8px monospace;
}

.win{
  color:var(--green)!important;
}

.loss{
  color:var(--red)!important;
}

/* FOOTER */

.card-footer{
  display:flex;
  gap:6px;
  padding:10px;
  border-top:1px solid var(--line);
}

.card-footer .btn{
  flex:1;
}

/* EMPTY */

.empty{
  padding:65px 20px;
  text-align:center;
  border:1px dashed var(--line);
  border-radius:5px;
  background:rgba(255,255,255,.01);
}

.empty-icon{
  color:var(--gold);
  font-size:35px;
  margin-bottom:12px;
}

.empty h2{
  margin:0 0 8px;
}

.empty p{
  max-width:550px;
  margin:0 auto 18px;
  color:var(--muted);
  line-height:1.7;
  font-size:12px;
}

/* LEADERBOARD */

.leaderboard{
  border:1px solid var(--line);
  border-radius:5px;
  overflow:hidden;
  background:var(--panel);
}

.lb-row{
  display:grid;
  grid-template-columns:55px 1fr 100px 110px;
  align-items:center;
  gap:10px;
  padding:11px 13px;
  border-bottom:1px solid var(--line);
  transition:.15s;
}

.lb-row:last-child{
  border-bottom:0;
}

.lb-row:hover{
  background:rgba(255,255,255,.018);
}

.lb-row.mine{
  background:rgba(184,145,42,.055);
}

.lb-rank{
  color:#7c705c;
  font:bold 12px monospace;
}

.lb-player{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.lb-avatar{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:3px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#0c0a08;
}

.lb-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.lb-avatar div{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#5b4e3a;
  font-size:15px;
}

.lb-name{
  min-width:0;
}

.lb-name strong{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px;
}

.lb-name span{
  display:block;
  margin-top:3px;
  color:#665b4b;
  font:7px monospace;
}

.lb-score{
  color:var(--gold3);
  text-align:right;
  font:bold 14px monospace;
}

.lb-matches{
  color:#786c59;
  text-align:right;
  font:8px monospace;
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.86);
  backdrop-filter:blur(4px);
}

.modal{
  width:100%;
  max-width:560px;
  max-height:93vh;
  overflow:auto;
  position:relative;
  padding:21px;
  border:1px solid var(--gold2);
  border-radius:6px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.02),transparent 25%),
    var(--panel);
  box-shadow:0 25px 80px rgba(0,0,0,.65);
}

.close{
  position:absolute;
  top:8px;
  right:11px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:24px;
}

.modal h2{
  margin:0 0 6px;
}

.modal-desc{
  color:#9b8e75;
  font-size:11px;
  line-height:1.6;
  margin-bottom:17px;
}

.field{
  margin-bottom:14px;
}

.field>label{
  display:block;
  margin-bottom:6px;
  color:#968a73;
  font:8px monospace;
  letter-spacing:1px;
}

.roles,
.rarity-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.role-option,
.rarity-option{
  padding:11px 7px;
  text-align:center;
  border:1px solid var(--line);
  background:#100e0b;
  border-radius:3px;
  cursor:pointer;
  transition:.15s;
}

.role-option:hover,
.rarity-option:hover{
  border-color:#5f4c25;
}

.role-option.selected,
.rarity-option.selected{
  border-color:var(--gold);
  background:rgba(180,140,35,.06);
  color:var(--gold3);
}

.role-option strong{
  display:block;
  font:9px monospace;
}

.role-option span{
  display:block;
  margin-top:3px;
  color:#6f6554;
  font-size:9px;
}

.bonus-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.bonus{
  padding:8px;
  border:1px solid var(--line);
  background:#100e0b;
  border-radius:3px;
}

.bonus label{
  display:block;
  margin-bottom:4px;
  color:#766b58;
  font:7px monospace;
}

.bonus input{
  padding:7px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:17px;
}

/* CALC */

.calc-box{
  border:1px solid var(--line);
  margin-top:10px;
  border-radius:3px;
  overflow:hidden;
}

.calc-head{
  display:flex;
  justify-content:space-between;
  padding:9px;
  background:#17130f;
  border-bottom:1px solid var(--line);
  font:8px monospace;
}

.calc-head strong{
  color:var(--gold);
}

.calc-table{
  width:100%;
  border-collapse:collapse;
}

.calc-table th,
.calc-table td{
  padding:7px 6px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:8px;
}

.calc-table th{
  background:#110f0c;
  color:#756a57;
  font:7px monospace;
}

.calc-table td{
  background:#0d0c0a;
}

.calc-total{
  margin-top:10px;
  padding:12px;
  border:1px solid var(--gold2);
  background:rgba(160,125,30,.07);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.calc-total span{
  color:#988a6d;
  font:9px monospace;
}

.calc-total strong{
  color:var(--gold3);
  font-size:23px;
}

/* LOADING */

.loading{
  padding:12px;
  border-bottom:1px solid var(--line);
}

.loading-line{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#9c9078;
  font:8px monospace;
  margin-bottom:7px;
}

.progress{
  height:5px;
  background:#292219;
  border-radius:8px;
  overflow:hidden;
}

.progress i{
  display:block;
  width:0;
  height:100%;
  background:var(--gold);
  transition:width .2s;
}

/* MOBILE */

@media(max-width:760px){

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .status{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    align-items:stretch;
    flex-direction:column;
  }

  .search{
    width:100%;
    max-width:none;
  }

  .lb-row{
    grid-template-columns:38px 1fr auto;
  }

  .lb-matches{
    display:none;
  }

  .cards{
    grid-template-columns:1fr;
  }
}

@media(max-width:420px){

  body{
    padding-left:9px;
    padding-right:9px;
  }

  .logo h1{
    font-size:21px;
  }

  .roles,
  .rarity-grid{
    grid-template-columns:1fr;
  }

  .bonus-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">

  <div class="brand">

    <div class="brand-mark">⚔</div>

    <div class="logo">
      <h1>FANTASY LEAGUE</h1>
      <p>DOTA 2 · PLAYER CARDS · GLOBAL LADDER</p>
    </div>

  </div>

  <div class="actions">
    <button class="btn" id="myBtn">Моя карта</button>

</header>

<nav class="tabs">

  <button class="tab active" data-tab="players">

    ЛАДДЕРБОРД
  </button>

</nav>

<div id="status"></div>

<div id="notice"></div>

<div id="content"></div>

</div>

<div id="modalRoot"></div>

<script>

/* ============================================================
   CONFIG
============================================================ */

const API = "https://api.opendota.com/api";

const FIREBASE_CONFIG = {
  apiKey:"AIzaSyDijiSy46g6x-lqu6-LlI68wBVIjqB_-3BI",
  authDomain:"fantasy-218c8.firebaseapp.com",
  projectId:"fantasy-218c8",
  storageBucket:"fantasy-218c8.firebasestorage.app",
  messagingSenderId:"122819799870",
  appId:"1:122819799870:web:e47df878140ed305671a6f",
  measurementId:"G-9LZC0EZ0Y5"
};

const LOCAL_KEY = "dota_fantasy_player_v20";

const FANTASY_RULES = {

  kills:.30,
  deaths:-.30,
  assists:.15,

  last_hits:.003,
  gpm:.002,

  tower_kills:1,
  roshan_kills:1,

  teamfight:.03,

  observer_placed:.50,
  camps_stacked:.50,
  runes_grabbed:.25,

  first_blood:4,
  stuns:.05,

  deaths_base:3
};

const BONUS_FIELDS = [

  ["kills","Kills"],
  ["deaths","Deaths"],
  ["assists","Assists"],
  ["last_hits","Last Hits"],
  ["gpm","GPM"],
  ["tower_kills","Tower Kills"],
  ["roshan_kills","Roshan"],
  ["teamfight","Teamfight"],
  ["observer_placed","Observers"],
  ["camps_stacked","Stacks"],
  ["runes_grabbed","Runes"],
  ["first_blood","First Blood"],
  ["stuns","Stuns"]

];

const ROLES = {

  carry:"ОСНОВА",
  mid:"ЦЕНТР",
  support:"ПОДДЕРЖКА"

};

const RARITIES = {

  bronze:"BRONZE",
  silver:"SILVER",
  gold:"GOLD"

};


/* ============================================================
   STATE
============================================================ */

let db = null;

let player = null;

let allPlayers = [];

let telegramUser = null;

let activeTab = "players";

let ratingLoading = false;

let playerLoading = false;


/* ============================================================
   TELEGRAM
   Telegram НЕ используется как обязательная авторизация.
   Используем только данные профиля, если они доступны.
============================================================ */

function initTelegram(){

  try{

    const tg =
      window.Telegram &&
      window.Telegram.WebApp;

    if(!tg){
      return;
    }

    tg.ready();

    try{
      tg.expand();
    }catch(_){}

    const u =
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user;

    if(u){
      telegramUser = u;
    }

  }catch(e){

    console.warn(
      "Telegram unavailable",
      e
    );

  }

}

initTelegram();


/* ============================================================
   FIREBASE
============================================================ */

try{

  firebase.initializeApp(
    FIREBASE_CONFIG
  );

  db =
    firebase.firestore();

  db.enablePersistence({
    synchronizeTabs:true
  }).catch(()=>{});

}catch(e){

  console.error(
    "Firebase error",
    e
  );

}


/* ============================================================
   DOM
============================================================ */

const content =
  document.getElementById("content");

const status =
  document.getElementById("status");

const notice =
  document.getElementById("notice");

const modalRoot =
  document.getElementById("modalRoot");


/* ============================================================
   HELPERS
============================================================ */

function esc(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}

function num(v){

  const n = Number(v);

  return Number.isFinite(n)
    ? n
    : 0;

}

function fmt(v){

  return num(v).toLocaleString(
    "ru-RU",
    {
      maximumFractionDigits:2
    }
  );

}

function initials(v){

  return String(v || "?")
    .trim()
    .slice(0,1)
    .toUpperCase();

}

function defaultBonuses(){

  const x = {};

  BONUS_FIELDS.forEach(
    ([key])=>{
      x[key]=0;
    }
  );

  return x;

}

function defaultCard(){

  return {
    rarity:"bronze",
    bonuses:defaultBonuses()
  };

}

function tgPhoto(){

/* ============================================================
   NORMALIZE
============================================================ */

function normalize(p){

  p = p || {};

  p.card =
    p.card ||
    defaultCard();

  p.card.bonuses =
    p.card.bonuses ||
    defaultBonuses();

  BONUS_FIELDS.forEach(
    ([key])=>{
      p.card.bonuses[key] =
        num(p.card.bonuses[key]);
    }
  );

  if(
    !RARITIES[p.card.rarity]
  ){

    p.card.rarity = "bronze";

  }

  if(
    !ROLES[p.role]
  ){

    p.role = "carry";

  }

  if(
    !Array.isArray(p.matches)
  ){

    p.matches = [];

  }

  return p;

}

/* ============================================================
   FIRESTORE
============================================================ */

/*
   Общая коллекция:

   players/
      DOTA_ACCOUNT_ID

   Благодаря этому все пользователи
   находятся в одной таблице.
*/

function playerRef(accountId){

  if(!db || !accountId){
    return null;
  }

  return db
    .collection("players")
    .doc(String(accountId));

}


/* ============================================================
   CHECK PLAYER
============================================================ */

async function playerExists(accountId){

  if(!db){
    return false;
  }

  try{

    const snap =
      await playerRef(accountId)
        .get();

    return snap.exists;

  }catch(e){

    console.error(
      "playerExists",
      e
    );

    return false;

  }

}


/* ============================================================
   SAVE PLAYER
============================================================ */

async function savePlayer(){

  if(!player){
    return;
  }

  normalize(player);

  saveLocal();

  if(!db){
    return;
  }

  const ref =
    playerRef(
      player.accountId
    );

  if(!ref){
    return;
  }

  /*
    fantasyTotal всегда сохраняется.
    Поэтому ладдерборд может сортироваться
    даже без пересчёта всех матчей.
  */

  const best =
    bestTwoFor(player);

  player.fantasyTotal =
    Number(best.total.toFixed(2));

  player.matchCount =
    player.matches.length;

  player.updatedAt =
    Date.now();

  await ref.set(
    player,
    {merge:true}
  );

}

   LOAD CURRENT PLAYER
============================================================ */

async function loadCurrentPlayer(){

  const local =
    loadLocal();

  if(local){

    player = local;

    render();

  }

  /*
    Если локальный игрок есть,
    пытаемся найти его в Firebase.
  */

  if(
    local &&
    db &&
    local.accountId
  ){

    try{

      const snap =
        await playerRef(
          local.accountId
        ).get();

      if(snap.exists){

        player =
          normalize(
            snap.data()
          );

        saveLocal();

      }

    }catch(e){

      console.warn(
        "Current player load",
        e
      );

    }

  }

  render();

}


/* ============================================================
   LOAD ALL PLAYERS
============================================================ */

async function loadAllPlayers(){

  if(!db){

    allPlayers = [];

    return [];

  }

  ratingLoading = true;

  render();

  try{

    /*
      НЕ используем orderBy здесь.

      Это важно:
      Firestore может требовать индекс,
      а нам он не нужен.

      Сначала получаем всех игроков,
      затем сортируем JS.
    */

    const snap =
      await db
        .collection("players")
        .get();

    allPlayers =
      snap.docs
        .map(doc=>{

          return normalize({
            id:doc.id,
            ...doc.data()
          });

        })
        .filter(p=>p.accountId);

    /*
      Сортировка по актуальному fantasyTotal.
    */

    allPlayers.sort(
      (a,b)=>
        num(b.fantasyTotal)
        -
        num(a.fantasyTotal)
    );

    return allPlayers;

  }catch(e){

    console.error(
      "LOAD PLAYERS",
      e
    );

    showNotice(
      "Не удалось загрузить игроков: "+
      e.message,
      "error"
    );

    allPlayers = [];

    return [];

  }finally{

    ratingLoading = false;

    render();

  }

}


/* ============================================================

============================================================ */

async function api(path){

  const url =
    API + path;

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        },
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      `OpenDota HTTP ${response.status}`
    );

  }

  const text =
    await response.text();

  try{

    return JSON.parse(text);

  }catch(_){

    throw new Error(
      "OpenDota вернула не JSON"
    );

  }

}

/* ============================================================
   FANTASY
============================================================ */

function calculateBaseFantasy(p){

  const kills =
    num(p.kills);

  const deaths =
    num(p.deaths);

  const assists =
    num(p.assists);

  const lastHits =
    num(p.last_hits);

  const denies =
    num(p.denies);

  const gpm =
    num(p.gold_per_min);

  const tower =
    num(p.tower_kills);

  const roshan =
    num(p.roshan_kills);

  const team =
    num(
      p.teamfight_participation
    );

  const obs =
    num(p.obs_placed);

  const stacks =
    num(p.camps_stacked);

  const runes =
    num(p.rune_pickups);

  const firstBlood =
    p.firstblood_claimed
      ? 1
      : 0;

  const stuns =
    num(p.stuns);


  return {

    kills:
      kills *
      FANTASY_RULES.kills,

    deaths:
      FANTASY_RULES.deaths_base +
      deaths *
      FANTASY_RULES.deaths,

    assists:
      assists *
      FANTASY_RULES.assists,

    last_hits:
      (lastHits + denies) *
      FANTASY_RULES.last_hits,

    gpm:
      gpm *
      FANTASY_RULES.gpm,

    tower_kills:
      tower *
      FANTASY_RULES.tower_kills,

    roshan_kills:
      roshan *
      FANTASY_RULES.roshan_kills,

    teamfight:
      team *
      FANTASY_RULES.teamfight,

    observer_placed:
      obs *
      FANTASY_RULES.observer_placed,

    camps_stacked:
      stacks *
      FANTASY_RULES.camps_stacked,

    runes_grabbed:
      runes *
      FANTASY_RULES.runes_grabbed,

    first_blood:
      firstBlood *
      FANTASY_RULES.first_blood,

    stuns:
      stuns *
      FANTASY_RULES.stuns

  };

}


function applyBonuses(
  base,
  bonuses
){

  const out = {};

  BONUS_FIELDS.forEach(
    ([key])=>{

      out[key] =
        num(base[key]) *
        (
          1 +
          num(
            bonuses &&
            bonuses[key]
          ) / 100
        );

    }
  );

  return out;

}


function calculate(
  p,
  card
){

  const base =
    calculateBaseFantasy(p);

  const final =
    applyBonuses(
      base,
      card.bonuses
    );

  const total =
    Object.values(final)
      .reduce(
        (sum,v)=>
          sum + num(v),
        0
      );

  return {
    base,
    final,
    total
  };

}


/* ============================================================
   MATCH
============================================================ */

async function loadMatch(
  matchId,
  accountId,
  card
){

  const match =
    await api(
      `/matches/${matchId}`
    );

  if(
    !match ||
    !Array.isArray(
      match.players
    )
  ){

    throw new Error(
      `Матч ${matchId}: данные игроков отсутствуют`
    );

  }

  const p =
    match.players.find(
      x=>
        String(x.account_id)
        ===
        String(accountId)
    );

  if(!p){

    throw new Error(
      `Игрок ${accountId} не найден в матче ${matchId}`
    );

  }

  const calc =
    calculate(
      p,
      card
    );

  const radiant =
    num(p.player_slot)
    < 128;

  const win =
    Boolean(match.radiant_win)
    ===
    radiant;

  return {

    matchId:
      String(match.match_id),

    startTime:
      num(match.start_time),

    duration:
      num(match.duration),

    win,

    kills:
      num(p.kills),

    deaths:
      num(p.deaths),

    assists:
      num(p.assists),

    lastHits:
      num(p.last_hits),

    denies:
      num(p.denies),

    gpm:
      num(p.gold_per_min),

    teamfight:
      num(
        p.teamfight_participation
      ),

    observer:
      num(p.obs_placed),

    stacks:
      num(p.camps_stacked),

    runes:
      num(p.rune_pickups),

    firstBlood:
      Boolean(
        p.firstblood_claimed
      ),

    towerKills:
      num(p.tower_kills),

    roshanKills:
      num(p.roshan_kills),

    stuns:
      num(p.stuns),

    baseFantasy:
      calc.base,

    finalFantasy:
      calc.final,

    fantasy:
      Number(
        calc.total.toFixed(2)
      )

  };

}


/* ============================================================
   BEST TWO
============================================================ */

function bestTwoFor(p){

  const sorted =
    Array.isArray(p.matches)
      ? p.matches
          .slice()
          .sort(
            (a,b)=>
              num(b.fantasy)
              -
              num(a.fantasy)
          )
      : [];

  const matches =
    sorted.slice(0,2);

  const total =
    matches.reduce(
      (sum,m)=>
        sum + num(m.fantasy),
      0
    );

  return {
    matches,
    total
  };

}


function bestTwo(){

  return bestTwoFor(
    player || {
      matches:[]
    }
  );

}


/* ============================================================
   REFRESH CURRENT PLAYER
============================================================ */

async function refreshPlayer(){

  if(!player){
    return;
  }

  if(playerLoading){
    return;
  }

  playerLoading = true;

  player.loading = true;

  render();

  try{

    const history =
      await getHistory(
        player.accountId
      );

    if(!history.length){

      throw new Error(
        "OpenDota не вернула последние матчи"
      );

    }

    const target =
      history
        .slice(0,4)
        .map(
          x=>String(x.match_id)
        );

    const existing =
      new Map(
        (player.matches || [])
          .map(
            m=>
              [
                String(m.matchId),
                m
              ]
          )
      );

    /*
      Загружаем матчи,
      которых ещё нет.
    */

    for(
      let i=0;
      i<target.length;
      i++
    ){

      const matchId =
        target[i];

      /*
        Если матч уже сохранён,
        не дёргаем API повторно.
      */

      if(
        existing.has(matchId)
      ){

        continue;

      }

      try{

        const match =
          await loadMatch(
            matchId,
            player.accountId,
            player.card
          );

        existing.set(
          matchId,
          match
        );

      }catch(e){

        console.warn(
          "Match failed",
          matchId,
          e
        );

      }

      player.loadingCurrent =
        i+1;

      player.loadingTotal =
        target.length;

      render();

    }


    /*
      Берём только последние
      доступные матчи.
    */

    player.matches =
      target
        .map(
          id=>existing.get(id)
        )
        .filter(Boolean);


    /*
      ВАЖНО:
      если пользователь изменил бонусы,
      пересчитываем сохранённые матчи.
    */

    player.matches.forEach(
      m=>{

        if(!m.baseFantasy){
          return;
        }

        const final =
          applyBonuses(
            m.baseFantasy,
            player.card.bonuses
          );

        m.finalFantasy =
          final;

        m.fantasy =
          Number(
            Object.values(final)
              .reduce(
                (s,v)=>
                  s + num(v),
                0
              )
              .toFixed(2)
          );

      }
    );


    const best =
      bestTwo();

    player.fantasyTotal =
      Number(
        best.total.toFixed(2)
      );

    player.matchCount =
      player.matches.length;

    player.lastRefresh =
      Date.now();

    player.updatedAt =
      Date.now();


    delete player.loading;
    delete player.loadingCurrent;
    delete player.loadingTotal;


    /*
      Сохраняем свежие данные
      обратно в Firestore.
    */

    await savePlayer();


    /*
      Обновляем локальный объект
      в ладдерборде.
    */

    const index =
      allPlayers.findIndex(
        p=>
          String(p.accountId)
          ===
          String(player.accountId)
      );

    if(index >= 0){

      allPlayers[index] =
        normalize({
          ...player
        });

    }


    allPlayers.sort(
      (a,b)=>
        num(b.fantasyTotal)
        -
        num(a.fantasyTotal)
    );


    render();

    showNotice(
      "✓ Статистика игрока обновлена. Ладдерборд синхронизирован.",
      "ok"
    );

  }catch(e){

    delete player.loading;
    delete player.loadingCurrent;
    delete player.loadingTotal;

    render();

    showNotice(
      "Ошибка обновления: "+
      e.message,
      "error"
    );

  }finally{

    playerLoading = false;

  }

}


/* ============================================================
   REFRESH ALL PLAYERS
============================================================ */

/*
  Эта функция обновляет игроков,
  которые уже находятся в ладдерборде.

  Чтобы не создавать огромную нагрузку,
  одновременно обновляем максимум 2 игрока.
*/

async function refreshLeaderboardData(){

  if(!db){
    return;
  }

  if(!allPlayers.length){

    await loadAllPlayers();

  }

  showNotice(
    "Обновляем статистику игроков..."
  );

  const players =
    allPlayers.slice();

  let index = 0;


  async function worker(){

    while(true){

      const i =
        index++;

      if(i >= players.length){
        return;
      }

      const p =
        players[i];

      try{

        const history =
          await getHistory(
            p.accountId
          );

        if(!history.length){
          continue;
        }

        const target =
          history
            .slice(0,4)
            .map(
              x=>String(x.match_id)
            );

        const existing =
          new Map(
            (p.matches || [])
              .map(
                m=>
                  [
                    String(m.matchId),
                    m
                  ]
              )
          );


        for(
          const matchId
          of target
        ){

          if(
            existing.has(matchId)
          ){

            continue;

          }

          try{

            const m =
              await loadMatch(
                matchId,
                p.accountId,
                p.card
              );

            existing.set(
              matchId,
              m
            );

          }catch(_){}

        }


        p.matches =
          target
            .map(
              id=>
                existing.get(id)
            )
            .filter(Boolean);


        /*
          Пересчёт бонусов.
        */

        p.matches.forEach(
          m=>{

            if(!m.baseFantasy){
              return;
            }

            const final =
              applyBonuses(
                m.baseFantasy,
                p.card.bonuses
              );

            m.finalFantasy =
              final;

            m.fantasy =
              Number(
                Object.values(final)
                  .reduce(
                    (s,v)=>
                      s + num(v),
                    0
                  )
                  .toFixed(2)
              );

          }
        );


        const best =
          bestTwoFor(p);

        p.fantasyTotal =
          Number(
            best.total.toFixed(2)
          );

        p.matchCount =
          p.matches.length;

        p.updatedAt =
          Date.now();


        await playerRef(
          p.accountId
        ).set(
          p,
          {merge:true}
        );


        /*
          Если это текущий игрок,
          обновляем localStorage.
        */

        if(
          player &&
          String(
            player.accountId
          )
          ===
          String(
            p.accountId
          )
        ){

          player =
            normalize({
              ...p
            });

          saveLocal();

        }

      }catch(e){

        console.warn(
          "Leaderboard update failed",
          p.accountId,
          e
        );

      }

    }

  }


  await Promise.all([
    worker(),
    worker()
  ]);


  allPlayers.sort(
    (a,b)=>
      num(b.fantasyTotal)
      -
      num(a.fantasyTotal)
  );


  render();

  showNotice(
    "✓ Ладдерборд обновлён.",
    "ok"
  );

}

                      <span class="match-score">
                        ${fmt(m.fantasy)}
                      </span>

                    </div>

                    <div class="match-info">

                      <span
                        class="${
                          m.win
                          ? "win"
                          : "loss"
                        }"
                      >
                        ${
                          m.win
                          ? "ПОБЕДА"
                          : "ПОРАЖЕНИЕ"
                        }
                      </span>

                      <span>
                        ${m.kills}/
                        ${m.deaths}/
                        ${m.assists}
                      </span>

                      <span>
                        GPM ${fmt(m.gpm)}
                      </span>

                    </div>

                  </div>

                `
              )
              .join("")

            :

            `
              <div class="match">
                <div class="match-info">
                  Матчи ещё не загружены
                </div>
              </div>
            `
          }

        </div>


        <div class="card-footer">

          <button
            class="btn"
            id="calcBtn"
          >
            Расчёт
          </button>

          <button
            class="btn"
            id="editBtn"
          >
            Карта
          </button>

        </div>

      </article>

    </div>

  `;


  document
    .getElementById("calcBtn")
    .onclick =
    openCalculation;


  document
    .getElementById("editBtn")
    .onclick =
    openEditModal;


  document
    .getElementById("refreshMine")
    .onclick =
    refreshPlayer;

}


/* ============================================================
   RATING
============================================================ */

function renderRating(){

  if(ratingLoading){

    content.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ↻
        </div>

        <h2>
          Загружаем ладдерборд
        </h2>

        <p>
          Получаем всех зарегистрированных
          игроков из Firestore.
        </p>

      </div>

    `;

    return;

  }


  const query =
    (
      document
        .getElementById("ratingSearch")
        ?.value
      || ""
    )
    .trim()
    .toLowerCase();


  let players =
    allPlayers.filter(
      p=>{

        if(!query){
          return true;
        }

        return (

          String(p.name || "")
            .toLowerCase()
            .includes(query)

          ||

          String(p.accountId || "")
            .includes(query)

        );

      }
    );


  players.sort(
    (a,b)=>
      num(b.fantasyTotal)
      -
      num(a.fantasyTotal)
  );


  content.innerHTML = `

    <div class="toolbar">

      <div class="toolbar-left">

        <div class="toolbar-title">
          GLOBAL LADDER ·
          ${players.length}
        </div>

      </div>

      <div class="toolbar-left">

        <input
          class="search"
          id="ratingSearch"
          placeholder="Поиск игрока..."
          value="${esc(query)}"
        >

        <button
          class="btn"
          id="refreshRating"
        >
          ↻
        </button>

        <button
          class="btn primary"
          id="syncRating"
        >
          Синхронизировать
        </button>

      </div>

    </div>


    ${
      players.length

      ?

      `
      <div class="leaderboard">

        ${
          players
            .map(
              (p,index)=>{

                const isMine =
                  player &&
                  String(
                    player.accountId
                  )
                  ===
                  String(
                    p.accountId
                  );

                const best =
                  bestTwoFor(p);

                return `

                  <div
                    class="
                      lb-row
                      ${isMine ? "mine" : ""}
                    "
                  >

                    <div class="lb-rank">
                      #${index+1}
                    </div>


                    <div class="lb-player">

                      <div class="lb-avatar">

                        ${
                          p.photo

                          ?

                          `
                            <img
                              src="${esc(p.photo)}"
                              loading="lazy"
                            >
                          `

                          :

                          `
                            <div>
                              ${esc(
                                initials(
                                  p.name
                                )
                              )}
                            </div>
                          `
                        }

                      </div>


                      <div class="lb-name">

                        <strong>
                          ${esc(p.name)}
                          ${
                            isMine
                            ? " · ТЫ"
                            : ""
                          }
                        </strong>

                        <span>
                          ${esc(
                            ROLES[p.role]
                            || "ИГРОК"
                          )}
                          ·
                          ${esc(
                            p.accountId
                          )}
                        </span>

                      </div>

                    </div>


                    <div class="lb-score">

                      ${fmt(
                        best.total
                      )}

                    </div>


                    <div class="lb-matches">

                      BEST 2<br>

                      ${
                        p.updatedAt
                        ?
                        new Date(
                          p.updatedAt
                        ).toLocaleDateString(
                          "ru-RU"
                        )
                        :
                        "—"
                      }

                    </div>

                  </div>

                `;

              }
            )
            .join("")
        }

      </div>
      `

      :

      `
        <div class="empty">

          <div class="empty-icon">
            🏆
          </div>

          <h2>
            Игроков пока нет
          </h2>

          <p>
            Зарегистрируй первую карту,
            чтобы она появилась в глобальном
            ладдерборде.
          </p>

        </div>
      `
    }

  `;


  const search =
    document.getElementById(
      "ratingSearch"
    );

  if(search){

    search.oninput =
      ()=>{
        renderRating();
      };

  }


  const refresh =
    document.getElementById(
      "refreshRating"
    );

  if(refresh){

    refresh.onclick =
      loadAllPlayers;

  }


  const sync =
    document.getElementById(
      "syncRating"
    );

  if(sync){

    sync.onclick =
      async ()=>{

        sync.disabled=true;

        try{

          await refreshLeaderboardData();

        }finally{

          sync.disabled=false;

        }

      };

  }

}


/* ============================================================
   RENDER
============================================================ */

function render(){

  renderStatus();

  if(activeTab==="players"){

    renderPlayer();

  }else{

    renderRating();

  }

}


/* ============================================================
   MODALS
============================================================ */

function closeModal(){

  modalRoot.innerHTML="";

}


/* ============================================================
   CREATE
============================================================ */

function openCreateModal(){

  if(player){

    showNotice(
      "Карта уже создана. Вторую карту создать нельзя.",
      "error"
    );

    return;

  }

  renderForm(false);

}


/* ============================================================
   EDIT
============================================================ */

function openEditModal(){

  if(!player){
    return;
  }

  renderForm(true);

}


/* ============================================================
   FORM
============================================================ */

function renderForm(edit){

  const card =
    player
    ?
    normalize(player).card
    :
    defaultCard();

  let role =
    player
    ?
    player.role
    :
    "carry";

  let rarity =
    card.rarity;


  modalRoot.innerHTML = `

    <div class="overlay">

      <div class="modal">

        <button
          class="close"
          id="closeModal"
        >
          ×
        </button>


        <h2>
          ${
            edit
            ? "Настройки карты"
            : "Создание Player Card"
          }
        </h2>


        <div class="modal-desc">

          ${
            edit

            ?

            `
              Карта уже зарегистрирована.
              Dota Account ID изменить нельзя.
            `

            :

            `
              Укажи Dota 2 Account ID.
              Telegram-фото будет использовано
              автоматически, если оно доступно.
            `
          }

        </div>


        <div class="field">

          <label>
            ИМЯ ИГРОКА
          </label>

          <input
            id="playerName"
            value="${esc(
              player
              ?
              player.name
              :
              tgName()
            )}"
            placeholder="Например: Miracle-"
          >

        </div>


        <div class="field">

          <label>
            DOTA 2 ACCOUNT ID
          </label>

          <input
            id="playerAccount"
            value="${esc(
              player
              ?
              player.accountId
              :
              ""
            )}"
            placeholder="117905733"
            ${edit ? "readonly" : ""}
          >

        </div>


        <div class="field">

          <label>
            РОЛЬ
          </label>

          <div
            class="roles"
            id="roleGrid"
          >

            ${
              Object.entries(ROLES)
                .map(
                  ([key,label])=>`

                    <div
                      class="
                        role-option
                        ${
                          role===key
                          ? "selected"
                          : ""
                        }
                      "
                      data-role="${key}"
                    >

                      <strong>
                        ${label}
                      </strong>

                      <span>
                        Fantasy
                      </span>

                    </div>

                  `
                )
                .join("")
            }

          </div>

        </div>


        <div class="field">

          <label>
            РЕДКОСТЬ
          </label>

          <div class="rarity-grid">

            ${
              Object.entries(RARITIES)
                .map(
                  ([key,label])=>`

                    <div
                      class="
                        rarity-option
                        ${
                          rarity===key
                          ? "selected"
                          : ""
                        }
                      "
                      data-rarity="${key}"
                    >
                      ${label}
                    </div>

                  `
                )
                .join("")
            }

          </div>

        </div>


        <div class="field">

          <label>
            PLAYER CARD БОНУСЫ
          </label>

          <div class="bonus-grid">

            ${
              BONUS_FIELDS
                .map(
                  ([key,label])=>`

                    <div class="bonus">

                      <label>
                        ${label}
                      </label>

                      <input
                        type="number"
                        min="-100"
                        max="100"
                        step="1"
                        data-bonus="${key}"
                        value="${num(
                          card.bonuses[key]
                        )}"
                      >

                    </div>

                  `
                )
                .join("")
            }

          </div>

        </div>


        <div id="modalError"></div>


        <div class="modal-actions">

          <button
            class="btn"
            id="cancelModal"
          >
            Отмена
          </button>

          <button
            class="btn primary"
            id="savePlayer"
          >
            ${
              edit
              ? "Сохранить"
              : "Создать карту"
            }
          </button>

        </div>

      </div>

    </div>

  `;


  document
    .getElementById("closeModal")
    .onclick =
    closeModal;

  document
    .getElementById("cancelModal")
    .onclick =
    closeModal;


  document
    .querySelectorAll("[data-role]")
    .forEach(
      el=>{

        el.onclick =
          ()=>{

            role =
              el.dataset.role;

            document
              .querySelectorAll(
                "[data-role]"
              )
              .forEach(
                x=>
                  x.classList.remove(
                    "selected"
                  )
              );

            el.classList.add(
              "selected"
            );

          };

      }
    );


  document
    .querySelectorAll("[data-rarity]")
    .forEach(
      el=>{

        el.onclick =
          ()=>{

            rarity =
              el.dataset.rarity;

            document
              .querySelectorAll(
                "[data-rarity]"
              )
              .forEach(
                x=>
                  x.classList.remove(
                    "selected"
                  )
              );

            el.classList.add(
              "selected"
            );

          };

      }
    );


  document
    .getElementById("savePlayer")
    .onclick =
    async ()=>{

      const errorBox =
        document.getElementById(
          "modalError"
        );

      errorBox.innerHTML="";


      const saveButton =
        document.getElementById(
          "savePlayer"
        );

      saveButton.disabled=true;


      try{

        const name =
          document
            .getElementById(
              "playerName"
            )
            .value
            .trim();


        const rawAccount =
          document
            .getElementById(
              "playerAccount"
            )
            .value
            .trim();


        /*
          Разрешаем ввод:
          123456
          steam_123456
          https://...
        */

        const numbers =
          rawAccount.match(
            /\d+/g
          );

        const account =
          numbers &&
          numbers.length
          ?
          numbers[numbers.length-1]
          :
          null;


        if(!name){

          throw new Error(
            "Укажи имя игрока."
          );

        }


        if(!account){

          throw new Error(
            "Укажи корректный Dota Account ID."
          );

        }


        /*
          При создании проверяем,
          не занят ли этот Account ID.
        */

        if(!edit){

          if(
            await playerExists(
              account
            )
          ){

            throw new Error(
              "Этот Dota Account ID уже зарегистрирован в ладдерборде."
            );

          }

        }


        const bonuses =
          defaultBonuses();


        document
          .querySelectorAll(
            "[data-bonus]"
          )
          .forEach(
            input=>{

              bonuses[
                input.dataset.bonus
              ] =
                num(input.value);

            }
          );


        if(!edit){

          player = {

            accountId:
              String(account),

            name,

            role,

            photo:
              tgPhoto(),

            telegramUsername:
              telegramUser &&
              telegramUser.username
              ?
              telegramUser.username
              :
              null,

            card:{
              rarity,
              bonuses
            },

            matches:[],

            fantasyTotal:0,

            matchCount:0,

            createdAt:
              Date.now(),

            updatedAt:
              Date.now()

          };

        }else{

          /*
            В режиме редактирования
            Account ID НЕ меняем.
          */

          player.name =
            name;

          player.role =
            role;

          player.card = {

            rarity,

            bonuses

          };

          /*
            Если Telegram-фото появилось
            позже — можем его обновить.
          */

          if(
            tgPhoto()
          ){

            player.photo =
              tgPhoto();

          }

        }


        normalize(player);


        /*
          Сохраняем общую карточку
          в players/{accountId}.
        */

        await savePlayer();


        /*
          Обновляем локальный список.
        */

        const idx =
          allPlayers.findIndex(
            p=>
              String(
                p.accountId
              )
              ===
              String(
                player.accountId
              )
          );


        if(idx >= 0){

          allPlayers[idx] =
            normalize({
              ...player
            });

        }else{

          allPlayers.push(
            normalize({
              ...player
            })
          );

        }


        allPlayers.sort(
          (a,b)=>
            num(b.fantasyTotal)
            -
            num(a.fantasyTotal)
        );


        closeModal();

        render();


        /*
          После создания
          автоматически грузим матчи.
        */

        await refreshPlayer();


      }catch(e){

        errorBox.innerHTML =
          `
            <div class="notice error">
              ${esc(e.message)}
            </div>
          `;

      }finally{

        saveButton.disabled=false;

      }

    };

}


/* ============================================================
   CALCULATION
============================================================ */

  }

/* ============================================================
   TABS
============================================================ */

document
  .querySelectorAll(".tab")
  .forEach(
    tab=>{

      tab.onclick =
        async ()=>{

          document
            .querySelectorAll(".tab")
            .forEach(
              x=>
                x.classList.remove(
                  "active"
                )
            );

          tab.classList.add(
            "active"
          );

          activeTab =
            tab.dataset.tab;


          if(
            activeTab==="rating"
          ){

            if(!allPlayers.length){

              await loadAllPlayers();

            }else{

              render();

            }

          }else{

            render();

          }

        };

    }
  );


/* ============================================================
   HEADER BUTTONS
============================================================ */

document
  .getElementById("myBtn")
  .onclick =
  ()=>{

    activeTab =
      "players";

    document
      .querySelectorAll(".tab")
      .forEach(
        x=>
          x.classList.toggle(
            "active",
            x.dataset.tab==="players"
          )
      );

    render();

  };


document
  .getElementById("refreshBtn")
  .onclick =
  async ()=>{

    const btn =
      document.getElementById(
        "refreshBtn"
      );

    btn.disabled=true;

    btn.textContent =
      "Загрузка...";


    try{

      /*
        Если открыта карта —
        обновляем её.

        Если рейтинг —
        сначала читаем всех,
        затем обновляем их статистику.
      */

      if(
        activeTab==="players"
      ){

        if(player){

          await refreshPlayer();

        }else{

          showNotice(
            "Сначала создай карту."
          );

        }

      }else{

        await refreshLeaderboardData();

      }

    }finally{

      btn.disabled=false;

      btn.textContent =
        "↻ Обновить";

    }

  };


/* ============================================================
   BOOT
============================================================ */

async function boot(){

  /*
    Сначала мгновенно показываем
    локальную карту.
  */

  player =
    loadLocal();

  render();


  /*
    Затем загружаем её из Firebase.
  */

  await loadCurrentPlayer();


  /*
    Загружаем всех игроков
    сразу, чтобы ладдерборд был готов.
  */

  await loadAllPlayers();


  /*
    Если текущего игрока нет в общей базе,
    но есть локально — добавляем.
  */

  if(player){

    const exists =
      allPlayers.some(
        p=>
          String(
            p.accountId
          )
          ===
          String(
            player.accountId
          )
      );

    if(!exists){

      allPlayers.push(
        normalize({
          ...player
        })
      );

    }

    allPlayers.sort(
      (a,b)=>
        num(b.fantasyTotal)
        -
        num(a.fantasyTotal)
    );

    render();

  }

}

boot();
