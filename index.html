<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Fantasy Registry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600;700&family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#090806;
  --panel:#15110d;
  --panel2:#1d1710;
  --panel3:#231b12;
  --text:#eadfc7;
  --muted:#8f8269;
  --gold:#d1aa38;
  --gold2:#8f7426;
  --line:#33291d;
  --red:#b94b5a;
  --green:#55a872;
  --blue:#5f7fe0;
  --danger:#d35c69;
  --shadow:0 16px 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--text);
  padding:20px 14px 80px;
  font-family:"Spectral",serif;
  -webkit-tap-highlight-color:transparent;
}

button,input{font:inherit}
button{cursor:pointer}

.wrap{
  max-width:1240px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  padding-bottom:17px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}

.logo h1{
  margin:0;
  font-family:"Spectral SC",serif;
  font-size:27px;
  letter-spacing:1.8px;
}

.logo p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--gold2);
  background:var(--panel2);
  color:var(--text);
  padding:9px 13px;
  border-radius:4px;
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.btn:hover{
  border-color:var(--gold);
  background:var(--panel3);
}

.btn.primary{
  background:linear-gradient(180deg,#97761e,#6f5517);
  color:#151106;
  border-color:var(--gold);
  font-weight:600;
}

.btn.danger{
  border-color:#6c3038;
  color:#e39aa2;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.tabs{
  display:flex;
  gap:24px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.tab{
  position:relative;
  border:0;
  background:none;
  color:var(--muted);
  padding:11px 2px 13px;
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold);
}

.tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:var(--gold);
}

.status{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:18px;
}

.status-item{
  padding:7px 10px;
  background:rgba(255,255,255,.02);
  border:1px solid var(--line);
  border-radius:3px;
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
}

.status-item b{
  color:var(--gold);
}

.notice{
  border:1px solid #55441d;
  background:rgba(130,100,25,.08);
  padding:12px 14px;
  margin-bottom:18px;
  border-radius:4px;
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  line-height:1.6;
  color:#c9ba94;
}

.notice.error{
  border-color:#683039;
  background:rgba(130,30,40,.1);
  color:#e4a0a8;
}

.notice.ok{
  border-color:#31563e;
  background:rgba(40,100,60,.08);
  color:#9bd0aa;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:18px;
}

.card{
  overflow:hidden;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);
  border-radius:5px;
  box-shadow:var(--shadow);
}

.card.mine{
  border-color:#75602a;
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 13px;
  border-bottom:1px solid var(--line);
}

.role{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:1.5px;
}

.mine{
  color:#181307;

  padding:3px 6px;
  border-radius:2px;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  font-weight:600;
}

.photo{
  height:190px;
  position:relative;
  background:#0c0a08;
  overflow:hidden;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-placeholder{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Spectral SC",serif;
  font-size:60px;
  color:#40372a;
}

.photo:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.88),transparent 55%);
  pointer-events:none;
}

.player-name{
  position:absolute;
  left:13px;
  bottom:11px;
  z-index:2;
}

.player-name strong{
  display:block;
  font-family:"Spectral SC",serif;
  font-size:20px;
  text-shadow:0 2px 8px #000;
}

.player-name span{
  font-family:"IBM Plex Mono",monospace;
  color:#b7aa8e;
  font-size:9px;
}

.score-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 14px;
  border-bottom:1px solid var(--line);
}

.score-title{
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:1px;
}

.score{
  color:var(--gold);
  font-family:"Spectral SC",serif;
  font-size:26px;
  font-weight:700;
}

.matches{
  padding:12px;
}

.match{
  border:1px solid var(--line);
  background:#12100d;
  margin-bottom:7px;
  padding:9px 10px;
  border-radius:3px;
}

.match:last-child{
  margin-bottom:0;
}

.match-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.match-id{

  font-size:9px;
  color:#756b59;
}

.match-score{
  font-family:"IBM Plex Mono",monospace;
  font-size:13px;
  color:var(--gold);
  font-weight:600;
}

.match-info{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:5px;
  color:#817662;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
}

.win{color:#7fc595!important}
.loss{color:#cf7c85!important}

.card-footer{
  display:flex;
  gap:7px;
  padding:12px;
  border-top:1px solid var(--line);
}

.card-footer .btn{
  flex:1;
}

.empty{
  border:1px dashed var(--line);
  padding:55px 20px;
  text-align:center;
  color:var(--muted);
}

.empty h2{
  margin:0 0 8px;
  font-family:"Spectral SC",serif;
  color:var(--text);
}

.empty p{
  max-width:520px;
  margin:0 auto 18px;
  line-height:1.6;
  font-size:13px;
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:5px;
}

table{
  width:100%;

}

th,td{

th{

  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:1px;

}

td{
  background:var(--panel);
  font-size:13px;
}

tr:last-child td{
  border-bottom:0;
}

.player-cell{

  align-items:center;
  gap:10px;
}

.small-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  overflow:hidden;
  background:#231d14;

  align-items:center;
  justify-content:center;

.small-avatar img{
  width:100%;

}

.table-score{
  color:var(--gold);

  font-weight:600;
}

.rank-number{
  color:#a39578;
  font-family:"IBM Plex Mono",monospace;
}

.diagnostic{
  display:none;
  margin-top:18px;
  border:1px solid var(--line);
  background:#0d0b09;
  border-radius:4px;
  overflow:hidden;
}

.diagnostic.open{
  display:block;
}

.diag-head{
  padding:11px 13px;
  background:var(--panel2);
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.diag-head strong{
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  letter-spacing:1px;
}

pre{
  margin:0;
  padding:14px;
  max-height:500px;
  overflow:auto;
  color:#b8ad94;
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.modal{

  max-width:540px;
  max-height:92vh;
  overflow:auto;

}

.close{

  background:none;

}

.modal h2{

}

.modal-desc{

  font-size:12px;

  margin-bottom:18px;
}

.field{

}

.field label{

  color:#9e9178;
  font-family:"IBM Plex Mono",monospace;

  letter-spacing:1px;

}

input[type=text]{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  background:#0d0b09;
  color:var(--text);
  border-radius:3px;
  outline:none;
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
}

input:focus{
  border-color:var(--gold2);
}

.roles{
  display:grid;
  gap:7px;
}

.role-option{
  padding:11px;
  border:1px solid var(--line);
  background:#11100d;
  cursor:pointer;
  border-radius:3px;
}

.role-option.selected{
  border-color:var(--gold);
}

.role-option strong{
  display:block;
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
}

.role-option span{
  color:#817660;
  font-size:11px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* LOADING */

.loading-box{
  margin-top:15px;
  border:1px solid var(--line);
  background:#0e0c09;
  padding:15px;
  border-radius:4px;
}

.loading-title{
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  letter-spacing:1px;
  color:var(--gold);
  margin-bottom:11px;
}

.progress-track{
  height:7px;
  background:#292118;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#8b691d,#d1aa38);
  transition:width .25s ease;
}

.loading-text{
  margin-top:9px;
  color:#a39780;
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  line-height:1.5;
}

.loading-result{
  margin-top:10px;
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.detail-stat{
  background:#100e0b;
  border:1px solid var(--line);
  padding:9px;
}

.detail-stat small{
  display:block;
  color:#716652;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  text-transform:uppercase;
}

.detail-stat b{
  display:block;
  color:var(--text);
  margin-top:3px;
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
}

@media(max-width:720px){
  body{
    padding:14px 10px 70px;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .logo h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="wrap">

    </strong>

    </button>

Пока запросов нет.

</div>

<div id="modalRoot"></div>

<script>

/* ============================================================
   TELEGRAM
============================================================ */

let tgUser = null;

try{

  if(
    window.Telegram &&
    Telegram.WebApp
  ){

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    tgUser =
      Telegram.WebApp.initDataUnsafe &&
      Telegram.WebApp.initDataUnsafe.user
        ?Telegram.WebApp.initDataUnsafe.user
        :null;

    console.log(
      "Telegram user:",
      tgUser
    );
  }

}catch(error){

  console.warn(
    "Telegram:",
    error
  );
}

/* ============================================================
   FIREBASE
============================================================ */

const FIREBASE_CONFIG = {

  apiKey:"AIzaSyDiji-w6g6x-lqu6-LlI68wBVIjqB_-3BI",

  authDomain:
    "fantasy-218c8.firebaseapp.com",

  projectId:
    "fantasy-218c8",

  storageBucket:
    "fantasy-218c8.firebasestorage.app",

  messagingSenderId:
    "122819799870",

  appId:
    "1:122819799870:web:e47df878140ed305671a6f",

  measurementId:
    "G-9LZC0EZ0Y5"
};

let db=null;

try{

  firebase.initializeApp(
    FIREBASE_CONFIG
  );

  db=firebase.firestore();

  db.enablePersistence({
    synchronizeTabs:true
  }).catch(
    error=>{
      console.warn(
        "Firestore persistence:",
        error
      );
    }
  );

  console.log(
    "Firebase инициализирован"
  );

}catch(error){

  console.error(
    "Firebase init:",
    error
  );
}

/* ============================================================
   CONFIG
============================================================ */

const API =
  "https://api.opendota.com/api";

const CACHE_KEY =
  "fantasy_registry_players_v7";

const MY_ID_KEY =
  "fantasy_registry_my_id_v7";

const START_TOKENS=20;

/*
  ВАЖНО:

  Эти коэффициенты применяются к ПОЛНОМУ
  объекту игрока из /matches/{match_id}.

  Это не данные из recentMatches.
*/

const FANTASY={

  kills:.3,

  deaths:-.3,

  assists:0,

  last_hits:.003,

  gold_per_min:.002,

  xp_per_min:0,

  tower_kills:1,

  tower_damage:0,

  hero_damage:0,

  courier_kills:0,

  observer_kills:0,

  sentry_kills:0,

  roshan_kills:1,

  teamfight:3,

  observer_placed:.5,

  sentry_placed:0,

  camps_stacked:.5,

  runes_grabbed:.25,

  first_blood:4,

  stuns:.05,

  hero_healing:0,

  deaths_base:3
};

const ROLES={

  carry:{
    label:"ОСНОВА"
  },

  mid:{
    label:"ЦЕНТР"
  },

  support:{
    label:"ПОДДЕРЖКА"
  }
};

/* ============================================================
   STATE
============================================================ */

let PLAYERS=[];

let MY_ID=null;

let ACTIVE_TAB="players";

let diagnosticLogs=[];

const content=
  document.getElementById(
    "content"
  );

const status=
  document.getElementById(
    "status"
  );

const modalRoot=
  document.getElementById(
    "modalRoot"
  );

const diagnosticPanel=
  document.getElementById(
    "diagnosticPanel"
  );

const diagOutput=
  document.getElementById(
    "diagOutput"
  );

/* ============================================================
   HELPERS
============================================================ */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");
}

function fmt(value){

  const n=Number(value);

  if(!Number.isFinite(n))
    return "0";

  return n.toLocaleString(
    "ru-RU",
    {
      maximumFractionDigits:2
    }
  );
}

function sleep(ms){

  return new Promise(
    resolve=>setTimeout(
      resolve,
      ms
    )
  );
}

function initials(name){

  return String(
    name || "?"
  )
  .trim()
  .slice(0,1)
  .toUpperCase();
}

function accountIdFrom(value){

  const numbers=
    String(value || "")
      .match(/\d+/g);

  if(
    !numbers ||
    !numbers.length
  )
    return null;

  return numbers[
    numbers.length-1
  ];
}

function tgPhoto(){

  return tgUser &&
    tgUser.photo_url
      ?tgUser.photo_url
      :null;
}

function tgName(){

  if(!tgUser)
    return "";

  let name=
    tgUser.first_name || "";

  if(tgUser.last_name)
    name+=" "+tgUser.last_name;

  if(tgUser.username)
    name+=" @"+tgUser.username;

  return name.trim();
}

/* ============================================================
   DIAGNOSTICS
============================================================ */

function diag(title,data){

  diagnosticLogs.unshift({

    time:
      new Date()
        .toLocaleTimeString(
          "ru-RU"
        ),

    title,

    data
  });

  diagnosticLogs=
    diagnosticLogs.slice(
      0,
      30
    );

  renderDiagnostics();

  console.log(
    "[Fantasy]",
    title,
    data
  );
}

function renderDiagnostics(){

  if(!diagnosticLogs.length){

    diagOutput.textContent=
      "Пока запросов нет.";

    return;
  }

  diagOutput.textContent=
    diagnosticLogs
      .map(item=>

        `[${item.time}] ${item.title}\n`+
        JSON.stringify(
          item.data,
          null,
          2
        )

      )
      .join(
        "\n\n------------------------------\n\n"
      );
}

document
  .getElementById("clearDiag")
  .onclick=()=>{

    diagnosticLogs=[];

    renderDiagnostics();
  };

/* ============================================================
   API REQUEST
============================================================ */

async function apiFetch(path){

  const url=
    API+path;

  diag(
    "REQUEST",
    {
      url
    }
  );

  let response;

  try{

    response=
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );

  }catch(error){

    diag(
      "CONNECTION ERROR",
      {
        url,
        name:error.name,
        message:error.message
      }
    );

    throw new Error(
      "Браузер не смог подключиться к OpenDota. "+
      error.message
    );
  }

  const text=
    await response.text();

  diag(
    "RESPONSE",
    {
      url,
      status:response.status,
      ok:response.ok,
      preview:text.slice(
        0,
        3000
      )
    }
  );

  if(!response.ok){

    throw new Error(
      "OpenDota HTTP "+
      response.status
    );
  }

  let json;

  try{

    json=
      JSON.parse(text);

  }catch(error){

    throw new Error(
      "OpenDota вернула не JSON"
    );
  }

  return json;
}

async function getRecentMatches(accountId){

  /*
    recentMatches содержит историю,
    но НЕ полную статистику Fantasy.
  */

  let history=null;

  try{

    history=
      await apiFetch(
        `/players/${accountId}/recentMatches`
      );

  }catch(error){

    diag(
      "recentMatches FAILED",
      {
        accountId,
        error:error.message
      }
    );
  }

  if(
    !Array.isArray(history) ||
    !history.length
  ){

    /*
      fallback
    */

    history=
      await apiFetch(
        `/players/${accountId}/matches?limit=10`
      );
  }

  if(
    !Array.isArray(history) ||
    !history.length
  ){

    throw new Error(
      "OpenDota не вернула историю матчей"
    );
  }

  const sorted=
    history
      .filter(
        item=>item.match_id
      )
      .sort(
        (a,b)=>
          Number(
            b.start_time || 0
          )-
          Number(
            a.start_time || 0
          )
      );

  diag(
    "RECENT MATCHES",
    {
      accountId,
      count:sorted.length,
      ids:sorted
        .slice(0,5)
        .map(
          x=>x.match_id
        )
    }
  );

  return sorted;
}

/* ============================================================
   FANTASY CALCULATION
============================================================ */

function calculateFantasy(player){

  /*
    Проверяем реальные поля.
  */

  const kills=
    Number(player.kills)||0;

  const deaths=
    Number(player.deaths)||0;

  const assists=
    Number(player.assists)||0;

  const lastHits=
    Number(player.last_hits)||0;

  const denies=
    Number(player.denies)||0;

  const gpm=
    Number(player.gold_per_min)||0;

  const xpm=
    Number(player.xp_per_min)||0;

  const towerKills=
    Number(player.tower_kills)||0;

  const towerDamage=
    Number(player.tower_damage)||0;

  const heroDamage=
    Number(player.hero_damage)||0;

  const courierKills=
    Number(player.courier_kills)||0;

  const observerKills=
    Number(player.observer_kills)||0;

  const sentryKills=
    Number(player.sentry_kills)||0;

  const roshanKills=
    Number(player.roshan_kills)||0;

  const teamfight=
    Number(
      player.teamfight_participation
    )||0;

  const obsPlaced=
    Number(player.obs_placed)||0;

  const sentryPlaced=
    Number(player.sen_placed)||0;

  const camps=
    Number(player.camps_stacked)||0;

  const runes=
    Number(player.rune_pickups)||0;

  const firstBlood=
    player.firstblood_claimed
      ?1
      :0;

  const stuns=
    Number(player.stuns)||0;

  const healing=
    Number(player.hero_healing)||0;

  /*
    ВАЖНО:
    deaths_base = +3 базовых очка матча,
    после чего идут штрафы за смерти.
  */

  const parts={

    kills:
      kills*
      FANTASY.kills,

    deaths:
      FANTASY.deaths_base+
      deaths*
      FANTASY.deaths,

    assists:
      assists*
      FANTASY.assists,

    last_hits:
      (lastHits+denies)*
      FANTASY.last_hits,

    gold_per_min:
      gpm*
      FANTASY.gold_per_min,

    xp_per_min:
      xpm*
      FANTASY.xp_per_min,

    tower_kills:
      towerKills*
      FANTASY.tower_kills,

    tower_damage:
      towerDamage*
      FANTASY.tower_damage,

    hero_damage:
      heroDamage*
      FANTASY.hero_damage,

    courier_kills:
      courierKills*
      FANTASY.courier_kills,

    observer_kills:
      observerKills*
      FANTASY.observer_kills,

    sentry_kills:
      sentryKills*
      FANTASY.sentry_kills,

    roshan_kills:
      roshanKills*
      FANTASY.roshan_kills,

    teamfight:
      teamfight*
      FANTASY.teamfight,

    observer_placed:
      obsPlaced*
      FANTASY.observer_placed,

    sentry_placed:
      sentryPlaced*
      FANTASY.sentry_placed,

    camps_stacked:
      camps*
      FANTASY.camps_stacked,

    runes_grabbed:
      runes*
      FANTASY.runes_grabbed,

    first_blood:
      firstBlood*
      FANTASY.first_blood,

    stuns:
      stuns*
      FANTASY.stuns,

    hero_healing:
      healing*
      FANTASY.hero_healing
  };

  let total=0;

  Object.values(parts)
    .forEach(
      value=>{
        total+=Number(value)||0;
      }
    );

  return {
    total,
    parts,
    source:{
      kills,
      deaths,
      assists,
      lastHits,
      denies,
      gpm,
      xpm,
      towerKills,
      towerDamage,
      heroDamage,
      courierKills,
      observerKills,
      sentryKills,
      roshanKills,
      teamfight,
      obsPlaced,
      sentryPlaced,
      camps,
      runes,
      firstBlood,
      stuns,
      healing
    }
  };
}

/* ============================================================
   FULL MATCH
============================================================ */

async function getMatchFantasy(
  matchId,
  accountId
){

  const match=
    await apiFetch(
      `/matches/${matchId}`
    );

  if(
    !match ||
    !Array.isArray(
      match.players
    )
  ){

    throw new Error(
      "Матч "+matchId+
      " не содержит players"
    );
  }

  const player=
    match.players.find(
      p=>
        String(
          p.account_id
        )===
        String(accountId)
    );

  if(!player){

    throw new Error(
      "Игрок "+
      accountId+
      " не найден в матче "+
      matchId
    );
  }

  const fantasy=
    calculateFantasy(
      player
    );

  const isRadiant=
    Number(
      player.player_slot
    )<128;

  const win=
    Boolean(
      match.radiant_win
    )===
    isRadiant;

  /*
    Диагностика показывает именно то,
    что OpenDota прислала для игрока.
  */

  diag(
    "FANTASY MATCH "+matchId,
    {
      accountId,
      fantasy:fantasy.total,
      raw:{
        kills:player.kills,
        deaths:player.deaths,
        assists:player.assists,
        last_hits:player.last_hits,
        denies:player.denies,
        gold_per_min:player.gold_per_min,
        xp_per_min:player.xp_per_min,
        tower_kills:player.tower_kills,
        roshan_kills:player.roshan_kills,
        teamfight_participation:
          player.teamfight_participation,
        obs_placed:player.obs_placed,
        sen_placed:player.sen_placed,
        camps_stacked:player.camps_stacked,
        rune_pickups:player.rune_pickups,
        firstblood_claimed:
          player.firstblood_claimed,
        stuns:player.stuns,
        hero_healing:player.hero_healing
      },
      calculation:
        fantasy.parts
    }
  );

  return {

    matchId:String(
      match.match_id
    ),

    startTime:
      Number(
        match.start_time
      )||0,

    duration:
      Number(
        match.duration
      )||0,

    heroId:
      player.hero_id,

    kills:
      Number(player.kills)||0,

    deaths:
      Number(player.deaths)||0,

    assists:
      Number(player.assists)||0,

    lastHits:
      Number(player.last_hits)||0,

    denies:
      Number(player.denies)||0,

    gpm:
      Number(player.gold_per_min)||0,

    xpm:
      Number(player.xp_per_min)||0,

    teamfight:
      Number(
        player.teamfight_participation
      )||0,

    stuns:
      Number(player.stuns)||0,

    runes:
      Number(player.rune_pickups)||0,

    camps:
      Number(player.camps_stacked)||0,

    obsPlaced:
      Number(player.obs_placed)||0,

    sentryPlaced:
      Number(player.sen_placed)||0,

    firstBlood:
      Boolean(
        player.firstblood_claimed
      ),

    towerKills:
      Number(player.tower_kills)||0,

    roshanKills:
      Number(player.roshan_kills)||0,

    heroDamage:
      Number(player.hero_damage)||0,

    heroHealing:
      Number(player.hero_healing)||0,

    radiantWin:
      Boolean(
        match.radiant_win
      ),

    isRadiant,

    win,

    fantasy:
      Number(
        fantasy.total.toFixed(2)
      ),

    fantasyBreakdown:
      fantasy.parts,

    rawPlayer:player
  };
}

/* ============================================================
   REFRESH PLAYER
============================================================ */

async function refreshPlayer(
  player,
  progressCallback=null
){

  const accountId=
    String(
      player.accountId
    );

  if(!accountId)
    throw new Error(
      "Нет Account ID"
    );

  const history=
    await getRecentMatches(
      accountId
    );

  /*
    Берём только последние 2.
  */

  const candidates=
    history
      .filter(
        x=>x.match_id
      )
      .slice(0,2);

  if(!candidates.length){

    throw new Error(
      "Нет матчей"
    );
  }

  const oldMatches=
    Array.isArray(
      player.matches
    )
      ?player.matches
      :[];

  const oldMap=
    new Map(
      oldMatches.map(
        m=>[
          String(m.matchId),
          m
        ]
      )
    );

  let completed=0;

  for(
    let i=0;
    i<candidates.length;
    i++
  ){

    const item=
      candidates[i];

    const id=
      String(
        item.match_id
      );

    if(progressCallback){

      progressCallback({
        current:i,
        total:candidates.length,
        text:
          `Загружаю матч ${i+1}/${candidates.length} · ${id}`
      });
    }

    /*
      Даже если матч уже есть,
      не нужно заново долбить API.
    */

    if(
      oldMap.has(id) &&
      typeof oldMap.get(id).fantasy===
        "number"
    ){

      completed++;

      if(progressCallback){

        progressCallback({
          current:i+1,
          total:candidates.length,
          text:
            `Матч ${i+1}/${candidates.length} уже сохранён`
        });
      }

      continue;
    }

    try{

      const result=
        await getMatchFantasy(
          id,
          accountId
        );

      oldMap.set(
        id,
        result
      );

      completed++;

      if(progressCallback){

        progressCallback({
          current:i+1,
          total:candidates.length,
          text:
            `Матч ${i+1}/${candidates.length} загружен · Fantasy ${fmt(result.fantasy)}`
        });
      }

    }catch(error){

      diag(
        "MATCH ERROR",
        {
          matchId:id,
          accountId,
          error:error.message
        }
      );

      /*
        Если матч не загрузился,
        продолжаем второй.
      */

      if(progressCallback){

        progressCallback({
          current:i+1,
          total:candidates.length,
          text:
            `Ошибка матча ${i+1}/${candidates.length}: ${error.message}`,
          error:true
        });
      }
    }

    /*
      Небольшая пауза,
      чтобы браузер не делал несколько
      запросов подряд.
    */

    if(
      i<
      candidates.length-1
    ){

      await sleep(250);
    }
  }

  player.matches=
    Array.from(
      oldMap.values()
    )
    .sort(
      (a,b)=>
        Number(b.startTime||0)-
        Number(a.startTime||0)
    )
    .slice(0,10);

  player.lastRefresh=
    Date.now();

  /*
    ВАЖНО:
    сначала обновляем PLAYERS,
    потом сохраняем localStorage.
  */

  saveLocal();

  await savePlayer(
    player
  );

  if(progressCallback){

    progressCallback({
      current:candidates.length,
      total:candidates.length,
      text:
        `Готово · загружено ${completed}/${candidates.length}`
    });
  }

  return {
    newMatches:completed,
    totalMatches:
      player.matches.length
  };
}

/* ============================================================
   BEST TWO
============================================================ */

function bestTwo(player){

  const matches=
    Array.isArray(
      player.matches
    )
      ?player.matches
      :[];

  const sorted=
    matches
      .filter(
        m=>
          typeof m.fantasy===
          "number"
      )
      .slice()
      .sort(
        (a,b)=>
          b.fantasy-
          a.fantasy
      );

  const best=
    sorted.slice(0,2);

  return {
    matches:best,
    total:
      best.reduce(
        (sum,m)=>
          sum+
          Number(m.fantasy||0),
        0
      )
  };
}

============================================================ */

async function savePlayer(
  player
){

  /*
    Сначала local.
  */

  saveLocal();

  if(!db)
    return;

  try{

    await db
      .collection("v7-players")
      .doc(
        String(
          player.accountId
        )
      )
      .set(
        player,
        {
          merge:true
        }
      );

    diag(
      "FIRESTORE SAVE",
      {
        accountId:
          player.accountId
      }
    );

  }catch(error){

    console.warn(
      "Firestore save:",
      error
    );

    diag(
      "FIRESTORE SAVE ERROR",
      {
        error:error.message
      }
    );
  }
}

async function getPlayersFirestore(){

  if(!db)
    return null;

  try{

    const snap=
      await db
        .collection(
          "v7-players"
        )
        .get();

    return snap.docs.map(
      doc=>doc.data()
    );

  }catch(error){

    console.warn(
      "Firestore read:",
      error
    );

    diag(
      "FIRESTORE READ ERROR",
      {
        error:error.message
      }
    );

    return null;
  }

function updateLoading(
  current,
  total,
  text,
  error=false
){

  const bar=
    document.getElementById(
      "loadingBar"
    );

  const label=
    document.getElementById(
      "loadingText"
    );

  const result=
    document.getElementById(
      "loadingResult"
    );

  if(bar){

    const percent=
      total
        ?Math.min(
          100,
          Math.round(
            current/
            total*
            100
          )
        )
        :0;

    bar.style.width=
      percent+"%";
  }

  if(label){

    label.textContent=
      text || "";
  }

  if(result){

    result.textContent=
      error
        ?"⚠ "+text
        :"";
  }
}

function openJoinModal(
  editId=null
){

  const existing=
    editId
      ?PLAYERS.find(
        p=>
          String(
            p.accountId
          )===
          String(editId)
      )
      :null;

  let selectedRole=
    existing
      ?existing.role
      :"";

  let selectedPhoto=
    existing
      ?existing.photo
      :tgPhoto();

  let defaultName=
    existing
      ?existing.name
      :tgName();

  modalRoot.innerHTML=`

    <div class="overlay">

      <div class="modal">

        <button
          class="close"
          id="modalClose"
        >
          ×
        </button>

        <h2>
          ${
            existing
              ?"Изменить игрока"
              :"Добавить игрока"
          }
        </h2>

        <div class="modal-desc">

          Укажи имя и Account ID.
          Можно вставить ссылку Dotabuff.

          <br><br>

          После сохранения приложение
          автоматически загрузит
          последние 2 матча.

        </div>

        <div class="field">

          <label>
            ИМЯ
          </label>

          <input
            id="playerName"
            type="text"
            value="${esc(defaultName)}"
            placeholder="Например Denis"
          >

        </div>

        <div class="field">

          <label>
            DOTABUFF / ACCOUNT ID
          </label>

          <input
            id="playerId"
            type="text"
            value="${
              existing
                ?esc(
                  existing.accountId
                )
                :""
            }"
            placeholder="117905733"
          >

        </div>

        <div class="field">

          <label>
            РОЛЬ
          </label>

          <div class="roles">

            ${
              Object.entries(
                ROLES
              )
              .map(
                ([key,value])=>

                  `

                    <div
                      class="
                        role-option
                        ${
                          selectedRole===key
                            ?"selected"
                            :""
                        }
                      "
                      data-role="${key}"
                    >

                      <strong>
                        ${value.label}
                      </strong>

                      <span>
                        Fantasy Registry
                      </span>

                    </div>

                  `
              )
              .join("")
            }

          </div>

        </div>

        <div class="field">

          <label>
            TELEGRAM AVATAR
          </label>

          <div
            style="
            border:1px solid var(--line);
            padding:10px;
            background:#0e0c09;
            border-radius:3px;
            color:#817660;
            font-size:11px;"
          >

            ${
              selectedPhoto
                ?"✓ Аватар Telegram найден"
                :"Telegram photo_url недоступен"
            }

          </div>

        </div>

        <div id="joinError"></div>

        <div class="modal-actions">

          <button
            class="btn"
            id="cancelJoin"
          >
            Отмена
          </button>

          <button
            class="btn primary"
            id="saveJoin"
          >
            ${
              existing
                ?"Сохранить"
                :"Создать и загрузить"
            }
          </button>

        </div>

      </div>

    </div>
  `;

  document
    .getElementById(
      "modalClose"
    )
    .onclick=
    closeModal;

  document
    .getElementById(
      "cancelJoin"
    )
    .onclick=
    closeModal;

  document
    .querySelectorAll(
      ".role-option"
    )
    .forEach(
      element=>{

        element.onclick=()=>{

          selectedRole=
            element.dataset.role;

          document
            .querySelectorAll(
              ".role-option"
            )
            .forEach(
              x=>
                x.classList.remove(
                  "selected"
                )
            );

          element.classList.add(
            "selected"
          );
        };
      }
    );

  document
    .getElementById(
      "saveJoin"
    )
    .onclick=
    async()=>{

      const name=
        document
          .getElementById(
            "playerName"
          )
          .value
          .trim();

      const rawId=
        document
          .getElementById(
            "playerId"
          )
          .value
          .trim();

      const accountId=
        accountIdFrom(
          rawId
        );

      const error=
        document
          .getElementById(
            "joinError"
          );

      error.innerHTML="";

      if(!name){

        error.innerHTML=`

          <div class="notice error">
            Укажи имя.
          </div>

        `;

        return;
      }

      if(!accountId){

        error.innerHTML=`

          <div class="notice error">
            Не удалось определить Account ID.
          </div>

        `;

        return;
      }

      if(!selectedRole){

        error.innerHTML=`

          <div class="notice error">
            Выбери роль.
          </div>

        `;

        return;
      }

      const duplicate=
        PLAYERS.find(
          p=>
            String(
              p.accountId
            )===
            String(accountId) &&
            (
              !existing ||
              String(
                p.accountId
              )!==
              String(
                existing.accountId
              )
            )
        );

      if(duplicate){

        error.innerHTML=`

          <div class="notice error">
            Этот игрок уже есть.
          </div>

        `;

        return;
      }

      const player=
        existing
          ?existing
          :{

              accountId:
                String(accountId),

              name,

              photo:
                selectedPhoto,

              role:
                selectedRole,

              tokens:
                START_TOKENS,

              matches:[],

              lastRefresh:null,

              joinedAt:
                Date.now()

            };

      player.name=
        name;

      player.photo=
        selectedPhoto;

      player.role=
        selectedRole;

      /*
        Для нового игрока
        сначала добавляем в state.
      */

      if(!existing){

        PLAYERS.push(
          player
        );

        setMyId(
          accountId
        );
      }

      saveLocal();

      /*
        Показываем отдельное окно
        загрузки.
      */

      showLoadingModal(
        name
      );

      try{

        const result=
          await refreshPlayer(
            player,
            updateLoading
          );

        /*
          Если ни один матч
          не загрузился — не скрываем
          проблему.
        */

        if(
          result.newMatches<=0
        ){

          throw new Error(
            "OpenDota не вернула данные ни по одному из последних матчей"
          );
        }

        /*
          Сначала закрываем loading.
        */

        closeModal();

        renderAll();

        showNotice(
          `✓ ${name}: загружено ${result.newMatches} матчей. Fantasy Points получены.`,
          "ok"
        );

      }catch(error){

        console.error(
          "CREATE PLAYER:",
          error
        );

        /*
          Не закрываем окно,
          чтобы пользователь видел ошибку.
        */

        updateLoading(
          2,
          2,
          error.message,
          true
        );

        const result=
          document.getElementById(
            "loadingResult"
          );

        if(result){

          result.innerHTML=
            `⚠ ${esc(
              error.message
            )}<br><br>
            Открой вкладку «Диагностика»
            и посмотри ответ OpenDota.`;
        }

        diag(
          "PLAYER LOAD FAILED",
          {
            accountId,
            error:error.message
          }
        );

        /*
          Если новый игрок совсем
          не загрузился — удаляем его
          из списка, чтобы не оставался
          пустой карточкой.
        */

        if(!existing){

          PLAYERS=
            PLAYERS.filter(
              p=>
                String(
                  p.accountId
                )!==
                String(accountId)
            );

          saveLocal();

          renderAll();
        }
      }
    };
}

============================================================ */

async function refreshSinglePlayer(
  player
){

  showLoadingModal(
    player.name
  );

  try{

    const result=
      await refreshPlayer(
        player,
        updateLoading
      );

    closeModal();

    renderAll();

    showNotice(
      `✓ ${player.name}: ${result.newMatches} матчей обновлено.`,
      "ok"
    );

  }catch(error){

    updateLoading(
      2,
      2,
      error.message,
      true
    );

    diag(
      "REFRESH FAILED",
      {
        accountId:
          player.accountId,
        error:
          error.message
      }
    );
  }
}

/* ============================================================
   REFRESH ALL
============================================================ */

async function refreshAll(){

  if(!PLAYERS.length){

    showNotice(
      "В реестре нет игроков.",
      "normal"
    );

    return;
  }

  const button=
    document.getElementById(
      "refreshBtn"
    );

  button.disabled=true;

  button.textContent=
    "⏳ ЗАГРУЗКА...";

  let success=0;

  let errors=0;

  try{

    for(
      const player of PLAYERS
    ){

      try{

        await refreshPlayer(
          player,
          data=>{

            showNotice(
              `${player.name}: ${data.text}`,
              data.error
                ?"error"
                :"normal"
            );
          }
        );

        success++;

      }catch(error){

        errors++;

        diag(
          "REFRESH ALL ERROR",
          {
            accountId:
              player.accountId,
            error:
              error.message
          }
        );
      }

      renderAll();

      await sleep(300);
    }

    showNotice(
      `Обновление завершено: ${success} успешно, ${errors} ошибок.`,
      errors
        ?"normal"
        :"ok"
    );

  }finally{

    button.disabled=false;

    button.textContent=
      "↻ Обновить";
  }
}

/* ============================================================
   NOTICE
============================================================ */

function showNotice(
  text,
  type="normal"
){

  const old=
    document.getElementById(
      "temporaryNotice"
    );

  if(old)
    old.remove();

  status.insertAdjacentHTML(
    "afterend",
    `

      <div
        class="
          notice
          ${
            type==="error"
              ?"error"
              :type==="ok"
                ?"ok"
                :""
          }
        "
        id="temporaryNotice"
      >
        ${esc(text)}
      </div>

    `
  );

  setTimeout(
    ()=>{

      const el=
        document.getElementById(
          "temporaryNotice"
        );

      if(el)
        el.remove();

    },
    7000
  );
}

/* ============================================================
   BOOTSTRAP
============================================================ */

async function bootstrap(){

  /*
    Сначала локальные данные.
  */

  PLAYERS=
    loadLocal();

  MY_ID=
    getMyId();

  renderAll();

  /*
    Потом Firebase.
  */

  const remote=
    await getPlayersFirestore();

  if(
    remote &&
    remote.length
  ){

    PLAYERS=
      remote;

    saveLocal();

    renderAll();
  }

  console.log(
    "Fantasy Registry запущен",
    {
      players:
        PLAYERS.length,

      telegramUser:
        tgUser
    }
  );

  /*
    ВАЖНО:
    API автоматически не вызываем.
    Загрузка начинается при добавлении
    или кнопке Обновить.
  */
}

/* ============================================================
   START
============================================================ */

bootstrap();
