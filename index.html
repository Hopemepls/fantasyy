<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Dota 2 Fantasy Registry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600;700&family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#090806;
  --panel:#15110d;
  --panel2:#1d1710;
  --panel3:#251d13;
  --text:#eadfc7;
  --muted:#8f8269;
  --gold:#d1aa38;
  --gold2:#8f7426;
  --line:#33291d;
  --green:#63b27c;
  --red:#c75b67;
  --blue:#6684df;
  --shadow:0 14px 36px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--text);
  padding:16px 11px 70px;
  font-family:"Spectral",serif;
  -webkit-tap-highlight-color:transparent;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  max-width:1180px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;
  padding-bottom:15px;
  border-bottom:1px solid var(--line);
}

.logo h1{
  margin:0;
  font-family:"Spectral SC",serif;
  font-size:25px;
  letter-spacing:1.4px;
}

.logo p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:11px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--gold2);
  background:var(--panel2);
  color:var(--text);
  padding:9px 12px;
  border-radius:4px;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.btn:hover{
  border-color:var(--gold);
  background:var(--panel3);
}

.btn.primary{
  background:linear-gradient(180deg,#9c7b21,#6d5316);
  border-color:var(--gold);
  color:#171206;
  font-weight:600;
}

.btn.green{
  border-color:#396346;
  color:#8ac49a;
}

.btn.danger{
  border-color:#6d3038;
  color:#df929b;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.tabs{
  display:flex;
  gap:23px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}

.tab{
  position:relative;
  border:0;
  background:none;
  color:var(--muted);
  padding:11px 1px 12px;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold);
}

.tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:var(--gold);
}

.status{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:14px 0;
}

.status-item{
  border:1px solid var(--line);
  background:rgba(255,255,255,.015);
  padding:6px 9px;
  border-radius:3px;
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
}

.status-item b{
  color:var(--gold);
}

.notice{
  border:1px solid #54451e;
  background:rgba(140,110,25,.08);
  color:#cbbb97;
  padding:10px 12px;
  margin:12px 0;
  border-radius:4px;
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  line-height:1.55;
}

.notice.ok{
  border-color:#315a3e;
  background:rgba(50,120,70,.08);
  color:#9bcfa9;
}

.notice.error{
  border-color:#693039;
  background:rgba(140,30,45,.09);
  color:#e2a0a8;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:15px;
}

.card{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:5px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  box-shadow:var(--shadow);
}

.card.mine{
  border-color:#80682b;
}

.card-head{
  height:40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid var(--line);
}

.role{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  letter-spacing:1.4px;
}

.mine-badge{
  padding:3px 6px;
  border-radius:2px;
  background:var(--gold);
  color:#171206;
  font-family:"IBM Plex Mono",monospace;
  font-size:7px;
  font-weight:600;
}

.photo{
  height:175px;
  position:relative;
  overflow:hidden;
  background:#0c0a08;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Spectral SC",serif;
  font-size:55px;
  color:#40372a;
}

.photo:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.9),
    rgba(0,0,0,0) 60%
  );
  pointer-events:none;
}

.player-name{
  position:absolute;
  left:12px;
  right:12px;
  bottom:10px;
  z-index:2;
}

.player-name strong{
  display:block;
  font-family:"Spectral SC",serif;
  font-size:19px;
  text-shadow:0 2px 8px #000;
}

.player-name span{
  color:#aaa087;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
}

.card-summary{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  padding:12px;
  border-bottom:1px solid var(--line);
}

.rarity{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  letter-spacing:1.2px;
}

.score{
  margin-top:3px;
  color:var(--gold);
  font-family:"Spectral SC",serif;
  font-size:26px;
  font-weight:700;
}

.score-label{
  color:#736954;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
}

.loading{
  padding:12px;
  border-bottom:1px solid var(--line);
}

.loading-line{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#9c9078;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  margin-bottom:7px;
}

.progress{
  height:5px;
  background:#292219;
  border-radius:8px;
  overflow:hidden;
}

.progress i{
  display:block;
  width:0%;
  height:100%;
  background:var(--gold);
  transition:width .2s ease;
}

.matches{
  padding:10px;
}

.match{
  background:#11100d;
  border:1px solid var(--line);
  padding:9px;
  margin-bottom:6px;
  border-radius:3px;
}

.match:last-child{
  margin-bottom:0;
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.match-id{
  color:#6d6454;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
}

.match-score{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  font-weight:600;
}

.match-info{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:5px;
  color:#746a58;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
}

.win{
  color:var(--green)!important;
}

.loss{
  color:var(--red)!important;
}

.card-footer{
  display:flex;
  gap:6px;
  padding:10px;
  border-top:1px solid var(--line);
}

.card-footer .btn{
  flex:1;
}

.empty{
  padding:50px 18px;
  text-align:center;
  border:1px dashed var(--line);
  color:var(--muted);
}

.empty h2{
  margin:0 0 8px;
  color:var(--text);
  font-family:"Spectral SC",serif;
}

.empty p{
  max-width:520px;
  margin:0 auto 16px;
  line-height:1.6;
  font-size:12px;
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:4px;
}

table{
  width:100%;
  min-width:720px;
  border-collapse:collapse;
}

th,
td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

th{
  background:var(--panel2);
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  text-transform:uppercase;
}

td{
  background:var(--panel);
  font-size:12px;
}

tr:last-child td{
  border-bottom:0;
}

.avatar-small{
  width:32px;
  height:32px;
  overflow:hidden;
  border-radius:50%;
  background:#211b13;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#685b47;
  font-family:"Spectral SC",serif;
}

.avatar-small img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.player-cell{
  display:flex;
  align-items:center;
  gap:9px;
}

.table-score{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-weight:600;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.84);
}

.modal{
  width:100%;
  max-width:550px;
  max-height:93vh;
  overflow:auto;
  position:relative;
  padding:20px;
  border:1px solid var(--gold2);
  border-radius:5px;
  background:var(--panel);
  box-shadow:var(--shadow);
}

.close{
  position:absolute;
  top:8px;
  right:11px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:23px;
}

.modal h2{
  margin:0 0 6px;
  font-family:"Spectral SC",serif;
}

.modal-desc{
  color:#9b8e75;
  font-size:11px;
  line-height:1.55;
  margin-bottom:16px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin-bottom:5px;
  color:#968a73;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  letter-spacing:1px;
}

input,
select{
  width:100%;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:3px;
  outline:none;
  background:#0d0b09;
  color:var(--text);
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
}

input:focus,
select:focus{
  border-color:var(--gold2);
}

.roles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.role-option{
  padding:10px;
  text-align:center;
  border:1px solid var(--line);
  background:#11100d;
  border-radius:3px;
}

.role-option.selected{
  border-color:var(--gold);
}

.role-option strong{
  display:block;
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
}

.role-option span{
  display:block;
  margin-top:3px;
  color:#6f6554;
  font-size:9px;
}

.rarity-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.rarity-option{
  padding:10px 6px;
  text-align:center;
  border:1px solid var(--line);
  background:#11100d;
  border-radius:3px;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
}

.rarity-option.selected{
  border-color:var(--gold);
  color:var(--gold);
}

.bonus-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.bonus{
  padding:8px;
  border:1px solid var(--line);
  background:#100e0b;
  border-radius:3px;
}

.bonus label{
  margin-bottom:4px;
  font-size:7px;
}

.bonus input{
  padding:7px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:16px;
}

.progress-box{
  margin-top:15px;
  border:1px solid var(--line);
  background:#0d0b09;
  padding:13px;
  border-radius:4px;
}

.progress-title{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:1px;
  margin-bottom:9px;
}

.progress-text{
  margin-top:8px;
  color:#9a8f78;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  line-height:1.5;
}

.calc-table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}

.calc-table th,
.calc-table td{
  min-width:0;
  padding:8px 6px;
  font-size:8px;
}

.calc-table th{
  font-size:7px;
}

.calc-table td{
  background:#100e0b;
}

.calc-total{
  margin-top:10px;
  padding:12px;
  border:1px solid var(--gold2);
  background:rgba(160,125,30,.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.calc-total span{
  color:#988a6d;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
}

.calc-total strong{
  color:var(--gold);
  font-family:"Spectral SC",serif;
  font-size:23px;
}

.diag{
  display:none;
  border:1px solid var(--line);
  background:#0d0b09;
  border-radius:4px;
  overflow:hidden;
}

.diag.open{
  display:block;
}

.diag-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-bottom:1px solid var(--line);
  background:var(--panel2);
}

.diag-head strong{
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
}

pre{
  margin:0;
  max-height:500px;
  overflow:auto;
  padding:12px;
  color:#afa38b;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

@media(max-width:650px){

  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .bonus-grid{
    grid-template-columns:1fr 1fr;
  }

  .roles,
  .rarity-grid{
    grid-template-columns:1fr 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">

  <div class="logo">
    <h1>FANTASY REGISTRY</h1>
    <p>Dota 2 · Player Cards · Fantasy Points</p>
  </div>

  <div class="actions">

    <button
      class="btn"
      id="myBtn"
    >
      Моя карта
    </button>

    <button
      class="btn"
      id="refreshBtn"
    >
      ↻ Обновить
    </button>

    <button
      class="btn primary"
      id="addBtn"
    >
      ＋ Игрок
    </button>

  </div>

</header>

<nav class="tabs">

  <button
    class="tab active"
    data-tab="players"
  >
    Игроки
  </button>

  <button
    class="tab"
    data-tab="rating"
  >
    Рейтинг
  </button>

  <button
    class="tab"
    data-tab="diagnostics"
  >
    API
  </button>

</nav>

<div id="status"></div>

<div id="notice"></div>

<div id="content"></div>

<div
  class="diag"
  id="diag"
>

  <div class="diag-head">

    <strong>
      OPEN DOTA / DEBUG
    </strong>

    <button
      class="btn"
      id="clearDiag"
    >
      Очистить
    </button>

  </div>

  <pre id="diagOutput">
Пока запросов нет.
  </pre>

</div>

</div>

<div id="modalRoot"></div>

<script>

/* ============================================================
   CONFIG
============================================================ */

const API =
  "https://api.opendota.com/api";

const FIREBASE_CONFIG = {

  apiKey:
    "AIzaSyDiji-w6g6x-lqu6-LlI68wBVIjqB_-3BI",

  authDomain:
    "fantasy-218c8.firebaseapp.com",

  projectId:
    "fantasy-218c8",

  storageBucket:
    "fantasy-218c8.firebasestorage.app",

  messagingSenderId:
    "122819799870",

  appId:
    "1:122819799870:web:e47df878140ed305671a6f",

  measurementId:
    "G-9LZC0EZ0Y5"
};

const STORAGE_KEY =
  "fantasy_registry_v8";

const MY_ID_KEY =
  "fantasy_registry_my_player_v8";

/*
  Базовые правила.

  Вся архитектура теперь отделяет:

  BASE
    ↓
  CARD BONUS
    ↓
  FINAL
*/

const FANTASY_RULES = {

  kills:0.30,

  deaths:-0.30,

  assists:0.15,

  last_hits:0.003,

  gpm:0.002,

  tower_kills:1,

  roshan_kills:1,

  teamfight:0.03,

  observer_placed:0.50,

  camps_stacked:0.50,

  runes_grabbed:0.25,

  first_blood:4,

  stuns:0.05,

  deaths_base:3
};

const BONUS_FIELDS = [

  ["kills","Kills"],

  ["deaths","Deaths"],

  ["assists","Assists"],

  ["last_hits","Last Hits"],

  ["gpm","GPM"],

  ["tower_kills","Tower Kills"],

  ["roshan_kills","Roshan"],

  ["teamfight","Teamfight"],

  ["observer_placed","Observers"],

  ["camps_stacked","Stacks"],

  ["runes_grabbed","Runes"],

  ["first_blood","First Blood"],

  ["stuns","Stuns"]

];

const ROLES = {

  carry:"ОСНОВА",

  mid:"ЦЕНТР",

  support:"ПОДДЕРЖКА"

};

const RARITIES = {

  bronze:"BRONZE",

  silver:"SILVER",

  gold:"GOLD"

};

let db = null;

let players = [];

let telegramUser = null;

let myPlayerId = null;

let activeTab = "players";

let logs = [];

/* ============================================================
   TELEGRAM
============================================================ */

try{

  if(
    window.Telegram &&
    Telegram.WebApp
  ){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

    telegramUser =
      Telegram.WebApp.initDataUnsafe &&
      Telegram.WebApp.initDataUnsafe.user
        ?Telegram.WebApp.initDataUnsafe.user
        :null;

  }

}catch(error){

  console.warn(
    "Telegram init:",
    error
  );

}

/* ============================================================
   FIREBASE
============================================================ */

try{

  firebase.initializeApp(
    FIREBASE_CONFIG
  );

  db =
    firebase.firestore();

  db.enablePersistence({
    synchronizeTabs:true
  }).catch(
    ()=>{}
  );

}catch(error){

  console.warn(
    "Firebase:",
    error
  );

}

/* ============================================================
   DOM
============================================================ */

const content =
  document.getElementById(
    "content"
  );

const status =
  document.getElementById(
    "status"
  );

const notice =
  document.getElementById(
    "notice"
  );

const modalRoot =
  document.getElementById(
    "modalRoot"
  );

const diag =
  document.getElementById(
    "diag"
  );

const diagOutput =
  document.getElementById(
    "diagOutput"
  );

/* ============================================================
   HELPERS
============================================================ */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

}

function number(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ?n
    :0;

}

function fmt(value){

  return number(value)
    .toLocaleString(
      "ru-RU",
      {
        maximumFractionDigits:2
      }
    );

}

function accountIdFrom(value){

  const matches =
    String(value || "")
      .match(/\d+/g);

  if(
    !matches ||
    !matches.length
  )
    return null;

  return matches[
    matches.length-1
  ];

}

function initials(name){

  return String(
    name || "?"
  )
  .trim()
  .slice(0,1)
  .toUpperCase();

}

function sleep(ms){

  return new Promise(
    resolve=>
      setTimeout(
        resolve,
        ms
      )
  );

}

function defaultBonuses(){

  const bonuses={};

  BONUS_FIELDS.forEach(
    ([key])=>{
      bonuses[key]=0;
    }
  );

  return bonuses;

}

function defaultCard(){

  return {

    rarity:"bronze",

    bonuses:
      defaultBonuses()

  };

}

function normalizePlayer(player){

  player =
    player || {};

  if(!player.card){

    player.card =
      defaultCard();

  }

  if(
    !player.card.bonuses
  ){

    player.card.bonuses =
      defaultBonuses();

  }

  BONUS_FIELDS.forEach(
    ([key])=>{

      player.card.bonuses[key] =
        number(
          player.card.bonuses[key]
        );

    }
  );

  if(
    !RARITIES[
      player.card.rarity
    ]
  ){

    player.card.rarity =
      "bronze";

  }

  if(
    !Array.isArray(
      player.matches
    )
  ){

    player.matches=[];

  }

  return player;

}

/*
  Автоматически ищем карточку,
  которая привязана к Telegram ID.
*/

function findMyPlayer(){

  const tgId =
    getTelegramId();

  if(!tgId)
    return null;

  const found =
    players.find(
      player=>
        String(
          player.telegramUserId || ""
        )===
        tgId
    );

  if(found){

    myPlayerId =
      String(
        found.accountId
      );

    try{

      localStorage.setItem(
        MY_ID_KEY,
        myPlayerId
      );

    }catch(error){}

    return found;

  }

  /*
    fallback локального ID
  */

  try{

    const saved =
      localStorage.getItem(
        MY_ID_KEY
      );

    if(saved){

      return players.find(
        p=>
          String(
            p.accountId
          )===String(saved)
      ) || null;

    }

  }catch(error){}

  return null;

}

    );

async function savePlayer(player){

  normalizePlayer(
    player

  try{

    await db
      .collection(
        "v8-players"
      )
      .doc(
        String(
          player.accountId
        )
      )
      .set(

/* ============================================================
   API
============================================================ */

async function api(
  path
){

  const url =
    API+
    path;

  log(
    "REQUEST",
    {
      url
    }
  );

  let response;

  try{

    response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"force-cache",
          headers:{
            Accept:
              "application/json"
          }
        }
      );

  }catch(error){

    throw new Error(
      "Ошибка соединения с OpenDota: "+
      error.message
    );

  }

  const text =
    await response.text();

  if(
    !response.ok
  ){

    log(
      "HTTP ERROR",
      {
        status:
          response.status,
        body:
          text.slice(
            0,
            1000
          )
      }
    );

    throw new Error(
      `OpenDota HTTP ${response.status}`
    );

  }

  let json;

  try{

    json =
      JSON.parse(
        text
      );

  }catch(error){

    throw new Error(
      "OpenDota вернула не JSON"
    );

  }

  return json;

}

async function getHistory(
  accountId
){

  /*
    limit=4.
    Нам нужны только последние 2,
    но небольшой запас помогает,
    если матч временно недоступен.
  */

  const data =
    await api(
      `/players/${accountId}/recentMatches`
    );

  if(
    !Array.isArray(data)
  ){

    throw new Error(
      "История матчей пустая"
    );

  }

  return data
    .filter(
      item=>
        item.match_id
    )
    .sort(
      (a,b)=>
        number(b.start_time)-
        number(a.start_time)
    )
    .slice(
      0,
      4
    );

}

/* ============================================================
   BASE FANTASY
============================================================ */

function calculateBaseFantasy(
  player
){

  const kills =
    number(
      player.kills
    );

  const deaths =
    number(
      player.deaths
    );

  const assists =
    number(
      player.assists
    );

  const lastHits =
    number(
      player.last_hits
    );

  const denies =
    number(
      player.denies
    );

  const gpm =
    number(
      player.gold_per_min
    );

  const towerKills =
    number(
      player.tower_kills
    );

  const roshanKills =
    number(
      player.roshan_kills
    );

  const teamfight =
    number(
      player.teamfight_participation
    );

  const observer =
    number(
      player.obs_placed
    );

  const stacks =
    number(
      player.camps_stacked
    );

  const runes =
    number(
      player.rune_pickups
    );

  const firstBlood =
    player.firstblood_claimed
      ?1
      :0;

  const stuns =
    number(
      player.stuns
    );

  /*
    Важное отличие:
    сначала считаем БАЗОВЫЕ очки.
  */

  return {

    kills:
      kills*
      FANTASY_RULES.kills,

    deaths:
      FANTASY_RULES.deaths_base+
      deaths*
      FANTASY_RULES.deaths,

    assists:
      assists*
      FANTASY_RULES.assists,

    last_hits:
      (
        lastHits+
        denies
      )*
      FANTASY_RULES.last_hits,

    gpm:
      gpm*
      FANTASY_RULES.gpm,

    tower_kills:
      towerKills*
      FANTASY_RULES.tower_kills,

    roshan_kills:
      roshanKills*
      FANTASY_RULES.roshan_kills,

    teamfight:
      teamfight*
      FANTASY_RULES.teamfight,

    observer_placed:
      observer*
      FANTASY_RULES.observer_placed,

    camps_stacked:
      stacks*
      FANTASY_RULES.camps_stacked,

    runes_grabbed:
      runes*
      FANTASY_RULES.runes_grabbed,

    first_blood:
      firstBlood*
      FANTASY_RULES.first_blood,

    stuns:
      stuns*
      FANTASY_RULES.stuns

  };

}

/* ============================================================
   CARD BONUSES
============================================================ */

function applyCardBonuses(
  base,
  bonuses
){

  const final={};

  BONUS_FIELDS.forEach(
    ([key])=>{

      const value =
        number(
          base[key]
        );

      const bonus =
        number(
          bonuses &&
          bonuses[key]
        );

      final[key] =
        value*
        (
          1+
          bonus/100
        );

    }
  );

  return final;

}

function calculateFinalFantasy(
  playerStats,
  card
){

  const base =
    calculateBaseFantasy(
      playerStats
    );

  const final =
    applyCardBonuses(
      base,
      card &&
      card.bonuses
    );

  const total =
    Object.values(
      final
    )
    .reduce(
      (sum,value)=>
        sum+
        number(value),
      0
    );

  return {

    base,

    final,

    total

  };

}

/* ============================================================
   FULL MATCH
============================================================ */

async function loadMatch(
  matchId,
  accountId,
  card
){

  const match =
    await api(
      `/matches/${matchId}`
    );

  if(
    !match ||
    !Array.isArray(
      match.players
    )
  ){

    throw new Error(
      `Матч ${matchId}: players отсутствует`
    );

  }

  const player =
    match.players.find(
      p=>
        String(
          p.account_id
        )===
        String(accountId)
    );

  if(!player){

    throw new Error(
      `Игрок не найден в матче ${matchId}`
    );

  }

  const calculation =
    calculateFinalFantasy(
      player,
      card
    );

  const radiant =
    number(
      player.player_slot
    )<
    128;

  const win =
    Boolean(
      match.radiant_win
    )===
    radiant;

  const result={

    matchId:
      String(
        match.match_id
      ),

    startTime:
      number(
        match.start_time
      ),

    duration:
      number(
        match.duration
      ),

    win,

    kills:
      number(player.kills),

    deaths:
      number(player.deaths),

    assists:
      number(player.assists),

    lastHits:
      number(player.last_hits),

    denies:
      number(player.denies),

    gpm:
      number(player.gold_per_min),

    teamfight:
      number(
        player.teamfight_participation
      ),

    observer:
      number(player.obs_placed),

    stacks:
      number(player.camps_stacked),

    runes:
      number(player.rune_pickups),

    firstBlood:
      Boolean(
        player.firstblood_claimed
      ),

    towerKills:
      number(player.tower_kills),

    roshanKills:
      number(player.roshan_kills),

    stuns:
      number(player.stuns),

    baseFantasy:
      calculation.base,

    finalFantasy:
      calculation.final,

    fantasy:
      Number(
        calculation.total.toFixed(2)
      )

  };

  log(
    "MATCH",
    {
      matchId,
      accountId,
      fantasy:
        result.fantasy,
      base:
        calculation.base,
      final:
        calculation.final
    }
  );

  return result;

}

/* ============================================================
   CONCURRENCY 2
============================================================ */

async function loadMatchesLimited(
  matchIds,
  accountId,
  card,
  onProgress
){

  const results =
    [];

  let next =
    0;

  let completed =
    0;

  async function worker(){

    while(true){

      const index =
        next++;

      if(
        index>=
        matchIds.length
      )
        return;

      const matchId =
        matchIds[index];

      try{

        const result =
          await loadMatch(
            matchId,
            accountId,
            card
          );

        results[index]=
          result;

      }catch(error){

        results[index]=
          null;

        log(
          "MATCH FAILED",
          {
            matchId,
            error:
              error.message
          }
        );

      }

      completed++;

      if(onProgress){

        onProgress(
          completed,
          matchIds.length,
          matchId
        );

      }

    }

  }

  /*
    Максимум 2 запроса одновременно.
    Это заметно мягче для OpenDota,
    чем Promise.all на десятки матчей.
  */

  await Promise.all([
    worker(),
    worker()
  ]);

  return results
    .filter(Boolean);

}

/* ============================================================
   REFRESH PLAYER
============================================================ */

async function refreshPlayer(
  player,
  progress
){

  normalizePlayer(
    player
  );

  const history =
    await getHistory(
      player.accountId
    );

  if(!history.length){

    throw new Error(
      "Не найдено последних матчей"
    );

  }

  const target =
    history
      .slice(
        0,
        2
      )
      .map(
        x=>
          String(
            x.match_id
          )
      );

  const existing =
    new Map(
      player.matches.map(
        match=>[
          String(
            match.matchId
          ),
          match
        ]
      )
    );

  const needLoad =
    target.filter(
      id=>{
        const cached =
          existing.get(id);

        return !cached ||
          !cached.fantasy;
      }
    );

  /*
    Если всё уже в кэше —
    вообще не трогаем OpenDota.
  */

  if(!needLoad.length){

    player.matches =
      target
        .map(
          id=>
            existing.get(id)
        )
        .filter(Boolean);

    player.lastRefresh =
      Date.now();

    await savePlayer(
      player
    );

    if(progress){

      progress(
        2,
        2,
        "Матчи уже есть в кэше"
      );

    }

    return player;

  }

  if(progress){

    progress(
      0,
      needLoad.length,
      "Загружаю матчи..."
    );

  }

  const fresh =
    await loadMatchesLimited(
      needLoad,
      player.accountId,
      player.card,
      progress
    );

  fresh.forEach(
    match=>{

      existing.set(
        String(
          match.matchId
        ),
        match
      );

    }
  );

  /*
    Только последние 2.
  */

  player.matches =
    target
      .map(
        id=>
          existing.get(id)
      )
      .filter(Boolean);

  player.lastRefresh =
    Date.now();

  await savePlayer(
    player
  );

  return player;

}

/* ============================================================
   BEST TWO
============================================================ */

function bestTwo(
  player
){

  const matches =
    Array.isArray(
      player.matches
    )
      ?player.matches
      :[];

  const sorted =
    matches
      .slice()
      .sort(
        (a,b)=>
          number(b.fantasy)-
          number(a.fantasy)
      );

  const best =
    sorted.slice(
      0,
      2
    );

  return {

    matches:best,

    total:
      best.reduce(
        (sum,match)=>
          sum+
          number(
            match.fantasy
          ),
        0
      )

  };

}

    `;

    document
      .getElementById(
        "emptyAdd"
      )
      .onclick=
      ()=>openPlayerModal();

    return;

  }

  content.innerHTML=`

    <div class="cards">

      ${players
        .map(
          playerCard
        )
        .join("")}

    </div>

  `;

  bindCardButtons();

}

function bindCardButtons(){

  document
    .querySelectorAll(
      "[data-calc]"
    )
    .forEach(
      button=>{

        button.onclick=()=>{

          const player =
            players.find(
              p=>
                String(
                  p.accountId
                )===
                String(
                  button.dataset.calc
                )
            );

          if(player)
            openCalculation(
              player
            );

        };

      }
    );

  document
    .querySelectorAll(
      "[data-edit]"
    )
    .forEach(
      button=>{

        button.onclick=()=>{

          const player =
            players.find(
              p=>
                String(
                  p.accountId
                )===
                String(
                  button.dataset.edit
                )
            );

          if(player)
            openPlayerModal(
              player
            );

        };

      }
    );

    .querySelectorAll(
      "[data-refresh-player]"
    )
    .forEach(
      button=>{

        button.onclick=()=>{

          const player =
            players.find(
              p=>
                String(
                  p.accountId
                )===
                String(
                  button.dataset.refreshPlayer
                )
            );

          if(player)
            refreshSingle(
              player
            );

        };

      }
    );

}

/* ============================================================
   CALCULATION MODAL
============================================================ */

function openCalculation(
  player
){

  const matches =
    player.matches || [];

  const best =
    bestTwo(
      player
    );

  modalRoot.innerHTML=`

    <div class="overlay">

      <div class="modal">

        <button
          class="close"
          id="closeModal"
        >
          ×
        </button>

        <h2>
          Расчёт · ${esc(
            player.name
          )}
        </h2>

        <div class="modal-desc">

          ${
            RARITIES[
              player.card.rarity
            ]
          }
          PLAYER CARD

          · бонусы применяются
          после расчёта базовых Fantasy Points.

        </div>

        ${
          best.matches.length

            ?best.matches
              .map(
                match=>
                  calculationBlock(
                    match,
                    player.card
                  )
              )
              .join("")

            :`

              <div class="notice">
                Нет загруженных матчей.
              </div>

            `
        }

        <div class="calc-total">

          <span>
            BEST 2 TOTAL
          </span>

          <strong>
            ${fmt(
              best.total
            )}
          </strong>

        </div>

      </div>

    </div>

  `;

  document
    .getElementById(
      "closeModal"
    )
    .onclick=
    closeModal;

}

function calculationBlock(
  match,
  card
){

  const rows =
    BONUS_FIELDS
      .map(
        ([key,label])=>{

          const base =
            number(
              match.baseFantasy &&
              match.baseFantasy[key]
            );

          const bonus =
            number(
              card.bonuses &&
              card.bonuses[key]
            );

          const final =
            number(
              match.finalFantasy &&
              match.finalFantasy[key]
            );

          return `

            <tr>

              <td>
                ${esc(label)}
              </td>

              <td>
                ${base.toFixed(3)}
              </td>

              <td>
                +${bonus}%
              </td>

              <td>
                ${final.toFixed(3)}
              </td>

            </tr>

          `;

        }
      )
      .join("");

  return `

    <div
      style="
        border:1px solid var(--line);
        margin-top:12px;
      "
    >

      <div
        style="
          display:flex;
          justify-content:space-between;
          padding:9px;
          border-bottom:1px solid var(--line);
          font:9px IBM Plex Mono;
        "
      >

        <span>
          MATCH #${esc(
            match.matchId
          )}
        </span>

        <strong
          style="color:var(--gold)"
        >
          ${fmt(
            match.fantasy
          )}
        </strong>

      </div>

      <table
        class="calc-table"
      >

        <thead>

          <tr>

            <th>
              Показатель
            </th>

            <th>
              Base
            </th>

            <th>
              Card
            </th>

            <th>
              Final
            </th>

          </tr>

        </thead>

        <tbody>

          ${rows}

        </tbody>

      </table>

    </div>

  `;

}

/* ============================================================
   PLAYER MODAL
============================================================ */

function openPlayerModal(

){

      ?normalizePlayer(
          existing
        ).card

    existing
      ?existing.role
      :"carry";

  modalRoot.innerHTML=`

      <div class="modal">

        <button
          class="close"
          id="closeModal"
        >
          ×
        </button>

        <h2>

            existing

          }
        </h2>

        <div class="modal-desc">

                    getTelegramName()
                  )}

                  getTelegramId()
                )}
              `

              `
          }

          <label>
            ИМЯ ИГРОКА
          </label>

          <input

                  ?existing.name
                  :getTelegramName()
              )
            }"

          >

        </div>

        <div class="field">

          <label>
            DOTA 2 ACCOUNT ID / DOTABUFF
          </label>

          <input
            id="playerAccount"
            value="${
              existing
                ?esc(
                  existing.accountId
                )
                :""
            }"
            placeholder="117905733"
            ${
              existing
                ?"readonly"
                :""
            }
          >

        </div>

        <div class="field">

          <label>
            РОЛЬ
          </label>

          <div
            class="roles"
            id="roleGrid"
          >

            ${
              Object.entries(
                ROLES
              )
              .map(
                ([key,label])=>

                  `

                    <div
                      class="
                        role-option
                        ${
                          selectedRole===key
                            ?"selected"
                            :""
                        }
                      "
                      data-role="${key}"
                    >

                      <strong>
                        ${label}
                      </strong>

                      <span>
                        Fantasy
                      </span>

                    </div>

                  `
              )
              .join("")
            }

          </div>

        </div>

        <div class="field">

          <label>
            РЕДКОСТЬ КАРТЫ
          </label>

          <div
            class="rarity-grid"
            id="rarityGrid"
          >

            ${
              Object.entries(
                RARITIES
              )
              .map(
                ([key,label])=>

                  `

                    <div
                      class="
                        rarity-option
                        ${
                          card.rarity===key
                            ?"selected"
                            :""
                        }
                      "
                      data-rarity="${key}"
                    >
                      ${label}
                    </div>

                  `
              )
              .join("")
            }

          </div>

        </div>

        <div class="field">

          <label>
            БОНУСЫ PLAYER CARD
          </label>

          <div
            class="bonus-grid"
          >

            ${
              BONUS_FIELDS
                .map(
                  ([key,label])=>

                    `

                      <div
                        class="bonus"
                      >

                        <label>
                          ${label}
                        </label>

                        <input

                          min="-100"
                          max="100"
                          step="1"
                          data-bonus="${key}"
                          value="${

                        >

                      </div>

                    `
                )
                .join("")
            }

          </div>

        </div>

        <div class="notice">

          Формат:

        </div>

        <div id="modalError"></div>

        <div

          <button

          >

          >

            }

  `;

  let role =

  document
    .querySelectorAll(
      "[data-role]"
    )
    .forEach(
      el=>{

        el.onclick=()=>{

          role =

          document
            .querySelectorAll(
              "[data-role]"

            .forEach(
              x=>
                x.classList
                  .remove(

          el.classList.add(

  document
    .querySelectorAll(

    .forEach(
      el=>{

        };

  document
    .getElementById(

    .getElementById(

          .getElementById(

      const name =

          .getElementById(

          .value

            .getElementById(
              "playerAccount"
            )
            .value
        );

            Укажи имя.
          </div>

        return;

      }

      if(!account){

        errorBox.innerHTML=`

          <div class="notice error">
            Неверный Account ID.
          </div>

        `;

        return;

      }

      const bonuses =
        defaultBonuses();

      document
        .querySelectorAll(
          "[data-bonus]"

        .forEach(
          input=>{

              input.dataset.bonus

              );

        );

        existing;

        player = {

          accountId:
            String(account),

          name,

          role,

          photo:
            getTelegramPhoto(),

          telegramUserId:
            getTelegramId(),

          telegramUsername:
            telegramUser &&
            telegramUser.username
              ?telegramUser.username
              :null,

          card:{

            rarity,

            bonuses

          matches:[],

          lastRefresh:null,

          createdAt:
            Date.now()

        };

          Владелец создаваемой карты —
          текущий Telegram user.
        */

        if(
          getTelegramId()
        ){

          myPlayerId =
            String(account);

          try{

            localStorage.setItem(
              MY_ID_KEY,
              myPlayerId
            );

          }catch(error){}

        }

        players.push(
          player
        );

      }else{

        player.name =
          name;

        player.role =
          role;

        player.card = {

          rarity,

          bonuses

        };

        /*
          Если это собственная
          карточка — не теряем привязку.
        */

        if(
          getTelegramId() &&
          (
            String(
              player.telegramUserId || ""
            )===
            String(
              getTelegramId()
            ) ||
            String(
              player.accountId
            )===
            String(
              myPlayerId || ""
            )
          )
        ){

          player.telegramUserId =
            getTelegramId();

          player.telegramUsername =
            telegramUser &&
            telegramUser.username
              ?telegramUser.username
              :null;

        }

      }

      normalizePlayer(
        player
      );

      saveLocal();

      /*
        Сначала карточка появляется
        на экране.
      */

      closeModal();

      renderAll();

      /*
        Затем тихо загружаем матчи.
      */

      player.loading =
        true;

      player.loadingCurrent =
        0;

      player.loadingTotal =
        2;

      player.loadingText =
        "Получаем последние матчи...";

      renderAll();

      try{

        await refreshPlayer(
          player,
          (
            current,
            total,
            matchId
          )=>{

            player.loading =
              true;

            player.loadingCurrent =
              current;

            player.loadingTotal =
              total;

            player.loadingText =
              matchId
                ?`Матч ${current}/${total} · ${matchId}`
                :"Получаем последние матчи...";

            renderAll();

          }
        );

        delete player.loading;

        delete player.loadingCurrent;

        delete player.loadingTotal;

        delete player.loadingText;

        saveLocal();

        renderAll();

        showNotice(
          `✓ ${player.name} загружен. Fantasy рассчитан.`,
          "ok"
        );

      }catch(error){

        delete player.loading;

        delete player.loadingCurrent;

        delete player.loadingTotal;

        player.loadingError =
          error.message;

        saveLocal();

        renderAll();

        showNotice(
          `Ошибка загрузки ${player.name}: ${error.message}`,
          "error"
        );

      }

    };

}

/* ============================================================
   REFRESH SINGLE
============================================================ */

async function refreshSingle(
  player
){

  player.loading =
    true;

  player.loadingCurrent =
    0;

  player.loadingTotal =
    2;

  player.loadingText =
    "Обновляю...";

  renderAll();

  try{

    await refreshPlayer(
      player,
      (
        current,
        total,
        matchId
      )=>{

        player.loadingCurrent =
          current;

        player.loadingTotal =
          total;

        player.loadingText =
          matchId
            ?`Матч ${current}/${total} · ${matchId}`
            :"Обновление...";

        renderAll();

      }
    );

    delete player.loading;
    delete player.loadingCurrent;
    delete player.loadingTotal;
    delete player.loadingText;

    renderAll();

    showNotice(
      `✓ ${player.name}: данные обновлены.`,
      "ok"
    );

  }catch(error){

    delete player.loading;
    delete player.loadingCurrent;
    delete player.loadingTotal;

    player.loadingError =
      error.message;

    renderAll();

    showNotice(
      error.message,
      "error"
    );

  }

}

/* ============================================================
   REFRESH ALL
============================================================ */

async function refreshAll(){

  /*
    Обновляем только игроков,
    у которых есть matches или Telegram owner.
  */

  if(!players.length){

    showNotice(
      "Игроков нет.",
      "error"
    );

    return;

  }

  const button =
    document
      .getElementById(
        "refreshBtn"
      );

  button.disabled =
    true;

  button.textContent =
    "Загрузка...";

  try{

    for(
      const player of players
    ){

      await refreshSingle(
        player
      );

      /*
        Не создаём очередь из API-запросов.
      */

      await sleep(150);

    }

  }finally{

    button.disabled =
      false;

    button.textContent =
      "↻ Обновить";

  }

}

   MY CARD
============================================================ */

function openMyCard(){

  const player =
    findMyPlayer();

  if(!telegramUser){

    showNotice(
      "Открой приложение внутри Telegram, чтобы определить аккаунт.",
      "error"

    return;

  }

  if(!player){

    openPlayerModal();

    return;

  }

  openCalculation(

/* ============================================================
   BOOT
============================================================ */

async function boot(){

  /*
    1.
    Сразу показываем local cache.
    Пользователь не ждёт Firebase.
  */

  players =
    loadLocal();

  render();

  /*
    2.
    Затем ищем remote.
    Это происходит асинхронно.
  */

  const remote =
    await loadRemote();

  if(
    remote &&
    remote.length
  ){

    /*
      Merge remote с local.
    */

    const map =
      new Map();

    players.forEach(
      p=>
        map.set(
          String(
            p.accountId
          ),
          normalizePlayer(p)
        )
    );

    remote.forEach(
      p=>
        map.set(
          String(
            p.accountId
          ),
          normalizePlayer(p)
        )
    );

    players =
      Array.from(
        map.values()
      );

    saveLocal();

    render();

  }

  /*
    3.
    Автоматически определяем
    карточку текущего Telegram user.
  */

  const mine =
    findMyPlayer();

  if(mine){

    showNotice(
      `✓ Вход выполнен: ${mine.name}. Карточка привязана к Telegram.`,
      "ok"
    );

  }else if(
    telegramUser &&
    players.length
  ){

    showNotice(
      "Telegram подключён. Твоя карточка ещё не привязана.",
      ""
    );

  }

}

boot();
