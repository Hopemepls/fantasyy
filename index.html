<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0c09">

<title>Реестр Фэнтези</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600;700&family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0b0907;
  --panel:#15110e;
  --panel2:#1d1711;
  --panel3:#241c14;
  --parchment:#eee2c6;
  --muted:#9a8e76;
  --muted2:#6d644f;
  --gold:#d1aa35;
  --gold2:#8e7628;
  --line:#352b1f;

  --red:#c74d5e;
  --red-bg:#35151b;

  --blue:#6687ef;
  --blue-bg:#151d3a;

  --green:#51a873;
  --green-bg:#12271b;

  --danger:#d66b72;

  --shadow:0 18px 45px rgba(0,0,0,.55);
  --radius:6px;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--ink);
}

body{
  margin:0;
  min-height:100vh;
  padding:18px 14px 90px;
  background:
    radial-gradient(circle at 15% -10%,#2b2113 0,transparent 42%),
    radial-gradient(circle at 90% 0,#172033 0,transparent 38%),
    var(--ink);
  color:var(--parchment);
  font-family:'Spectral',serif;
  -webkit-tap-highlight-color:transparent;
}

button,
input{
  font:inherit;
}

.wrap{
  max-width:1220px;
  margin:auto;
}

/* HEADER */

.masthead{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;
  flex-wrap:wrap;
  padding-bottom:17px;
  margin-bottom:18px;
  border-bottom:1px solid var(--line);
}

.masthead h1{
  margin:0 0 5px;
  font-family:'Spectral SC',serif;
  font-size:27px;
  letter-spacing:1.8px;
}

.masthead p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.4px;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--gold2);
  background:var(--panel2);
  color:var(--parchment);
  padding:9px 14px;
  border-radius:var(--radius);
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:.7px;
  transition:.15s;
}

.btn:hover{
  border-color:var(--gold);
  background:var(--panel3);
}

.btn.primary{
  background:linear-gradient(180deg,#927221,#6b5217);
  border-color:var(--gold);
  color:#171106;
  font-weight:600;
}

.btn:disabled{
  opacity:.45;
  cursor:default;
}

.btn.ghost{
  background:transparent;
  border-color:var(--line);
  color:var(--muted);
}

.btn.small{
  padding:6px 9px;
  font-size:9px;
}

/* TABS */

.tabs{
  display:flex;
  gap:24px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.tab{
  position:relative;
  border:0;
  background:none;
  color:var(--muted);
  padding:10px 0 12px;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:1.3px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold);
}

.tab.active:after{
  content:'';
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:var(--gold);
}

/* STATUS */

.status-strip{
  display:flex;
  flex-wrap:wrap;
  gap:10px 18px;
  margin-bottom:20px;
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  color:var(--muted);
}

.status-strip b{
  color:var(--gold);
}

.online{
  color:var(--green)!important;
}

.offline{
  color:var(--danger)!important;
}

/* INFO */

.info-box{
  padding:13px 15px;
  margin-bottom:18px;
  border:1px solid var(--line);
  background:rgba(29,23,17,.75);
  border-radius:var(--radius);
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  line-height:1.6;
}

.info-box strong{
  color:var(--gold);
}

/* EMPTY */

.empty-state{
  border:1px dashed var(--line);
  padding:52px 20px;
  text-align:center;
  border-radius:var(--radius);
  color:var(--muted);
}

.empty-state h3{
  margin:0 0 8px;
  font-family:'Spectral SC',serif;
  color:var(--parchment);
  font-size:19px;
}

.empty-state p{
  max-width:480px;
  margin:0 auto 18px;
  line-height:1.6;
  font-size:13px;
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:18px;
}

.card{
  overflow:hidden;
  position:relative;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  box-shadow:var(--shadow);
}

.card.mine{
  border-color:var(--gold2);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
}

.card-role{
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  letter-spacing:1.8px;
}

.card-tokens{
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
}

.card-tokens b{
  color:var(--parchment);
}

.mine-badge{
  padding:2px 6px;
  background:var(--gold);
  color:#151006;
  border-radius:2px;
  font-family:'IBM Plex Mono',monospace;
  font-size:8px;
  font-weight:600;
}

/* PHOTO */

.photo-wrap{
  height:185px;
  position:relative;
  overflow:hidden;
  background:#0d0a07;
}

.photo-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.initials{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#504631;
  font-family:'Spectral SC',serif;
  font-size:54px;
}

.photo-wrap:after{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent 55%);
}

.name-plate{
  position:absolute;
  z-index:2;
  left:14px;
  bottom:11px;
}

.name{
  color:#fff7e5;
  font-family:'Spectral SC',serif;
  font-size:20px;
  font-weight:600;
  text-shadow:0 2px 8px #000;
}

.sub{
  margin-top:2px;
  color:#c6b998;
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
}

/* EMBLEMS */

.emblems{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:12px;
}

.emblem{
  display:grid;
  grid-template-columns:32px 1fr auto;
  align-items:center;
  gap:9px;
  padding:7px 8px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#14100d;
}

.emblem.clickable{
  cursor:pointer;
}

.emblem.clickable:hover{
  border-color:var(--gold2);
}

.rank-dot{
  width:31px;
  height:31px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  border:2px solid;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:600;
}

.color-red .rank-dot{
  border-color:var(--red);
  color:#f19ca7;
  background:radial-gradient(circle,var(--red-bg),#170c0f);
}

.color-blue .rank-dot{
  border-color:var(--blue);
  color:#b3c3ff;
  background:radial-gradient(circle,var(--blue-bg),#0d111d);
}

.color-green .rank-dot{
  border-color:var(--green);
  color:#a7dfbd;
  background:radial-gradient(circle,var(--green-bg),#0c1710);
}

.stat-name{
  color:#ded2b5;
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  letter-spacing:.6px;
}

.prop-name{
  margin-top:2px;
  color:var(--muted2);
  font-size:9px;
}

.emblem-value{
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
}

.emblem-value.none{
  color:#554d3c;
  font-size:8.5px;
  font-weight:400;
}

/* SCORE */

.card-score{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 14px;
  border-top:1px solid var(--line);
}

.card-score small{
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
  letter-spacing:1px;
}

.card-score strong{
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
  font-size:17px;
}

/* MATCHES */

.matches-preview{
  padding:0 13px 11px;
}

.match-mini{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #2b231a;
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
  color:var(--muted);
}

.match-mini:last-child{
  border-bottom:0;
}

.match-id{
  color:#8b7c60;
}

.fantasy{
  color:var(--gold);
  font-weight:600;
}

.win{
  color:var(--green);
}

.loss{
  color:var(--danger);
}

/* TABLE */

.table-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.chips{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.chip{
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:20px;
  background:none;
  color:var(--muted);
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:.7px;
  text-transform:uppercase;
}

.chip.active{
  border-color:var(--gold);
  color:var(--gold);
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:var(--radius);
}

.players-table{
  width:100%;
  min-width:850px;
  border-collapse:collapse;
  background:var(--panel);
}

.players-table th{
  padding:10px 12px;
  background:var(--panel2);
  border-bottom:1px solid var(--line);
  color:var(--muted);
  text-align:left;
  font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;
  letter-spacing:1px;
  text-transform:uppercase;
  white-space:nowrap;
}

.players-table td{
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  font-size:12px;
  white-space:nowrap;
}

.players-table tr:last-child td{
  border-bottom:0;
}

.players-table tr:hover td{
  background:#1b1510;
}

.player-cell{
  display:flex;
  align-items:center;
  gap:9px;
}

.table-avatar{
  width:32px;
  height:32px;
  flex-shrink:0;
  overflow:hidden;
  border-radius:50%;
  background:#241d13;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#62563f;
  font-family:'Spectral SC',serif;
  font-size:13px;
}

.table-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.player-name{
  color:var(--parchment);
}

.player-id{
  margin-top:2px;
  color:var(--muted2);
  font-family:'IBM Plex Mono',monospace;
  font-size:8px;
}

.role{
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
}

.points{
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:600;
}

.points-muted{
  color:#625945;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
}

.expand-btn{
  border:0;
  background:none;
  color:var(--gold);
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
}

.details-row{
  display:none;
}

.details-row.open{
  display:table-row;
}

.details-content{
  padding:12px 16px;
  background:#110e0b;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}

.detail-match{
  padding:9px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#17120e;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
}

.detail-match strong{
  color:var(--gold);
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  background:rgba(4,3,2,.86);
}

.modal{
  width:100%;
  max-width:480px;
  max-height:90vh;
  overflow:auto;
  position:relative;
  padding:22px;
  border:1px solid var(--gold2);
  border-radius:var(--radius);
  background:var(--panel);
  box-shadow:var(--shadow);
}

.modal h2{
  margin:0 0 6px;
  font-family:'Spectral SC',serif;
  font-size:19px;
}

.desc{
  margin:0 0 17px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.close-x{
  position:absolute;
  top:10px;
  right:13px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:21px;
  cursor:pointer;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  margin-bottom:6px;
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:1px;
}

.field input[type=text]{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:4px;
  outline:0;
  background:#0e0b09;
  color:var(--parchment);
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
}

.field input:focus{
  border-color:var(--gold2);
}

.hint{
  margin-top:5px;
  color:var(--muted2);
  font-size:9.5px;
  line-height:1.5;
}

.photo-picker{
  display:flex;
  align-items:center;
  gap:10px;
}

.photo-preview{
  width:62px;
  height:62px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0e0b09;
  color:#584c37;
  font-family:'Spectral SC',serif;
  font-size:21px;
}

.photo-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.file-btn{
  position:relative;
  overflow:hidden;
}

.file-btn input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

.role-options{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.role-opt{
  padding:11px;
  border:1px solid var(--line);
  border-radius:4px;
  cursor:pointer;
  background:#14100d;
}

.role-opt:hover,
.role-opt.sel{
  border-color:var(--gold);
}

.rt{
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:1px;
}

.rd{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}

.dot-row{
  display:flex;
  gap:4px;
  margin-top:7px;
}

.dot-row span{
  width:8px;
  height:8px;
  border-radius:50%;
}

.dot-row .r{background:var(--red);}
.dot-row .b{background:var(--blue);}
.dot-row .g{background:var(--green);}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

.err-note{
  color:var(--danger);
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  margin-top:7px;
}

/* CANDIDATES */

.candidate{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:11px;
  margin-bottom:7px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#14100d;
  cursor:pointer;
}

.candidate:hover{
  border-color:var(--gold);
}

.cname{
  color:var(--parchment);
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
}

.cprop{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  line-height:1.4;
}

.cval{
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
}

/* RESPONSIVE */

@media(max-width:700px){
  body{
    padding-left:9px;
    padding-right:9px;
  }

  .masthead h1{
    font-size:23px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .detail-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <header class="masthead">
    <div>
      <h1>РЕЕСТР ФЭНТЕЗИ</h1>
      <p>Открытая лига · Fantasy Points из OpenDota · лучшие 2 матча</p>
    </div>

    <div class="top-actions">
      <button class="btn" id="btnRefresh">↻ Обновить матчи</button>
      <button class="btn primary" id="btnJoin">+ Присоединиться</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="cards">Знамёна</button>
    <button class="tab" data-tab="board">Рейтинг игроков</button>
  </nav>

  <div id="configBanner"></div>

  <div class="info-box">
    <strong>Как считается счёт:</strong>
    приложение получает последние матчи игрока из OpenDota,
    сохраняет их Fantasy Points и выбирает <strong>2 лучших матча</strong>.
    Итоговый счёт = сумма Fantasy Points этих двух матчей.
  </div>

  <div class="status-strip" id="statusStrip"></div>

  <main id="viewCards"></main>
  <main id="viewBoard" style="display:none"></main>

</div>

<div id="modalRoot"></div>

<script>

============================================================ */

try{

  }

/* ============================================================
   FIREBASE
============================================================ */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDiji-w6g6x-lqu6-LlI68wBVIjqB_-3BI",
  authDomain: "fantasy-218c8.firebaseapp.com",
  projectId: "fantasy-218c8",
  storageBucket: "fantasy-218c8.firebasestorage.app",
  messagingSenderId: "122819799870",
  appId: "1:122819799870:web:e47df878140ed305671a6f",
  measurementId: "G-9LZC0EZ0Y5"
};

let db = null;
let firebaseReady = false;

try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  firebaseReady = true;

  db.enablePersistence({
    synchronizeTabs:true
  }).catch(err=>{
    console.warn("Firestore persistence:",err);
  });

  console.log("Firebase инициализирован");
}catch(e){
  console.error("Firebase:",e);

  document.getElementById("configBanner").innerHTML = `
    <div class="info-box">
      <strong>Firebase:</strong> не удалось подключиться.
      Будет использован локальный кеш.
    </div>
  `;
}


/* ============================================================
   CONSTANTS
============================================================ */

const NS = "v3";

const CACHE_NS = "fantasy_registry";

const START_TOKENS = 20;

const ROLES = {
  carry:{
    label:"ОСНОВА",
    slots:["red","red","red","green","green"]
  },

  mid:{
    label:"ЦЕНТР",
    slots:["green","green","blue","red","red"]
  },

  support:{
    label:"ПОДДЕРЖКА",
    slots:["blue","blue","blue","green","green"]
  }
};

const STAT_POOL = {

  red:[
    {
      key:"kills",
      label:"УБИЙСТВА",
      desc:"Kills"
    },
    {
      key:"deaths",
      label:"СМЕРТИ",
      desc:"Deaths"
    },
    {
      key:"lasthits",
      label:"КРИПЫ",
      desc:"Last Hits"

/* ============================================================
   CACHE
============================================================ */

function saveCache(key,data){

  try{

    localStorage.setItem(
      `${CACHE_NS}_${key}`,
      JSON.stringify({
        timestamp:Date.now(),
        data
      })
    );

  }catch(e){}
}

function loadCache(key){

  try{

    const raw =
      localStorage.getItem(
        `${CACHE_NS}_${key}`
      );

    if(!raw) return null;

    const obj = JSON.parse(raw);

    return obj.data || null;

  }catch(e){

    return null;

  }
}


/* ============================================================
   HELPERS
============================================================ */

function fmt(n){

  if(n === null || n === undefined)
    return "—";

  return Number(n).toLocaleString("ru-RU",{
    maximumFractionDigits:1
  });
}

function initials(name){

  return (name || "?")
    .trim()
    .slice(0,1)
    .toUpperCase();
}

function extractAccountId(value){

  const numbers =
    String(value || "").match(/\d+/g);

  if(!numbers || !numbers.length)
    return null;

  return numbers[numbers.length-1];
}

function themeFor(id){

  let h = 0;

  for(const c of String(id)){
    h =
      (h * 31 + c.charCodeAt(0))
      >>> 0;
  }

  return THEMES[h % THEMES.length];
}

function random(arr){

  return arr[
    Math.floor(Math.random()*arr.length)
  ];
}

function rankByTier(tier){

  return RANKS.find(
    x => x.tier === Number(tier)
  ) || RANKS[0];
}

function statByKey(color,key){

  return STAT_POOL[color].find(
    x => x.key === key
  ) || STAT_POOL[color][0];
}

function propertyByKey(key){

  return PROPERTIES.find(
    x => x.key === key
  ) || PROPERTIES[0];
}

function freshEmblem(color){

  return {
    color,
    stat:random(STAT_POOL[color]).key,
    rankTier:random(RANKS).tier,
    prop:random(PROPERTIES).key
  };
}

/* ============================================================
   FIREBASE STORAGE
============================================================ */

async function getIndex(){

  if(!db){

    return loadCache("index") || [];

  }

  try{

    const snap =
      await db
        .collection(`${NS}-meta`)
        .doc("index")
        .get();

    const ids =
      snap.exists
        ? (snap.data().ids || [])
        : [];

    saveCache("index",ids);

    return ids;

  }catch(e){

    console.warn("Index offline");

    return loadCache("index") || [];

  }
}

async function setIndex(ids){

  saveCache("index",ids);

  if(!db) return;

  try{

    await db
      .collection(`${NS}-meta`)
      .doc("index")
      .set({ids});

  }catch(e){

    console.warn("Index save failed",e);

  }
}

async function getPlayer(id){

  const cached =
    loadCache(`player_${id}`);

  if(!db){

    return cached;

  }

  try{

    const snap =
      await db
        .collection(`${NS}-players`)
        .doc(String(id))
        .get();

    if(!snap.exists)
      return cached;

    const data = snap.data();

    saveCache(`player_${id}`,data);

    return data;

  }catch(e){

    console.warn(
      "Firestore offline for player:",
      id
    );

    return cached;

  }
}

async function savePlayer(player){

  saveCache(
    `player_${player.accountId}`,
    player
  );

  if(!db) return;

  try{

    await db
      .collection(`${NS}-players`)
      .doc(String(player.accountId))
      .set(player);

  }catch(e){

    console.warn(
      "Player save failed:",
      e
    );

  }
}

async function loadAllPlayers(){

  const ids = await getIndex();

  if(!ids.length)
    return [];

  const players =
    await Promise.all(
      ids.map(id => getPlayer(id))
    );

  return players.filter(Boolean);
}

/*
  ВАЖНО:

  Мы больше НЕ вычисляем Fantasy Points
  через kills/deaths/gpm.

  Берём fantasy_points из данных OpenDota,
  если оно присутствует.

  Разные версии/ответы API могут отдавать
  поле под разными структурами, поэтому
  ниже несколько безопасных вариантов.
*/

function extractFantasyPoints(match,player){

  const candidates = [

    player?.fantasy_points,

    player?.fantasyPoints,

    match?.fantasy_points,

    match?.fantasyPoints,

    player?.fantasy?.points,

    player?.fantasy?.fantasy_points,

    player?.stats?.fantasy_points

  ];

  for(const value of candidates){

    if(
      value !== undefined &&
      value !== null &&
      Number.isFinite(Number(value))
    ){

      return Number(value);

    }

  }

  return null;
}


async function getRecentMatches(accountId){

  const url =
    `https://api.opendota.com/api/players/${accountId}/recentMatches`;

  const response =
    await fetch(url);

  if(response.status === 429){

    throw new Error(
      "OpenDota ограничил количество запросов. Подождите немного."
    );

  }

  if(!response.ok){

    throw new Error(
      `OpenDota HTTP ${response.status}`
    );

  }

  const data =
    await response.json();

  if(!Array.isArray(data))
    return [];

  return data;

}


/*
  Получаем детали матча.

  Чтобы не делать огромный объём запросов,
  берём только несколько последних матчей.
*/

async function getMatchDetails(matchId){

  const response =
    await fetch(
      `https://api.opendota.com/api/matches/${matchId}`
    );

  if(!response.ok)
    return null;

  return await response.json();

}


/*
  Парсим последние матчи.

  Храним ВСЕ найденные Fantasy Points,
  но для текущего цикла берём последние 2.
*/

async function refreshPlayer(player){

  if(!player.accountId){

    return {
      ok:false,
      msg:"нет Account ID"
    };

  }

  try{

    const recent =
      await getRecentMatches(
        player.accountId
      );

    if(!recent.length){

      return {
        ok:false,
        msg:"OpenDota не вернул матчи"
      };

    }

    /*
      Последние матчи уже идут от новых
      к старым.

      Берём последние 2 завершённых.
    */

    const candidates =
      recent
        .filter(m => m.match_id)
        .slice(0,2);

    const oldMatches =
      Array.isArray(player.matches)
        ? player.matches
        : [];

    const map =
      new Map(
        oldMatches.map(m => [
          String(m.matchId),
          m
        ])
      );

    let parsed = 0;

    for(const rm of candidates){

      const matchId =
        Number(rm.match_id);

      /*
        Если этот матч уже разобран,
        не делаем лишний запрос.
      */

      if(map.has(String(matchId)))
        continue;

      const detail =
        await getMatchDetails(matchId);

      if(!detail)
        continue;

      const me =
        (detail.players || []).find(
          p =>
            Number(p.account_id) ===
            Number(player.accountId)
        );

      if(!me)
        continue;

      const fantasyPoints =
        extractFantasyPoints(
          detail,
          me
        );

      const matchData = {

        matchId,

        fantasyPoints,

        kills:Number(me.kills || 0),

        deaths:Number(me.deaths || 0),

        assists:Number(me.assists || 0),

        lastHits:Number(me.last_hits || 0),

        gpm:Number(me.gold_per_min || 0),

        xpm:Number(me.xp_per_min || 0),

        heroId:Number(me.hero_id || 0),

        playerSlot:Number(
          me.player_slot || 0
        ),

        radiantWin:
          detail.radiant_win,

        duration:
          Number(detail.duration || 0),

        startTime:
          Number(detail.start_time || 0),

        parsedAt:Date.now()

      };

      map.set(
        String(matchId),
        matchData
      );

      parsed++;

    }

    /*
      Сохраняем максимум 10 последних
      разобранных матчей.

      Но отображаем/учитываем только
      2 лучших Fantasy Points.
    */

    player.matches =
      Array.from(map.values())
        .sort(
          (a,b) =>
            Number(b.startTime || 0) -
            Number(a.startTime || 0)
        )
        .slice(0,10);

    player.lastRefresh =
      Date.now();

    player.fantasyAvailable =
      player.matches.some(
        m =>
          m.fantasyPoints !== null &&
          m.fantasyPoints !== undefined
      );

    await savePlayer(player);

    return {
      ok:true,
      newCount:parsed
    };

  }catch(e){

    console.error(
      "refreshPlayer:",
      e
    );

    return {
      ok:false,
      msg:e.message
    };

  }

}


/* ============================================================
   BEST 2
============================================================ */

function getValidFantasyMatches(player){

  return (player.matches || [])
    .filter(
      m =>
        m.fantasyPoints !== null &&
        m.fantasyPoints !== undefined &&
        Number.isFinite(
          Number(m.fantasyPoints)
        )
    )
    .map(m=>({
      ...m,
      fantasyPoints:
        Number(m.fantasyPoints)
    }))
    .sort(
      (a,b) =>
        b.fantasyPoints -
        a.fantasyPoints
    );
}

function getBestTwo(player){

  return getValidFantasyMatches(player)
    .slice(0,2);
}

function totalFantasy(player){

  return getBestTwo(player)
    .reduce(
      (sum,m) =>
        sum + Number(m.fantasyPoints || 0),
      0
    );
}

              МАТЧИ ${escapeHtml(player.name)}
            </div>

            <div class="detail-grid">

              ${
                (player.matches || [])
                  .sort(
                    (a,b)=>
                      Number(b.startTime || 0) -
                      Number(a.startTime || 0)
                  )
                  .map(m=>{

                    const win =
                      m.radiantWin ===
                      (m.playerSlot < 128);

                    const date =
                      m.startTime
                      ? new Date(
                          m.startTime*1000
                        ).toLocaleString(
                          "ru-RU"
                        )
                      : "—";

                    return `

                      <div class="detail-match">

                        <div>
                          Матч:
                          <strong>
                            ${m.matchId}
                          </strong>
                        </div>

                        <div style="margin-top:5px">

                          Fantasy:
                          <strong>
                            ${
                              m.fantasyPoints !== null &&
                              m.fantasyPoints !== undefined
                                ? fmt(m.fantasyPoints)
                                : "нет данных"
                            }
                          </strong>

                        </div>

                        <div style="margin-top:5px">

                          ${win ? "Победа" : "Поражение"}
                          · ${date}

                        </div>

                        <div style="margin-top:5px;color:var(--muted)">

                          K/D/A:
                          ${m.kills ?? 0}/
                          ${m.deaths ?? 0}/
                          ${m.assists ?? 0}

                        </div>

                      </div>

                    `;

                  }).join("")
                  ||
                  `
                    <div class="detail-match">
                      Нет загруженных матчей
                    </div>
                  `
              }

            </div>

          </div>

        </td>

      </tr>

    `;

  });

  html += `

        </tbody>

      </table>

    </div>

  `;

  viewBoard.innerHTML = html;

  wireBoard();

}


function wireBoard(){

  viewBoard
    .querySelectorAll("[data-filter]")
    .forEach(button=>{

      button.onclick = ()=>{

        BOARD_FILTER =
          button.dataset.filter;

        renderBoard();

      };

    });


  viewBoard
    .querySelectorAll("[data-expand]")
    .forEach(button=>{

      button.onclick = ()=>{

        const id =
          String(button.dataset.expand);

        if(expandedPlayers.has(id)){

          expandedPlayers.delete(id);

        }else{

          expandedPlayers.add(id);

        }

        renderBoard();

      };

    });

}

function resizeImage(file,maxSize){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload = ()=>{

        const img =
          new Image();

        img.onload = ()=>{

          let width =
            img.width;

          let height =
            img.height;

          if(
            width > maxSize ||
            height > maxSize
          ){

            const scale =
              Math.min(
                maxSize/width,
                maxSize/height
              );

            width =
              Math.round(width*scale);

            height =
              Math.round(height*scale);

          }

          const canvas =
            document.createElement("canvas");

          canvas.width =
            width;

          canvas.height =
            height;

          canvas
            .getContext("2d")
            .drawImage(
              img,
              0,
              0,
              width,
              height
            );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              .8
            )
          );

        };

        img.onerror = reject;

        img.src =
          reader.result;

      };

      reader.onerror = reject;

      reader.readAsDataURL(file);

    }
  );

}

/* ============================================================
   ESCAPE
============================================================ */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttribute(value){

  return escapeHtml(value);

}


/* ============================================================
   AUTO REFRESH
============================================================ */

async function refreshAll(){

  if(updating)
    return;

  updating = true;

  const button =
    document.getElementById(
      "btnRefresh"
    );

  const oldText =
    button.textContent;

  button.disabled = true;

  button.textContent =
    "⌛ Обновление...";


  let updated = 0;

  const errors = [];


  try{

    for(const player of PLAYERS){

      const result =
        await refreshPlayer(
          player
        );

      if(result.ok){

        updated +=
          result.newCount || 0;

      }else{

        errors.push(
          `${player.name}: ${result.msg}`
        );

      }

    }


    PLAYERS =
      await loadAllPlayers();

    saveCache(
      "players",
      PLAYERS
    );

    renderAll();


    if(tg && tg.HapticFeedback){

      try{

        tg.HapticFeedback
          .notificationOccurred(
            "success"
          );

      }catch(e){}

    }


    if(errors.length){

      console.warn(
        "Ошибки:",
        errors
      );

    }

  }catch(e){

    console.error(e);

  }finally{

    updating = false;

    button.disabled = false;

    button.textContent =
      oldText;

  }

}

/* ============================================================
   BOOTSTRAP
============================================================ */

async function bootstrap(){

  const cached =
    loadCache("players");

  if(cached){

    PLAYERS =
      cached;

    MY_ID =
      await getMyId();

    renderAll();

  }


  try{

    const players =
      await loadAllPlayers();

    PLAYERS =
      players;

    saveCache(
      "players",
      players
    );

    MY_ID =
      await getMyId();

    renderAll();

  }catch(e){

    console.warn(
      "Bootstrap offline:",
      e
    );

  }


  /*
    Автоматически подтягиваем
    свежие последние 2 матча.
  */

  if(PLAYERS.length){

    for(const player of PLAYERS){

      try{

        await refreshPlayer(
          player
        );

      }catch(e){

        console.warn(e);

      }

    }

    PLAYERS =
      await loadAllPlayers();

    saveCache(
      "players",
      PLAYERS
    );

    renderAll();

  }

}

============================================================ */

(async function(){

  renderAll();

})();
