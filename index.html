<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Dota 2 Fantasy Registry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600;700&family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#090806;
  --panel:#15110d;
  --panel2:#1d1710;
  --panel3:#251d13;
  --text:#eadfc7;
  --muted:#8f8269;
  --gold:#d1aa38;
  --gold2:#8f7426;
  --line:#33291d;
  --green:#63b27c;
  --red:#c75b67;
  --blue:#6684df;
  --shadow:0 14px 36px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--text);
  padding:16px 11px 70px;
  font-family:"Spectral",serif;
  -webkit-tap-highlight-color:transparent;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  max-width:1180px;
  margin:auto;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;
  padding-bottom:15px;
  border-bottom:1px solid var(--line);
}

.logo h1{
  margin:0;
  font-family:"Spectral SC",serif;
  font-size:25px;
  letter-spacing:1.4px;
}

.logo p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:11px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--gold2);
  background:var(--panel2);
  color:var(--text);
  padding:9px 12px;
  border-radius:4px;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.btn:hover{
  border-color:var(--gold);
  background:var(--panel3);
}

.btn.primary{
  background:linear-gradient(180deg,#9c7b21,#6d5316);
  border-color:var(--gold);
  color:#171206;
  font-weight:600;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* TABS */

.tabs{
  display:flex;
  gap:23px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}

.tab{
  position:relative;
  border:0;
  background:none;
  color:var(--muted);
  padding:11px 1px 12px;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.tab.active{
  color:var(--gold);
}

.tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:var(--gold);
}

/* STATUS */

.status{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:14px 0;
}

.status-item{
  border:1px solid var(--line);
  background:rgba(255,255,255,.015);
  padding:6px 9px;
  border-radius:3px;
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
}

.status-item b{
  color:var(--gold);
}

/* NOTICE */

.notice{
  border:1px solid #54451e;
  background:rgba(140,110,25,.08);
  color:#cbbb97;
  padding:10px 12px;
  margin:12px 0;
  border-radius:4px;
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  line-height:1.55;
}

.notice.ok{
  border-color:#315a3e;
  background:rgba(50,120,70,.08);
  color:#9bcfa9;
}

.notice.error{
  border-color:#693039;
  background:rgba(140,30,45,.09);
  color:#e2a0a8;
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:15px;
}

.card{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:5px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  box-shadow:var(--shadow);
}

.card.mine{
  border-color:#80682b;
}

.card-head{
  height:40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid var(--line);
}

.role{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  letter-spacing:1.4px;
}

.mine-badge{
  padding:3px 6px;
  border-radius:2px;
  background:var(--gold);
  color:#171206;
  font-family:"IBM Plex Mono",monospace;
  font-size:7px;
  font-weight:600;
}

.photo{
  height:175px;
  position:relative;
  overflow:hidden;
  background:#0c0a08;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Spectral SC",serif;
  font-size:55px;
  color:#40372a;
}

.photo:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.9),
    rgba(0,0,0,0) 60%
  );
  pointer-events:none;
}

.player-name{
  position:absolute;
  left:12px;
  right:12px;
  bottom:10px;
  z-index:2;
}

.player-name strong{
  display:block;
  font-family:"Spectral SC",serif;
  font-size:19px;
  text-shadow:0 2px 8px #000;
}

.player-name span{
  color:#aaa087;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
}

.card-summary{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  padding:12px;
  border-bottom:1px solid var(--line);
}

.rarity{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  letter-spacing:1.2px;
}

.score{
  margin-top:3px;
  color:var(--gold);
  font-family:"Spectral SC",serif;
  font-size:26px;
  font-weight:700;
}

.score-label{
  color:#736954;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
}

/* LOADING */

.loading{
  padding:12px;
  border-bottom:1px solid var(--line);
}

.loading-line{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#9c9078;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  margin-bottom:7px;
}

.progress{
  height:5px;
  background:#292219;
  border-radius:8px;
  overflow:hidden;
}

.progress i{
  display:block;
  width:0%;
  height:100%;
  background:var(--gold);
  transition:width .2s ease;
}

/* MATCH */

.matches{
  padding:10px;
}

.match{
  background:#11100d;
  border:1px solid var(--line);
  padding:9px;
  margin-bottom:6px;
  border-radius:3px;
}

.match:last-child{
  margin-bottom:0;
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.match-id{
  color:#6d6454;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
}

.match-score{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  font-weight:600;
}

.match-info{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:5px;
  color:#746a58;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
}

.win{
  color:var(--green)!important;
}

.loss{
  color:var(--red)!important;
}

.card-footer{
  display:flex;
  gap:6px;
  padding:10px;
  border-top:1px solid var(--line);
}

.card-footer .btn{
  flex:1;
}

/* EMPTY */

.empty{
  padding:50px 18px;
  text-align:center;
  border:1px dashed var(--line);
  color:var(--muted);
}

.empty h2{
  margin:0 0 8px;
  color:var(--text);
  font-family:"Spectral SC",serif;
}

.empty p{
  max-width:520px;
  margin:0 auto;
  line-height:1.6;
  font-size:12px;
}

/* TABLE */

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:4px;
}

table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}

th,
td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

th{
  background:var(--panel2);
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  text-transform:uppercase;
}

td{
  background:var(--panel);
  font-size:12px;
}

tr:last-child td{
  border-bottom:0;
}

.avatar-small{
  width:32px;
  height:32px;
  overflow:hidden;
  border-radius:50%;
  background:#211b13;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#685b47;
  font-family:"Spectral SC",serif;
}

.avatar-small img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.player-cell{
  display:flex;
  align-items:center;
  gap:9px;
}

.table-score{
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-weight:600;
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.84);
}

.modal{
  width:100%;
  max-width:550px;
  max-height:93vh;
  overflow:auto;
  position:relative;
  padding:20px;
  border:1px solid var(--gold2);
  border-radius:5px;
  background:var(--panel);
  box-shadow:var(--shadow);
}

.close{
  position:absolute;
  top:8px;
  right:11px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:23px;
}

.modal h2{
  margin:0 0 6px;
  font-family:"Spectral SC",serif;
}

.modal-desc{
  color:#9b8e75;
  font-size:11px;
  line-height:1.55;
  margin-bottom:16px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin-bottom:5px;
  color:#968a73;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  letter-spacing:1px;
}

input{
  width:100%;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:3px;
  outline:none;
  background:#0d0b09;
  color:var(--text);
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
}

input:focus{
  border-color:var(--gold2);
}

input[readonly]{
  opacity:.55;
  cursor:not-allowed;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:16px;
}

.calc-table{
  width:100%;
  min-width:0;
  border-collapse:collapse;
  margin-top:12px;
}

.calc-table th,
.calc-table td{
  min-width:0;
  padding:8px 6px;
  font-size:8px;
}

.calc-table th{
  font-size:7px;
}

.calc-table td{
  background:#100e0b;
}

.calc-total{
  margin-top:10px;
  padding:12px;
  border:1px solid var(--gold2);
  background:rgba(160,125,30,.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.calc-total span{
  color:#988a6d;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
}

.calc-total strong{
  color:var(--gold);
  font-family:"Spectral SC",serif;
  font-size:23px;
}

/* RANK */

.my-rank{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.rank-box{
  border:1px solid var(--line);
  background:var(--panel);
  padding:12px;
}

.rank-box span{
  display:block;
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
}

.rank-box strong{
  display:block;
  margin-top:5px;
  color:var(--gold);
  font-family:"Spectral SC",serif;
  font-size:22px;
}

/* DIAG */

.diag{
  display:none;
  border:1px solid var(--line);
  background:#0d0b09;
  border-radius:4px;
  overflow:hidden;
}

.diag.open{
  display:block;
}

.diag-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-bottom:1px solid var(--line);
  background:var(--panel2);
}

.diag-head strong{
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
}

pre{
  margin:0;
  max-height:500px;
  overflow:auto;
  padding:12px;
  color:#afa38b;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

/* MOBILE */

@media(max-width:650px){

  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .my-rank{
    grid-template-columns:1fr 1fr 1fr;
  }

}
</style>
</head>

<body>

<div class="wrap">

<header class="header">

  <div class="logo">
    <h1>FANTASY REGISTRY</h1>
    <p>Dota 2 · Player Cards · Global Fantasy Ranking</p>
  </div>

  <div class="actions">

    <button
      class="btn"
      id="myBtn"
    >
      Моя карта
    </button>

    <button
      class="btn"
      id="refreshBtn"
    >
      ↻ Обновить
    </button>

  </div>

</header>

<nav class="tabs">

  <button
    class="tab active"
    data-tab="players"
  >
    Моя карта
  </button>

  <button
    class="tab"
    data-tab="rating"
  >
    Мировой рейтинг
  </button>

  <button
    class="tab"
    data-tab="diagnostics"
  >
    API
  </button>

</nav>

<div id="status"></div>

<div id="notice"></div>

<div id="content"></div>

<div
  class="diag"
  id="diag"
>

  <div class="diag-head">

    <strong>
      OPEN DOTA / DEBUG
    </strong>

    <button
      class="btn"
      id="clearDiag"
    >
      Очистить
    </button>

  </div>

  <pre id="diagOutput">Пока запросов нет.</pre>

</div>

</div>

<div id="modalRoot"></div>

<script>

/* ============================================================
   CONFIG
============================================================ */

const API =
  "https://api.opendota.com/api";

const FIREBASE_CONFIG = {

  apiKey:
    "AIzaSyDiji-w6g6x-lqu6-LlI68wBVIjqB_-3BI",

  authDomain:
    "fantasy-218c8.firebaseapp.com",

  projectId:
    "fantasy-218c8",

  storageBucket:
    "fantasy-218c8.firebasestorage.app",

  messagingSenderId:
    "122819799870",

  appId:
    "1:122819799870:web:e47df878140ed305671a6f",

  measurementId:
    "G-9LZC0EZ0Y5"
};

const COLLECTION =
  "fantasy-users-v9";

const LOCAL_PREFIX =
  "fantasy-user-v9-";

const FANTASY_RULES = {

  kills:0.30,
  deaths:-0.30,
  assists:0.15,
  last_hits:0.003,
  gpm:0.002,
  tower_kills:1,
  roshan_kills:1,
  teamfight:0.03,
  observer_placed:0.50,
  camps_stacked:0.50,
  runes_grabbed:0.25,
  first_blood:4,
  stuns:0.05,
  deaths_base:3

};

const BONUS_FIELDS = [

  ["kills","Kills"],
  ["deaths","Deaths"],
  ["assists","Assists"],
  ["last_hits","Last Hits"],
  ["gpm","GPM"],
  ["tower_kills","Tower Kills"],
  ["roshan_kills","Roshan"],
  ["teamfight","Teamfight"],
  ["observer_placed","Observers"],
  ["camps_stacked","Stacks"],
  ["runes_grabbed","Runes"],
  ["first_blood","First Blood"],
  ["stuns","Stuns"]

];

const ROLES = {

  carry:"ОСНОВА",
  mid:"ЦЕНТР",
  support:"ПОДДЕРЖКА"

};

const RARITIES = {

  bronze:"BRONZE",
  silver:"SILVER",
  gold:"GOLD"

};

let db = null;

let telegramUser = null;

let myPlayer = null;

let leaderboard = [];

let activeTab = "players";

let logs = [];

let loading = false;

/* ============================================================
   TELEGRAM
============================================================ */

try{

  if(
    window.Telegram &&
    Telegram.WebApp
  ){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

    telegramUser =
      Telegram.WebApp.initDataUnsafe &&
      Telegram.WebApp.initDataUnsafe.user
        ?Telegram.WebApp.initDataUnsafe.user
        :null;

  }

}catch(error){

  console.warn(
    "Telegram:",
    error
  );

}

/* ============================================================
   FIREBASE
============================================================ */

try{

  firebase.initializeApp(
    FIREBASE_CONFIG
  );

  db =
    firebase.firestore();

  db.enablePersistence({
    synchronizeTabs:true
  }).catch(
    ()=>{}
  );

}catch(error){

  console.warn(
    "Firebase:",
    error
  );

}

/* ============================================================
   DOM
============================================================ */

const content =
  document.getElementById("content");

const status =
  document.getElementById("status");

const notice =
  document.getElementById("notice");

const modalRoot =
  document.getElementById("modalRoot");

const diag =
  document.getElementById("diag");

const diagOutput =
  document.getElementById("diagOutput");

/* ============================================================
   HELPERS
============================================================ */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}

function number(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ?n
    :0;

}

function fmt(value){

  return number(value)
    .toLocaleString(
      "ru-RU",
      {
        maximumFractionDigits:2
      }
    );

}

function accountIdFrom(value){

  const matches =
    String(value || "")
      .match(/\d+/g);

  if(
    !matches ||
    !matches.length
  ){

    return null;

  }

  return matches[
    matches.length-1
  ];

}

function initials(name){

  return String(
    name || "?"
  )
  .trim()
  .slice(0,1)
  .toUpperCase();

}

function defaultBonuses(){

  const bonuses = {};

  BONUS_FIELDS.forEach(
    ([key])=>{
      bonuses[key]=0;
    }
  );

  return bonuses;

}

function defaultCard(){

  return {

    rarity:"bronze",

    bonuses:
      defaultBonuses()

  };

}

function getTelegramId(){

  return telegramUser
    ?String(telegramUser.id)
    :null;

}

function getTelegramName(){

  if(!telegramUser)
    return "";

  let name =
    telegramUser.first_name || "";

  if(
    telegramUser.last_name
  ){

    name +=
      " "+
      telegramUser.last_name;

  }

  return name.trim();

}

function getTelegramPhoto(){

  return telegramUser &&
    telegramUser.photo_url
      ?telegramUser.photo_url
      :null;

}

function localKey(){

  const id =
    getTelegramId();

  return id
    ?LOCAL_PREFIX+id
    :LOCAL_PREFIX+"guest";

}

/* ============================================================
   NORMALIZE
============================================================ */

function normalizePlayer(player){

  player =
    player || {};

  player.accountId =
    String(
      player.accountId || ""
    );

  player.name =
    String(
      player.name || ""
    );

  player.role =
    ROLES[player.role]
      ?player.role
      :"carry";

  if(!player.card){

    player.card =
      defaultCard();

  }

  if(
    !player.card.bonuses
  ){

    player.card.bonuses =
      defaultBonuses();

  }

  BONUS_FIELDS.forEach(
    ([key])=>{

      player.card.bonuses[key] =
        number(
          player.card.bonuses[key]
        );

    }
  );

  if(
    !RARITIES[
      player.card.rarity
    ]
  ){

    player.card.rarity =
      "bronze";

  }

  if(
    !Array.isArray(
      player.matches
    )
  ){

    player.matches=[];

  }

  return player;

}

/* ============================================================
   LOCAL CACHE
============================================================ */

function loadLocal(){

  try{

    const raw =
      localStorage.getItem(
        localKey()
      );

    if(!raw)
      return null;

    return normalizePlayer(
      JSON.parse(raw)
    );

  }catch(error){

    return null;

  }

}

function saveLocal(){

  if(!myPlayer)

function userDoc(){

  const tgId =
    getTelegramId();

  if(
    !db ||
    !tgId
  ){

    return null;

  }

  return db
    .collection(
      COLLECTION
    )
    .doc(
      tgId
    );

}

/*
  Только собственный документ.
*/

async function loadMyUser(){

  const ref =
    userDoc();

  if(!ref)
    return null;

  try{

    const snapshot =
      await ref.get();

    if(!snapshot.exists)
      return null;

    return normalizePlayer(
      snapshot.data()
    );

  }catch(error){

    log(
      "LOAD USER ERROR",
      {
        error:
          error.message
      }
    );

    return null;

  }

}

async function createMyUser(player){

  const ref =
    userDoc();

  if(!ref)
    return false;

  try{

    await ref.set(
      player,
      {
        merge:false
      }
    );

    return true;

  }catch(error){

    log(
      "CREATE USER ERROR",
      {
        error:
          error.message
      }
    );

    throw error;

  }

}

async function saveMyUser(){

  if(!myPlayer)
    return;

  normalizePlayer(
    myPlayer
  );

  saveLocal();

  const ref =
    userDoc();

  if(!ref)
    return;

  try{

    await ref.set(
      myPlayer,
      {
        merge:true
      }
    );

  }catch(error){

    log(
      "SAVE USER ERROR",
      {
        error:
          error.message
      }
    );

  }

}

/* ============================================================

============================================================ */

function log(
  title,
  data
){

  logs.unshift({

    time:
      new Date()
        .toLocaleTimeString(
          "ru-RU"
        ),

    title,

    data

  });

  logs =
    logs.slice(0,40);

  renderDiagnostics();

}

function renderDiagnostics(){

  if(!logs.length){

    diagOutput.textContent =
      "Пока запросов нет.";

    return;

  }

  diagOutput.textContent =
    logs
      .map(
        item=>
          `[${item.time}] ${item.title}\n`+
          JSON.stringify(
            item.data,
            null,
            2
          )
      )
      .join(
        "\n\n--------------------\n\n"
      );

}

document
  .getElementById("clearDiag")
  .onclick=()=>{

    logs=[];

    renderDiagnostics();

  };

/* ============================================================
   API
============================================================ */

async function api(path){

  const url =
    API+
    path;

  log(
    "REQUEST",
    {
      url
    }
  );

  let response;

  try{

    response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"force-cache",
          headers:{
            Accept:
              "application/json"
          }
        }
      );

  }catch(error){

    throw new Error(
      "Ошибка соединения с OpenDota: "+
      error.message
    );

  }

  if(!response.ok){

    throw new Error(
      `OpenDota HTTP ${response.status}`
    );

  }

  return response.json();

}

async function getHistory(
  accountId
){

  const data =
    await api(
      `/players/${accountId}/recentMatches`
    );

  if(
    !Array.isArray(data)
  ){

    throw new Error(
      "История матчей не получена"
    );

  }

  return data
    .filter(
      item=>
        item &&
        item.match_id
    )
    .sort(
      (a,b)=>
        number(b.start_time)-
        number(a.start_time)
    )
    .slice(0,2);

}

/* ============================================================
   FANTASY
============================================================ */

function calculateBaseFantasy(
  player
){

  const kills =
    number(player.kills);

  const deaths =
    number(player.deaths);

  const assists =
    number(player.assists);

  const lastHits =
    number(player.last_hits);

  const denies =
    number(player.denies);

  const gpm =
    number(player.gold_per_min);

  const towerKills =
    number(player.tower_kills);

  const roshanKills =
    number(player.roshan_kills);

  const teamfight =
    number(
      player.teamfight_participation
    );

  const observer =
    number(player.obs_placed);

  const stacks =
    number(player.camps_stacked);

  const runes =
    number(player.rune_pickups);

  const firstBlood =
    player.firstblood_claimed
      ?1
      :0;

  const stuns =
    number(player.stuns);

  return {

    kills:
      kills*
      FANTASY_RULES.kills,

    deaths:
      FANTASY_RULES.deaths_base+
      deaths*
      FANTASY_RULES.deaths,

    assists:
      assists*
      FANTASY_RULES.assists,

    last_hits:
      (
        lastHits+
        denies
      )*
      FANTASY_RULES.last_hits,

    gpm:
      gpm*
      FANTASY_RULES.gpm,

    tower_kills:
      towerKills*
      FANTASY_RULES.tower_kills,

    roshan_kills:
      roshanKills*
      FANTASY_RULES.roshan_kills,

    teamfight:
      teamfight*
      FANTASY_RULES.teamfight,

    observer_placed:
      observer*
      FANTASY_RULES.observer_placed,

    camps_stacked:
      stacks*
      FANTASY_RULES.camps_stacked,

    runes_grabbed:
      runes*
      FANTASY_RULES.runes_grabbed,

    first_blood:
      firstBlood*
      FANTASY_RULES.first_blood,

    stuns:
      stuns*
      FANTASY_RULES.stuns

  };

}

function applyCardBonuses(
  base,
  bonuses
){

  const final = {};

  BONUS_FIELDS.forEach(
    ([key])=>{

      const value =
        number(base[key]);

      const bonus =
        number(
          bonuses &&
          bonuses[key]
        );

      final[key] =
        value*
        (
          1+
          bonus/100
        );

    }
  );

  return final;

}

function calculateFinalFantasy(
  stats,
  card
){

  const base =
    calculateBaseFantasy(
      stats
    );

  const final =
    applyCardBonuses(
      base,
      card &&
      card.bonuses
    );

  const total =
    Object.values(final)
      .reduce(
        (sum,value)=>
          sum+
          number(value),
        0
      );

  return {

    base,
    final,
    total

  };

}

/* ============================================================
   MATCH
============================================================ */

async function loadMatch(
  matchId,
  accountId,
  card
){

  const match =
    await api(
      `/matches/${matchId}`
    );

  if(
    !match ||
    !Array.isArray(match.players)
  ){

    throw new Error(
      `Матч ${matchId} не содержит игроков`
    );

  }

  const player =
    match.players.find(
      p=>
        String(
          p.account_id
        )===
        String(accountId)
    );

  if(!player){

    throw new Error(
      `Игрок не найден в матче ${matchId}`
    );

  }

  const calc =
    calculateFinalFantasy(
      player,
      card
    );

  const radiant =
    number(
      player.player_slot
    )<128;

  const win =
    Boolean(
      match.radiant_win
    )===
    radiant;

  return {

    matchId:
      String(match.match_id),

    startTime:
      number(match.start_time),

    duration:
      number(match.duration),

    win,

    kills:
      number(player.kills),

    deaths:
      number(player.deaths),

    assists:
      number(player.assists),

    lastHits:
      number(player.last_hits),

    denies:
      number(player.denies),

    gpm:
      number(player.gold_per_min),

    teamfight:
      number(
        player.teamfight_participation
      ),

    observer:
      number(player.obs_placed),

    stacks:
      number(player.camps_stacked),

    runes:
      number(player.rune_pickups),

    firstBlood:
      Boolean(
        player.firstblood_claimed
      ),

    towerKills:
      number(player.tower_kills),

    roshanKills:
      number(player.roshan_kills),

    stuns:
      number(player.stuns),

    baseFantasy:
      calc.base,

    finalFantasy:
      calc.final,

    fantasy:
      Number(
        calc.total.toFixed(2)
      )

  };

}

/* ============================================================
   TWO CONCURRENT REQUESTS
============================================================ */

async function loadMatches(
  ids,
  accountId,
  card,
  progress
){

  const result = [];

  let next = 0;

  async function worker(){

    while(true){

      const index =
        next++;

      if(
        index>=ids.length
      ){

        return;

      }

      const id =
        ids[index];

      try{

        result[index] =
          await loadMatch(
            id,
            accountId,
            card
          );

      }catch(error){

        result[index]=null;

        log(
          "MATCH ERROR",
          {
            id,
            error:
              error.message
          }
        );

      }

      if(progress){

        progress(
          index+1,
          ids.length
        );

      }

    }

  }

  await Promise.all([
    worker(),
    worker()
  ]);

  return result
    .filter(Boolean);

}

/* ============================================================
   BEST TWO
============================================================ */

function bestTwo(){

  if(
    !myPlayer ||
    !Array.isArray(
      myPlayer.matches
    )
  ){

    return {
      matches:[],
      total:0
    };

  }

  const matches =
    myPlayer.matches
      .slice()
      .sort(
        (a,b)=>
          number(b.fantasy)-
          number(a.fantasy)
      )
      .slice(0,2);

  return {

    matches,

    total:
      matches.reduce(
        (sum,item)=>
          sum+
          number(item.fantasy),
        0
      )

  };

}

/* ============================================================
   LOAD PLAYER
============================================================ */

async function refreshMyPlayer(){

  if(!myPlayer)
    return;

  if(loading)
    return;

  loading=true;

  setLoadingUI(
    true,
    0,
    2,
    "Получаю последние матчи..."
  );

  try{

    const history =
      await getHistory(
        myPlayer.accountId
      );

    if(!history.length){

      throw new Error(
        "У игрока пока нет доступной истории матчей"
      );

    }

    const ids =
      history
        .map(
          item=>
            String(
              item.match_id
            )
        );

    const cache =
      new Map(
        (
          myPlayer.matches || []
        )
        .map(
          match=>[
            String(
              match.matchId
            ),
            match
          ]
        )
      );

    /*
      Главное ускорение:
      уже рассчитанные матчи вообще
      не запрашиваем повторно.
    */

    const need =
      ids.filter(
        id=>
          !cache.has(id)
      );

    if(!need.length){

      myPlayer.matches =
        ids
          .map(
            id=>
              cache.get(id)
          )
          .filter(Boolean);

      updateScore();

      await saveMyUser();

      setLoadingUI(
        false
      );

      loading=false;

      renderPlayers();

      return;

    }

    setLoadingUI(
      true,
      0,
      need.length,
      "Загружаю матчи..."
    );

    const fresh =
      await loadMatches(
        need,
        myPlayer.accountId,
        myPlayer.card,
        (
          current,
          total
        )=>{

          setLoadingUI(
            true,
            current,
            total,
            `Матч ${current}/${total}`
          );

        }
      );

    fresh.forEach(
      match=>{

        cache.set(
          String(match.matchId),
          match
        );

      }
    );

    myPlayer.matches =
      ids
        .map(
          id=>
            cache.get(id)
        )
        .filter(Boolean);

    updateScore();

    myPlayer.updatedAt =
      Date.now();

    await saveMyUser();

    setLoadingUI(
      false
    );

    loading=false;

    /*
      Только теперь один раз
      перерисовываем карточку.
    */

    renderPlayers();

    /*
      И обновляем мировой рейтинг.
    */

    loadLeaderboard(
      true
    );

    showNotice(
      "✓ Матчи обновлены.",
      "ok"
    );

  }catch(error){

    setLoadingUI(
      false
    );

    loading=false;

    showNotice(
      error.message,
      "error"
    );

  }

}

/* ============================================================
   PROGRESS WITHOUT RERENDER
============================================================ */

function setLoadingUI(
  active,
  current=0,
  total=0,
  text=""
){

  const box =
    document.getElementById(
      "playerLoading"
    );

  if(!box)
    return;

  if(!active){

    box.style.display =
      "none";

    return;

  }

  box.style.display =
    "block";

  const label =
    box.querySelector(
      "[data-loading-text]"
    );

  const counter =
    box.querySelector(
      "[data-loading-counter]"
    );

  const bar =
    box.querySelector(
      "i"
    );

  if(label)
    label.textContent =
      text;

  if(counter)
    counter.textContent =
      `${current}/${total}`;

  if(bar){

    bar.style.width =
      total
        ?(
          current/
          total*
          100
        )+"%"
        :"0%";

  }

}

/* ============================================================
   CREATE PLAYER
============================================================ */

async function createPlayer(){

  if(myPlayer){

    closeModal();

    return;

  }

  const input =
    document.getElementById(
      "accountInput"
    );

  const errorBox =
    document.getElementById(
      "linkError"
    );

  const account =
    accountIdFrom(
      input.value
    );

  if(!account){

    errorBox.innerHTML=`

      <div class="notice error">
        Укажи корректный Dota 2 Account ID.
      </div>

    `;

    return;

  }

  const button =
    document.getElementById(
      "confirmLink"
    );

  button.disabled=true;

  button.textContent=
    "Проверка...";

  try{

    /*
      Повторная проверка Firebase
      перед созданием.
    */

    const remote =
      await loadMyUser();

    if(remote){

      myPlayer =
        remote;

      saveLocal();

      closeModal();

      render();

      showNotice(
        "Эта Telegram-учётка уже имеет Dota-карту.",
        "ok"
      );

      return;

    }

    /*
      Проверяем Account ID через OpenDota.
    */

    const profile =
      await api(
        `/players/${account}`
      );

    if(
      !profile ||
      !profile.profile
    ){

      throw new Error(
        "Dota 2 игрок не найден."
      );

    }

    const name =
      (
        profile.profile.personaname ||
        getTelegramName() ||
        "Dota Player"
      );

    const photo =
      profile.profile.avatarfull ||
      getTelegramPhoto() ||
      null;

    myPlayer =
      normalizePlayer({

        accountId:
          String(account),

        name,

        role:"carry",

        photo,

        telegramUserId:
          getTelegramId(),

        telegramUsername:
          telegramUser &&
          telegramUser.username
            ?telegramUser.username
            :null,

        telegramName:
          getTelegramName(),

        card:
          defaultCard(),

        matches:[],

        score:0,

        createdAt:
          Date.now(),

        updatedAt:
          Date.now()

      });

    /*
      Сохраняем сразу.
      После этого Telegram уже имеет
      одну постоянную карту.
    */

    await createMyUser(
      myPlayer
    );

    saveLocal();

    /*
      КРИТИЧНО:
      окно закрывается ДО загрузки матчей.
    */

    closeModal();

    render();

    showNotice(
      "✓ Dota 2 аккаунт привязан. Загружаю матчи в фоне...",
      "ok"
    );

    /*
      Матчи грузятся уже после закрытия окна.
    */

    await refreshMyPlayer();

  }catch(error){

    button.disabled=false;

    button.textContent=
      "Привязать";

    errorBox.innerHTML=`

      <div class="notice error">
        ${esc(
          error.message
        )}
      </div>

    `;

  }

}

/* ============================================================

============================================================ */

          ${esc(

        ${

function calculationBlock(
  match
){

  const rows =
    BONUS_FIELDS
      .map(
        ([key,label])=>{

          const base =
            number(
              match.baseFantasy &&
              match.baseFantasy[key]
            );

          const bonus =
            number(
              myPlayer.card.bonuses &&
              myPlayer.card.bonuses[key]
            );

          const final =
            number(
              match.finalFantasy &&
              match.finalFantasy[key]
            );

          return `

            <tr>

              <td>
                ${esc(label)}
              </td>

              <td>
                ${base.toFixed(3)}
              </td>

              <td>
                +${bonus}%
              </td>

              <td>
                ${final.toFixed(3)}
              </td>

            </tr>

          `;

        }
      )
      .join("");

  return `

    <div
      style="
        border:1px solid var(--line);
        margin-top:12px;
      "
    >

      <div
        style="
          display:flex;
          justify-content:space-between;
          padding:9px;
          border-bottom:1px solid var(--line);
          font:9px IBM Plex Mono;
        "
      >

        <span>
          MATCH #${esc(
            match.matchId
          )}
        </span>

        <strong
          style="color:var(--gold)"
        >
          ${fmt(
            match.fantasy
          )}
        </strong>

      </div>

      <table class="calc-table">

        <thead>

          <tr>

            <th>
              Показатель
            </th>

            <th>
              Base
            </th>

            <th>
              Card
            </th>

            <th>
              Final
            </th>

          </tr>

        </thead>

        <tbody>

          ${rows}

        </tbody>

      </table>

    </div>

  `;

}

/* ============================================================
   GLOBAL LEADERBOARD
============================================================ */

/*
  Загружаем только верхнюю часть рейтинга.
  Это гораздо быстрее, чем тащить всех пользователей
  при каждом открытии приложения.
*/

async function loadLeaderboard(
  silent=false
){

  if(!db)
    return;

  try{

    const snapshot =
      await db
        .collection(
          COLLECTION
        )
        .orderBy(
          "score",
          "desc"
        )
        .limit(100)
        .get();

    leaderboard =
      snapshot.docs
        .map(
          doc=>
            normalizePlayer(
              doc.data()
            )
        );

    if(
      activeTab==="rating"
    ){

      renderRating();

    }

  }catch(error){

    /*
      Если composite/index ещё не создан,
      пробуем простой запрос.
    */

    try{

      const snapshot =
        await db
          .collection(
            COLLECTION
          )
          .limit(100)
          .get();

      leaderboard =
        snapshot.docs
          .map(
            doc=>
              normalizePlayer(
                doc.data()
              )
          )
          .sort(
            (a,b)=>
              number(b.score)-
              number(a.score)
          );

      if(
        activeTab==="rating"
      ){

        renderRating();

      }

    }catch(error2){

      if(!silent){

        showNotice(
          "Не удалось загрузить мировой рейтинг.",
          "error"
        );

      }

    }

  }

}

/* ============================================================
   RATING
============================================================ */

function renderRating(){

  const rows =
    leaderboard
      .slice()
      .sort(
        (a,b)=>
          number(b.score)-
          number(a.score)
      );

  if(!rows.length){

    content.innerHTML=`

      <div class="empty">

        <h2>
          Мировой рейтинг пока пуст

          После появления игроков здесь
          будет общий рейтинг Fantasy Points.

    return;

  }

  let myIndex =
    rows.findIndex(
      player=>
        myPlayer &&
        String(
          player.telegramUserId || ""
        )===
        String(
          myPlayer.telegramUserId || ""
        )
    );

  const myRank =
    myIndex>=0
      ?myIndex+1
      :"—";

  const myScore =
    myPlayer
      ?number(myPlayer.score)
      :0;

  const leaderScore =
    rows.length
      ?number(rows[0].score)
      :0;

  const difference =
    leaderScore-
    myScore;

  content.innerHTML=`

    ${
      myPlayer
        ?`

          <div class="my-rank">

            <div class="rank-box">

              <span>
                МОЁ МЕСТО
              </span>

              <strong>
                #${myRank}
              </strong>

            </div>

            <div class="rank-box">

              <span>
                МОИ ОЧКИ
              </span>

              <strong>
                ${fmt(myScore)}
              </strong>

            </div>

            <div class="rank-box">

              <span>
                ДО ЛИДЕРА
              </span>

              <strong>
                ${fmt(
                  Math.max(
                    0,
                    difference
                  )
                )}
              </strong>

            </div>

          </div>

        `
        :""
    }

    <div class="notice">

      🌍 <b>МИРОВОЙ РЕЙТИНГ</b>

      <br>

      Все Telegram-пользователи
      используют одну таблицу очков.

      <br>

      В рейтинге показываются лучшие
      доступные игроки.

    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              #
            </th>

            <th>
              Игрок
            </th>

            <th>
              Fantasy
            </th>

            <th>
              Статус
            </th>

          </tr>

        </thead>

        <tbody>

          ${
            rows
              .map(
                (player,index)=>{

                  const isMe =
                    myPlayer &&
                    String(
                      player.telegramUserId || ""
                    )===
                    String(
                      myPlayer.telegramUserId || ""
                    );

                  return `

                    <tr
                      ${
                        isMe
                          ?`style="
                              outline:1px solid var(--gold2);
                            "`
                          :""
                      }
                    >

                      <td>
                        ${
                          index<3
                            ?(
                              index===0
                                ?"🥇"
                                :index===1
                                  ?"🥈"
                                  :"🥉"
                            )
                            :index+1
                        }
                      </td>

                      <td>

                        <div
                          class="player-cell"
                        >

                          <div
                            class="avatar-small"
                          >

                            ${
                              player.photo
                                ?`
                                  <img
                                    src="${esc(
                                      player.photo
                                    )}"
                                    loading="lazy"
                                  >
                                `
                                :esc(
                                  initials(
                                    player.name
                                  )
                                )
                            }

                          </div>

                          <div>

                            <strong>
                              ${esc(
                                player.name
                              )}
                            </strong>

                            <div
                              style="
                                color:#675c4a;
                                font:8px IBM Plex Mono;
                              "
                            >
                              ${
                                isMe
                                  ?"ТЫ"
                                  :"DOTA PLAYER"
                              }
                            </div>

                          </div>

                        </div>

                      </td>

                      <td
                        class="table-score"
                        style="font-size:14px"
                      >
                        ${fmt(
                          player.score
                        )}
                      </td>

                      <td>

                        ${
                          isMe
                            ?`
                              <span
                                style="
                                  color:var(--gold);
                                  font:8px IBM Plex Mono;
                                "
                              >
                                ТВОЯ КАРТА
                              </span>
                            `

                              <span
                                style="
                                  color:var(--muted);
                                  font:8px IBM Plex Mono;
                                "
                              >
                                МИР
                              </span>
                            `

                  `;

                }
              )

}

============================================================ */

/* ============================================================
   TABS
============================================================ */

document
  .querySelectorAll(".tab")
  .forEach(
    tab=>{

      tab.onclick=()=>{

        document
          .querySelectorAll(".tab")
          .forEach(
            item=>
              item.classList
                .remove("active")
          );

        tab.classList.add("active");

        activeTab =
          tab.dataset.tab;

        render();

        if(
          activeTab==="rating"
        ){

          loadLeaderboard();

        }

      };

    }
  );

   BUTTONS
============================================================ */

document
  .getElementById("myBtn")
  .onclick=()=>{

    activeTab="players";

    document
      .querySelectorAll(".tab")
      .forEach(
        tab=>{
          tab.classList.toggle(
            "active",
            tab.dataset.tab==="players"
          );
        }
      );

    render();

  };

document
  .getElementById("refreshBtn")
  .onclick=
  refreshMyPlayer;

/* ============================================================
   BOOT
============================================================ */

async function boot(){

  /*
    Сначала мгновенно показываем
    локального пользователя.
  */

  if(telegramUser){

    myPlayer =
      loadLocal();

    if(myPlayer){

      render();

    }else{

      render();

    }

    /*
      Потом тихо проверяем Firebase.
    */

    const remote =
      await loadMyUser();

    if(remote){

      myPlayer =
        remote;

      saveLocal();

      render();

      /*
        Если score/матчи уже есть —
        ничего не грузим.
      */

      if(
        !myPlayer.matches ||
        myPlayer.matches.length<2
      ){

        refreshMyPlayer();

      }

    }

    else{

      /*
        Новый Telegram пользователь.
      */

      render();

    }

  }else{

    render();

    showNotice(
      "Открой приложение внутри Telegram, чтобы создать свою карту.",
      "error"
    );

  }

}

/* ============================================================
   START
============================================================ */

boot();
